</style>

<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
(function(){
'use strict';
/* ===== constants ===== */
var PW=800, PH=1040, BAR_L=280, BAR_T=46, ARC_R=120, ARC_T=40, MR=22;
var DV=[[0,1],[1,0],[0,-1],[-1,0]];          // facing: 0 down,1 right,2 up,3 left
var DA=[0,-Math.PI/2,Math.PI,Math.PI/2];
var G_SL=1500, MAXP=70;
var SKEY='gf261107-17-karakuri-v1';
var DESK='#c8bca6', INK='rgba(24,20,17,';
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}
function hyp(x,y){return Math.sqrt(x*x+y*y)}
function ease(t){t=clamp(t,0,1);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function rng(seed){var s=(seed>>>0)||1;return function(){s=(s+0x6D2B79F5)>>>0;var t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function AX(p){return p.o===0?p.x:p.y}
function PP(p){return p.o===0?p.y:p.x}
function XY(o,a,pp){return o===0?{x:a,y:pp}:{x:pp,y:a}}
function centerFor(dir,line,tan,w){switch(dir){case 0:return{x:tan,y:line-w};case 2:return{x:tan,y:line+w};case 1:return{x:line-w,y:tan};default:return{x:line+w,y:tan}}}
function wFor(p,dir,line){switch(dir){case 0:return line-p.y;case 2:return p.y-line;case 1:return line-p.x;default:return p.x-line}}
function tanOf(p,dir){return (dir===0||dir===2)?p.x:p.y}
function edgeLine(d){return d===0?PH:d===1?PW:0}
function edgeLen(d){return (d===0||d===2)?PW:PH}
function pip(x,y,poly){var c=false;for(var i=0,j=poly.length-1;i<poly.length;j=i++){var a=poly[i],b=poly[j];if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))c=!c}return c}

/* ===== layout ===== */
var VW=0,VH=0,DPR=1,S=1,OX=0,OY=0,SA={t:0,r:0,b:0,l:0},GAL={mode:'none',x:0,y:0};
function readSA(){try{var cs=getComputedStyle(document.getElementById('sa'));SA.t=parseFloat(cs.paddingTop)||0;SA.r=parseFloat(cs.paddingRight)||0;SA.b=parseFloat(cs.paddingBottom)||0;SA.l=parseFloat(cs.paddingLeft)||0}catch(e){}}
function layout(){
  VW=Math.max(1,window.innerWidth);VH=Math.max(1,window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  readSA();
  var top=SA.t+14,bot=VH-SA.b-60,left=SA.l+14,right=VW-SA.r-14;
  S=Math.max(0.1,Math.min((right-left)/PW,(bot-top)/PH));
  OX=left+((right-left)-PW*S)/2;OY=top+((bot-top)-PH*S)/2;
  if(OY-SA.t>=74){GAL.mode='row';GAL.x=Math.max(SA.l+10,OX);GAL.y=SA.t+8}
  else if(OX-SA.l>=72){GAL.mode='col';GAL.x=SA.l+10;GAL.y=OY}
  else GAL.mode='none';
  SPR={};TEX.F=makePaper(false);TEX.B=makePaper(true);
}

/* ===== art: paper & brush ===== */
var SPR={},TEX={F:null,B:null};
function paperPath(g,r){
  g.beginPath();var N=36,i,j=1.4;
  g.moveTo(0,0);
  for(i=1;i<=N;i++)g.lineTo(PW*i/N,(r()-.5)*j);
  for(i=1;i<=N;i++)g.lineTo(PW+(r()-.5)*j,PH*i/N);
  for(i=1;i<=N;i++)g.lineTo(PW-PW*i/N,PH+(r()-.5)*j);
  for(i=1;i<N;i++)g.lineTo((r()-.5)*j,PH-PH*i/N);
  g.closePath();
}
function makePaper(back){
  var M=40,k=S*DPR,c=document.createElement('canvas');
  c.width=Math.ceil((PW+2*M)*k);c.height=Math.ceil((PH+2*M)*k);
  var g=c.getContext('2d');g.scale(k,k);g.translate(M,M);
  var r=rng(back?777:333);
  g.save();g.shadowColor='rgba(70,52,34,0.30)';g.shadowBlur=16*k;g.shadowOffsetY=5*k;g.shadowOffsetX=2*k;
  g.fillStyle=back?'#ece3cf':'#f4eddd';paperPath(g,rng(back?5:9));g.fill();g.restore();
  g.save();paperPath(g,rng(back?5:9));g.clip();
  var i;
  for(i=0;i<160;i++){var x=r()*PW,y=r()*PH,rr=20+r()*90;var gr=g.createRadialGradient(x,y,0,x,y,rr);
    var dark=r()<.5;gr.addColorStop(0,dark?'rgba(150,125,90,0.035)':'rgba(255,255,250,0.10)');gr.addColorStop(1,'rgba(150,125,90,0)');
    g.fillStyle=gr;g.fillRect(x-rr,y-rr,rr*2,rr*2)}
  g.lineCap='round';
  for(i=0;i<900;i++){var x0=r()*PW,y0=r()*PH,a=r()*Math.PI*2,l=5+r()*26,cu=(r()-.5)*10;
    g.strokeStyle=r()<.55?'rgba(150,128,96,'+(0.06+r()*0.10)+')':'rgba(255,255,252,'+(0.25+r()*0.3)+')';
    g.lineWidth=0.4+r()*1.1;g.beginPath();g.moveTo(x0,y0);
    g.quadraticCurveTo(x0+Math.cos(a)*l/2-Math.sin(a)*cu,y0+Math.sin(a)*l/2+Math.cos(a)*cu,x0+Math.cos(a)*l,y0+Math.sin(a)*l);g.stroke()}
  if(back){g.fillStyle='rgba(120,100,70,0.035)';g.fillRect(0,0,PW,PH)}
  g.restore();
  g.strokeStyle='rgba(120,100,75,0.25)';g.lineWidth=1.2;paperPath(g,rng(back?5:9));g.stroke();
  return {c:c,M:M};
}
function makeStroke(type,seed){
  var r=rng(seed*7919+13),k=S*DPR,ext;
  if(type==='bar')ext=[-BAR_L/2-24,-BAR_T/2-24,BAR_L/2+24,BAR_T/2+24];
  else ext=[-ARC_R-ARC_T-16,-ARC_R-ARC_T-16,ARC_R+ARC_T+16,ARC_T+16];
  var W=ext[2]-ext[0],H=ext[3]-ext[1],c=document.createElement('canvas');
  c.width=Math.max(2,Math.ceil(W*k));c.height=Math.max(2,Math.ceil(H*k));
  var g=c.getContext('2d');g.scale(c.width/W,c.height/H);g.translate(-ext[0],-ext[1]);
  var N=48,pts=[],T=type==='bar'?BAR_T:ARC_T,ph=r()*6,i;
  for(i=0;i<=N;i++){var t=i/N,x,y,tx,ty;
    if(type==='bar'){x=-BAR_L/2+BAR_L*t;y=Math.sin(t*3.1+ph)*2.2;tx=1;ty=0}
    else{var a=Math.PI+Math.PI*t;x=ARC_R*Math.cos(a);y=ARC_R*Math.sin(a);tx=-Math.sin(a);ty=Math.cos(a)}
    var w=T*(1.1-0.22*t+0.08*Math.sin(t*7+ph));
    if(t<0.05)w*=0.82+t/0.05*0.18;
    if(t>0.86)w*=1-(t-0.86)/0.14*0.55;
    pts.push({x:x,y:y,nx:-ty,ny:tx,tx:tx,ty:ty,w:w,t:t})}
  g.save();g.shadowColor='rgba(30,24,18,0.35)';g.shadowBlur=3*k;g.fillStyle='rgba(26,22,19,0.88)';
  bodyPath(g,pts,0,0.8);g.fill();g.restore();
  var NB=24;g.lineCap='round';g.lineJoin='round';
  for(var b=0;b<NB;b++){var off=(b/(NB-1))*2-1,ao=Math.abs(off);
    var tEnd=Math.min(1,0.6+r()*0.42*(1-0.45*ao)+(ao<0.5?0.08:0)),g0=r()<0.55?0.45+r()*0.4:2,g1=g0+0.03+r()*0.07;
    g.strokeStyle='rgba(22,18,15,'+(0.45+r()*0.5)+')';g.lineWidth=T/NB*(1.5+r()*0.9);
    g.beginPath();var pen=false;
    for(i=0;i<=N;i++){var p=pts[i];if(p.t>tEnd)break;if(p.t>g0&&p.t<g1){pen=false;continue}
      var j2=(r()-.5)*0.06,x=p.x+p.nx*(off+j2)*p.w/2,y=p.y+p.ny*(off+j2)*p.w/2;
      if(!pen){g.moveTo(x,y);pen=true}else g.lineTo(x,y)}
    g.stroke()}
  var p0=pts[0],bx0=p0.x+p0.tx*T*0.25,by0=p0.y+p0.ty*T*0.25;
  var rg=g.createRadialGradient(bx0,by0,0,bx0,by0,T*0.6);
  rg.addColorStop(0,'rgba(8,6,5,0.92)');rg.addColorStop(0.65,'rgba(14,11,9,0.55)');rg.addColorStop(1,'rgba(14,11,9,0)');
  g.fillStyle=rg;g.beginPath();g.arc(bx0,by0,T*0.6,0,7);g.fill();
  g.strokeStyle='rgba(255,250,240,0.10)';g.lineWidth=2;g.beginPath();
  for(i=4;i<N*0.6;i++){var pp=pts[i];var xx=pp.x-pp.nx*pp.w*0.18,yy=pp.y-pp.ny*pp.w*0.18;i===4?g.moveTo(xx,yy):g.lineTo(xx,yy)}g.stroke();
  return {c:c,ext:ext};
}
function bodyPath(g,pts,t0,t1){var a=pts.filter(function(p){return p.t>=t0&&p.t<=t1});g.beginPath();
  a.forEach(function(p,i){var x=p.x+p.nx*p.w*0.46,y=p.y+p.ny*p.w*0.46;i?g.lineTo(x,y):g.moveTo(x,y)});
  for(var i=a.length-1;i>=0;i--){var p=a[i];g.lineTo(p.x-p.nx*p.w*0.46,p.y-p.ny*p.w*0.46)}g.closePath()}
function sprite(p){var s=SPR[p.id];if(!s)s=SPR[p.id]=makeStroke(p.type,hashStr(p.id)+sheet.seed);return s}

/* ===== audio ===== */
var AU={c:null,m:null,nb:null,bg:null,bf:null,rg:null,rf:null,on:false};
function audioInit(){
  if(AU.c){if(AU.c.state==='suspended'&&!document.hidden){try{AU.c.resume()}catch(e){}}return}
  try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;var c=new C();AU.c=c;
    var m=c.createGain();m.gain.value=0.8;var comp=c.createDynamicsCompressor();comp.threshold.value=-16;
    m.connect(comp);comp.connect(c.destination);AU.m=m;
    var len=c.sampleRate,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);for(var i=0;i<len;i++)d[i]=Math.random()*2-1;AU.nb=b;
    var s=c.createBufferSource();s.buffer=b;s.loop=true;var f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=2600;f.Q.value=0.8;
    var g=c.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(m);s.start();AU.bf=f;AU.bg=g;
    var s2=c.createBufferSource();s2.buffer=b;s2.loop=true;var f2=c.createBiquadFilter();f2.type='lowpass';f2.frequency.value=260;
    var g2=c.createGain();g2.gain.value=0;s2.connect(f2);f2.connect(g2);g2.connect(m);s2.start(0,0.37);AU.rf=f2;AU.rg=g2;
    AU.on=true;
    if(c.state==='suspended'){try{c.resume()}catch(e){}}
  }catch(e){AU.c=null}
}
function at(){return AU.c.currentTime+0.005}
function ok(){return AU.c&&AU.c.state!=='closed'&&!document.hidden}
function noiseHit(t0,dur,type,freq,q,gain){var c=AU.c,s=c.createBufferSource();s.buffer=AU.nb;var f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  var g=c.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(gain,t0+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f);f.connect(g);g.connect(AU.m);s.start(t0,Math.random()*0.5);s.stop(t0+dur+0.05)}
function tone(t0,dur,type,f0,f1,gain){var c=AU.c,o=c.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);
  var g=c.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(gain,t0+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(AU.m);o.start(t0);o.stop(t0+dur+0.05)}
var lastClick=0;
var SND={
  fold:function(h){if(!ok())return;var t=at();noiseHit(t,0.09,'bandpass',900+h*1700,0.9,0.32);tone(t,0.17,'sine',110+h*150,70+h*100,0.32);tone(t+0.05,0.12,'triangle',380+h*320,300+h*260,0.07)},
  unfold:function(){if(!ok())return;var t=at();noiseHit(t,0.24,'lowpass',850,0.6,0.15);tone(t,0.2,'sine',150,90,0.08)},
  click:function(k){if(!ok())return;var n=performance.now();if(n-lastClick<45)return;lastClick=n;var t=at();tone(t,0.05,'sine',2100+Math.random()*700,1700,0.10*(k||1));tone(t,0.03,'triangle',4300,3800,0.025*(k||1))},
  step:function(l){if(!ok())return;var t=at();tone(t,0.09,'triangle',240+l*80,200+l*70,0.17);noiseHit(t,0.03,'highpass',3200,0.7,0.05)},
  hole:function(){if(!ok())return;var t=at();tone(t,0.38,'sine',620,140,0.30);noiseHit(t,0.2,'lowpass',520,1,0.10)},
  flip:function(){if(!ok())return;var t=at(),c=AU.c,s=c.createBufferSource();s.buffer=AU.nb;var f=c.createBiquadFilter();f.type='bandpass';f.Q.value=0.9;
    f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(2600,t+0.55);var g=c.createGain();g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.18,t+0.2);g.gain.exponentialRampToValueAtTime(0.0001,t+0.7);s.connect(f);f.connect(g);g.connect(AU.m);s.start(t);s.stop(t+0.75);
    tone(t+0.62,0.14,'sine',180,110,0.16)},
  success:function(){if(!ok())return;var t=at();[784,988,1175,1568].forEach(function(f,i){tone(t+i*0.13,1.1,'sine',f,f*0.998,0.14);tone(t+i*0.13,0.5,'sine',f*2.76,f*2.7,0.035)})},
  tick:function(){if(!ok())return;var t=at();tone(t,0.035,'sine',1250,1050,0.05)},
  bridge:function(){if(!ok())return;var t=at();noiseHit(t,0.07,'bandpass',1500,1,0.2);tone(t,0.12,'sine',320,230,0.14)},
  peek:function(){if(!ok())return;var t=at();tone(t,0.16,'sine',430,300,0.09)},
  brush:function(){if(!ok())return;var t=at();noiseHit(t,0.12,'bandpass',2400,0.8,0.10)}
};
function contSound(brushSp,rollSp){
  if(!AU.c||!AU.bg)return;var t=AU.c.currentTime;
  try{AU.bg.gain.setTargetAtTime(document.hidden?0:Math.min(0.20,brushSp*0.00022),t,0.04);AU.bf.frequency.setTargetAtTime(1800+Math.min(2600,brushSp*1.4),t,0.05);
    AU.rg.gain.setTargetAtTime(document.hidden?0:Math.min(0.22,rollSp*0.00045),t,0.05);AU.rf.frequency.setTargetAtTime(160+Math.min(500,rollSp*0.6),t,0.05)}catch(e){}
}

/* ===== sheet state ===== */
var sheet=null,gallery=[],view='F';
function mkPiece(id,side,type,x,y,o){return {id:id,side:side,type:type,x:x,y:y,o:o,ang:type==='bar'?(o?Math.PI/2:0):DA[o],press:0,vx:0,vy:0,jig:0,tw:null}}
function clampPiece(p){p.x=clamp(p.x,22,PW-22);p.y=clamp(p.y,22,PH-22)}
function newSheet(no,seed){
  var r=rng(seed),sh={no:no,seed:seed,passes:0,done:false,flipped:false,cid:0,pieces:[],creases:[]};
  var ad=[0,1,3][Math.floor(r()*3)],al=edgeLen(ad),tan=al*(0.32+r()*0.36);
  var cA=centerFor(ad,edgeLine(ad),tan,168);
  sh.pieces.push(mkPiece('a1','F','arc',cA.x,cA.y,ad));
  var hd;do{hd=Math.floor(r()*4)}while(hd===ad);
  var hl=edgeLen(hd),ht=hl*(0.26+r()*0.48),hp=centerFor(hd,edgeLine(hd),ht,80);
  sh.hole={x:hp.x,y:hp.y,dir:hd};
  var n=DV[ad],tx=-n[1],ty=n[0],c2={x:cA.x+n[0]*(168-85),y:cA.y+n[1]*(168-85)};
  var mh={x:c2.x-tx*ARC_R+n[0]*42-tx*80,y:c2.y-ty*ARC_R+n[1]*42-ty*80};
  if(mh.x<40||mh.x>PW-40||mh.y<40||mh.y>PH-40){mh={x:c2.x+tx*ARC_R+n[0]*42+tx*80,y:c2.y+ty*ARC_R+n[1]*42+ty*80}}
  mh.x=clamp(mh.x,40,PW-40);mh.y=clamp(mh.y,40,PH-40);sh.mh=mh;
  var spots=[],xs=[170,400,630],ys=[190,400,620,840],i,j;
  for(i=0;i<3;i++)for(j=0;j<4;j++)spots.push({x:xs[i],y:ys[j]});
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
  function edgeMin(s){return Math.min(s.x,PW-s.x,s.y,PH-s.y)}
  var fs=shuffle(spots.filter(function(s){return hyp(s.x-cA.x,s.y-cA.y)>290&&hyp(s.x-hp.x,s.y-hp.y)>220&&hyp(s.x-mh.x,s.y-mh.y)>150}));
  var ai=-1;for(i=0;i<fs.length;i++)if(edgeMin(fs[i])>=240){ai=i;break}
  if(ai<0&&fs.length){var bm=-1;for(i=0;i<fs.length;i++)if(bm<0||edgeMin(fs[i])>edgeMin(fs[bm]))bm=i;ai=bm}
  var arcB=ai>=0?fs.splice(ai,1)[0]:{x:PW-cA.x>PW/2?PW-170:170,y:PH-cA.y>PH/2?PH-260:260};
  sh.pieces.push(mkPiece('a2','F','arc',arcB.x+(r()-.5)*30,arcB.y+(r()-.5)*30,0));
  var aB=sh.pieces[1];
  function place(id,side,avoid){var best=null,bs=-1e9;for(var k=0;k<80;k++){var c={x:120+r()*560,y:150+r()*740,o:r()<.5?0:1},sc=1e9;
      avoid.forEach(function(v){sc=Math.min(sc,hyp(c.x-v.x,c.y-v.y)-v.r)});
      sh.pieces.forEach(function(q){if(q.side!==side||q.type!=='bar')return;var G=pairGeo({x:c.x,y:c.y,o:c.o},q);if(G&&(pairKind(G)||pairPre(G)>0))sc-=400});
      if(sc>bs){bs=sc;best=c}if(sc>=0)break}
    var p=mkPiece(id,side,'bar',best.x,best.y,best.o);sh.pieces.push(p);avoid.push({x:best.x,y:best.y,r:250});return p}
  var av=[{x:cA.x,y:cA.y,r:300},{x:aB.x,y:aB.y,r:300},{x:hp.x,y:hp.y,r:230},{x:mh.x,y:mh.y,r:180}];
  ['b1','b2','b3','b4'].forEach(function(id){place(id,'F',av)});
  var bh={x:PW-hp.x,y:hp.y};
  var bs=shuffle(spots.filter(function(s){return hyp(s.x-bh.x,s.y-bh.y)>230}));
  var bi=-1;for(i=0;i<bs.length;i++)if(edgeMin(bs[i])>=240){bi=i;break}
  if(bi<0&&bs.length){var bm2=-1;for(i=0;i<bs.length;i++)if(bm2<0||edgeMin(bs[i])>edgeMin(bs[bm2]))bm2=i;bi=bm2}

    ctx.drawImage(trans.snap,cv.width*(1-k)*0.1,-cv.height*0.6*e,cv.width*k,cv.height*k);ctx.globalAlpha=1}
}

/* ===== main loop ===== */
var rafId=0,lastT=0,running=false;
function update(dt,now){
  T+=dt;
  sheet.pieces.forEach(function(p){
    if(p.tw){p.tw.t+=dt/p.tw.d;var e=1-Math.pow(1-clamp(p.tw.t,0,1),3);var nx=lerp(p.tw.fx,p.tw.tx,e),ny=lerp(p.tw.fy,p.tw.ty,e);p.vx=(nx-p.x)/Math.max(dt,1e-3)*0.5;p.vy=(ny-p.y)/Math.max(dt,1e-3)*0.5;p.x=nx;p.y=ny;if(p.tw.t>=1){p.tw=null;failed={};save()}}
    else if(!(drag&&drag.p===p)){p.vx*=Math.max(0,1-10*dt);p.vy*=Math.max(0,1-10*dt)}
    if(drag&&drag.p===p&&drag.tm&&now-drag.tm>60){p.vx*=0.8;p.vy*=0.8}
    var ta=p.type==='bar'?(p.o?Math.PI/2:0):DA[p.o],da=ta-p.ang;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;p.ang+=da*Math.min(1,14*dt);
    p.jig=Math.max(0,p.jig-dt*2.5);if(!(drag&&drag.p===p))p.press=Math.max(0,p.press-dt*6)});
  SIDES.F=compute('F',null);SIDES.B=compute('B',SIDES.F);
  liftUpdate(dt);booting=false;
  mUpdate(dt);partUpdate(dt);
  if(flip.active){flip.t+=dt/0.8;if(flip.t>=0.5&&view===flip.from){view=flip.from==='F'?'B':'F';if(view==='B'&&SIDES.B.toys.some(function(t){return t.type==='struct'}))disc('structSeen')}if(flip.t>=1){flip.active=false;flip.t=0}}
  if(trans.active){trans.t+=dt/0.85;if(trans.t>=1){trans.active=false;trans.snap=null}}
  hintT-=dt;if(hintT<=0){hintT=0.2;HINT=computeHint()}
  demoUpdate(dt,now);
  if(SIDES.B.toys.some(function(t){return t.type!=='struct'})&&SIDES.B.links.some(function(l){return !l.hole&&((SIDES.B.map[l.a.key]||{}).type==='struct')!==((SIDES.B.map[l.b.key]||{}).type==='struct')}))disc('backExtend');
  var bsp=0;if(drag&&drag.p)bsp=hyp(drag.p.vx,drag.p.vy);else if(drag&&drag.kind==='toy'&&drag.ps[0])bsp=hyp(drag.ps[0].vx,drag.ps[0].vy);
  var rsp=(M.mode==='path'||M.mode==='bridge'||M.mode==='approach')&&M.side===view?Math.abs(M.v):0;contSound(bsp,rsp);
}
function frame(now){rafId=0;if(!running)return;var dt=Math.min(0.05,Math.max(0,(now-lastT)/1000));lastT=now;
  try{update(dt,now);render()}catch(e){if(window.console)console.warn(e)}
  rafId=requestAnimationFrame(frame)}
function start(){if(running)return;running=true;lastT=performance.now();rafId=requestAnimationFrame(frame)}
function stop(){running=false;if(rafId)cancelAnimationFrame(rafId);rafId=0;contSound(0,0)}
document.addEventListener('visibilitychange',function(){if(document.hidden){cancelDrag();stop();doSave();if(AU.c){try{AU.c.suspend()}catch(e){}}}
  else{if(AU.c){try{AU.c.resume()}catch(e){}}start()}});
window.addEventListener('pagehide',function(){doSave()});
var rsT=0;function onResize(){clearTimeout(rsT);rsT=setTimeout(function(){layout()},60)}
window.addEventListener('resize',onResize);window.addEventListener('orientationchange',onResize);

/* ===== boot ===== */
(function boot(){var L=load();
  var hm=/seed=(\d+)/.exec(location.hash||'');
  if(L){sheet=L.sheet;gallery=L.gallery}else{var sd=hm?(parseInt(hm[1],10)>>>0):(Date.now()^Math.floor(Math.random()*1e9))>>>0;sheet=newSheet(1,sd)}
  layout();resetRun();
  if(L){sheet.pieces.forEach(function(p){p.ang=p.type==='bar'?(p.o?Math.PI/2:0):DA[p.o]})}
  SIDES.F=compute('F',null);SIDES.B=compute('B',SIDES.F);
  if(!L)doSave();
  start();
})();

/* test/inspection hook (no UI) */
window.__gf17={
  state:function(){function tl(SD){return SD.toys.map(function(t){return {key:t.key,type:t.type,sub:t.sub,w:t.w,base:t.base&&t.base.kind,dirHigh:t.dirHigh,ports:t.ports.length,lift:LIFT[t.key]?LIFT[t.key].x:0}})}
    return {view:view,flipping:flip.active,trans:trans.active,no:sheet.no,passes:sheet.passes,done:sheet.done,flipped:sheet.flipped,creases:sheet.creases.map(function(c){return {side:c.side,x1:c.x1,y1:c.y1,x2:c.x2,y2:c.y2,by:c.by}}),
      marble:{side:M.side,mode:M.mode,x:M.x,y:M.y,z:M.z,key:M.key},toys:{F:tl(SIDES.F),B:tl(SIDES.B)},
      links:{F:SIDES.F.links.map(function(l){return {key:l.key,d:Math.round(l.d),bridge:l.bridge,hole:l.hole}}),B:SIDES.B.links.map(function(l){return {key:l.key,d:Math.round(l.d),bridge:l.bridge,hole:l.hole}})},
      holeActive:!!holeActive(),hole:sheet.hole,disc:DISC,hint:HINT&&{kind:HINT.kind,key:HINT.key,id:HINT.id,goal:HINT.goal},demo:demo.t,saveOK:saveOK,gallery:gallery.length,audio:AU.c?AU.c.state:'none',parts:PARTS.length,running:running}},
  pieces:function(){return sheet.pieces.map(function(p){return {id:p.id,side:p.side,type:p.type,x:p.x,y:p.y,o:p.o}})},
  w2s:function(x,y){return {x:OX+x*S,y:OY+y*S}},
  layout:function(){return {S:S,OX:OX,OY:OY,VW:VW,VH:VH,DPR:DPR,SA:SA}}
};
})();
