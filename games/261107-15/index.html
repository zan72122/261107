<script>
'use strict';
(function(){
// =====================================================================
//  basics
// =====================================================================
const cv=document.getElementById('c'), sa=document.getElementById('sa');
let cx=cv.getContext('2d');
const SPEED=(function(){const m=/[?&]speed=(\d+(?:\.\d+)?)/.exec(location.search);return m?Math.min(8,Math.max(.25,+m[1])):1;})();
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const back=t=>{t=clamp(t,0,1);const c1=1.7,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const nrm=(x,y)=>{const l=Math.hypot(x,y)||1;return {x:x/l,y:y/l};};
const COL={ecru:'#efe6d2',ecru2:'#e4d6b8',ecru3:'#d3bf96',ecru4:'#bfa678',navy:'#1f2a5a',navy2:'#34457f',red:'#c8323c',red2:'#e2585a',redD:'#93202a',blue:'#2f5fae',blue2:'#5a86cf',blueD:'#1f4686',yel:'#e8b52a',yel2:'#f5d266',yelD:'#b98712',skin:'#f4e3c4',wood:'#a8743c'};
const ITEM={umb:{p:1.25,b:1.12,k:110,d:4.5},chair:{p:.78,b:.82,k:230,d:9},tray:{p:1.05,b:1,k:320,d:5.5},yarn:{p:1.5,b:1.35,k:85,d:3.2},none:{p:1,b:1,k:200,d:8}};
const HOUSES=['tea','nei','craft'];
const CARGO=['umb','chair','tray','yarn'];

// =====================================================================
//  audio (Web Audio synth)
// =====================================================================
const AU={c:null,m:null,nb:null,unlocked:false,
  init(){
    if(!this.c){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      try{
        this.c=new AC();
        const comp=this.c.createDynamicsCompressor(); comp.connect(this.c.destination);
        this.m=this.c.createGain(); this.m.gain.value=.55; this.m.connect(comp);
        const n=(this.c.sampleRate*.6)|0; this.nb=this.c.createBuffer(1,n,this.c.sampleRate);
        const d=this.nb.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
      }catch(e){this.c=null;return;}
    }
    if(this.c.state==='suspended'&&!document.hidden){try{this.c.resume().catch(()=>{});}catch(e){}}
    if(!this.unlocked){try{const b=this.c.createBuffer(1,1,22050),s=this.c.createBufferSource();s.buffer=b;s.connect(this.m);s.start(0);}catch(e){} this.unlocked=true;}
  },
  ok(){return !!this.c&&!document.hidden;},
  tone(type,f0,f1,dur,vol,dl){
    if(!this.ok())return; const c=this.c,t=c.currentTime+(dl||0);
    try{const o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f0,t);
    if(f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(this.m); o.start(t); o.stop(t+dur+.03);}catch(e){}
  },
  noise(dur,vol,freq,q,dl,type){
    if(!this.ok())return; const c=this.c,t=c.currentTime+(dl||0);
    try{const s=c.createBufferSource(); s.buffer=this.nb; const f=c.createBiquadFilter(); f.type=type||'bandpass'; f.frequency.value=freq; f.Q.value=q;
    const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.005); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(this.m); s.start(t,Math.random()*.4); s.stop(t+dur+.03);}catch(e){}
  },
  suspend(){if(this.c&&this.c.state==='running'){try{this.c.suspend().catch(()=>{});}catch(e){}}},
  resume(){if(this.c&&this.c.state==='suspended'){try{this.c.resume().catch(()=>{});}catch(e){}}}
};
const SND={
  pokon(p){p=p||1;AU.tone('sine',165*p,78*p,.24,.55);AU.tone('triangle',330*p,150*p,.09,.16);AU.noise(.04,.1,900*p,1.5);},
  land(p){p=p||1;AU.tone('sine',118*p,70*p,.12,.22);AU.noise(.03,.05,600,1);},
  tick(a){AU.tone('triangle',a?640:500,a?620:490,.035,.07);AU.noise(.02,.04,2600,2);},
  pofu(a){AU.tone('sine',a?210:165,a?150:115,.14,.16);AU.noise(.09,.05,480,.8,0,'lowpass');},
  pick(p){p=p||1;AU.tone('triangle',500*p,700*p,.09,.2);AU.tone('sine',1000*p,1000*p,.12,.06,.04);},
  flag(){AU.tone('triangle',660,880,.08,.16);AU.tone('triangle',880,990,.08,.12,.07);},
  nope(){AU.tone('sine',260,230,.07,.06);},
  ok(){[523,659,784,1047].forEach((f,i)=>AU.tone('triangle',f,f,.3,.19,i*.08));AU.tone('sine',262,262,.5,.14);},
  big(){[392,523,659,784,1047,1319].forEach((f,i)=>AU.tone('triangle',f,f,.38,.17,i*.09));AU.tone('sine',196,392,.9,.16);},
  clap(){AU.noise(.05,.2,1600,1.2);AU.noise(.04,.12,2600,1.4,.03);},
  knit(){for(let i=0;i<5;i++)AU.tone('triangle',880+i*110,880+i*110,.05,.07,i*.06);},
  rewind(){AU.tone('triangle',700,120,.9,.12);AU.tone('sine',520,90,.9,.12);},
  wave(){AU.tone('sine',700,900,.08,.07);},
  board(){AU.tone('square',330,330,.05,.04);AU.tone('square',440,440,.06,.04,.08);},
  snap(){AU.tone('sine',400,200,.12,.1);},
  plop(){AU.tone('sine',520,300,.08,.12);}
};

// =====================================================================
//  layout
// =====================================================================
const LAY={
  p:{side:[-1,1,1],pole:1,shelfSide:-1,craftKeys:['dock','m1','c1','c2','craft'],
    craftY:{A:[1.1,-.15],holder:[2.45,-.1],tray:[1.75,.55]},
    dock:[.42,.815],m1:[.45,.72],stop:[.49,.59],J:[.38,.515],t1:[.33,.41],tea:[.32,.31],
    d1:[.42,.40],d2:[.51,.475],d3:[.62,.41],nei:[.70,.31],
    c1:[.32,.705],c2:[.22,.685],craft:[.15,.665],
    shop:[.78,.835],shelf:[.80,.665],garden:[.51,.39],
    tiles:[[.12,.94],[.33,.94],[.54,.94],[.75,.94]],
    flags:[[.04,.705],[.04,.78],[.04,.855]],spool:[.92,.04]},
  l:{side:[-1,1,-1],pole:-1,shelfSide:1,craftKeys:['dock','m1','stop','J','c1','c2','craft'],
    craftY:{A:[-1.05,-.15],holder:[-2.1,-1.0],tray:[-3.1,-.75]},
    dock:[.31,.79],m1:[.32,.70],stop:[.34,.62],J:[.40,.60],t1:[.46,.57],tea:[.47,.47],
    d1:[.52,.63],d2:[.61,.74],d3:[.70,.63],nei:[.75,.47],
    c1:[.52,.80],c2:[.72,.92],craft:[.93,.92],
    shop:[.10,.30],shelf:[.11,.60],garden:[.61,.60],
    tiles:[[.06,.91],[.15,.91],[.24,.91],[.33,.91]],
    flags:[[.02,.76],[.07,.775],[.12,.79]],spool:[.965,.075]}
};
let W=0,H=0,DPR=1,U=30,PORT=true,AR={x:0,y:0,w:1,h:1},A=null,PAT=null,BGC=null;
const SIDE={tea:1,nei:1,craft:1};
function readSafe(){const s=getComputedStyle(sa);return [parseFloat(s.paddingTop)||0,parseFloat(s.paddingRight)||0,parseFloat(s.paddingBottom)||0,parseFloat(s.paddingLeft)||0];}
function buildAnchors(){
  const L=PORT?LAY.p:LAY.l; const P=f=>({x:AR.x+f[0]*AR.w,y:AR.y+f[1]*AR.h});
  A={};
  for(const k in L){if(!Array.isArray(L[k])||typeof L[k][0]!=='number')continue;A[k]=P(L[k]);}
  A.tiles={};CARGO.forEach((k,i)=>A.tiles[k]=P(L.tiles[i]));
  A.flags={};HOUSES.forEach((k,i)=>A.flags[k]=P(L.flags[i]));
  A.spot={tea:A.tea,nei:A.nei,craft:A.craft};
  HOUSES.forEach((h,i)=>SIDE[h]=L.side[i]);A.pole=L.pole;A.shelfSide=L.shelfSide;A.craftKeys=L.craftKeys;A.craftY=L.craftY;
  const dir=Math.sign(A.nei.x-A.tea.x)||1;
  A.R1={x:A.tea.x+dir*1.4*U,y:A.tea.y-1.15*U};
  A.R2={x:A.nei.x-dir*1.4*U,y:A.nei.y-1.15*U};
  A.CM={x:(A.R1.x+A.R2.x)/2,y:(A.R1.y+A.R2.y)/2+.3*U};
}
function resize(){
  W=Math.max(200,window.innerWidth);H=Math.max(200,window.innerHeight);DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const s=readSafe(),pad=6;
  AR={x:s[3]+pad,y:s[0]+pad,w:W-s[1]-s[3]-pad*2,h:H-s[0]-s[2]-pad*2};
  PORT=AR.h>=AR.w*1.05;
  U=PORT?Math.min(AR.w/10,AR.h/21):Math.min(AR.w/18,AR.h/13.5);
  buildAnchors();PAT=mkPats();buildBG();
  if(C&&C.route){const f=C.route.total?C.u/C.route.total:0;C.route=C.reverse?revRoute(routeTo(C.dest)):routeTo(C.dest);C.u=f*C.route.total;C.stopU=C.route.stopU;}
}

// =====================================================================
//  knit patterns
// =====================================================================
function knit(base,hi,lo){
  const s=Math.max(5,Math.round(U*.2*DPR)),ch=Math.max(4,Math.round(s*.78));
  const c=document.createElement('canvas');c.width=s*2;c.height=ch*2;const g=c.getContext('2d');
  g.fillStyle=base;g.fillRect(0,0,c.width,c.height);g.lineCap='round';g.lineJoin='round';
  for(let col=0;col<2;col++)for(let row=-1;row<=2;row++){
    const x0=col*s,y0=row*ch;
    g.lineWidth=s*.3;g.strokeStyle=lo;g.beginPath();g.moveTo(x0+s*.12,y0+ch*.15+1);g.lineTo(x0+s*.5,y0+ch*1.0+1);g.lineTo(x0+s*.88,y0+ch*.15+1);g.stroke();
    g.lineWidth=s*.22;g.strokeStyle=hi;g.beginPath();g.moveTo(x0+s*.14,y0+ch*.1);g.lineTo(x0+s*.5,y0+ch*.92);g.lineTo(x0+s*.86,y0+ch*.1);g.stroke();
  }
  const p=cx.createPattern(c,'repeat');
  try{if(p.setTransform&&window.DOMMatrix)p.setTransform(new DOMMatrix([1/DPR,0,0,1/DPR,0,0]));}catch(e){}
  return p;
}
function mkPats(){
  return {red:knit(COL.red,COL.red2,COL.redD),blue:knit(COL.blue,COL.blue2,COL.blueD),yel:knit(COL.yel,COL.yel2,COL.yelD),
    ecru:knit(COL.ecru2,'#f6eedc',COL.ecru3),tan:knit(COL.ecru3,'#e2d0aa',COL.ecru4),skin:knit(COL.skin,'#fbf0db','#e2cca6'),navy:knit(COL.navy,COL.navy2,'#141c40')};
}

// =====================================================================
//  draw primitives
// =====================================================================
function ol(w){cx.lineJoin='round';cx.lineCap='round';cx.strokeStyle=COL.navy;cx.lineWidth=U*.1*(w||1);cx.stroke();}
function olT(w){w=w||1;ol(w);cx.setLineDash([U*.08*w,U*.1*w]);cx.strokeStyle='rgba(130,150,215,.6)';cx.lineWidth=U*.032*w;cx.stroke();cx.setLineDash([]);}
function puff(path,fill,w){cx.save();cx.translate(U*.03,U*.08);path();cx.fillStyle='rgba(31,42,90,.25)';cx.fill();cx.restore();path();cx.fillStyle=fill;cx.fill();olT(w);}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
function circ(x,y,r){cx.beginPath();cx.arc(x,y,r,0,TAU);}
function ell(x,y,rx,ry){cx.beginPath();cx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,TAU);}
function stitch(x1,y1,x2,y2,col,w){cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(x2,y2);cx.setLineDash([U*.09,U*.08]);cx.strokeStyle=col||COL.navy;cx.lineWidth=U*.04*(w||1);cx.lineCap='round';cx.stroke();cx.setLineDash([]);}
function line(x1,y1,x2,y2,col,w){cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(x2,y2);cx.strokeStyle=col;cx.lineWidth=w;cx.lineCap='round';cx.stroke();}
function yarnLine(x1,y1,x2,y2,col,w){line(x1,y1,x2,y2,COL.navy,w+U*.08);line(x1,y1,x2,y2,col,w);}

// ---------------------------------------------------------------------
//  items  (origin = bottom centre)
// ---------------------------------------------------------------------
function drawItem(k,x,y,s,o){
  o=o||{};cx.save();cx.translate(x,y);if(s!==1)cx.scale(s,s);if(o.rot)cx.rotate(o.rot);
  if(k==='umb'){
    cx.beginPath();cx.moveTo(0,-1.28*U);cx.lineTo(0,-1.5*U);cx.arc(.16*U,-1.5*U,.16*U,PI,0);
    cx.strokeStyle=COL.navy;cx.lineWidth=.17*U;cx.lineCap='round';cx.stroke();cx.strokeStyle=COL.wood;cx.lineWidth=.08*U;cx.stroke();
    puff(()=>{cx.beginPath();cx.moveTo(0,-1.32*U);cx.quadraticCurveTo(.36*U,-1.05*U,.29*U,-.62*U);cx.quadraticCurveTo(.2*U,-.24*U,0,-.06*U);cx.quadraticCurveTo(-.2*U,-.24*U,-.29*U,-.62*U);cx.quadraticCurveTo(-.36*U,-1.05*U,0,-1.32*U);cx.closePath();},PAT.red);
    rr(-.3*U,-.82*U,.6*U,.16*U,.06*U);cx.fillStyle=PAT.yel;cx.fill();ol(.6);
    stitch(-.1*U,-1.2*U,-.12*U,-.25*U,COL.redD);stitch(.1*U,-1.2*U,.12*U,-.25*U,COL.redD);
  }else if(k==='chair'||k==='bench'){
    const bench=k==='bench';
    yarnLine(-.34*U,-.58*U,-.36*U,0,COL.yel,.1*U);yarnLine(.34*U,-.58*U,.36*U,0,COL.yel,.1*U);
    if(!bench){puff(()=>rr(-.36*U,-1.28*U,.72*U,.56*U,.16*U),PAT.blue,.8);stitch(-.22*U,-1.1*U,.22*U,-1.1*U,COL.yel);}
    puff(()=>rr(-.46*U,-.72*U,.92*U,.22*U,.09*U),PAT.blue,.8);
    if(bench){
      puff(()=>rr(-.72*U,-.9*U,1.44*U,.22*U,.08*U),PAT.yel,.8);
      // tools on bench: spool + scissors
      circ(-.4*U,-1.02*U,.12*U);cx.fillStyle=PAT.red;cx.fill();ol(.5);
      cx.beginPath();cx.moveTo(.15*U,-.98*U);cx.lineTo(.5*U,-1.1*U);cx.moveTo(.15*U,-1.08*U);cx.lineTo(.5*U,-.96*U);cx.strokeStyle=COL.navy;cx.lineWidth=.06*U;cx.stroke();
    }
  }else if(k==='tray'){
    puff(()=>ell(0,-.16*U,.6*U,.2*U),PAT.yel,.8);ell(0,-.18*U,.44*U,.12*U);cx.strokeStyle=COL.yelD;cx.lineWidth=.04*U;cx.stroke();
    if(o.cups){for(let i=0;i<2;i++){const cxp=(i?.2:-.2)*U;puff(()=>rr(cxp-.11*U,-.48*U,.22*U,.28*U,.05*U),i?PAT.blue:PAT.red,.6);
      cx.beginPath();cx.moveTo(cxp,-.52*U);cx.quadraticCurveTo(cxp+.08*U,-.68*U,cxp,-.82*U);cx.strokeStyle='rgba(31,42,90,.35)';cx.lineWidth=.035*U;cx.stroke();}}
  }else if(k==='yarn'||k==='yR'||k==='yB'||k==='yY'){
    const p=k==='yB'?PAT.blue:k==='yY'?PAT.yel:k==='yR'?PAT.red:(o.c==='b'?PAT.blue:o.c==='y'?PAT.yel:PAT.red);
    puff(()=>circ(0,-.36*U,.36*U),p,.8);
    cx.save();circ(0,-.36*U,.34*U);cx.clip();cx.strokeStyle='rgba(31,42,90,.45)';cx.lineWidth=.04*U;
    for(let i=-2;i<=2;i++){cx.beginPath();cx.ellipse(0,-.36*U,.36*U,.13*U,.7,i*.5,i*.5+2.2);cx.stroke();}
    for(let i=0;i<3;i++){cx.beginPath();cx.arc(-.25*U+i*.18*U,-.25*U,.32*U,-1.9,-.6);cx.stroke();}
    cx.restore();
    cx.beginPath();cx.moveTo(.3*U,-.2*U);cx.quadraticCurveTo(.5*U,-.02*U,.62*U,-.06*U);cx.strokeStyle=COL.navy;cx.lineWidth=.04*U;cx.stroke();
  }else if(k==='cozy'){
    puff(()=>{cx.beginPath();cx.moveTo(-.42*U,0);cx.quadraticCurveTo(-.46*U,-.74*U,0,-.74*U);cx.quadraticCurveTo(.46*U,-.74*U,.42*U,0);cx.closePath();},PAT.red,.8);
    rr(-.44*U,-.16*U,.88*U,.16*U,.05*U);cx.fillStyle=PAT.yel;cx.fill();ol(.5);
    circ(0,-.82*U,.12*U);cx.fillStyle=PAT.blue;cx.fill();ol(.5);
  }else if(k==='mitten'){
    puff(()=>{cx.beginPath();cx.moveTo(-.22*U,0);cx.lineTo(-.24*U,-.6*U);cx.quadraticCurveTo(-.22*U,-.86*U,.02*U,-.86*U);cx.quadraticCurveTo(.24*U,-.86*U,.24*U,-.6*U);cx.lineTo(.24*U,-.42*U);cx.quadraticCurveTo(.44*U,-.5*U,.42*U,-.32*U);cx.quadraticCurveTo(.36*U,-.18*U,.22*U,-.2*U);cx.lineTo(.22*U,0);cx.closePath();},PAT.blue,.8);
    rr(-.26*U,-.14*U,.5*U,.14*U,.04*U);cx.fillStyle=PAT.yel;cx.fill();ol(.5);
  }else if(k==='bolt'){
    puff(()=>rr(-.5*U,-.5*U,1*U,.42*U,.2*U),PAT.tan,.7);ell(.42*U,-.29*U,.08*U,.2*U);cx.fillStyle=COL.ecru4;cx.fill();ol(.5);
    stitch(-.3*U,-.29*U,.3*U,-.29*U,COL.red);
  }
  cx.restore();
}
// parasol: (x,y)=centre of dome base
function drawParasol(x,y,r,open,cA,cB,shop,sway){
  if(open<=0)return;
  cx.save();cx.translate(x,y);cx.rotate(sway||0);
  const rx=r*(.25+.75*open),ry=r*.72*(.4+.6*open),n=6;
  // pole
  yarnLine(0,-.1*U,0,1.0*U,COL.wood,.1*U);
  if(shop){// back curtain of roofed workshop
    cx.save();rr(-rx*.92,0,rx*1.84,.95*U,.1*U);cx.fillStyle=PAT.tan;cx.globalAlpha=.85;cx.fill();cx.globalAlpha=1;ol(.6);cx.restore();
    for(let i=1;i<6;i++){stitch(-rx*.92+i*rx*1.84/6,.05*U,-rx*.92+i*rx*1.84/6,.9*U,COL.ecru4,.8);}
  }
  const dome=()=>{cx.beginPath();cx.moveTo(-rx,0);cx.bezierCurveTo(-rx,-ry*1.25,rx,-ry*1.25,rx,0);
    for(let i=n;i>0;i--){const xa=-rx+2*rx*(i-1)/n,xm=(-rx+2*rx*(i-.5)/n);cx.quadraticCurveTo(xm,ry*.28,xa,0);} cx.closePath();};
  puff(dome,cA,1.1);
  cx.save();dome();cx.clip();
  for(let i=0;i<n;i+=2){const xa=-rx+2*rx*i/n,xb=-rx+2*rx*(i+1)/n;cx.beginPath();cx.moveTo(0,-ry*.95);cx.lineTo(xa,.3*U);cx.lineTo(xb,.3*U);cx.closePath();cx.fillStyle=cB;cx.fill();}
  cx.restore();
  dome();ol(1.1);
  for(let i=1;i<n;i++){const xa=-rx+2*rx*i/n;cx.beginPath();cx.moveTo(0,-ry*.94);cx.quadraticCurveTo(xa*.7,-ry*.6,xa,0);cx.strokeStyle='rgba(31,42,90,.55)';cx.lineWidth=.04*U;cx.stroke();}
  circ(0,-ry*.96,.1*U);cx.fillStyle=PAT.yel;cx.fill();ol(.6);
  if(shop){// valance with fringe
    rr(-rx*1.02,-.04*U,rx*2.04,.26*U,.08*U);cx.fillStyle=PAT.blue;cx.fill();ol(.7);

const LOOK={
  tea:{body:'red',hair:COL.yel,hs:'bun',cuff:'yel'},
  nei:{body:'blue',hair:COL.red,hs:'curl',cuff:'red'},
  craft:{body:'yel',hair:COL.navy,hs:'band',cuff:'blue'},
  keeper:{body:'blue',hair:COL.navy,hs:'kerchief',cuff:'yel',apron:true}
};
function armDirs(pose,t,o){
  const sw=Math.sin(t*9)*.5;
  switch(pose){
    case 'wave':return [{x:-.35,y:.94},nrm(.55+.3*Math.sin(t*14),-.85)];
    case 'hug':return [nrm(.75,-.1),nrm(-.75,-.1)];
    case 'carry':return [nrm(.6,-.75),nrm(-.6,-.75)];
    case 'clap':{const c=Math.sin(t*18)>0;return c?[nrm(.98,-.15),nrm(-.98,-.15)]:[nrm(.5,.4),nrm(-.5,.4)];}
    case 'work':return [nrm(.85,.25+.35*Math.sin(t*9)),nrm(-.85,.25-.35*Math.sin(t*9))];
    case 'push':return [nrm(o.face*.98,.08),nrm(o.face*.98,.2)];
    case 'brace':return [nrm(o.face*.95,-.25),nrm(o.face*.95,-.1)];
    case 'shade':return [nrm(.25,-.97),nrm(-.25,-.97)];
    case 'sit':return [nrm(.5,.7),nrm(-.5,.7)];
    case 'drink':return [nrm(.5,.7),nrm(-.45,-.8)];
    case 'point':{const d=nrm(o.px||1,o.py||-.3);return [{x:-.35,y:.94},d];}
    case 'walk':return [nrm(-.35+sw*.6,.9),nrm(.35-sw*.6,.9)];
    case 'cheer':return [nrm(-.6,-.8),nrm(.6,-.8)];
    default:return [{x:-.33,y:.94},{x:.33,y:.94}];
  }
}
function drawDoll(x,y,lk,pose,o){
  o=o||{};const t=o.t||0,s=o.s||1;
  const L=LOOK[lk];const bp=PAT[L.body];
  cx.save();cx.translate(x,y);if(s!==1)cx.scale(s,s);
  const sit=pose==='sit'||pose==='drink'||o.sit;
  let bob=o.bob||0;
  if(pose==='walk')bob=-Math.abs(Math.sin(t*9))*.12*U;
  if(pose==='cheer'||pose==='wave')bob=-Math.abs(Math.sin(t*7))*.06*U;
  cx.translate(0,bob+(sit?.32*U:0));
  // legs
  if(sit){yarnLine(-.12*U,-.32*U,-.12*U+.0*U,-.02*U,COL.navy2,.12*U);yarnLine(.12*U,-.32*U,.14*U,-.02*U,COL.navy2,.12*U);}
  else{const lw=pose==='walk'?Math.sin(t*9)*.12*U:0;const sp=pose==='brace'?.1*U:0;
    yarnLine(-.12*U,-.3*U,-.14*U-lw-sp,-.03*U,COL.navy2,.12*U);yarnLine(.12*U,-.3*U,.14*U+lw+sp,-.03*U,COL.navy2,.12*U);
    ell(-.16*U-lw-sp,-.02*U,.12*U,.07*U);cx.fillStyle=COL.navy;cx.fill();ell(.16*U+lw+sp,-.02*U,.12*U,.07*U);cx.fill();}
  const lean=pose==='brace'||pose==='push'?(o.face||1)*.12:0;
  cx.save();cx.rotate(lean);
  // body
  const body=()=>{cx.beginPath();cx.moveTo(-.2*U,-.96*U);cx.lineTo(.2*U,-.96*U);cx.quadraticCurveTo(.44*U,-.32*U,.38*U,-.24*U);cx.lineTo(-.38*U,-.24*U);cx.quadraticCurveTo(-.44*U,-.32*U,-.2*U,-.96*U);cx.closePath();};
  puff(body,bp,.9);
  rr(-.4*U,-.36*U,.8*U,.13*U,.05*U);cx.fillStyle=PAT[L.cuff];cx.fill();ol(.5);
  if(L.apron){puff(()=>rr(-.2*U,-.74*U,.4*U,.42*U,.06*U),PAT.ecru,.6);rr(-.1*U,-.58*U,.2*U,.14*U,.03*U);cx.fillStyle=PAT.yel;cx.fill();ol(.4);}
  else stitch(0,-.9*U,0,-.4*U,'rgba(31,42,90,.6)');
  // arms
  const ad=armDirs(pose,t,o);const al=.48*U;
  for(let i=0;i<2;i++){const sx=(i?.24:-.24)*U,sy=-.86*U;const d=ad[i];const hx=sx+d.x*al,hy=sy+d.y*al;
    yarnLine(sx,sy,hx,hy,COL[L.body==='yel'?'yel':L.body],.15*U);circ(hx,hy,.09*U);cx.fillStyle=COL.skin;cx.fill();ol(.5);
    if(i===1&&pose==='drink'){puff(()=>rr(hx-.08*U,hy-.2*U,.16*U,.2*U,.04*U),PAT.blue,.5);}
  }
  // head
  const hy=-1.24*U,hr=.34*U;
  if(L.hs==='bun'){puff(()=>circ(0,hy-.36*U,.16*U),L.hair,.7);}
  if(L.hs==='curl'){cx.fillStyle=L.hair;for(let i=0;i<7;i++){const a=PI+i*PI/6;circ(Math.cos(a)*hr*.95,hy+Math.sin(a)*hr*.95,.11*U);cx.fill();ol(.4);}}
  puff(()=>circ(0,hy,hr),PAT.skin,.9);
  // hair cap
  cx.save();circ(0,hy,hr);cx.clip();
  cx.beginPath();cx.ellipse(0,hy-hr*.55,hr*1.1,hr*.62,0,0,TAU);cx.fillStyle=L.hair;cx.fill();
  cx.strokeStyle='rgba(31,42,90,.35)';cx.lineWidth=.03*U;for(let i=-3;i<=3;i++){cx.beginPath();cx.moveTo(i*.08*U,hy-hr);cx.lineTo(i*.1*U,hy-hr*.15);cx.stroke();}
  cx.restore();
  if(L.hs==='band'){cx.beginPath();cx.arc(0,hy,hr*.98,PI*1.12,PI*1.88);cx.strokeStyle=COL.red;cx.lineWidth=.1*U;cx.stroke();}
  if(L.hs==='kerchief'){puff(()=>{cx.beginPath();cx.moveTo(-hr*1.05,hy-hr*.2);cx.quadraticCurveTo(0,hy-hr*1.6,hr*1.05,hy-hr*.2);cx.lineTo(hr*1.3,hy-hr*.05);cx.closePath();},PAT.red,.6);}
  circ(0,hy,hr);ol(.8);
  // face
  const g=o.gaze?nrm(o.gaze.x,o.gaze.y):{x:0,y:0};const ex=g.x*.05*U,ey=g.y*.04*U;
  for(let i=-1;i<=1;i+=2){circ(i*.12*U+ex,hy+.02*U+ey,.058*U);cx.fillStyle=COL.navy;cx.fill();circ(i*.12*U+ex+.02*U,hy+ey,.018*U);cx.fillStyle='#fff';cx.fill();}
  cx.beginPath();const happy=o.happy||pose==='cheer'||pose==='wave'||pose==='clap';
  if(happy)cx.arc(ex*.5,hy+.1*U,.11*U,.15*PI,.85*PI);else cx.arc(ex*.5,hy+.06*U,.09*U,.25*PI,.75*PI);
  cx.setLineDash([U*.04,U*.035]);cx.strokeStyle=COL.redD;cx.lineWidth=.035*U;cx.stroke();cx.setLineDash([]);
  for(let i=-1;i<=1;i+=2){line(i*.22*U-.03*U,hy+.1*U,i*.22*U+.03*U,hy+.1*U,COL.red2,.03*U);}
  if(pose==='shade'){drawItem('tray',0,hy-hr*.95,.85);}
  cx.restore();cx.restore();
}

function spline(P,step){
  const out=[];if(P.length<2)return P.map(p=>({x:p.x,y:p.y}));
  for(let i=0;i<P.length-1;i++){
    const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)];
    const n=Math.max(2,Math.ceil(Math.hypot(p2.x-p1.x,p2.y-p1.y)/step));
    for(let j=0;j<n;j++){const t=j/n,t2=t*t,t3=t2*t;
      out.push({x:.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
               y:.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3),si:i});}
  }
  const l=P[P.length-1];out.push({x:l.x,y:l.y,si:P.length-2});return out;
}
function mkRoute(keys,canopyFrom){
  const pts=spline(keys.map(k=>A[k]),.1*U);

  const len=[0];for(let i=1;i<pts.length;i++)len.push(len[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));
  const r={pts,len,total:len[len.length-1],keys};
  let best=1e18,bu=0;for(let i=0;i<pts.length;i++){const d=Math.hypot(pts[i].x-A.stop.x,pts[i].y-A.stop.y);if(d<best){best=d;bu=len[i];}}
  r.stopU=best<.6*U?bu:-1;return r;
}
function routeTo(h){
  const base=['dock','m1','stop','J'];
  if(h==='tea')return mkRoute(base.concat(['t1','tea']),-1);
  if(h==='craft')return mkRoute(A.craftKeys,-1);
  if(S.canopy)return mkRoute(base.concat(['t1','tea','R1','CM','R2','nei']),5);
  return mkRoute(base.concat(['t1','tea','d1','d2','d3','nei']),-1);
}
function revRoute(r){
  const pts=r.pts.slice().reverse();const len=[0];for(let i=1;i<pts.length;i++)len.push(len[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));
  return {pts,len,total:len[len.length-1],stopU:r.stopU<0?-1:len[len.length-1]-r.stopU,keys:r.keys};
}
function at(r,u){
  u=clamp(u,0,r.total);let lo=0,hi=r.len.length-1;
  while(hi-lo>1){const m=(lo+hi)>>1;if(r.len[m]<=u)lo=m;else hi=m;}
  const a=r.pts[lo],b=r.pts[hi],d=(r.len[hi]-r.len[lo])||1,t=(u-r.len[lo])/d;
  return {x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t),dx:b.x-a.x,dy:b.y-a.y,c:a.c&&b.c};
}

function recommend(){
  if(S.orders.length){const o=S.orders[0];return {item:o.item,house:R[o.rid].id,order:true};}
  const H=S.H;
  const seq=[
    [!H.tea.umb,'umb','tea'],
    [!H.craft.umb,'umb','craft'],
    [!H.nei.umb&&H.nei.chairs===0,'chair','nei'],
    [!H.nei.umb,'umb','nei'],
    [!H.tea.tray,'tray','tea'],
    [cfg('tea').seats<1,'chair','tea'],
    [S.yarnUnlocked&&!H.tea.yarn,'yarn','tea'],
    [cfg('nei').seats<1,'chair','nei'],
    [!H.nei.tray,'tray','nei'],
    [!H.craft.chairs,'chair','craft'],
    [!H.craft.tray,'tray','craft'],
    [S.yarnUnlocked&&!H.nei.yarn,'yarn','nei']
  ];
  for(const s of seq)if(s[0])return {item:s[1],house:s[2]};
  const cyc=[['tray','tea'],['umb','craft'],['chair','nei'],['yarn','craft'],['tray','nei'],['chair','tea']];
  const c=cyc[S.trips%cyc.length];return {item:(c[0]==='yarn'&&!S.yarnUnlocked)?'umb':c[0],house:c[1]};
}
function guideTarget(){
  if(S.phase!=='dock'||S.selAnim||RW)return null;
  const rec=recommend();
  if(S.manual&&!rec.order)return {k:'cart'};
  if(S.sel.item!==rec.item){
    if(rec.order){const sl=shelfSlots().find(s=>s.k===rec.item||(rec.item==='yarn'&&/^y/.test(s.k)));if(sl)return {k:'shelf',i:sl.i,x:sl.x,y:sl.y-.35*U};}
    return {k:'tile',item:rec.item};
  }
  if(S.sel.house!==rec.house)return {k:'flag',house:rec.house};
  return {k:'cart'};
}
function targetPos(g){
  if(!g)return null;
  if(g.k==='cart')return {x:C.x,y:C.y-.8*U,r:1.35*U};
  if(g.k==='tile'){const p=A.tiles[g.item];return {x:p.x,y:p.y-.3*U,r:.9*U};}
  if(g.k==='flag'){const p=A.flags[g.house];return {x:p.x+.55*U,y:p.y-1.15*U,r:.8*U};}

  if(S.orders.length&&S.orders[0].item===k){const h=R[S.orders[0].rid].id;if(S.sel.house!==h){S.sel.house=h;S.flagTilt[h]=1;}}

function applyDelivery(h,item){
  const s=S.H[h],r=R[h],home=r.st==='home';

  const out={board:false,visitor:null,yarn:0,gift:null,canopy:false,big:false,use:''};

function finishDock(){S.phase='dock';S.idle=0;if(!S.cargo&&!S.selAnim){S.selAnim={k:S.sel.item,old:null,from:A.tiles[S.sel.item]||A.shop,t:0};}}
function pickOrder(id){

  else{if(!s.tray)cand.push('tray');if(c.seats<2)cand.push('chair');if(S.yarnUnlocked&&!s.yarn)cand.push('yarn');if(!s.umb)cand.push('umb');cand.push(S.yarnUnlocked?'yarn':'tray');}

function arrangeShelf(){

  // the first passenger's order goes on the top tier, centre
  const want=[];for(const id of C.passengers){const o=R[id].order;if(o&&want.indexOf(o)<0)want.push(o);}
  for(const o of S.orders){if(want.indexOf(o.item)<0)want.push(o.item);}

  want.forEach((k,i)=>{if(spots[i]>=0&&spots[i]<cap)arr[spots[i]]=k;});

function update(dt){
  T+=dt;
  // timers
  if(S.timers.length){const due=S.timers.filter(x=>x.t<=T);if(due.length){S.timers=S.timers.filter(x=>x.t>T);for(const d of due)d.fn();}}
  // flying items
  for(const f of S.fly){f.t+=dt/f.dur;if(f.t>=1&&!f.fin){f.fin=true;f.done&&f.done();}}
  S.fly=S.fly.filter(f=>!f.fin);
  // selection anim
  if(S.selAnim){S.selAnim.t+=dt/.45;if(S.selAnim.t>=1){S.cargo=S.selAnim.k;S.selAnim=null;C.coV+=6*U;SND.plop();}}
  // cart movement
  const moving=S.phase==='out'||S.phase==='back';
  if(moving){
    if(C.launch>0){C.launch-=dt;}
    else{
      const r=C.route;let v=4.4*U;const rem=r.total-C.u;
      C.v=Math.min(v,C.v+v*3.5*dt);let sp=C.v;if(rem<1.4*U)sp*=Math.max(.3,rem/(1.4*U));
      // stop for passengers on the way back
      if(S.phase==='back'&&!C.stopDone&&C.stopU>=0&&C.u>=C.stopU-.05*U){
        const waiting=stopQueue().length>0||HOUSES.some(h=>R[h].goStop);
        if(waiting){sp=0;C.v=0;C.wait+=dt;
          for(const rr2 of stopQueue()){if(!rr2.boarding){rr2.boarding=true;const i=C.passengers.length;const from=snap(resPos(rr2));
            after(.25+i*.3,()=>{walkTo(rr2,from,()=>cartSeat(C.passengers.length),.4,()=>{rr2.st='cart';rr2.boarding=false;if(C.passengers.indexOf(rr2.id)<0)C.passengers.push(rr2.id);SND.board();},1.1*U);});}}
          if(C.wait>9){for(const h of HOUSES){const q=R[h];if(q.goStop){q.goStop=false;q.goStopPending=false;if(q.st==='walk'){q.st='cart';C.passengers.push(q.id);}}}}
        }else{C.stopDone=true;C.wait=0;if(C.passengers.length)logD('board','passengers boarded at the stop');}
      }
      // stop re-knits when a cart passes the folded spot
      if(S.stopFolded&&S.phase==='out'&&C.stopU>=0&&C.u>=C.stopU){S.stopFolded=false;S.stopKnit=0;SND.knit();}
      const du=sp*dt;C.u=Math.min(r.total,C.u+du);
      // wheel ticks
      const p=at(r,C.u);const step=p.c?.8*U:.55*U;C.tick+=du;
      if(C.tick>step){C.tick=0;C.tickN++;if(p.c)SND.pofu(C.tickN%2);else SND.tick(C.tickN%2);}
      C.rot+=du/(.36*U);
      if(C.u>=r.total-.01){C.v=0;if(S.phase==='out')arriveHouse();else arriveDock();}
    }
  }
  // cart position
  if(C.route){const p=at(C.route,C.u);let y=p.y;
    if(p.c&&S.canopy){const a=A.R1,b=A.R2;const t=clamp((p.x-a.x)/((b.x-a.x)||1),0,1);y+=Math.sin(t*PI)*.35*U;}
    C.x=p.x;C.y=y;if(Math.abs(p.dx)>.01)C.face=p.dx>0?1:-1;}

  if(C.pend>0){C.pend-=dt;if(C.pend<=0){C.hopV=-(8.2*U)*ip.b*(1+.07*(S.combo-1));C.coV+=8*U*ip.b;}}
  if(C.hop<0||C.hopV<0){C.hopV+=42*U*dt;C.hop+=C.hopV*dt;if(C.hop>=0){C.hop=0;const imp=C.hopV;C.hopV=0;if(imp>2*U){C.sq=Math.min(1,C.sq+imp/(16*U));C.coV+=imp*.45;SND.land(ip.p);fuzz(C.x,C.y,2);}}}

}

  if(S.selAnim){const sa2=S.selAnim;const k=ease(sa2.t);const fr=sa2.from;const to={x:C.x,y:C.y-1.0*U};
    drawItem(sa2.k,lerp(fr.x,to.x,k),lerp(fr.y,to.y,k)-Math.sin(k*PI)*1.6*U,1,{c:'r'});
    if(sa2.old&&k<1){const tt=A.tiles[sa2.old];drawItem(sa2.old,lerp(to.x,tt.x,k),lerp(to.y,tt.y,k)-Math.sin(k*PI)*1.2*U,lerp(1,.85,k),{c:'r'});}}
  // particles
  for(const p of parts){cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.globalAlpha=clamp(p.life*2,0,1);cx.beginPath();cx.moveTo(-.12*U*p.s,0);cx.quadraticCurveTo(0,-.12*U*p.s,.12*U*p.s,0);cx.quadraticCurveTo(.2*U*p.s,.1*U*p.s,.24*U*p.s,0);cx.strokeStyle=p.col;cx.lineWidth=.05*U;cx.lineCap='round';cx.stroke();cx.restore();}
  cx.globalAlpha=1;
  // spool
  const sp=A.spool;const pl=PULL?PULL:{x:sp.x+.55*U,y:sp.y+.7*U,p:0};
  drawSpool(sp.x,sp.y,pl.x,pl.y,pl.p||0);
  // demo hand
  if(S.demo){const d=S.demo,k=d.t;const ax=d.x+1.6*U,ay=d.y+1.6*U;const mv=ease(seg(k,0,.4));const pr=seg(k,.4,.55)-seg(k,.55,.7);const fade=1-seg(k,.8,1);
    if(k>.45&&k<.8){circ(d.x,d.y,(.3+seg(k,.45,.8)*.8)*U);cx.strokeStyle='rgba(200,50,60,'+(.6*(1-seg(k,.45,.8)))+')';cx.lineWidth=.1*U;cx.stroke();}
    drawHand(lerp(ax,d.x,mv),lerp(ay,d.y,mv),pr,fade*Math.min(1,k*5));}
  if(RW)drawRewind();
}
function drawRes(r,t){
  const p=resPos(r);let pose=p.pose;
  if(r.clap>0&&r.st!=='walk')pose='clap';else if(r.wave>0&&r.st!=='walk')pose='wave';
  const o={t:t+r.ph,s:p.s||1,sit:p.sit,gaze:{x:C.x-p.x,y:C.y-p.y}};
  if(pose==='point'){const sl=shelfSlots().find(s=>s.k===S.orders[0].item||(S.orders[0].item==='yarn'&&/^y/.test(s.k)));if(sl){o.px=sl.x-p.x;o.py=(sl.y-.3*U)-(p.y-.9*U);o.gaze={x:o.px,y:o.py};}}
  drawDoll(p.x,p.y,r.id,pose,o);
  // order bubble
  if(r.st==='shop'&&S.orders.length&&S.orders[0].rid===r.id&&S.phase==='dock'){
    const bx=p.x,by=p.y-2.35*U;cx.save();
    puff(()=>{rr(bx-.85*U,by-.5*U,1.7*U,.95*U,.4*U);},'#fbf4e2',.7);
    circ(bx-.1*U,by+.62*U,.1*U);cx.fillStyle='#fbf4e2';cx.fill();ol(.4);
    drawItem(S.orders[0].item,bx-.35*U,by+.3*U,.55,{c:'r'});drawHouse(r.id,bx+.42*U,by+.3*U,.2,0,false);
    cx.restore();
  }
}
function drawYard(h,t,layer){
  const s=S.H[h],y=yard(h),c=h==='craft'?null:cfg(h);
  const here=HOUSES.map(id=>R[id]).filter(r=>(r.st==='home'&&r.id===h)||(r.st==='visit'&&r.at===h));
  if(h==='craft'){
    if(layer==='back')return;
    if(s.umb)drawHolder(y.holder.x,y.holder.y,Math.min(6,(s.an.holder<1?0:3)+s.balls),back(s.an.holder),S.H[h].wig>0?Math.sin(t*25)*.04:0);
    if(s.tray){drawItem('tray',y.trayG.x,y.trayG.y,.9);drawItem('yB',y.trayG.x-.2*U,y.trayG.y-.2*U,.5);drawItem('yY',y.trayG.x+.2*U,y.trayG.y-.2*U,.5);}
    if(s.chairs)drawItem('chair',y.A.x,y.A.y,1);
    for(const r of here)drawRes(r,t);
    return;
  }
  if(layer==='back'){
    if(s.umb){const op=back(s.an.umb);const shop=c.bench;drawParasol(y.umb.x,y.umb.y,(1.4+(s.umb>1?.2:0))*U,op,h==='tea'?PAT.red:PAT.blue,PAT.yel,shop,Math.sin(t*1.3+(h==='tea'?0:2))*.02);}
    return;
  }
  // working residents behind the bench
  for(const r of here){const p=resPos(r);if(p.behind)drawRes(r,t);}
  const order=['A','B'];
  for(let i=0;i<Math.min(2,s.chairs);i++){const slot=y[order[i]];const isBench=c.bench&&i===0;const k=i===s.chairs-1?back(s.an.chair):1;
    cx.save();cx.translate(slot.x,slot.y);cx.scale(k,k);drawItem(isBench?'bench':'chair',0,0,1);cx.restore();}
  for(const r of here){const p=resPos(r);if(!p.behind)drawRes(r,t);}
  if(s.tray){const k=back(s.an.tray);const res=R[h];const resHome=res.st==='home';
    if(c.bench){drawItem('tray',y.A.x+.1*U,y.A.y-.88*U,.75*k,{cups:!!s.umb});}
    else if(s.umb||!resHome){const sl=c.seats>0?y[c.seatSlots[0]]:y.A;drawItem('tray',sl.x-SIDE[h]*.75*U,sl.y-.05*U,.8*k,{cups:!!s.umb});}
  }
  if(s.yarn&&h==='tea'){drawItem('cozy',y.A.x-SIDE[h]*.55*U,y.A.y-1.0*U*0,.45);}
  if(s.yarn&&h==='nei'){drawItem('mitten',y.A.x-SIDE[h]*.55*U,y.A.y,.45);}
}
function drawCanopy(t){
  const k=ease(S.canopyT);if(k<=0)return;
  const a=A.R1,b=A.R2;
  const onC=(S.phase==='out'||S.phase==='back')&&C.route&&at(C.route,C.u).c;
  const ct=clamp((C.x-a.x)/((b.x-a.x)||1),0,1);
  const pts=spline([A.tea,A.R1,A.CM,A.R2,A.nei],.12*U).map(p=>{let y=p.y;const tt=(p.x-a.x)/((b.x-a.x)||1);
    if(onC&&tt>0&&tt<1)y+=Math.sin(ct*PI)*.35*U*Math.exp(-Math.pow((tt-ct)*3,2));return {x:p.x,y,tt};});
  const n=pts.length,m=Math.ceil(n/2*k);
  const parts2=[pts.slice(0,m),pts.slice(n-m)];
  const path=L=>{cx.beginPath();cx.moveTo(L[0].x,L[0].y);for(const p of L)cx.lineTo(p.x,p.y);};
  cx.lineJoin='round';cx.lineCap='round';
  for(const L of parts2){if(L.length<2)continue;
    path(L);cx.strokeStyle='rgba(31,42,90,.2)';cx.lineWidth=.8*U;cx.save();cx.translate(0,.1*U);cx.stroke();cx.restore();
    path(L);cx.strokeStyle=COL.navy;cx.lineWidth=.7*U;cx.stroke();
    path(L);cx.strokeStyle=PAT.yel;cx.lineWidth=.56*U;cx.stroke();
    path(L);cx.setLineDash([U*.11,U*.1]);cx.strokeStyle=COL.red;cx.lineWidth=.05*U;cx.stroke();cx.setLineDash([]);
    for(let i=2;i<L.length;i+=3){const p=L[i];if(p.tt>0&&p.tt<1)line(p.x,p.y+.3*U,p.x,p.y+.5*U,COL.red,.06*U);}}
}
function drawCartAll(t,hl){
  const x=C.x,y=C.y,hop=C.hop,f=C.face;
  cx.save();cx.translate(x,y);
  ell(0,0,1.0*U*(1-clamp(-hop/(3*U),0,.5)),.18*U);cx.fillStyle='rgba(31,42,90,.22)';cx.fill();
  cx.translate(0,hop);
  const r=.36*U;const sq=Math.max(0,C.sq);
  drawWheel(-.6*U,0,r,sq,C.rot);drawWheel(.6*U,0,r,sq,C.rot);
  const wh=2*r*(1-.36*sq);const top=-wh-.62*U-sq*.04*U;
  // pennant
  drawPennant(f*.85*U,top+.15*U,S.sel.house&&S.phase==='dock'?S.sel.house:C.dest,f>0?.08:-.08,C.flut);
  // body
  const bw=1.95*U,bh=.62*U;
  puff(()=>rr(-bw/2,top,bw,bh,.14*U),PAT.blue);
  rr(-bw/2,top-.02*U,bw,.18*U,.07*U);cx.fillStyle=PAT.yel;cx.fill();ol(.6);
  stitch(-bw/2+.15*U,top+.42*U,bw/2-.15*U,top+.42*U,COL.yel);
  // return cargo (small, in front-left)
  S.ret.forEach((k,i)=>{drawItem(k,(-.65+i*.33)*U,top+.15*U,.5,{c:'r'});});
  // passengers
  const np=C.passengers.length;C.passengers.forEach((id,i)=>{const rr2=R[id];if(rr2.st!=='cart')return;const off=(i-(np-1)/2)*.62*U;
    drawDoll(off,top+.12*U,id,rr2.clap>0?'clap':'cheer',{t:t+rr2.ph,s:.78,sit:true,happy:true,gaze:{x:f,y:-.2}});});
  // cargo
  if(S.cargo&&!(S.phase==='deliver'&&S.fly.some(q=>q.k===C.item))){drawItem(S.cargo,C.passengers.length?f*.35*U:0,top+.05*U+C.co,S.cargo==='umb'?1:1,{c:'r',rot:S.cargo==='umb'?f*.15+C.co/(8*U):C.co/(14*U)});}
  cx.restore();
}
function drawFold(f,t){
  const P0=A.stop,P1=A.shelf;
  const f1=ease(seg(f,0,.3)),f2=ease(seg(f,.3,.68));
  if(f>=.7)return;
  const x=lerp(P0.x,P1.x,f2),y=lerp(P0.y,P1.y-.4*U,f2)-Math.sin(f2*PI)*2.2*U-f1*.5*U;
  cx.save();cx.translate(x,y);
  // pad folding up into a plank
  const sy=lerp(1,.35,f1),rot=lerp(0,-.25,f1)+f2*.25;
  cx.save();cx.rotate(rot);cx.scale(lerp(1,1.25,f2),sy);
  puff(()=>rr(-1.05*U,-.36*U,2.1*U,.72*U,.3*U),PAT.blue,.8);
  // a piece of track folds with it
  rr(-1.0*U,-.12*U,2.0*U,.24*U,.06*U);cx.fillStyle=PAT.tan;cx.fill();ol(.5);
  cx.restore();
  // pole tilting
  cx.save();cx.translate(A.pole*1.2*U*(1-f2),0);cx.rotate(lerp(0,-1.0,f1)*(1-f2)+f2*0);
  yarnLine(0,0,0,-2.1*U,COL.wood,.12*U);puff(()=>circ(0,-2.35*U,.46*U),PAT.yel);
  cx.restore();
  cx.restore();
  if(Math.random()<.3)fuzz(x,y,1);
}
// rewind overlay
let RW=null,PULL=null;
function drawRewind(){
  const k=RW.t;const sp=A.spool;
  // a cloth roll sweeping toward the spool then unrolling
  const cover=k<.5?ease(k*2):1-ease((k-.5)*2);
  cx.save();cx.globalAlpha=1;
  const rx=lerp(-W*.1,W*1.1,cover);
  cx.fillStyle=PAT.tan;cx.fillRect(0,0,rx,H);
  for(let i=0;i<14;i++){const yy=i*H/14;stitch(0,yy,rx,yy,'rgba(31,42,90,.35)');}
  rr(rx-.6*U,-10,1.2*U,H+20,.6*U);cx.fillStyle=PAT.red;cx.fill();ol(1);
  cx.restore();
}

// =====================================================================
//  input
// =====================================================================
let activeId=null;
function hitTest(x,y){
  const d=(p,r)=>Math.hypot(x-p.x,y-p.y)<=r;
  if(d(A.spool,1.0*U))return {k:'spool'};
  if(Math.hypot(x-C.x,(y-(C.y+C.hop-.75*U))*1.1)<=1.45*U)return {k:'cart'};
  for(const k of CARGO){if(k==='yarn'&&!S.yarnUnlocked)continue;const p=A.tiles[k];if(Math.hypot(x-p.x,(y-p.y+.3*U)*.9)<=.95*U)return {k:'tile',item:k};}
  if(S.shelf.tiers>0&&!S.fold){for(const s of shelfSlots()){if(Math.hypot(x-s.x,y-(s.y-.3*U))<=.5*U)return {k:'shelf',item:s.k,x:s.x,y:s.y-.3*U};}}
  for(const h of HOUSES){const p=A.flags[h];if(Math.hypot(x-(p.x+.5*U),y-(p.y-1.0*U))<=.85*U)return {k:'flag',house:h};}
  for(const h of HOUSES){const r=R[h];const p=resPos(r);if(Math.hypot(x-p.x,y-(p.y-.8*U))<=.6*U)return {k:'res',r};}
  for(const h of HOUSES){const p=yard(h).house;if(x>p.x-1.4*U&&x<p.x+1.4*U&&y>p.y-3.1*U&&y<p.y+.1*U)return {k:'house',house:h};}
  if(Math.abs(x-A.shop.x)<1.9*U&&y>A.shop.y-3.0*U&&y<A.shop.y)return {k:'shop'};
  if(!S.stopFolded&&Math.hypot(x-(A.stop.x+A.pole*1.2*U),y-(A.stop.y-1.6*U))<.8*U)return {k:'stop'};
  return null;
}
function onDown(e){
  e.preventDefault();
  if(activeId!==null)return;
  activeId=e.pointerId;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  AU.init();
  const x=e.clientX,y=e.clientY;
  S.idle=0;S.demo=null;S.demoDone=false;S.tapCount++;
  if(RW)return;
  const h=hitTest(x,y);
  if(!h)return;
  switch(h.k){
    case 'spool':PULL={x,y,p:0,sx:x,sy:y};SND.pick(.7);break;
    case 'cart':if(S.phase==='dock'&&!S.selAnim){tapHop();depart();}else tapHop();break;
    case 'tile':if(S.phase==='dock'&&!S.selAnim)select(h.item,A.tiles[h.item]);else{S.wig['tile_'+h.item]=.3;SND.nope();}break;
    case 'shelf':if(S.phase==='dock'&&!S.selAnim&&CARGO.indexOf(/^y/.test(h.item)?'yarn':h.item)>=0){select(/^y/.test(h.item)?'yarn':h.item,{x:h.x,y:h.y});}else SND.nope();break;
    case 'flag':if(S.phase==='dock'&&!S.selAnim)setDest(h.house);else{S.wig['flag_'+h.house]=.3;SND.nope();}break;
    case 'house':if(S.phase==='dock'&&!S.selAnim)setDest(h.house);else{S.wig['house_'+h.house]=.3;SND.nope();}break;
    case 'res':if(h.r.st!=='walk'){h.r.wave=.7;SND.wave();}break;
    case 'shop':S.wig.shop=.3;SND.nope();break;
    case 'stop':S.wig.stop=.3;SND.nope();break;
  }
}
function onMove(e){
  if(e.pointerId!==activeId)return;e.preventDefault();
  if(PULL){PULL.x=e.clientX;PULL.y=e.clientY;PULL.p=clamp(Math.hypot(PULL.x-PULL.sx,PULL.y-PULL.sy)/(2.2*U),0,1);}
}
function onUp(e){
  if(e.pointerId!==activeId)return;
  activeId=null;
  if(PULL){const ok=e.type==='pointerup'&&PULL.p>=.8;PULL=null;if(ok&&!RW){RW={t:0,did:false};SND.rewind();}else SND.snap();}
}
cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});
cv.addEventListener('pointerup',onUp);
cv.addEventListener('pointercancel',onUp);
cv.addEventListener('lostpointercapture',e=>{if(e.pointerId===activeId){onUp({pointerId:e.pointerId,type:'pointercancel'});}});
['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick','contextmenu','selectstart'].forEach(n=>document.addEventListener(n,e=>{e.preventDefault();},{passive:false}));

// =====================================================================
//  loop
// =====================================================================
let raf=0,last=0;
function frame(ts){
  raf=0;
  if(document.hidden)return;
  let dt=last?(ts-last)/1000:0;last=ts;dt=Math.min(dt,.05)*SPEED;
  if(RW){RW.t+=dt/1.4;if(RW.t>=.5&&!RW.did){RW.did=true;newState();}if(RW.t>=1)RW=null;}
  try{update(dt);render();}catch(err){console.error(err);}
  raf=requestAnimationFrame(frame);
}
function start(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame);}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(raf){cancelAnimationFrame(raf);raf=0;}AU.suspend();activeId=null;PULL=null;}else{AU.resume();start();}});
window.addEventListener('resize',()=>{resize();});
window.addEventListener('orientationchange',()=>{setTimeout(resize,120);});
window.addEventListener('pagehide',()=>{AU.suspend();});

newState();resize();start();
// read-only debug hooks for automated checks
window.__gf={
  state:()=>({phase:S.phase,sel:Object.assign({},S.sel),cargo:S.cargo,canopy:S.canopy,yarnUnlocked:S.yarnUnlocked,stock:S.stock.slice(),shelf:{tiers:S.shelf.tiers,items:S.shelf.items.slice()},
    stopFolded:S.stopFolded,orders:S.orders.map(o=>({rid:o.rid,item:o.item})),hist:S.hist.slice(),trips:S.trips,
    H:JSON.parse(JSON.stringify(S.H,(k,v)=>k==='an'?undefined:v)),R:HOUSES.map(h=>({id:h,st:R[h].st,at:R[h].at})),passengers:C.passengers.slice(),
    cart:{x:C.x,y:C.y,u:C.u,total:C.route?C.route.total:0,hop:C.hop,sq:C.sq,co:C.co},guide:guideTarget(),selAnim:!!S.selAnim,log:S.log.slice(),discover:Object.assign({},S.discover),demo:!!S.demo,parts:parts.length,ret:S.ret.slice(),routeLen:C.route?C.route.total/U:0,U,T,combo:S.combo,pull:!!PULL,rw:!!RW,active:activeId}),
  targets:()=>{const o={cart:{x:C.x,y:C.y+C.hop-.75*U},spool:{x:A.spool.x,y:A.spool.y},tiles:{},flags:{},houses:{},shelf:shelfSlots().map(s=>({k:s.k,x:s.x,y:s.y-.3*U}))};
    for(const k of CARGO)o.tiles[k]={x:A.tiles[k].x,y:A.tiles[k].y-.3*U};for(const h of HOUSES){o.flags[h]={x:A.flags[h].x+.5*U,y:A.flags[h].y-1.0*U};const p=yard(h).house;o.houses[h]={x:p.x,y:p.y-1.4*U};}return o;}
};
})();
