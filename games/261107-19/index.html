const PR=(typeof CanvasPattern!=='undefined'&&CanvasPattern.prototype&&CanvasPattern.prototype.setTransform&&typeof DOMMatrix!=='undefined')?3:1;
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c;}
function toPat(tile){const p=cx.createPattern(tile,'repeat');if(PR>1){try{p.setTransform(new DOMMatrix([1/PR,0,0,1/PR,0,0]));}catch(e){}}return p;}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function knitTile(base,dark,light,w,h){
  const c=mk(w*PR,h*PR),g=c.getContext('2d');g.scale(PR,PR);g.fillStyle=dark;g.fillRect(0,0,w,h);
  for(const dy of [-h,0,h])for(const dx of [-w,0,w])for(const s of [-1,1]){
    g.save();g.translate(w/2+s*w*0.21+dx,h/2+dy);g.rotate(s*0.45);
    g.beginPath();g.ellipse(0,0,w*0.2,h*0.5,0,0,TAU);g.fillStyle=base;g.fill();
    g.beginPath();g.ellipse(-w*0.03,-h*0.1,w*0.065,h*0.28,0,0,TAU);g.fillStyle=light;g.globalAlpha=.5;g.fill();g.globalAlpha=1;
    g.restore();
  }
  return toPat(c);
}
function weaveTile(a,b,dark,s){
  const w=s*2,c=mk(w*PR,w*PR),g=c.getContext('2d');g.scale(PR,PR);g.fillStyle=dark;g.fillRect(0,0,w,w);
  for(const [x,y,hz,col] of [[0,0,1,a],[s,0,0,b],[0,s,0,b],[s,s,1,a]]){
    g.fillStyle=col;rr(g,x+.7,y+.7,s-1.4,s-1.4,s*.28);g.fill();
    g.strokeStyle='rgba(255,255,255,.3)';g.lineWidth=s*.08;g.beginPath();
    if(hz){g.moveTo(x+s*.2,y+s*.36);g.lineTo(x+s*.8,y+s*.36);}else{g.moveTo(x+s*.36,y+s*.2);g.lineTo(x+s*.36,y+s*.8);}
    g.stroke();
  }

}

const AU={c:null,m:null,nb:null,
  init(){
    if(!this.c){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      try{
        this.c=new AC();
        const comp=this.c.createDynamicsCompressor(); comp.connect(this.c.destination);
        this.m=this.c.createGain(); this.m.gain.value=.6; this.m.connect(comp);
        const n=(this.c.sampleRate*1)|0; this.nb=this.c.createBuffer(1,n,this.c.sampleRate);
        const d=this.nb.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
      }catch(e){this.c=null;return;}
    }
    if(this.c.state==='suspended'&&!document.hidden){try{const p=this.c.resume();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
  },
  ok(){return !!this.c&&this.c.state!=='closed'&&!document.hidden;},
  tone(type,f0,f1,dur,vol,dl){
    if(!this.ok())return; const c=this.c,t=c.currentTime+(dl||0);
    try{const o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+Math.min(.02,dur*.3)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(this.m); o.start(t); o.stop(t+dur+.05);}catch(e){}
  },
  noise(dur,f0,f1,q,vol,type,dl,flut){
    if(!this.ok())return; const c=this.c,t=c.currentTime+(dl||0);
    try{const s=c.createBufferSource(); s.buffer=this.nb; const f=c.createBiquadFilter(); f.type=type||'bandpass'; f.Q.value=q;
      f.frequency.setValueAtTime(f0,t); f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
      const g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+Math.min(.03,dur*.3)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      s.connect(f); f.connect(g);
      if(flut){const lg=c.createGain(); lg.gain.value=.7; const lfo=c.createOscillator(); lfo.frequency.value=flut; const ld=c.createGain(); ld.gain.value=.55; lfo.connect(ld); ld.connect(lg.gain); lfo.start(t); lfo.stop(t+dur+.05); g.connect(lg); lg.connect(this.m);}
      else g.connect(this.m);
      s.start(t,Math.random()*.4); s.stop(t+dur+.05);}catch(e){}
  },
  tap(p){p=p||1;this.tone('sine',270*p,150*p,.12,.16);this.noise(.07,900*p,500*p,1,.06,'lowpass');},
  soft(){this.tone('sine',210,170,.08,.07);},
  rub(p,d){p=p||1;d=d||.4;this.noise(d,700*p,1500*p,3,.22,'bandpass',0,22);this.tone('triangle',170*p,230*p,d*.8,.035);},
  kotsun(p){p=p||1;this.tone('sine',380*p,130*p,.15,.32);this.noise(.025,2600,2600,1.5,.12,'highpass');},
  sururu(p,d){p=p||1;d=d||.6;this.noise(d,450*p,2400*p,5,.2,'bandpass',0,34);},
  pon(p){p=p||1;this.tone('triangle',440*p,820*p,.12,.22);this.tone('sine',220*p,440*p,.09,.13);},
  yay(p){p=p||1;this.tone('triangle',784*p,784*p,.16,.2);this.tone('triangle',1175*p,1175*p,.26,.18,.09);this.tone('sine',1568*p,1568*p,.3,.07,.09);},
  big(){[523,659,784,1047,1319].forEach((f,i)=>this.tone('triangle',f,f,.38,.16,i*.09));this.noise(.8,2000,6000,1,.04,'highpass',.3);},
  flip(){this.noise(.6,300,1800,2,.16,'bandpass',0,12);this.tone('sine',180,520,.5,.12);},
  tick(p){this.tone('square',1800*(p||1),1400*(p||1),.02,.022);}
};

function loadSave(){
  let raw=null;

  try{const o=JSON.parse(raw);

  try{localStorage.removeItem(KEY);}catch(e){}
}

const wears=(p,k)=>!!p&&S.items[k].owner===p.id;
function geom(p){const drop=40*p.sit+34*p.bend;return {drop,yT:-134+drop,hip:-58+drop,hy:-170+drop};}
function headW(p){const g=geom(p);return {x:p.x,y:p.y+g.hy-p.hop};}
function neckW(p){const g=geom(p);return {x:p.x,y:p.y+g.yT+2-p.hop};}
function chestW(p){const g=geom(p);return {x:p.x,y:p.y+g.yT+14-p.hop};}

function isWarm(p){return wears(p,'scarf')||p.spare||S.items.scarf.link===p.id;}
function isOutside(p){return !L.inside(p);}
function learnedFromOther(p,g){return p.learned.some(l=>l.g===g&&l.from!==p.id);}

function knows(p,g){if(learnedAny(p,g))return true; if(g==='wrap')return isWarm(p); return false;}
function learn(p,g,from){
  if(!p||p.isClerk) return;
  if(p.learned.some(l=>l.g===g&&(l.from!==p.id||from===p.id))) return;
  const ex=p.learned.find(l=>l.g===g);
  if(ex){ if(from!==p.id&&ex.from===p.id){ex.from=from;} return; }
  p.learned.push({g,from,seq:S.seq++,time:S.t}); p.badgePop=1; logEv('learn '+p.id+' '+g+' from '+from);
}
function condMet(){
  const tr=[]; for(const c of CUST) for(const l of c.learned) if(l.from!==c.id) tr.push([c.id,l.g]);
  for(let i=0;i<tr.length;i++) for(let j=i+1;j<tr.length;j++) if(tr[i][0]!==tr[j][0]&&tr[i][1]!==tr[j][1]) return true;
  return false;
}
function spotPos(p){
  const a=L.A[p.spot]; if(!a) return {x:p.x,y:p.y};

// =====================================================================
//  actions
// =====================================================================
function A(ms,o){return Object.assign({dur:ms/1000,t:0},o||{});}
function Walk(target,opt){
  opt=opt||{};
  return {walk:true,t:0,target,ok:opt.ok,fin:opt.fin,
    start(p){ if(typeof target==='string'){p.spot=target;} const g=this.resolve(p); this.path=g?route(p,g):[]; },
    resolve(p){ if(typeof target==='string') return spotPos(p); if(typeof target==='function') return target(p); return target; }};
}
function route(a,b){ return L.inside(a)!==L.inside(b)?[{x:L.door.x,y:L.door.y},{x:b.x,y:b.y}]:[{x:b.x,y:b.y}]; }
function stepWalk(p,a,dt){
  if(typeof a.target==='function'){
    const g=a.target(p); if(!g) return true;
    const last=a.path[a.path.length-1];
    if(!last||dst(g,last)>18){ a.path=route(p,g); }
  }
  if(!a.path.length) return true;
  const tg=a.path[0], dx=tg.x-p.x, dy=tg.y-p.y, d=Math.hypot(dx,dy), sp=270*dt;
  p.walking=true; p.walkPh+=dt*11; if(Math.abs(dx)>2) p.face=dx>0?1:-1;
  if(d<=sp){ p.x=tg.x;p.y=tg.y; a.path.shift(); if(!a.path.length){p.walking=false;return true;} }
  else { p.x+=dx/d*sp; p.y+=dy/d*sp; }
  return false;
}
function finAct(p,a){ if(a&&a.fin&&!a._fin){a._fin=true; try{a.fin(p);}catch(e){}} }
function runPerson(p,dt){
  let guard=0;
  while(!p.cur&&p.q.length&&guard++<6){
    const a=p.q.shift(); a.t=0;
    if(a.ok&&!a.ok(p)){ finAct(p,a); continue; }
    p.cur=a; if(a.start) a.start(p);
    if(a.skip){ finAct(p,a); p.cur=null; }
  }
  const a=p.cur; if(!a) return;
  if(a.ok&&!a.ok(p)){ if(a.abort)a.abort(p); finAct(p,a); p.cur=null; return; }
  a.t+=dt; let done;
  if(a.walk) done=stepWalk(p,a,dt);
  else { const k=a.dur>0?Math.min(1,a.t/a.dur):1; if(a.upd)a.upd(p,k); done=k>=1||(a.until&&a.until(p)); }
  if(done){ p.cur=null; if(a.end)a.end(p); finAct(p,a); }
}
function abortAll(p){
  const a=p.cur; p.cur=null; if(a){ if(a.abort)a.abort(p); finAct(p,a); }
  const q=p.q.splice(0); for(const b of q) finAct(p,b);
  p.walking=false; p.hatAnim=null;
  for(const b of [S.button,S.clerkBtn]){
    if(b.carrier===p.id){ b.state='floor'; const fr=floorRect({x:p.x,y:p.y}); b.x=clamp(p.x+rnd(-30,30),fr.x0,fr.x1); b.y=clamp(p.y+12,fr.y0,fr.y1); b.vx=rnd(-120,120); b.vy=rnd(-30,30); b.rolling=true; b.carrier=null; p.pocket.button=false; }
    if(b.fetcher===p.id&&b.state!=='fly') b.fetcher=null;
  }
  if(S.items.scarf.owner===p.id&&S.items.scarf.link==null) S.items.scarf.linkTo=null;
  if(p.pocket.spare){p.pocket.spare=0;}
}

// ---------------------------------------------------------------- item actions
function actSpread(W){
  return A(650,{ok:p=>wears(p,'hat')&&!p.pocket.hat&&S.phase==='shop',
    start(p){ const tg=shadeTargets(p); for(const s of S.shades) if(s.by===p.id) s.want=0;
      S.shades.push({by:p.id,host:false,chairs:tg.chairs,pts:tg.pts,grow:0,want:1}); p.shading=true;
      const len=tg.pts.length?dst(p,tg.pts[0]):60; AU.rub(clamp(1.5-len/500,.75,1.45),.5); learn(p,'shade',p.id); logEv('spread '+p.id+' '+tg.chairs.join(',')); },
    upd(p,k){p.hatLift=ease(k);} });
}
function shadeTargets(W){
  const own=W.spot;
  const list=CHAIRS.filter(c=>c!==own).map(c=>({c,d:dst(W,L.A[c])})).filter(o=>o.d<440).sort((a,b)=>a.d-b.d);
  const n=learnedFromOther(W,'shade')?2:1;
  const ch=list.slice(0,n).map(o=>o.c);
  return {chairs:ch,pts:ch.map(c=>({x:L.A[c].x,y:L.A[c].y-16}))};
}
function actPocketHat(W){
  return A(520,{ok:p=>wears(p,'hat')&&wears(p,'apron')&&!p.pocket.hat,
    start(p){ p.shading=false; p.hatAnim={k:0,dir:1}; AU.rub(.8,.35); },
    upd(p,k){ if(p.hatAnim)p.hatAnim.k=ease(k); p.aR=pocketW(p); p.bendT=.25; },
    end(p){ p.hatAnim=null; p.pocket.hat=true; AU.kotsun(.9); logEv('pocketHat '+p.id); const q=pocketW(p); lint(q.x,q.y,3); },
    abort(p){ p.hatAnim=null; } });
}
function actPocketOutHat(W,flagIt){
  return A(600,{ok:p=>wears(p,'hat')&&(p.pocket.hat||!!p.hatAnim),
    start(p){ logEv('pocketOut '+p.id+' '+(flagIt?1:0)); p.pocket.hat=false; p.hatAnim={k:1,dir:-1}; AU.kotsun(1.1); AU.rub(1.2,.4); },
    upd(p,k){ if(p.hatAnim)p.hatAnim.k=1-ease(k); p.aR=k<.5?pocketW(p):{x:p.x+30,y:headW(p).y-30}; },
    end(p){ p.hatAnim=null; if(flagIt&&S.phase==='shop'){S.flags.hatPocket=true; logEv('hatPocket '+p.id);} const h=headW(p); lint(h.x,h.y-30,4); },
    abort(p){ p.hatAnim=null; } });
}
function actTie(W){
  return A(480,{ok:p=>wears(p,'apron'),start(p){AU.kotsun(1.2);},upd(p,k){p.aR=pocketW(p);p.aL={x:p.x-20,y:pocketW(p).y};p.lookAt=pocketW(p);}});
}
function canSpare(){return S.spares<3;}
function pickSpareTarget(W,excl){
  let best=null,bs=1e9;
  for(const c of CUST){ if(c===W||excl.indexOf(c.id)>=0||c.spare||c.spareIn||wears(c,'scarf')) continue;
    let s=dst(c,W); if(c.trait==='cold'&&!isWarm(c)) s-=1000; if(S.items.scarf.link===c.id) s+=300; if(s<bs){bs=s;best=c;} }
  return best;
}
function actSpareOut(W){
  return A(460,{ok:p=>wears(p,'apron')&&canSpare(),start(p){p.pocket.spare=1;AU.kotsun(1.25);},upd(p,k){p.aR=pocketW(p);p.bendT=.2;}});
}
function actSpareGive(W,flag,exclFn){
  return A(720,{ok:p=>p.pocket.spare>0,
    start(p){ const N=pickSpareTarget(p,exclFn?exclFn():[]); if(!N){p.pocket.spare=0;this.skip=true;return;}
      this.N=N; p.pocket.spare=0; S.spares++; N.spareIn=true; const from=pocketW(p);
      fly('spare',from,()=>neckW(N),.55,()=>{ N.spareIn=false; N.spare=true; N.sq=.3; AU.sururu(1.3,.45); helped(p,N); learn(N,'wrap',p.id);
        if(flag&&S.phase==='shop'){S.flags[flag]=true;} logEv('spare '+p.id+'->'+N.id+' '+flag); },{arc:110}); },
    upd(p,k){ if(this.N){p.aR=neckW(this.N);p.lookAt=headW(this.N);} } });
}
function actWrapSelf(W){
  return A(600,{ok:p=>wears(p,'scarf'),start(p){AU.sururu(1,.5);p.wrapK=0;},upd(p,k){p.wrapK=k;p.aR=neckW(p);p.aL={x:p.x-24,y:neckW(p).y};},end(p){p.wrapK=1;learn(p,'wrap',p.id);p.happy=Math.max(p.happy,.6);}});
}
function actWrapLink(W,getN,flag,fin){
  return A(880,{ok:p=>wears(p,'scarf'),fin,
    start(p){ const N=getN?getN(p):nearestOther(p); if(!N){this.skip=true;return;} this.N=N; const sc=S.items.scarf;
      sc.link=null; sc.linkTo=N.id; sc.linkK=0; AU.sururu(clamp(320/(dst(p,N)+80),.6,1.6),.75); },
    upd(p,k){ const N=this.N; S.items.scarf.linkK=ease(k); p.aR=neckW(N); p.lookAt=headW(N); N.lookAt=headW(p); },
    end(p){ const N=this.N, sc=S.items.scarf; sc.link=N.id; sc.linkTo=N.id; sc.linkK=1; helped(p,N); learn(N,'wrap',p.id);
      if(flag&&S.phase==='shop'){S.flags[flag]=true;} logEv('wrap '+p.id+'->'+N.id); },
    abort(){ const sc=S.items.scarf; if(sc.link==null) sc.linkTo=null; } });
}

// ---------------------------------------------------------------- button fetch
function besideOf(O,p){return {x:O.x+(p.x<O.x?-74:74),y:O.y+4};}
function planFetch(H,btn,after){
  btn.fetcher=H.id;
  if(wears(H,'apron')&&wears(H,'hat')&&!H.pocket.hat&&S.phase==='shop') H.q.push(actPocketHat(H));
  H.q.push(Walk(p=>btn.state==='floor'?{x:btn.x+(p.x<btn.x?-30:30),y:btn.y+4}:null,{ok:p=>btn.fetcher===p.id&&(btn.state==='floor')}));
  H.q.push(actPick(H,btn,after,0));
}
function actPick(H,btn,after,tries){
  return A(540,{ok:p=>btn.fetcher===p.id&&(btn.state==='floor'||btn.carrier===p.id),
    start(p){ this.got=false;
      if(btn.state==='floor'&&dst({x:p.x,y:p.y},btn)>90&&tries<4){ this.skip=true;
        p.q.unshift(Walk(q=>btn.state==='floor'?{x:btn.x+(q.x<btn.x?-30:30),y:btn.y+4}:null,{ok:q=>btn.fetcher===q.id&&btn.state==='floor'}),actPick(H,btn,after,tries+1)); return; }
      if(btn.state==='floor'&&dst({x:p.x,y:p.y},btn)>90){ this.skip=true; btn.fetcher=null; return; }
      btn.rolling=false; },
    upd(p,k){ p.bendT=Math.sin(k*PI); p.lookAt=btn.state==='floor'?{x:btn.x,y:btn.y}:pocketW(p);
      if(btn.state==='floor') p.aR={x:btn.x,y:btn.y-10};
      if(!this.got&&k>.5){ this.got=true; btn.state='carry'; btn.carrier=p.id; btn.inPocket=wears(p,'apron'); if(btn.inPocket)p.pocket.button=true;
        AU.kotsun(1); lint(btn.x,btn.y,3); learn(p,'pick',p.id); } },
    end(p){ if(btn.carrier!==p.id) return;
      p.q.unshift(Walk(q=>{const O=P(btn.owner);return O===q?null:besideOf(O,q);},{ok:q=>btn.carrier===q.id}),actGiveBtn(p,btn,after)); } });
}
function actGiveBtn(H,btn,after){
  return A(560,{ok:p=>btn.carrier===p.id,
    start(p){ this.O=P(btn.owner); this.sent=false; },
    upd(p,k){ const O=this.O; p.aR=chestW(O); p.lookAt=headW(O); O.lookAt=headW(p);
      if(!this.sent&&k>.35){ this.sent=true; const from=btn.inPocket?pocketW(p):handW(p); btn.state='fly'; btn.carrier=null; p.pocket.button=false;
        fly('button',from,()=>chestW(O),.38,()=>{ btn.state='coat'; btn.fetcher=null; O.sq=.3; AU.kotsun(1.4);
          if(O!==p){ helped(p,O); learn(O,'pick',p.id);} else {O.happy=1;AU.yay();}
          if(after) after(p,O); },{arc:60}); } } });
}
function popButton(btn,tp){
  const O=P(btn.owner), c=chestW(O); btn.state='drop'; btn.x=c.x; btn.y=c.y; btn.fetcher=null; btn.carrier=null;
  const to=tp||randFloorNear(O);
  fly('button',c,to,.5,()=>{ btn.state='floor'; btn.x=to.x; btn.y=to.y; const a=Math.random()*TAU; btn.vx=Math.cos(a)*170; btn.vy=Math.sin(a)*50; btn.rolling=true; AU.kotsun(1.6); },{arc:90});
}
function floorRect(pt){return L.inside(pt)?L.rIn:L.rOut;}
function randFloor(preferOut){
  for(let i=0;i<40;i++){ const r=(Math.random()<(preferOut?.75:.3))?L.rOut:L.rIn; const pt={x:rnd(r.x0+20,r.x1-20),y:rnd(r.y0+10,r.y1-10)};
    if(PEOPLE.every(q=>dst(q,pt)>95)&&CHAIRS.every(c=>dst(L.A[c],pt)>80)&&dst(L.A.stage,pt)>120) return pt; }
  const r=L.rOut; return {x:(r.x0+r.x1)/2,y:r.y1-20};
}
function randFloorNear(O){
  const r=floorRect(O);
  for(let i=0;i<30;i++){const a=rnd(0,TAU),d=rnd(140,260);const pt={x:clamp(O.x+Math.cos(a)*d,r.x0+15,r.x1-15),y:clamp(O.y+Math.sin(a)*d*.6+30,r.y0+8,r.y1-8)};
    if(PEOPLE.every(q=>dst(q,pt)>80)) return pt;}
  return randFloor(true);
}

// =====================================================================
//  flyers, particles, ripples
// =====================================================================
const FLY=[];
function fly(kind,from,to,dur,onEnd,opt){FLY.push({kind,fx:from.x,fy:from.y,to,dur,t:0,onEnd,arc:(opt&&opt.arc)||120,x:from.x,y:from.y,trail:[]});}
function updFly(dt){
  for(let i=FLY.length-1;i>=0;i--){const f=FLY[i]; f.t+=dt; const k=Math.min(1,f.t/f.dur); const tg=typeof f.to==='function'?f.to():f.to;
    const e=ease(k); f.x=lerp(f.fx,tg.x,e); f.y=lerp(f.fy,tg.y,e)-Math.sin(k*PI)*f.arc; f.k=k;
    f.trail.push({x:f.x,y:f.y}); if(f.trail.length>9) f.trail.shift();
    if(k>=1){ FLY.splice(i,1); if(f.onEnd) f.onEnd(); }}
}
function flushFly(){ let g=0; while(FLY.length&&g++<20){ const f=FLY.shift(); if(f.onEnd) f.onEnd(); } }
const PARTS=[], PMAX=70, RIP=[];
function lint(x,y,n,cols){ for(let i=0;i<n;i++){ if(PARTS.length>=PMAX) PARTS.shift(); const a=rnd(0,TAU),sp=rnd(60,230);
  PARTS.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-120,r:rnd(0,TAU),vr:rnd(-7,7),life:0,max:rnd(.6,1.1),c:pickR(cols||LINTC),l:rnd(6,13)}); } }
function ripple(x,y){ if(RIP.length>=6) RIP.shift(); RIP.push({x,y,t:0}); }

// =====================================================================
//  giving items
// =====================================================================
function takeOff(k,O){
  if(!O) return;
  if(k==='hat'){ O.pocket.hat=false; O.shading=false; O.hatAnim=null; }
  if(k==='scarf'){ const sc=S.items.scarf; if(sc.link!=null) AU.sururu(.7,.4); sc.link=null; sc.linkTo=null; sc.linkK=0; }
  if(k==='apron'){ O.pocket.spare=0; O.pocket.hat=false; }
  if(S.phase==='shop') abortAll(O);
  else { if(k==='apron'){ for(const b of [S.button,S.clerkBtn]) if(b.carrier===O.id&&b.inPocket) b.inPocket=false; } }
}
function giveItem(k,R,onLand){
  const it=S.items[k]; if(it.owner==='fly'||!R) return false;
  let from; if(it.owner===null) from=L.slots[k]; else { const O=P(it.owner); from=itemWorldPos(k,O); takeOff(k,O); }
  it.owner='fly'; kickSq(S.slotSq[k],.35);
  fly(k,from,()=>itemWorldPos(k,R),.42,()=>{ it.owner=R.id; R.sq=.35; R.sqV=0; AU.pon(k==='hat'?1:k==='apron'?.85:1.15); const w=itemWorldPos(k,R); lint(w.x,w.y,5); logEv('land '+k+'->'+R.id); if(onLand) onLand(); },{arc:150});
  return true;
}
function returnToShelf(k){
  const it=S.items[k]; if(it.owner===null||it.owner==='fly') return;
  const O=P(it.owner), from=itemWorldPos(k,O); takeOff(k,O); it.owner='fly';
  fly(k,from,L.slots[k],.55,()=>{it.owner=null;kickSq(S.slotSq[k],.3);AU.pon(.9);},{arc:120});
}
function perform(k,R){
  if(k==='hat'){ R.shading=false; R.happy=Math.max(R.happy,.5); return; }
  if(k==='apron'){
    const hadHat=wears(R,'hat'), kw=knows(R,'wrap');
    R.q.push(actTie(R));
    if(kw&&canSpare()){ const fl=(learnedFromOther(R,'wrap')&&!wears(R,'scarf'))?'spareByLearner':'spareByWearer';
      R.q.push(actSpareOut(R)); R.q.push(actSpareGive(R,fl,null)); }
    if(hadHat){
      R.q.push(actPocketHat(R)); R.q.push(Walk('back'));
      const b=S.button;
      if(b.state==='floor'&&b.fetcher==null){ b.fetcher=R.id;
        R.q.push(Walk(p=>b.state==='floor'?{x:b.x+(p.x<b.x?-30:30),y:b.y+4}:null,{ok:p=>b.fetcher===p.id&&b.state==='floor'}));
        R.q.push(actPick(R,b,fetchAfter,0));
        R.q.push(A(3500,{until:p=>b.carrier!==p.id&&b.state!=='fly'}));
      }
      R.q.push(Walk('front')); R.q.push(actPocketOutHat(R,true));
    }
    return;
  }
  if(k==='scarf'){
    const ap=wears(R,'apron');
    R.q.push(actWrapSelf(R)); R.q.push(actWrapLink(R,null,'wrapTeach'));
    if(ap&&canSpare()){ R.q.push(actSpareOut(R)); R.q.push(actSpareGive(R,'spareByWearer',()=>{const l=S.items.scarf.link;return l!=null?[l]:[];})); }
  }
}
function fetchAfter(p,O){ if(S.phase!=='shop') return; S.flags.pickReturn=true; if(S.button.rerolled){S.flags.reroll=true;S.button.rerolled=false;} logEv('return '+p.id+'->'+O.id); }

// =====================================================================
//  guidance (one target at a time)
// =====================================================================
const STEP={
  hat1:{flag:'shade1',item:'hat'},
  hat2:{flag:'shade2',item:'hat',rc:p=>!wears(p,'hat'),pref:c=>{const s=S.shades.find(x=>x.want&&!x.host);const cur=s&&s.chairs[0];const t=shadeTargets(c).chairs[0];return (t===cur||!t?50:0)+(isOutside(c)?0:20)+(c.owner?15:0);}},
  hatApron:{flag:'hatPocket',item:'apron',rc:p=>wears(p,'hat')&&!wears(p,'apron')},
  apron1:{flag:'pickReturn',item:'apron'},
  reroll:{flag:'reroll',button:true},
  scarf1:{flag:'wrapTeach',item:'scarf',rc:p=>!wears(p,'apron')&&!wears(p,'scarf'),pref:c=>c.trait==='cold'?0:10},
  learnerApron:{flag:'spareByLearner',item:'apron',rc:p=>learnedFromOther(p,'wrap')&&!wears(p,'scarf')&&!wears(p,'apron')},
  apronScarf:{flag:'spareByWearer',item:'scarf',rc:p=>wears(p,'apron')&&!wears(p,'scarf')}
};
const VARIANTS=[
  ['hat1','hat2','hatApron','reroll','scarf1','learnerApron','apronScarf'],
  ['apron1','hat1','reroll','hat2','hatApron','scarf1','learnerApron','apronScarf'],
  ['scarf1','learnerApron','apronScarf','hat1','hatApron','reroll','hat2']];
function stepTarget(st){
  if(st.button){ if(!S.flags.pickReturn||!helperExists()) return null; if(S.button.state==='coat') return {k:'button'}; return null; }
  const it=S.items[st.item]; if(it.owner==='fly') return null;
  if(st.rc){ const R=P(S.receiver); if(R&&st.rc(R)) return {k:'item',item:st.item};
    let best=null,bs=1e9; for(const c of CUST){ if(!st.rc(c)) continue; const s=(st.pref?st.pref(c):0)+dst(c,K())*.01; if(s<bs){bs=s;best=c;} }
    return best?{k:'p',id:best.id}:null; }
  return {k:'item',item:st.item};
}
function firstStep(){ for(const id of VARIANTS[S.variant]){ if(!S.flags[STEP[id].flag]) return id; } return null; }
function computeHint(){
  if(S.phase==='shop'){
    const cm=condMet(), all=!firstStep();
    if(cm&&(all||S.givesSinceCond>=5)) return {k:'p',id:4};
    for(const id of VARIANTS[S.variant]){ const st=STEP[id]; if(S.flags[st.flag]) continue;
      if(S.pending[id]&&S.t<S.pending[id]) return null;
      const t=stepTarget(st); if(t) return t; }
    if(cm) return {k:'p',id:4};
    if(FLY.length||CUST.some(c=>c.cur)) return null;
    const R=P(S.receiver); const fresh=CUST.find(c=>!c.learned.length&&c!==R);
    if(R&&R.learned.length&&fresh) return {k:'p',id:fresh.id};
    return {k:'item',item:ITEMS[S.gives%3]};
  }
  if(S.phase==='choose'){
    const order=ITEMS.map((_,i)=>ITEMS[(i+S.cycle)%3]);
    if(ITEMS.some(k=>S.items[k].owner===4)) return {k:'p',id:4};
    for(const k of order) if(S.items[k].owner===null) return {k:'item',item:k};
    return null;
  }
  return null;
}
function hintPos(h){
  if(!h) return null;
  if(h.k==='item'){const s=L.slots[h.item];return {x:s.x,y:s.y,r:108};}
  if(h.k==='p'){const p=P(h.id);return {x:p.x,y:p.y+geom(p).hip-14,r:112};}
  if(h.k==='button'){const b=btnPos(S.button);return b?{x:b.x,y:b.y,r:50}:null;}
  return null;
}
const isHint=(k,id)=>!!S.hint&&S.hint.k===k&&(k==='item'?S.hint.item===id:k==='p'?S.hint.id===id:true);

// =====================================================================
//  cycle setup
// =====================================================================
function assignSpots(){
  const [P0,P1,P2,P3]=CUST;
  P0.spot='stage'; P1.spot=pickR(['st1','st2','front']); P3.spot=pickR(['ch1','ch2']); P2.spot=pickR(['win','back']);
  K().spot='counter';
}
function snapAll(){ for(const p of PEOPLE){ const s=spotPos(p); p.x=s.x; p.y=s.y; p.sit=(CHAIRS.indexOf(p.spot)>=0||p.spot==='seat')?1:0; p.hR=null;p.hL=null; } }
function resetCycleState(){
  S.variant=S.cycle%3; S.flags={}; S.pending={}; S.gives=0; S.givesSinceCond=0; S.condT=null; S.firstShadeBy=null; S.spares=0;
  for(const c of CUST){ abortAll(c); c.learned=[]; c.spare=false; c.spareIn=false; c.pocket={hat:false,button:false,spare:0}; c.comfy=false; c.shading=false; }
  const sc=S.items.scarf; sc.link=null; sc.linkTo=null; sc.linkK=0;
  S.receiver=0; S.shades=[];
}
function initGame(){
  loadSave(); S.cycle=saved.cycle; S.torso=saved.combo.slice();
  resetCycleState(); assignSpots(); snapAll();
  const b=S.button, pt=randFloor(true); b.state='floor'; b.x=pt.x; b.y=pt.y; b.vx=rnd(-90,90); b.vy=rnd(-20,20); b.rolling=true;
  S.clerkBtn.state='coat';
}

// =====================================================================
//  finale: flip -> host -> celebrate -> choose -> reopen
// =====================================================================
function startFinale(){
  S.phase='flip'; AU.flip(); logEv('finale');
  const k=K(); k.hopV=380; abortAll(k);
  for(const c of CUST){ abortAll(c); c.shading=false; }
  for(const s of S.shades) s.want=0;
  const st=CUST.find(c=>c.spot==='stage');
  if(st){ const free=['front','st1','st2','back'].find(s=>!occupiedBy(s))||'front'; st.q.push(Walk(free)); }
  S.flipWant=1; kickStage(.3);
  k.q.push(A(350,{})); k.q.push(Walk('seat'));
  lint(L.A.stage.x,L.A.stage.y-20,10);
}
function planHost(){
  const firsts=[];
  for(const g of ['shade','pick','wrap']){ let best=null;
    for(const c of CUST) for(const l of c.learned) if(l.g===g&&(!best||l.seq<best.seq)) best={g,p:c,seq:l.seq,time:l.time};
    if(best) firsts.push(best); }
  firsts.sort((a,b)=>a.seq-b.seq);
  const groups=[]; let i=0;
  if(firsts.length>=2&&firsts[0].p!==firsts[1].p&&(Math.abs(firsts[0].time-firsts[1].time)<4||Math.random()<.4)){groups.push([firsts[0],firsts[1]]);i=2;}
  for(;i<firsts.length;i++) groups.push([firsts[i]]);
  S.hostQ=groups; S.hostActive=0; S.hostT=0; S.phase='host'; S.hostLog=groups.map(g=>g.map(x=>x.g+':'+x.p.id).join('+'));
  logEv('host '+S.hostLog.join(' / '));
}

function celebrate(){

function updSpring(o,dt){o.sqV+=(-260*o.sq-13*o.sqV)*dt;o.sq+=o.sqV*dt;}
function updBtn(b,dt){
  if(b.state!=='floor'||!b.rolling) return;
  b.x+=b.vx*dt; b.y+=b.vy*dt; b.rot+=b.vx*dt/13;
  const r=floorRect(b);
  if(b.x<r.x0){b.x=r.x0;b.vx=Math.abs(b.vx)*.7;} if(b.x>r.x1){b.x=r.x1;b.vx=-Math.abs(b.vx)*.7;}
  if(b.y<r.y0){b.y=r.y0;b.vy=Math.abs(b.vy)*.7;} if(b.y>r.y1){b.y=r.y1;b.vy=-Math.abs(b.vy)*.7;}
  const f=Math.pow(.25,dt); b.vx*=f; b.vy*=f; const sp=Math.hypot(b.vx,b.vy);
  b.tickT-=dt*sp/60; if(b.tickT<0){b.tickT=1;AU.tick(.8+sp/400);}
  if(sp<14){b.rolling=false;b.vx=b.vy=0;}
}
function comfyNow(p){
  if(p.trait!=='hot') return true;

}
function shadeOver(p){
  if(p.sit<.6||p.walking) return null;
  for(const s of S.shades) if(s.want&&s.grow>.7&&!s.host&&s.chairs.indexOf(p.spot)>=0) return s;
  return null;
}
function shadedSpot(sp){ return S.shades.some(s=>s.want&&!s.host&&s.chairs.indexOf(sp)>=0); }
function idleRules(p){
  if(p.cur||p.q.length) return;
  if(wears(p,'hat')&&p.pocket.hat){ if(wears(p,'apron')){p.q.push(actPocketOutHat(p,false));return;} p.pocket.hat=false; }
  const sp=spotPos(p); if(dst(p,sp)>14){ p.q.push(Walk(p.spot)); return; }
  if(wears(p,'hat')&&!p.shading){ p.q.push(actSpread(p)); return; }
}
function shopAutonomy(){
  for(const c of CUST) idleRules(c);
  // hot customers follow free shade
  for(const s of S.shades){ if(!s.want||s.grow<.3||s.host) continue;
    for(const ch of s.chairs){ if(occupiedBy(ch)) continue;
      let best=null,bd=1e9; for(const c of CUST){ if(c.trait!=='hot'||c.cur||c.q.length||c.comfy||wears(c,'hat')||shadedSpot(c.spot)) continue; const d=dst(c,L.A[ch]); if(d<bd){bd=d;best=c;} }
      if(best){ best.q.push(Walk(ch)); logEv('seek '+best.id+'->'+ch); } } }
  // fetch fallen button
  const b=S.button;
  if(b.state==='floor'&&!b.rolling&&b.fetcher==null){
    let best=null,bd=1e9; for(const c of CUST){ if(c.cur||c.q.length) continue; if(!(wears(c,'apron')||learnedAny(c,'pick'))) continue; const d=dst(c,b)+(c.id===b.owner?5000:0); if(d<bd){bd=d;best=c;} }
    if(best&&best.id===b.owner&&CUST.some(c=>c.id!==b.owner&&(wears(c,'apron')||learnedAny(c,'pick')))) best=null;
    if(best) planFetch(best,b,fetchAfter);

function poseLook(p,dt){
  const g=geom(p), t=S.t;
  // look policy
  let la=p.lookAt;
  if(p.lookUntil>t&&p.lookItem) la=p.lookItem;
  if(!la){
    if(p.isClerk){ if(S.phase==='shop'){ const R=P(S.receiver); la=(condMet()&&Math.sin(t*1.6)>.2)?{x:L.A.stage.x,y:L.A.stage.y-60}:(R?headW(R):null); }
      else if(S.phase==='host'||S.phase==='celebrate'){ const pf=CUST.find(c=>c.cur&&!c.cur.walk); la=pf?headW(pf):null; } }
    else if(S.phase!=='shop'&&S.phase!=='reopen'){ la=headW(K()); }
    else if(p.owner&&S.button.state==='floor'&&S.button.carrier==null) la={x:S.button.x,y:S.button.y};
    else if(S.receiver===p.id) la=headW(K());
    else if(p.walking) la={x:p.x+p.face*200,y:p.y-170};
  }
  let lx=0,ly=0; if(la){ const h=headW(p); const dx=la.x-h.x, dy=la.y-h.y, d=Math.hypot(dx,dy)||1; lx=dx/d; ly=dy/d; }
  else { lx=Math.sin(t*.7+p.id*2)*.3; ly=.1; }
  const kk=1-Math.exp(-dt*9); p.look.x+=(lx-p.look.x)*kk; p.look.y+=(ly-p.look.y)*kk;
  // arm policy
  const hot=p.trait==='hot'&&!p.comfy&&isOutside(p)&&S.phase==='shop';
  const cold=p.trait==='cold'&&!isWarm(p)&&S.phase==='shop';
  let tR=p.aR?toLocal(p,p.aR,1,g):null, tL=p.aL?toLocal(p,p.aL,-1,g):null;
  const sh=S.shades.find(s=>s.by===p.id&&s.want&&s.grow>.2);
  if(sh&&!p.walking&&!p.cur){ const pt=sh.pts[0]; const side=pt&&pt.x<p.x-20?-1:1; const h=headW(p); const tgt={x:p.x+side*80,y:h.y-22};
    if(side>0&&!tR) tR=toLocal(p,tgt,1,g); if(side<0&&!tL) tL=toLocal(p,tgt,-1,g); }
  if(p.isClerk&&S.phase==='shop'&&!p.walking){
    const R=P(S.receiver); if(R&&!tR){ const c=chestW(R); tR=toLocal(p,c,1,g); const v={x:tR.x-30,y:tR.y-(g.yT+12)}; const d=Math.hypot(v.x,v.y)||1; tR={x:30+v.x/d*70,y:g.yT+12+v.y/d*70}; }
    if(condMet()&&!tL){ const s={x:L.A.stage.x,y:L.A.stage.y-50}; tL=toLocal(p,s,-1,g); tL.y+=Math.sin(t*6)*8; }
  }
  if(!p.walking&&!p.cur){
    if(hot&&!tR) tR={x:22+Math.sin(t*14)*7,y:g.hy+30};
    if(cold){ if(!tR) tR={x:-14,y:g.yT+36}; if(!tL) tL={x:14,y:g.yT+40}; }
    if(S.phase==='celebrate'&&!p.isClerk){ const c=Math.abs(Math.sin(t*9))*10; if(!tR) tR={x:4+c,y:g.yT+20}; if(!tL) tL={x:-4-c,y:g.yT+20}; }
  }
  const sw=p.walking?Math.sin(p.walkPh)*8:0;
  if(!tR) tR={x:40,y:g.hip-2+sw}; if(!tL) tL={x:-40,y:g.hip-2-sw};
  const ka=1-Math.exp(-dt*14);
  if(!p.hR) p.hR={x:tR.x,y:tR.y}; if(!p.hL) p.hL={x:tL.x,y:tL.y};
  p.hR.x+=(tR.x-p.hR.x)*ka; p.hR.y+=(tR.y-p.hR.y)*ka; p.hL.x+=(tL.x-p.hL.x)*ka; p.hL.y+=(tL.y-p.hL.y)*ka;
  p.bend=approach(p.bend,p.bendT,dt*4);
  const sitT=(!p.walking&&(CHAIRS.indexOf(p.spot)>=0||p.spot==='seat')&&dst(p,spotPos(p))<12)?1:0;
  p.sit=approach(p.sit,sitT,dt*4);
  p.happy=Math.max(0,p.happy-dt*.55);
  if(!sh&&!(p.cur&&p.cur.upd&&p.hatLift>0&&p.cur.dur)) p.hatLift=approach(p.hatLift,0,dt*2);
  p.blink-=dt; if(p.blink<-.12) p.blink=rnd(1.8,4.5);
  p.hopV-=2300*dt; p.hop+=p.hopV*dt; if(p.hop<0){p.hop=0;p.hopV=0;}
  updSpring(p,dt);

}
function toLocal(p,w,side,g){ const sx=side*30, sy=g.yT+12; let x=w.x-p.x, y=w.y-p.y+p.hop; const dx=x-sx,dy=y-sy,d=Math.hypot(dx,dy),m=88; if(d>m){x=sx+dx/d*m;y=sy+dy/d*m;} return {x,y}; }

function update(dt){
  S.t+=dt;
  for(let i=TIMERS.length-1;i>=0;i--) if(S.t>=TIMERS[i].t){ const f=TIMERS[i].fn; TIMERS.splice(i,1); f(); }
  for(const k of ITEMS) updSpring(S.slotSq[k],dt);
  S.stageSqV+=(-260*S.stageSq-13*S.stageSqV)*dt; S.stageSq+=S.stageSqV*dt;
  updFly(dt); updBtn(S.button,dt); updBtn(S.clerkBtn,dt);
  for(const p of PEOPLE){ p.walking=false; p.lookAt=null; p.aR=null; p.aL=null; p.bendT=0; runPerson(p,dt); }
  // shade validity
  for(const s of S.shades){ if(s.want){ const B=P(s.by); let ok=!!B&&wears(B,'hat')&&!B.pocket.hat&&!B.walking&&B.shading;
      ok=ok&&(s.host?(S.phase==='host'||S.phase==='celebrate'):S.phase==='shop'); if(!ok){ s.want=0; if(B&&B.walking) B.shading=false; } }
    s.grow=approach(s.grow,s.want,dt*1.7); }
  S.shades=S.shades.filter(s=>s.want||s.grow>.01);
  if(S.phase==='shop'){
    shopAutonomy();
    for(const c of CUST){ const now=comfyNow(c);
      if(c.trait==='hot'&&now&&!c.comfy){ const sh=shadeOver(c); if(sh&&sh.by!==c.id){ const B=P(sh.by); helped(B,c); learn(c,'shade',B.id); S.flags.shade1=true;
          if(S.firstShadeBy==null) S.firstShadeBy=B.id; else if(B.id!==S.firstShadeBy) S.flags.shade2=true; logEv('comfy '+c.id+' by '+B.id); } }
      c.comfy=now; }
    if(S.condT==null&&condMet()){ S.condT=S.t; logEv('cond'); const k=K(); k.happy=1; k.hopV=300; }
  }
  else if(S.phase==='flip'){ const k=K(); if(!k.cur&&!k.q.length&&k.spot==='seat'&&S.flip>.98){ k.sit=Math.max(k.sit,.5); planHost(); } }
  else if(S.phase==='host'){ S.hostT+=dt;
    if(S.hostActive===0){ if(S.hostQ.length) startGroup(S.hostQ.shift()); else celebrate(); }
    else if(S.hostT>40){ for(const c of CUST) abortAll(c); S.hostQ=[]; S.hostActive=0; celebrate(); } }
  else if(S.phase==='celebrate'){ if(S.t-S.celT>2.2) startChoose(); }
  else if(S.phase==='choose'){ for(const k of ITEMS){ const o=S.items[k].owner; if(o!==null&&o!=='fly'&&o!==4) returnToShelf(k); } }
  else if(S.phase==='reopen'){ const k=K(); if(!k.cur&&!k.q.length&&k.spot==='counter'&&dst(k,spotPos(k))<14&&S.flip<.02){ S.phase='shop'; logEv('shop'); } }
  if(S.phase==='reopen'&&S.flip<.5) { /* customers walking back */ }
  S.flip=approach(S.flip,S.flipWant,dt/0.9);
  if(S.torsoPop) S.torsoPop=Math.max(0,S.torsoPop-dt*1.5);
  for(const p of PEOPLE) poseLook(p,dt);
  // particles
  for(let i=PARTS.length-1;i>=0;i--){const q=PARTS[i]; q.life+=dt; if(q.life>q.max){PARTS.splice(i,1);continue;} q.vy+=420*dt; q.vx*=.985; q.x+=q.vx*dt; q.y+=q.vy*dt; q.r+=q.vr*dt;}
  for(let i=RIP.length-1;i>=0;i--){RIP[i].t+=dt; if(RIP[i].t>.5) RIP.splice(i,1);}
  // guidance
  S.hint=computeHint();
  if(!S.demo&&!S.demoDone&&S.hint&&S.t-S.lastInput>4){ const hp=hintPos(S.hint); if(hp){ S.demo={t:0,x:hp.x,y:hp.y}; S.demoDone=true; } }
  if(S.demo){ S.demo.t+=dt; if(S.demo.t>1.7) S.demo=null; }
}

function chairShape(g,x,y){
  g.save(); g.translate(x,y);

window.addEventListener('orientationchange',()=>setTimeout(resize,120));
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ if(raf) cancelAnimationFrame(raf); raf=0; try{ if(AU.c&&AU.c.state==='running') AU.c.suspend(); }catch(e){} }
  else { last=0; if(!raf) raf=requestAnimationFrame(frame); }
});
resize(); initGame();
raf=requestAnimationFrame(frame);

// =====================================================================
//  test hooks (read-only inspection + deterministic stepping)
// =====================================================================
window.__gf={
  state(){ return {phase:S.phase,t:S.t,cycle:S.cycle,variant:S.variant,receiver:S.receiver,
    items:{hat:S.items.hat.owner,apron:S.items.apron.owner,scarf:S.items.scarf.owner,link:S.items.scarf.link},
    shades:S.shades.map(s=>({by:s.by,chairs:s.chairs.slice(),grow:+s.grow.toFixed(2),host:s.host})),
    button:S.button.state, clerkBtn:S.clerkBtn.state, flags:Object.assign({},S.flags), cond:condMet(), hint:S.hint, flip:S.flip,
    people:PEOPLE.map(p=>({id:p.id,x:Math.round(p.x),y:Math.round(p.y),spot:p.spot,sit:+p.sit.toFixed(2),busy:!!(p.cur||p.q.length),
      learned:p.learned.map(l=>l.g+(l.from!==p.id?'<'+l.from:'')),spare:p.spare,warm:isWarm(p),comfy:p.comfy,pocket:Object.assign({},p.pocket)})),
    audio:AU.c?AU.c.state:null, torso:S.torso.slice(), save:{status:saveStatus,ok:saveOK,data:saved}, demo:!!S.demo, hostLog:S.hostLog||null, land:L.land, fly:FLY.length, parts:PARTS.length}; },
  pos(what){ let pt=null;
    if(ITEMS.indexOf(what)>=0) pt=L.slots[what];
    else if(what==='button'){ pt=btnPos(S.button); }
    else if(/^p\d$/.test(what)){ const p=P(+what[1]); pt={x:p.x,y:p.y+geom(p).hip-14}; }
    else if(what==='clerk'){ const p=K(); pt={x:p.x,y:p.y-110+geom(p).drop*.5}; }
    else if(what==='bg'){ pt={x:L.land?1000:560,y:L.land?300:560}; }
    return pt?{x:OX+pt.x*SC,y:OY+pt.y*SC}:null; },
  step(sec){ const n=Math.ceil(sec*60); for(let i=0;i<n;i++) update(1/60); draw(); },
  log(){ return S.log.slice(); },
  hit(x,y){ return hitTest((x-OX)/SC,(y-OY)/SC); }
};
})();
</script>
</body>
</html>
