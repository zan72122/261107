<title>ぺたっ、もぐっ！クレヨン食卓のひとやすみレコード</title>
<style>

canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#sa{position:fixed;left:0;top:0;right:0;bottom:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);visibility:hidden;pointer-events:none}

<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
'use strict';
(function(){
// =====================================================================
//  basics
// =====================================================================
const cv=document.getElementById('c');
const mainCtx=cv.getContext('2d');
let ctx=mainCtx;
const saEl=document.getElementById('sa');
const TAU=Math.PI*2, NS=8, PERIOD=8, SD=PERIOD/NS;
const C={ink:'#0c1536',navy:'#14245a',navy2:'#22397e',navy3:'#0f1c48',paper:'#fbf6e9',grey:'#d9d3c4',
  red:'#e4402c',red2:'#a8221a',orange:'#f28b2c',orange2:'#c45f17',yellow:'#f8cf35',yellow2:'#fde69a',
  green:'#4db448',green2:'#2b7a31',pink:'#f59cab',brown:'#8f4a1c',skin:'#f5b27a',skin2:'#d9824a',tea:'#c8742a',hair:'#5a2e14'};
const TOOLS=['board','pan','whisk','kettle'];
const TCOL={board:C.green,pan:C.red,whisk:C.yellow,kettle:C.orange};
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut=t=>1-(1-t)*(1-t);
function hs(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function angDiff(a,b){let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return Math.abs(d);}
let W=0,H=0,DPR=1;

// =====================================================================
//  crayon textures
// =====================================================================
function mkTex(cols,holes,base){
  const S=80,c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');
  g.fillStyle=cols[0];g.globalAlpha=base==null?0.92:base;g.fillRect(0,0,S,S);
  for(let i=0;i<120;i++){
    g.strokeStyle=cols[(Math.random()*cols.length)|0];g.globalAlpha=0.25+Math.random()*0.6;g.lineWidth=1+Math.random()*3;g.lineCap='round';
    const x=Math.random()*S,y=Math.random()*S,a=-0.7+(Math.random()-.5)*0.7,l=4+Math.random()*13;
    for(let ox=-S;ox<=S;ox+=S)for(let oy=-S;oy<=S;oy+=S){g.beginPath();g.moveTo(x+ox,y+oy);g.lineTo(x+ox+Math.cos(a)*l,y+oy+Math.sin(a)*l);g.stroke();}
  }
  g.globalCompositeOperation='destination-out';
  for(let i=0;i<(holes==null?70:holes);i++){g.globalAlpha=0.3+Math.random()*0.55;g.fillRect(Math.random()*S,Math.random()*S,1+Math.random()*2.2,1+Math.random()*1.4);}
  return mainCtx.createPattern(c,'repeat');
}
const P={
  red:mkTex([C.red,'#f25f3c','#c9301f','#f07a3a']),
  red2:mkTex([C.red2,'#c22a1e','#8a1a14','#d6402a'],40),
  orange:mkTex([C.orange,'#f6a443','#e2741f','#f8b955']),
  orange2:mkTex([C.orange2,'#a94e12','#d8711f','#8f3f10'],40),
  yellow:mkTex([C.yellow,'#fbe066','#f2b51f','#ffe98a']),
  yellow2:mkTex([C.yellow2,'#fff1bd','#f8d778','#fde8a3'],40),
  green:mkTex([C.green,'#6cc95a','#3c9a39','#8bd66a']),
  green2:mkTex([C.green2,'#21662a','#3f8f3b','#1b5523'],40),
  pink:mkTex([C.pink,'#f8b6c2','#ee7f90','#fbd0d6'],40),
  brown:mkTex([C.brown,'#a85a23','#6f3612','#b8682c'],40),
  skin:mkTex([C.skin,'#f8c294','#eda06a','#f9cfa8'],30),
  white:mkTex(['#ffffff','#f4efe3','#fffaf0','#e6e0d2'],10,1),
  plate:mkTex(['#fffdf6','#f6efdc','#fff6d8','#ece3cc'],10,1),
  navy2:mkTex([C.navy2,'#2a4590','#1a2f6c','#33509c'],30),
  tea:mkTex([C.tea,'#d88a3e','#a95a1c','#e09a50'],30),
  hair:mkTex([C.hair,'#6e3a1a','#41200e','#7a4520'],30),
};

// =====================================================================
//  path helpers
// =====================================================================
function blob(x,y,rx,ry,seed,amt){
  amt=amt==null?0.07:amt;const n=14;const px=[],py=[];
  for(let i=0;i<n;i++){const a=i/n*TAU;const r=1+(hs(seed+i*1.37)-.5)*2*amt;px.push(x+Math.cos(a)*rx*r);py.push(y+Math.sin(a)*ry*r);}
  ctx.beginPath();ctx.moveTo((px[n-1]+px[0])/2,(py[n-1]+py[0])/2);
  for(let i=0;i<n;i++){const j=(i+1)%n;ctx.quadraticCurveTo(px[i],py[i],(px[i]+px[j])/2,(py[i]+py[j])/2);}
  ctx.closePath();
}
function cblob(x,y,rx,ry,seed,fill,stroke,lw,amt){
  if(fill){blob(x,y,rx,ry,seed,amt);ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.lineWidth=lw;blob(x,y,rx,ry,seed+5.3,amt);ctx.stroke();
    const a=ctx.globalAlpha;ctx.globalAlpha=a*0.4;ctx.lineWidth=lw*0.45;blob(x+lw*0.3,y-lw*0.2,rx*1.03,ry*1.03,seed+9.1,amt);ctx.stroke();ctx.globalAlpha=a;}
}
function cline(pts,col,lw,seed){
  ctx.strokeStyle=col;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=lw;
  ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);ctx.stroke();
  const a=ctx.globalAlpha;ctx.globalAlpha=a*0.45;ctx.lineWidth=lw*0.5;const j=lw*0.32;
  ctx.beginPath();ctx.moveTo(pts[0]+j,pts[1]-j);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i]+j*(hs((seed||0)+i)-.3),pts[i+1]-j*hs((seed||0)+i+.5));ctx.stroke();ctx.globalAlpha=a;
}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,TAU);}

// =====================================================================
//  state
// =====================================================================
const S={
  phase:'cook',spinTo:'dine',spinT:0,tableAng:0,cycle:0,phi:0.02,time:0,
  slots:[],stk:{},straw:null,batter:null,plates:[],guests:[],
  dirty:0,dinEaten:0,combo:{tool:null,t:-9,n:0},heat:null,lineCol:null,lineT:-9,
  disc:{d1:0,d2:0,d3:0,d4:0,d5:0,d6:0,top:0},lineMade:{jam:0,roastChop:0},discLog:[],made:{},orders:[],dishLog:[],
  lastSingle:{g:-1,t:-99,slot:-1},long:null,smears:[],ev:[],flies:[],parts:[],trail:[],
  lastInput:0,demo:null,demoShown:false,started:false,pics:[],picImgs:[],store:'fresh',
  flash:0,spinPending:false,frameT:0,noOverlay:false,taps:0,transforms:0,parties:0,saves:0,
  wobbles:{},supplyPop:0,hum:0
};
for(let i=0;i<NS;i++)S.slots.push({tool:null,rest:false,restT:0,used:false,wob:0});
TOOLS.forEach((t,i)=>{S.stk[t]={tool:t,slot:-1,x:0,y:0,sc:1,vs:0,press:0,drag:false,bounce:0,tray:i,init:false};});
function newStraw(){return{kind:'straw',state:'raw',amount:1,fine:0,plate:-1,x:null,y:null,hit:0,pop:1};}
function newBatter(){return{kind:'batter',state:'raw',mix:0,done:0,cookT:1,cookDur:1,cut:false,amount:1,plate:-1,x:null,y:null,hit:0,pop:1};}
S.straw=newStraw();S.batter=newBatter();
for(let i=0;i<3;i++)S.plates.push({i,dish:null,bites:0,maxBites:1,assigned:null,seat:i,x:null,y:null,away:null,pop:0,wob:0,topFly:false});
const GLOOK=[{shirt:'green',hair:'mess'},{shirt:'orange',hair:'band'},{shirt:'red',hair:'cap'}];
for(let i=0;i<3;i++)S.guests.push({i,x:null,y:null,look:{x:0,y:0},lx:0,ly:0,anim:null,chew:0,happy:0,cup:0,ate:[],wish:null,nextPoint:6+i*2.3,bob:hs(i)*TAU,hand:[{x:0,y:0},{x:0,y:0}],hold:null,giggle:0});

// =====================================================================
//  layout
// =====================================================================
let L={};
function readSA(){const cs=getComputedStyle(saEl);return{t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};}
function layout(){
  W=window.innerWidth;H=window.innerHeight;DPR=Math.min(2,window.devicePixelRatio||1,Math.max(1,Math.sqrt(2.6e6/Math.max(1,W*H))));
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const sa=readSA();const x0=sa.l+6,y0=sa.t+6,x1=W-sa.r-6,y1=H-sa.b-6,aw=x1-x0,ah=y1-y0;
  const port=ah>=aw;
  let R,cx,cy,tray=[],th=0,tw=0;
  if(port){th=clamp(ah*0.13,84,130);R=Math.min(aw*0.43,(ah-th)*0.31);cx=x0+aw/2;cy=y0+(ah-th)*0.6;
    for(let i=0;i<4;i++)tray.push({x:x0+aw*(i+.5)/4,y:y1-th*0.5});
  }else{tw=clamp(aw*0.13,100,170);R=Math.min(ah*0.36,(aw-tw)*0.33);cx=x0+(aw-tw)*0.5;cy=y0+ah*0.53;
    const ty0=y0+ah*0.25,ty1=y1-ah*0.02;for(let i=0;i<4;i++)tray.push({x:x1-tw*0.5,y:ty0+(ty1-ty0)*(i+.5)/4});
  }
  const u=R/150;
  const gx0=x0+30*u,gx1=(port?x1:x1-tw)-30*u,gy0=y0+36*u,gy1=port?(y1-th-64*u):(y1-62*u);
  const gp=(deg,rad)=>{const a=deg*Math.PI/180;return{x:clamp(cx+Math.cos(a)*rad,gx0,gx1),y:clamp(cy+Math.sin(a)*rad,gy0,gy1)};};
  const tp=(deg,rad)=>{const a=deg*Math.PI/180;return{x:cx+Math.cos(a)*rad,y:cy+Math.sin(a)*rad};};
  const fbR=Math.max(34,0.2*R);
  L={port,R,cx,cy,u,x0,y0,x1,y1,aw,ah,th,tw,tray,sr:Math.max(25,0.17*R),ring:0.84*R,
    fb:port?{x:x1-fbR-4,y:y0+fbR+4,r:fbR}:{x:x1-tw*0.5,y:y0+ah*0.11,r:fbR},
    galW:clamp(0.34*R,52,104),
    wait:[gp(-135,R+60*u),gp(-90,R+58*u),gp(-45,R+60*u)],
    seat:port?[gp(-90,R+46*u),gp(45,R+46*u),gp(135,R+46*u)]:[gp(-90,R+46*u),gp(0,R+50*u),gp(180,R+50*u)],
    pc:[tp(-150,0.47*R),tp(-30,0.47*R),tp(90,0.47*R)],
    pd:port?[tp(-90,0.47*R),tp(45,0.47*R),tp(135,0.47*R)]:[tp(-90,0.47*R),tp(0,0.5*R),tp(180,0.5*R)],
    supS:{x:cx-0.14*R,y:cy-0.02*R},supB:{x:cx+0.15*R,y:cy-0.01*R},dirty:{x:cx,y:cy+0.22*R},
    pr:0.185*R};
  buildBG();buildTable();buildStickers();
  S.smears.length=0;
  for(const t of TOOLS){const st=S.stk[t];const p=stickerHome(t);st.x=p.x;st.y=p.y;}
  for(const p of S.plates){const h=plateHome(p);p.x=h.x;p.y=h.y;}
  for(const g of S.guests){const h=guestHome(g);g.x=h.x;g.y=h.y;g.hand[0]=handRest(g,0);g.hand[1]=handRest(g,1);}
  S.straw.x=S.straw.y=null;S.batter.x=S.batter.y=null;
}
function slotAng(i){return -Math.PI/2+(i+0.5)*TAU/NS;}
function slotPos(i){const a=slotAng(i);return{x:L.cx+Math.cos(a)*L.ring,y:L.cy+Math.sin(a)*L.ring};}
function stickerHome(t){const st=S.stk[t];return st.slot>=0?slotPos(st.slot):L.tray[st.tray];}
function isDining(){return S.phase==='dine'||S.phase==='party'||(S.phase==='spin'&&S.spinTo==='cook');}
function plateHome(p){
  if(S.phase==='spin'){const k=ease(clamp(S.spinT,0,1));const a=L.pc[p.i],b=L.pd[p.seat];
    return S.spinTo==='dine'?{x:lerp(a.x,b.x,k),y:lerp(a.y,b.y,k)}:{x:lerp(b.x,a.x,k),y:lerp(b.y,a.y,k)};}
  return (S.phase==='cook')?L.pc[p.i]:L.pd[p.seat];
}
function guestHome(g){
  if(S.phase==='spin'){const k=ease(clamp(S.spinT,0,1));let a=L.wait[g.i],b=L.seat[g.i];if(S.spinTo!=='dine'){const t=a;a=b;b=t;}
    const a0=Math.atan2(a.y-L.cy,a.x-L.cx),a1=Math.atan2(b.y-L.cy,b.x-L.cx);let d=a1-a0;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;
    const r0=dist(a.x,a.y,L.cx,L.cy),r1=dist(b.x,b.y,L.cx,L.cy);const an=a0+d*k,r=Math.max(lerp(r0,r1,k),L.R+30*L.u)+Math.sin(k*Math.PI)*12*L.u;
    return{x:clamp(L.cx+Math.cos(an)*r,L.x0+26*L.u,L.x1-26*L.u-(L.port?0:L.tw)),y:clamp(L.cy+Math.sin(an)*r,L.y0+30*L.u,L.y1-50*L.u)};}
  return S.phase==='cook'?L.wait[g.i]:L.seat[g.i];
}
function guestAng(g){return Math.atan2(g.y-L.cy,g.x-L.cx);}
function handRest(g,h){const a=guestAng(g)+(h?0.17:-0.17)*clamp(160/L.R,0.55,1.1);return{x:L.cx+Math.cos(a)*L.R*0.99,y:L.cy+Math.sin(a)*L.R*0.99};}
function cupPos(g){const a=guestAng(g);return{x:L.cx+Math.cos(a)*L.R*1.03,y:L.cy+Math.sin(a)*L.R*1.03};}

// =====================================================================
//  cached layers
// =====================================================================
const bgCan=document.createElement('canvas'),tabCan=document.createElement('canvas');
const stCan={};
let grainPat=null;
(function(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  for(let i=0;i<900;i++){g.fillStyle=Math.random()<0.6?'rgba(12,21,54,'+(0.08+Math.random()*0.22)+')':'rgba(255,255,255,'+(0.04+Math.random()*0.1)+')';g.fillRect(Math.random()*128,Math.random()*128,1+Math.random()*2,1+Math.random()*1.5);}
  for(let i=0;i<14;i++){g.strokeStyle='rgba(12,21,54,0.10)';g.lineWidth=1;g.beginPath();const x=Math.random()*128,y=Math.random()*128;g.moveTo(x,y);g.lineTo(x+20*Math.random(),y+30*Math.random());g.stroke();}
  grainPat=mainCtx.createPattern(c,'repeat');})();
function withCtx(c2,fn){const old=ctx;ctx=c2;try{fn();}finally{ctx=old;}}
function buildBG(){
  bgCan.width=cv.width;bgCan.height=cv.height;const g=bgCan.getContext('2d');
  withCtx(g,()=>{
    g.setTransform(DPR,0,0,DPR,0,0);g.fillStyle=C.navy;g.fillRect(0,0,W,H);
    g.fillStyle=P.navy2;g.globalAlpha=0.35;g.fillRect(0,0,W,H);g.globalAlpha=1;
    const n=Math.round(W*H/2600);
    for(let i=0;i<n;i++){g.strokeStyle=Math.random()<0.5?C.navy2:C.navy3;g.globalAlpha=0.25+Math.random()*0.35;g.lineWidth=2+Math.random()*5;g.lineCap='round';
      const x=Math.random()*W,y=Math.random()*H,a=-0.6+(Math.random()-.5)*0.5,l=20+Math.random()*50;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}
    // thick pastel bands near the edges
    const cols=[P.red,P.yellow,P.orange,P.green];const u=L.u;
    for(let k=0;k<4;k++){g.globalAlpha=0.85;g.strokeStyle=cols[k];g.lineWidth=(10+k*2)*u;g.lineCap='round';g.beginPath();
      const off=(8+k*13)*u;
      for(let s=0;s<=24;s++){const t=s/24;const x=t*W,y=H-off+Math.sin(t*9+k)*5*u+(hs(k*7+s)-.5)*4*u;s?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();
      g.beginPath();for(let s=0;s<=24;s++){const t=s/24;const x=t*W,y=off*0.6+Math.sin(t*7+k*2)*5*u+(hs(k*9+s)-.5)*4*u;s?g.lineTo(x,y):g.moveTo(x,y);}g.globalAlpha=0.5;g.stroke();}
    // sgraffito scratches
    g.globalAlpha=0.35;g.strokeStyle=C.navy3;g.lineWidth=1.5;
    for(let i=0;i<40;i++){const x=Math.random()*W,y=(Math.random()<0.5?Math.random()*60*u:H-Math.random()*70*u);g.beginPath();g.moveTo(x,y);g.lineTo(x+(Math.random()-.5)*30,y+(Math.random()-.5)*20);g.stroke();}
    g.globalAlpha=1;
    // tray spots shadow
    for(let i=0;i<4;i++){const p=L.tray[i];g.globalAlpha=0.4;g.setLineDash([6*u,7*u]);g.strokeStyle='#ffffff';g.lineWidth=3*u;g.beginPath();g.arc(p.x,p.y,L.sr*1.08,0,TAU);g.stroke();g.setLineDash([]);
      g.globalAlpha=0.25;g.fillStyle=C.navy3;g.beginPath();g.arc(p.x,p.y,L.sr*1.05,0,TAU);g.fill();}
    g.globalAlpha=0.35;g.fillStyle=grainPat;g.fillRect(0,0,W,H);g.globalAlpha=1;
  });
}
function buildTable(){
  const R=L.R,u=L.u,pad=24*u;const sz=Math.ceil((R*2+pad*2)*DPR);tabCan.width=tabCan.height=sz;const g=tabCan.getContext('2d');
  withCtx(g,()=>{
    g.setTransform(DPR,0,0,DPR,0,0);const c=R+pad;
    // shadow
    g.globalAlpha=0.5;cblob(c+6*u,c+10*u,R*1.02,R*1.02,3,C.navy3,null,0,0.02);g.globalAlpha=1;
    // white table (thick white pastel)
    cblob(c,c,R,R,11,P.white,null,0,0.025);
    for(let i=0;i<70;i++){const a=Math.random()*TAU,r=Math.random()*R*0.95;g.strokeStyle=Math.random()<0.7?'#ffffff':'#ece6d6';g.globalAlpha=0.5;g.lineWidth=4+Math.random()*7;g.lineCap='round';
      const x=c+Math.cos(a)*r,y=c+Math.sin(a)*r;g.beginPath();g.moveTo(x,y);g.lineTo(x+14*u,y-9*u);g.stroke();}
    g.globalAlpha=1;
    // record groove ring
    g.strokeStyle='#f6f0e2';g.globalAlpha=0.9;g.lineWidth=0.36*R;circ(c,c,0.84*R);g.stroke();
    g.globalAlpha=0.6;g.strokeStyle='#d8cfb6';g.lineWidth=1.6*u;for(const rr of [0.67,0.75,0.93,1.0]){g.beginPath();g.arc(c,c,rr*R*0.995,0,TAU);g.stroke();}
    g.globalAlpha=1;
    // center label
    g.globalAlpha=0.55;cblob(c,c,0.3*R,0.3*R,21,P.yellow2,null,0,0.05);g.globalAlpha=1;
    // rim
    cblob(c,c,R,R,31,null,P.orange,9*u,0.02);
    cblob(c,c,R*0.975,R*0.975,41,null,P.yellow,4*u,0.02);
    // scratch marks
    g.globalAlpha=0.25;g.strokeStyle=C.grey;g.lineWidth=1.2*u;

let AC=null,master=null,noiseBuf=null,humGain=null;
function initAudio(){
  if(AC){if(AC.state==='suspended'&&!document.hidden)AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;return;}
  master=AC.createGain();master.gain.value=0.75;const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;master.connect(comp);comp.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,Math.floor(AC.sampleRate*1.5),AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  humGain=AC.createGain();humGain.gain.value=0;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;
  for(const f of [98,147]){const o=AC.createOscillator();o.type='triangle';o.frequency.value=f;o.connect(lp);o.start();}
  lp.connect(humGain);humGain.connect(master);
  if(AC.state==='suspended')AC.resume();
}
function now(){return AC?AC.currentTime:0;}
function envG(t,a,peak,d,dest){const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);g.connect(dest||master);return g;}
function tone(type,f0,f1,t,a,d,vol,dest){if(!AC)return;const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+a+d);o.connect(envG(t,a,vol,d,dest));o.start(t);o.stop(t+a+d+0.05);}
function noise(t,dur,type,f0,f1,q,vol,a){if(!AC)return;const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=AC.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)f.frequency.exponentialRampToValueAtTime(f1,t+dur);f.Q.value=q||1;s.connect(f);f.connect(envG(t,a||0.005,vol,dur));s.start(t,Math.random()*1.0);s.stop(t+dur+(a||0.005)+0.05);}
const SND={
  press(){if(!AC)return;const t=now();tone('sine',520,380,t,0.005,0.07,0.08);},
  place(){if(!AC)return;const t=now();tone('sine',200,80,t,0.004,0.16,0.35);noise(t,0.05,'highpass',2500,2500,1,0.12);tone('triangle',660,520,t+0.01,0.004,0.08,0.08);},
  peel(){if(!AC)return;const t=now();noise(t,0.2,'bandpass',700,3600,3,0.25,0.01);tone('sine',300,700,t,0.01,0.15,0.06);},
  chop(n,vol){if(!AC)return;const t=now();n=n||1;const gap=Math.max(0.05,0.2/n);for(let i=0;i<n+1;i++){const tt=t+i*gap;noise(tt,0.035,'bandpass',1800+i*120,1800,4,0.4*(vol||1));tone('square',900+n*120,500,tt,0.002,0.03,0.05);tone('sine',160,90,tt,0.002,0.06,0.2*(vol||1));}},
  sizzle(dur,heat){if(!AC)return;const t=now();const f=1800+heat*900;
    const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=f;const g=AC.createGain();
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.5,t+0.012);g.gain.exponentialRampToValueAtTime(0.16,t+0.18);
    const steps=Math.floor(dur/0.09);for(let i=1;i<steps;i++)g.gain.setValueAtTime(0.1+Math.random()*0.1,t+0.18+i*0.09*(dur-0.2)/dur);
    g.gain.setValueAtTime(0.14,t+Math.max(0.2,dur-0.1));g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.15);
    s.connect(hp);hp.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+dur+0.2);
    for(let i=0;i<Math.min(8,Math.floor(dur*4));i++)tone('sine',600+heat*200+Math.random()*400,300,t+0.1+Math.random()*dur,0.003,0.04,0.04);},
  whisk(level){if(!AC)return;const t=now();const n=4+level*2;const gap=0.32/n*2;for(let i=0;i<n;i++){const tt=t+i*gap;noise(tt,gap*0.9,'bandpass',2600+level*700+(i%2)*900,3800+level*700,5,0.22,0.02);}tone('triangle',520+level*130,700+level*150,t,0.01,0.25,0.05);},
  pour(){if(!AC)return;const t=now();noise(t,0.9,'bandpass',400,1500,6,0.3,0.06);tone('sine',1700,1900,t+0.1,0.15,0.6,0.04);for(let i=0;i<6;i++)tone('sine',900+i*140,1200+i*140,t+0.12*i,0.004,0.05,0.05);},

  ding(){if(!AC)return;const t=now();tone('sine',1320,1320,t,0.003,0.35,0.1);tone('sine',1980,1980,t+0.06,0.003,0.3,0.06);},

  whoosh(){if(!AC)return;const t=now();noise(t,1.6,'bandpass',300,2400,2,0.22,0.3);[392,494,587,784,988,1175].forEach((f,i)=>tone('triangle',f,f,t+0.2+i*0.16,0.01,0.4,0.11));},

  puff(){if(!AC)return;const t=now();noise(t,0.08,'lowpass',700,300,1,0.07);},
  slide(){if(!AC)return;const t=now();noise(t,0.5,'bandpass',600,900,2,0.12,0.05);tone('sine',2400,2400,t+0.45,0.002,0.15,0.06);tone('sine',2900,2900,t+0.55,0.002,0.15,0.05);},
  shutter(){if(!AC)return;const t=now();noise(t,0.05,'highpass',3000,3000,1,0.3);noise(t+0.08,0.05,'highpass',2000,2000,1,0.25);[784,988,1175,1568].forEach((f,i)=>tone('sine',f,f,t+0.18+i*0.07,0.005,0.3,0.1));},
  sip(){if(!AC)return;const t=now();noise(t,0.25,'bandpass',900,1400,4,0.08,0.03);}

const PMAX=140;
function part(o){if(S.parts.length>=PMAX)S.parts.shift();o.life=o.life||0.8;o.t=0;S.parts.push(o);}
function burst(x,y,col,n,spd,type,size){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=(0.4+Math.random())*spd;part({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-spd*0.3,col,type:type||'dust',size:(size||5)*L.u*(0.6+Math.random()*0.8),life:0.5+Math.random()*0.6,rot:Math.random()*TAU});}}
function stream(x0,y0,x1,y1,col,n){for(let i=0;i<n;i++)part({type:'arc',x0,y0,x1,y1,x:x0,y:y0,col,size:(4+Math.random()*4)*L.u,life:0.35+i*0.05,h:(20+Math.random()*30)*L.u});}
function fly(from,to,dur,drawFn,onEnd){S.flies.push({from,to,t:0,dur,drawFn,onEnd});}

// =====================================================================
//  game logic
// =====================================================================
function later(dt,fn){S.ev.push({t:S.time+dt,fn});}
function ingPos(ing){if(ing.plate>=0){const p=S.plates[ing.plate];return{x:p.x,y:p.y};}return ing.kind==='straw'?L.supS:L.supB;}
function fam(kind){return kind==='pancake'?'pan':kind==='roastChop'?'chop':'jam';}
function plateFam(p){if(!p.dish)return null;return fam(p.dish.kind);}
function freePlate(kind){
  const c=S.plates.filter(p=>!p.dish&&!p.assigned&&!p.away);if(!c.length)return -1;
  if(isDining()){const want=kind==='batter'?['pan']:['jam','chop'];const best=c.find(p=>{const g=S.guests[p.seat];return g&&want.includes(g.wish);});if(best)return best.i;}
  return c[0].i;
}
function leave(ing){if(ing.plate>=0)return;const p=freePlate(ing.kind);if(p>=0){ing.plate=p;S.plates[p].assigned=ing.kind;}}
function ringOrder(){return S.slots.map(s=>s.tool||(s.rest?'rest':'')).slice();}
function discover(key,x,y){
  if(S.disc[key])return;S.disc[key]=S.time;S.discLog.push({key,t:+S.time.toFixed(1),phase:S.phase,order:ringOrder().join(',')});
  SND.success();if(x!=null){burst(x,y,P.yellow,14,160*L.u,'spark',7);burst(x,y,P.red,8,120*L.u,'spark',5);}
}
function fireTool(tool,slot,src){
  const st=S.stk[tool];st.bounce=1;
  let n=1;if(src!=='line'){if(S.combo.tool===tool&&S.time-S.combo.t<0.9)n=Math.min(4,S.combo.n+1);S.combo={tool,t:S.time,n};}
  S.lineCol=TCOL[tool];S.lineT=S.time;
  const sp=slot>=0?slotPos(slot):{x:st.x,y:st.y};
  const s=S.straw,b=S.batter;const grow=src!=='line';
  const hitIng=(ing,col)=>{ing.hit=1;const q=ingPos(ing);stream(sp.x,sp.y,q.x,q.y,col,6);};
  if(tool==='board'){
    let did=false;
    if(s.state==='raw'){s.state='chopped';s.fine=n;s.cSrc=src;leave(s);did=true;}
    else if(s.state==='roasted'){s.state='roastChop';did=true;if(s.rSrc==='line'&&src==='line'){S.lineMade.roastChop=1;if(S.lineMade.jam)discover('d6',ingPos(s).x,ingPos(s).y);}}
    else if(s.state==='chopped'){s.fine=Math.min(4,s.fine+n);if(grow)s.amount=Math.min(4,s.amount+1);did=true;}
    else if(s.state==='roastChop'&&grow){s.amount=Math.min(4,s.amount+1);did=true;}
    if(did)hitIng(s,P.green);
    if(b.state==='pancake'&&!b.cut){b.cut=true;hitIng(b,P.green);}
    SND.chop(src==='line'?2:n);
  }else if(tool==='pan'){
    const k=src==='line'?sustainK(slot):1;const dur=src==='line'?k*SD:0.6;
    S.heat={slot,k:src==='line'?k:1,t0:S.time,dur};
    let did=false;
    if(s.state==='raw'){s.state='roasted';s.rSrc=src;leave(s);did=true;}
    else if(s.state==='chopped'){s.state='jam';did=true;const q=ingPos(s);discover('d1',q.x,q.y);if(s.cSrc==='line'&&src==='line'){S.lineMade.jam=1;if(S.lineMade.roastChop)discover('d6',q.x,q.y);}}
    else if(s.state==='roasted'&&grow){s.amount=Math.min(4,s.amount+1);did=true;}
    else if(s.state==='syrup'){s.state='jam';did=true;}
    if(did)hitIng(s,P.red);
    if(b.state==='mixed'){b.state='pancake';b.done=k;b.cookT=0;b.cookDur=dur;leave(b);hitIng(b,P.orange);const q=ingPos(b);discover('d2',q.x,q.y);}
    else if(b.state==='pancake'){b.done=Math.min(3,b.done+1);hitIng(b,P.orange);}
    SND.sizzle(dur,k);
    for(let i=0;i<5;i++)part({type:'steam',x:sp.x+(Math.random()-.5)*20*L.u,y:sp.y-10*L.u,vx:(Math.random()-.5)*10,vy:-30*L.u-Math.random()*20,col:'#ffffff',size:8*L.u,life:1+Math.random()*0.6});
  }else if(tool==='whisk'){
    let lv=1;
    if(b.state==='raw'){b.state='mixed';b.mix=1;hitIng(b,P.yellow);}
    else if(b.state==='mixed'){b.mix=Math.min(3,b.mix+(grow?1:0)+(src==='line'&&b.mix<2?1:0));lv=b.mix;hitIng(b,P.yellow);}
    if(s.state==='jam'||s.state==='syrup'){s.state='cream';hitIng(s,P.pink);}
    SND.whisk(Math.max(lv,n>1?Math.min(3,n):1));
  }else if(tool==='kettle'){
    if(s.state==='jam'){s.state='syrup';hitIng(s,P.red);}
    else if(s.state==='raw'){s.hit=1;burst(ingPos(s).x,ingPos(s).y,'#ffffff',6,60*L.u,'drop',4);}
    for(const g of S.guests){g.cup=Math.min(1,g.cup+0.5);const c=cupPos(g);stream(sp.x,sp.y,c.x,c.y,'#cfe8ff',4);}
    SND.pour();
    for(let i=0;i<4;i++)part({type:'steam',x:sp.x,y:sp.y-12*L.u,vx:(Math.random()-.5)*14,vy:-28*L.u,col:'#ffffff',size:9*L.u,life:1.2});
  }
}
function sustainK(i){let k=1;for(let j=i+1;j<NS&&k<3;j++){const s=S.slots[j];if(s.tool||s.rest)break;k++;}return k;}
function setBites(p){const d=p.dish;let b=d.kind==='pancake'?2+(d.stack||1):2+(d.amount||1);if(d.top)b+=1;p.bites=b;p.maxBites=b;}
function madeDish(kind){S.made[kind]=(S.made[kind]||0)+1;S.dishLog.push(kind);if(S.dishLog.length>40)S.dishLog.shift();S.orders.push(ringOrder());if(S.orders.length>20)S.orders.shift();}
function serve(){
  let served=false;const b=S.batter,s=S.straw;
  if(b.state==='pancake'){b.cookT=1;if(b.plate<0)leave(b);
    if(b.plate>=0){const p=S.plates[b.plate];p.dish={kind:'pancake',done:b.done,cut:b.cut,stack:Math.max(1,b.mix),top:null,amount:1};setBites(p);p.assigned=null;p.pop=1;madeDish('pancake');S.batter=newBatter();served=true;}}
  if(['jam','syrup','cream','roastChop'].includes(s.state)){
    let target=-1;
    if(s.state!=='roastChop'){const c=S.plates.find(p=>p.dish&&p.dish.kind==='pancake'&&!p.dish.top&&!p.topFly&&!p.away);if(c)target=c.i;}
    if(target>=0){
      const p=S.plates[target];const from=ingPos(s);const kind=s.state,amt=s.amount;
      if(s.plate>=0)S.plates[s.plate].assigned=null;
      p.topFly=true;
      fly(from,p,0.7,(x,y)=>drawStrawFood(x,y,kind,amt,2,1,0.8),()=>{p.topFly=false;if(p.dish&&p.dish.kind==='pancake'){p.dish.top=kind;p.bites+=1;p.maxBites+=1;p.pop=1;SND.clink(1.4);discover('top',p.x,p.y);burst(p.x,p.y,P.red,8,80*L.u);}});
      madeDish(kind);S.straw=newStraw();served=true;
    }else{
      if(s.plate<0)leave(s);
      if(s.plate>=0){const p=S.plates[s.plate];p.dish={kind:s.state,amount:s.amount,fine:s.fine};setBites(p);p.assigned=null;p.pop=1;madeDish(s.state);S.straw=newStraw();served=true;}
    }
  }
  if(served){SND.ding();S.supplyPop=1;}
  if(S.phase==='cook'&&!S.spinPending&&S.plates.every(p=>p.dish&&!p.away)){S.spinPending=true;later(0.9,()=>{S.spinPending=false;if(S.phase==='cook'&&S.plates.every(p=>p.dish))startSpin('dine');});}
}
function startSpin(to){

function runOf(i){let a=i,b=i;while(a-1>=0&&S.slots[a-1].rest&&!S.slots[a-1].tool)a--;while(b+1<NS&&S.slots[b+1].rest&&!S.slots[b+1].tool)b++;const r=[];for(let k=a;k<=b;k++)r.push(k);return r;}

function dishColor(d){if(d.kind==='pancake')return d.top==='cream'?P.pink:d.top?P.red:(d.done>=3?P.orange2:d.done>=2?P.orange:P.yellow);return d.kind==='cream'?P.pink:d.kind==='roastChop'?P.orange2:P.red;}
function computeWish(g){
  const fams=['pan','jam','chop'].filter(f=>S.dishLog.some(k=>fam(k)===f)||(S.made&&Object.keys(S.made).some(k=>fam(k)===f&&S.made[k]>0)));

  const cur=S.plates.map(p=>p.seat);let best=cur,bs=score(cur);

function computeHint(){
  if(S.phase==='spin')return null;

  const st=S.stk;const tp=t=>L.tray[st[t].tray];
  if(S.phase==='cook'){
    if(st.pan.slot<0)return trayHint('pan',nearestFree(tp('pan')));
    if(st.board.slot<0)return trayHint('board',freeBefore(st.pan.slot,tp('board')));
    if(st.whisk.slot<0)return trayHint('whisk',freeBefore(st.pan.slot,tp('whisk')));

    const LM=S.lineMade;
    if(LM.jam&&!LM.roastChop&&bBefore)return{kind:'swap',tool:'board',slot:st.pan.slot};
    if(LM.roastChop&&!LM.jam&&!bBefore)return{kind:'swap',tool:'board',slot:st.pan.slot};
    if(!LM.jam&&!LM.roastChop&&S.made.roastChop&&!bBefore&&S.disc.d1)return{kind:'swap',tool:'board',slot:st.pan.slot};
    if(st.kettle.slot<0&&(S.made.jam||S.disc.d1))return trayHint('kettle',freeAfter(st.pan.slot,tp('kettle')));

function dropSlot(x,y){let best=-1,bd=L.ring*TAU/NS*0.62;for(let i=0;i<NS;i++){const q=slotPos(i);const d=dist(q.x,q.y,x,y);if(d<bd){bd=d;best=i;}}return best;}

    if(!d||d.v!==1||!Array.isArray(d.pics)||!Array.isArray(d.guests))throw new Error('shape');
    S.pics=d.pics.filter(s=>typeof s==='string'&&s.indexOf('data:image/')===0&&s.length<600000).slice(0,3);
    d.guests.slice(0,3).forEach((gd,i)=>{if(gd&&Array.isArray(gd.ate))S.guests[i].ate=gd.ate.filter(validKind).slice(-16);if(gd&&typeof gd.last==='string'&&validKind(gd.last))S.guests[i].lastAte=gd.last;});
    if(d.made&&typeof d.made==='object')for(const k of ['pancake','jam','syrup','cream','roastChop'])if(Number.isFinite(d.made[k]))S.prevMade=(S.prevMade||0)+d.made[k];
    S.store='restored';
  }catch(e){S.store='corrupt';S.pics=[];for(const g of S.guests){g.ate=[];g.lastAte=null;}try{window.localStorage.removeItem(KEY);}catch(_){}}
  loadPicImgs();
}
function loadPicImgs(){S.picImgs=S.pics.map(src=>{const im=new Image();im.onerror=()=>{const k=S.pics.indexOf(src);if(k>=0){S.pics.splice(k,1);S.picImgs.splice(k,1);}};im.src=src;return im;});}
function persist(){
  const d={v:1,pics:S.pics.slice(0,3),guests:S.guests.map(g=>({ate:g.ate.slice(-16),last:g.lastAte||null})),made:S.made,cycle:S.cycle};
  try{window.localStorage.setItem(KEY,JSON.stringify(d));S.store='saved';return true;}
  catch(e){
    while(d.pics.length>0){d.pics.pop();try{window.localStorage.setItem(KEY,JSON.stringify(d));S.store='saved-trim';return true;}catch(_){}}
    S.store='save-failed';return false;
  }
}
function savePicture(){
  let url=null;

    S.noOverlay=true;draw();S.noOverlay=false;
    const k=Math.min(1,480/Math.max(cv.width,cv.height));const c=document.createElement('canvas');c.width=Math.round(cv.width*k);c.height=Math.round(cv.height*k);
    const g=c.getContext('2d');g.drawImage(cv,0,0,c.width,c.height);url=c.toDataURL('image/jpeg',0.72);
  }catch(e){url=null;}

function update(dt){
  S.time+=dt;const t=S.time;
  for(let i=0;i<S.ev.length;i++){if(S.ev[i].t<=t){const e=S.ev.splice(i,1)[0];i--;e.fn();}}
  if(S.phase==='spin'){S.spinT+=dt/1.9;S.tableAng=ease(clamp(S.spinT,0,1))*TAU;if(S.spinT>=1)finishSpin();}
  else{
    const prev=S.phi;S.phi+=dt/PERIOD;
    for(let i=0;i<NS;i++){const f=(i+.5)/NS;if(prev<f&&S.phi>=f)slotEvent(i);}
    if(S.phi>=1){S.phi-=1;serve();}
  }
  if(S.phase==='party')S.frameT+=dt;
  // hum: silent in a rest
  if(AC&&humGain){const sec=Math.floor(S.phi*NS)%NS;const target=S.phase==='spin'?0.02:(S.slots[sec].rest&&!S.slots[sec].tool?0:0.032);if(Math.abs(target-S.hum)>0.001){S.hum=target;humGain.gain.setTargetAtTime(target,AC.currentTime,0.06);}}
  if(S.batter.state==='pancake'&&S.batter.cookT<1)S.batter.cookT=Math.min(1,S.batter.cookT+dt/Math.max(0.2,S.batter.cookDur));
  if(S.heat&&S.time-S.heat.t0>S.heat.dur)S.heat=null;
  // stickers
  for(const tl of TOOLS){const st=S.stk[tl];
    if(!st.drag){const h=stickerHome(tl);const k=Math.min(1,dt*14);st.x+=(h.x-st.x)*k;st.y+=(h.y-st.y)*k;}
    st.bounce=Math.max(0,st.bounce-dt*2.5);st.press=st.drag?1:Math.max(0,st.press-dt*6);}
  // ingredients
  for(const ing of [S.straw,S.batter]){const q=ingPos(ing);if(ing.x==null){ing.x=q.x;ing.y=q.y;}const k=Math.min(1,dt*7);ing.x+=(q.x-ing.x)*k;ing.y+=(q.y-ing.y)*k;ing.hit=Math.max(0,ing.hit-dt*3);ing.pop=Math.max(0,ing.pop-dt*2);}
  S.supplyPop=Math.max(0,S.supplyPop-dt*2);for(const k in S.wobbles)S.wobbles[k]=Math.max(0,S.wobbles[k]-dt*2.5);
  // plates
  for(const p of S.plates){
    if(p.away){p.away.t+=dt;const k=ease(clamp(p.away.t/p.away.dur,0,1));p.x=lerp(p.away.fx,L.dirty.x,k);p.y=lerp(p.away.fy,L.dirty.y,k);}
    else{const h=plateHome(p);if(p.x==null){p.x=h.x;p.y=h.y;}const k=S.phase==='spin'?1:Math.min(1,dt*5);p.x+=(h.x-p.x)*k;p.y+=(h.y-p.y)*k;}
    p.pop=Math.max(0,p.pop-dt*2.2);p.wob=Math.max(0,p.wob-dt*3);}
  for(const s of S.slots)s.wob=Math.max(0,s.wob-dt*3);
  // flies
  for(let i=0;i<S.flies.length;i++){const f=S.flies[i];f.t+=dt;if(f.t>=f.dur){S.flies.splice(i,1);i--;if(f.onEnd)f.onEnd();}}
  // guests
  const h=hint();const hp=hintPoint(h);
  for(const g of S.guests)updGuest(g,dt,hp);
  // particles
  for(let i=0;i<S.parts.length;i++){const q=S.parts[i];q.t+=dt;if(q.t>=q.life){S.parts.splice(i,1);i--;continue;}
    if(q.type==='arc'){const k=q.t/q.life;q.x=lerp(q.x0,q.x1,k);q.y=lerp(q.y0,q.y1,k)-Math.sin(k*Math.PI)*q.h;}
    else{q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.type!=='steam'&&q.type!=='ring')q.vy+=260*L.u*dt;q.rot=(q.rot||0)+dt*4;}}
  for(let i=0;i<S.trail.length;i++){if(S.time-S.trail[i].t>0.6){S.trail.splice(i,1);i--;}}
  S.flash=Math.max(0,S.flash-dt*2);
  // idle demo
  if(!act&&S.phase!=='spin'&&!S.demo&&!S.demoShown&&S.time-S.lastInput>4&&h){
    const a=hintPoint(h),b=hintDest(h);if(a&&b){S.demo={t:0,dur:2.2,a:{x:a.x,y:a.y},b:{x:b.x,y:b.y},tool:h.tool||null,kind:h.kind};S.demoShown=true;}}
  if(S.demo){S.demo.t+=dt;if(S.demo.t>S.demo.dur)S.demo=null;}
  // fade smear slowly
  while(S.smears.length&&S.time-S.smears[0].t>40)S.smears.shift();
}
function updGuest(g,dt,hp){
  const hm=guestHome(g);if(g.x==null){g.x=hm.x;g.y=hm.y;}const k=S.phase==='spin'?1:Math.min(1,dt*4);g.x+=(hm.x-g.x)*k;g.y+=(hm.y-g.y)*k;
  g.chew=Math.max(0,g.chew-dt);g.happy=Math.max(0,g.happy-dt);g.giggle=Math.max(0,g.giggle-dt*2);
  if(g.wish==null)computeWish(g);
  // look target
  let look=hp||{x:L.cx,y:L.cy};
  if(g.anim&&g.anim.tx!=null)look={x:g.anim.tx,y:g.anim.ty};
  else if(isDining()&&S.phase!=='party'&&!plateOf(g.i)){look=wishTarget(g);}
  else if(isDining()&&Math.sin(S.time*0.7+g.i*2)>0.6){look=wishTarget(g);}
  g.lx+=(look.x-g.lx)*Math.min(1,dt*6);g.ly+=(look.y-g.ly)*Math.min(1,dt*6);
  // anim
  const rest=[handRest(g,0),handRest(g,1)];
  const beat=Math.exp(-((S.phi*NS)%1)*6);
  let hd=[{x:rest[0].x,y:rest[0].y-beat*3*L.u},{x:rest[1].x,y:rest[1].y-beat*3*L.u}];
  const mouth={x:g.x,y:g.y+6*L.u};
  if(g.anim){const a=g.anim;a.t+=dt;const p=clamp(a.t/a.dur,0,1);const hi=a.hand||0;const r=rest[hi];
    if(a.type==='bite'||a.type==='sip'){
      const tgt={x:a.tx,y:a.ty};if(a.plate!=null&&S.plates[a.plate]){tgt.x=S.plates[a.plate].x;tgt.y=S.plates[a.plate].y;}
      if(p<0.45){const e=ease(p/0.45);hd[hi]={x:lerp(r.x,tgt.x,e),y:lerp(r.y,tgt.y,e)};}
      else{if(!a.fired){a.fired=true;if(a.type==='bite')applyBite(g,a);else{g.cup=Math.max(0,g.cup-0.35);g.hold={col:P.tea};SND.sip();g.chew=0.4;}}
        if(p<0.8){const e=ease((p-0.45)/0.35);hd[hi]={x:lerp(tgt.x,mouth.x,e),y:lerp(tgt.y,mouth.y,e)};}
        else{const e=ease((p-0.8)/0.2);hd[hi]={x:lerp(mouth.x,r.x,e),y:lerp(mouth.y,r.y,e)};if(e>0.3)g.hold=null;}}
    }else if(a.type==='point'){const e=p<0.3?ease(p/0.3):p>0.75?1-ease((p-0.75)/0.25):1;const tx=lerp(r.x,a.tx,0.55),ty=lerp(r.y,a.ty,0.55);hd[hi]={x:lerp(r.x,tx,e)+Math.sin(S.time*14)*2*L.u*e,y:lerp(r.y,ty,e)};}
    else if(a.type==='carry'||a.type==='pass'){const pl=S.plates[a.plate];const e=p<0.25?ease(p/0.25):p>0.8?1-ease((p-0.8)/0.2):1;hd[hi]={x:lerp(r.x,pl.x,e),y:lerp(r.y,pl.y,e)};}
    else if(a.type==='cheer'){const e=Math.sin(p*Math.PI);hd[0]={x:lerp(rest[0].x,g.x-44*L.u,e),y:lerp(rest[0].y,g.y-24*L.u,e)};hd[1]={x:lerp(rest[1].x,g.x+44*L.u,e),y:lerp(rest[1].y,g.y-24*L.u,e)};}
    if(a.t>=a.dur){if(a.type==='bite'&&!a.fired)applyBite(g,a);g.anim=null;g.hold=null;}
  }else if(isDining()&&S.phase==='dine'){
    g.nextPoint-=dt;if(g.nextPoint<=0){g.nextPoint=5+Math.random()*4;const mine=plateOf(g.i);if(!mine||plateFam(mine)!==g.wish){const t=wishTarget(g);g.anim={type:'point',t:0,dur:1.3,tx:t.x,ty:t.y,hand:handSide(g,t)};}}
  }
  for(let i=0;i<2;i++){const kk=Math.min(1,dt*18);g.hand[i].x+=(hd[i].x-g.hand[i].x)*kk;g.hand[i].y+=(hd[i].y-g.hand[i].y)*kk;}
}

function berry(x,y,r,seed,roast){

  ctx.beginPath();ctx.moveTo(x,y+r*1.05);ctx.bezierCurveTo(x-r*1.25,y+r*0.2,x-r*0.95,y-r*0.95,x,y-r*0.7);ctx.bezierCurveTo(x+r*0.95,y-r*0.95,x+r*1.25,y+r*0.2,x,y+r*1.05);ctx.closePath();

  if(roast){ctx.globalAlpha=0.65;cblob(x,y+r*0.1,r*0.75,r*0.6,seed,P.orange2,null,0,0.2);ctx.globalAlpha=1;}
  ctx.fillStyle=roast?C.orange:C.yellow;for(let i=0;i<4;i++){const a=hs(seed+i)*TAU;circ(x+Math.cos(a)*r*0.45,y+Math.sin(a)*r*0.4+r*0.1,1.4*u);ctx.fill();}

  if(roast){ctx.globalAlpha=0.8;ctx.strokeStyle='#ffffff';ctx.lineWidth=1.8*u;ctx.beginPath();ctx.arc(x-r*0.3,y-r*0.1,r*0.3,3.6,4.4);ctx.stroke();ctx.globalAlpha=1;}
}

    cblob(0,0,w*0.56,hh*0.6,800+i,P.orange,C.ink,3*u,0.05);
    try{if(im.complete&&im.naturalWidth>0)ctx.drawImage(im,-w*0.45,-hh*0.45,w*0.9,hh*0.9);}catch(e){}
    ctx.restore();}
  // guest bodies

  ctx.save();ctx.translate(L.cx,L.cy);ctx.rotate(ang);ctx.translate(-L.cx,-L.cy);

  drawBasket(L.supS.x,L.supS.y+0.02*R);drawBowl(L.supB.x,L.supB.y,S.batter.plate<0&&S.batter.state!=='pancake'?S.batter:{state:'empty',hit:0});

  drawLine();

  for(const g of S.guests)drawCup(g);

  for(const g of S.guests)drawGuestHead(g);
  for(const g of S.guests)drawGuestHands(g);

  for(const t of TOOLS){const st=S.stk[t];if(st.drag){if(act&&act.moved){const d=dropSlot(st.x,st.y);if(d>=0){const q=slotPos(d);ctx.globalAlpha=0.6;ctx.strokeStyle=C.yellow;ctx.lineWidth=4*u;circ(q.x,q.y,L.sr*1.15);ctx.stroke();ctx.globalAlpha=1;}}drawSticker(t);}}

    cblob(fb.x,fb.y-b,fb.r,fb.r*0.82,901,P.orange,C.ink,4*u,0.05);
    cblob(fb.x,fb.y-b,fb.r*0.7,fb.r*0.55,902,C.navy,null,0,0.04);
    cblob(fb.x,fb.y-b+2*u,fb.r*0.38,fb.r*0.3,903,P.white,C.yellow,2*u,0.05);

function drawStickerWithHint(t,h){

  ctx.save();ctx.translate(hx,hy);ctx.rotate(-0.35);
  rrect(-5*u,-22*u,10*u,26*u,5*u);ctx.fillStyle=P.skin;ctx.fill();ctx.strokeStyle=C.ink;ctx.lineWidth=3*u;ctx.stroke();
  cblob(2*u,10*u,14*u,13*u,990,P.skin,C.ink,3*u,0.08);
  ctx.restore();ctx.globalAlpha=1;
}

// =====================================================================
//  loop, visibility, resize
// =====================================================================
let raf=0,last=0,SPEED=1;const DBG={noGrain:false,noSmear:false,noBg:false};
function frame(ts){
  raf=requestAnimationFrame(frame);
  let dt=(ts-last)/1000;last=ts;if(!(dt>0))dt=0;if(dt>0.1)dt=0.1;
  let total=dt*SPEED;while(total>0){const s=Math.min(0.05,total);update(s);total-=s;}
  draw();
}
function start(){cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(frame);}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){cancelAnimationFrame(raf);raf=0;if(AC&&AC.state==='running')AC.suspend();persist();if(act){const st=S.stk[act.tool];st.drag=false;act=null;}}
  else{if(AC&&S.started)AC.resume();start();}
});
window.addEventListener('pagehide',()=>persist());
let rsT=0;
window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(layout,60);});
window.addEventListener('orientationchange',()=>{setTimeout(layout,200);});
for(const ev of ['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick'])document.addEventListener(ev,e=>{if(e.cancelable)e.preventDefault();},{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());

loadStore();
layout();
for(const g of S.guests)computeWish(g);
start();

// debug / test hook (no UI)
window.__gf={_draw:()=>draw(),_flags:DBG,S,hint:()=>hint(),slotPos,setSpeed:v=>{SPEED=v;},L:()=>L,persist,savePicture,stickerPos:t=>({x:S.stk[t].x,y:S.stk[t].y}),trayPos:t=>L.tray[S.stk[t].tray]};
})();
</script>
