// =====================================================================
//  Crayon drawing helpers
// =====================================================================
var GRAIN = document.createElement('canvas');
(function(){
  GRAIN.width = GRAIN.height = 96; var g = GRAIN.getContext('2d'); seed = 99;
  for (var i = 0; i < 520; i++) { g.fillStyle = 'rgba(0,0,0,' + sr(0.35, 1).toFixed(2) + ')';
    g.beginPath(); g.ellipse(sr(0, 96), sr(0, 96), sr(0.4, 1.6), sr(0.3, 0.9), sr(0, 3), 0, TAU); g.fill(); }
})();

  for (var i = 0; i < n; i++) { var a = i / n * TAU, r = 1 + sr(-j, j), x = Math.cos(a) * rx * r, y = Math.sin(a) * ry * r;
    if (rot) { var c = Math.cos(rot), s = Math.sin(rot), x2 = x * c - y * s; y = x * s + y * c; x = x2; }
    pts.push([cx + x, cy + y]); }

}

//  Invite (one thing at a time) & demo hand
// =====================================================================
function trayInv(tool){ return { t: 'tray', i: TOOLS.indexOf(tool) }; }

  if (S.phase === 'cook') {
    if (!S.ever.pan) return trayInv('pan');

    if (!S.ever.whisk) return trayInv('whisk');
    if (!S.disc.d2) return beforeInv('whisk', 'cake');
    if (!S.ever.kettle) return trayInv('kettle');
    if (!S.disc.d2b && S.cook.some(function(p){ return p.done && p.food && (p.food.k === 'cake' || p.food.k === 'crepe') && !p.food.top; })) return beforeInv('board', 'jam');
    if (!S.disc.d6 && slotsOf('board').length && slotsOf('pan').length) return { t: 'slot', i: slotsOf('board')[0], mode: 'move', to: slotsOf('pan')[0] };
    if (!tools) return trayInv('pan');

    return { t: 'slot', i: S.slots.findIndex(function(s){ return s.tool; }), mode: 'tap' };
  }

  var toolIdx = []; S.slots.forEach(function(s, i){ if (s.tool) toolIdx.push(i); });

  if (hungry.length && toolIdx.length) {

      var isSep = function(i){ return !S.slots[(i + 1) % NS].rest && !S.slots[(i + NS - 1) % NS].rest; };
      var rg = restIdx.map(function(i){ return nearestGuests(slotAng(i) - S.rot)[0].i; });
      for (var h = 0; h < hungry.length; h++) { if (rg.indexOf(hungry[h].i) >= 0) continue; var c1 = nearestTo(hungry[h], isSep); if (c1 >= 0) return { t: 'slot', i: c1, mode: 'peel' }; }
      var c2 = toolIdx.filter(isSep)[0]; if (c2 != null) return { t: 'slot', i: c2, mode: 'peel' };
    }

      var adj = toolIdx.filter(function(i){ return S.slots[(i + 1) % NS].rest || S.slots[(i + NS - 1) % NS].rest; });

  if (!S.disc.d2b && S.guests.some(function(g){ return hasFood(g) && (g.plate.food.k === 'cake' || g.plate.food.k === 'crepe') && !g.plate.food.top; })) { var bi = beforeInv('board', 'jam'); if (bi) return bi; }
  if (waiting.length && !(S.center && S.center.done) || toolIdx.length < 2) {

    if (!slotsOf(want).length && nextSlot() >= 0) return trayInv(want);
    for (var q = 0; q < 4; q++) if (!slotsOf(TOOLS[q]).length && nextSlot() >= 0) return trayInv(TOOLS[q]);
    if (restIdx.length && nextSlot() >= 0) return trayInv(want);

}
