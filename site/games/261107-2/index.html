// ---------- palette: grout + 7 tile colors
const PAL={grout:'#2b221d',verm:'#d94a2c',indigo:'#2b3d78',lblue:'#86c8e2',ochre:'#cf9a38',white:'#f3ede1',peach:'#ecb58f',night:'#19213f'};
const COLS=['verm','indigo','lblue','ochre','white','peach','night'];

// ---------- utils
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const easeOutBack=t=>{t=clamp(t,0,1);const c1=1.6,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function hex2rgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function shadeStr(rgb,f){return 'rgb('+(clamp(rgb[0]*f,0,255)|0)+','+(clamp(rgb[1]*f,0,255)|0)+','+(clamp(rgb[2]*f,0,255)|0)+')';}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function shrinkPoly(p,g){let cx=0,cy=0;for(const q of p){cx+=q[0];cy+=q[1];}cx/=p.length;cy/=p.length;return p.map(q=>{const dx=q[0]-cx,dy=q[1]-cy,d=Math.hypot(dx,dy)||1;const f=Math.max(0,1-g/d);return[cx+dx*f,cy+dy*f];});}
function polyLen(p){let s=0;for(let i=0;i<p.length-1;i++)s+=Math.hypot(p[i+1].x-p[i].x,p[i+1].y-p[i].y);return s||1;}
function along(p,t){
  const total=polyLen(p);let d=clamp(t,0,1)*total;
  for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1];const l=Math.hypot(b.x-a.x,b.y-a.y);
    if(d<=l||i===p.length-2){const u=l>0?clamp(d/l,0,1):1;return{x:a.x+(b.x-a.x)*u,y:a.y+(b.y-a.y)*u,u,f:a,dx:b.x-a.x,dy:b.y-a.y,len:l};}
    d-=l;}
  return{x:p[0].x,y:p[0].y,u:0,f:{},dx:0,dy:0,len:0};
}
function flagsOf(p){const o={};if(p.h)o.h=1;if(p.m)o.m=1;if(p.c)o.c=1;if(p.tp)o.tp=1;return o;}
function backPath(P,pt){
  let best=0,bd=1e9;
  for(let i=0;i<P.length-1;i++){const a=P[i],b=P[i+1];const dx=b.x-a.x,dy=b.y-a.y;const l2=dx*dx+dy*dy||1;
    const u=clamp(((pt.x-a.x)*dx+(pt.y-a.y)*dy)/l2,0,1);const d=dist(pt.x,pt.y,a.x+dx*u,a.y+dy*u);if(d<bd){bd=d;best=i;}}
  const out=[Object.assign({x:pt.x,y:pt.y},flagsOf(P[best]))];
  for(let i=best;i>=0;i--){out.push(Object.assign({x:P[i].x,y:P[i].y},i>0?flagsOf(P[i-1]):{}));}
  return out;
}

}

// ---------- mosaic patterns
let PW={},PF={};
const canSetT=(typeof DOMMatrix!=='undefined');
function makePattern(hex,cell,seed,k){
  const n=6,size=n*cell;const kk=canSetT?k:1;
  const px=Math.max(8,Math.min(1024,Math.ceil(size*kk)));
  const pc=document.createElement('canvas');pc.width=pc.height=px;
  const c=pc.getContext('2d');c.scale(px/size,px/size);
  c.fillStyle=PAL.grout;c.fillRect(0,0,size,size);
  const R=rng(seed);const jx=[],jy=[];
  for(let i=0;i<n;i++){jx.push([]);jy.push([]);for(let j=0;j<n;j++){jx[i].push((R()-0.5)*0.64*cell);jy[i].push((R()-0.5)*0.64*cell);}}
  const V=(i,j)=>{const a=((i%n)+n)%n,b=((j%n)+n)%n;return[i*cell+jx[a][b],j*cell+jy[a][b]];};
  const gap=Math.max(0.55,cell*0.1);const polys=[];
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){
    const a=V(i,j),b=V(i+1,j),d=V(i+1,j+1),e=V(i,j+1);const r=R();
    if(r<0.22){polys.push([a,b,d]);polys.push([a,d,e]);}
    else if(r<0.42){polys.push([a,b,e]);polys.push([b,d,e]);}
    else if(r<0.55){const m=[(a[0]+b[0])/2,(a[1]+b[1])/2+(R()-0.5)*cell*0.25];polys.push([a,m,b,d,e]);}
    else polys.push([a,b,d,e]);
  }
  const base=hex2rgb(hex);
  for(const p of polys){const sp=shrinkPoly(p,gap/2);c.fillStyle=shadeStr(base,1+(R()-0.5)*0.11);
    for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){c.beginPath();for(let q=0;q<sp.length;q++){const X=sp[q][0]+ox*size,Y=sp[q][1]+oy*size;if(q)c.lineTo(X,Y);else c.moveTo(X,Y);}c.closePath();c.fill();}}
  const pat=ctx.createPattern(pc,'repeat');
  if(canSetT&&pat.setTransform){try{pat.setTransform(new DOMMatrix([size/px,0,0,size/px,0,0]));}catch(e){}}
  return pat;
}
function buildPatterns(){
  const k=VIEW.k,H=L.H;let sd=11;PW={};PF={};
  for(const nm of COLS){
    PW[nm]={m:makePattern(PAL[nm],H*0.075,sd++,k),l:makePattern(PAL[nm],H*0.13,sd++,k)};
    PF[nm]=makePattern(PAL[nm],5.2,sd++,k*H/100);
  }
}
function shp(g,fn,pat,ow,oc){g.beginPath();fn(g);g.fillStyle=pat;g.fill();if(ow){g.lineWidth=ow;g.strokeStyle=oc||PAL.grout;g.stroke();}}

// small irregular shard shapes (unit size)
const SH=[];(function(){const R=rng(99);for(let i=0;i<8;i++){const n=R()<0.5?4:5;const p=[];for(let j=0;j<n;j++){const a=j/n*Math.PI*2+(R()-0.5)*0.5;const r=0.38+R()*0.16;p.push([Math.cos(a)*r,Math.sin(a)*r*0.8]);}SH.push(p);}})();
function shardPath(c,k){const p=SH[k%SH.length];c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)c.lineTo(p[i][0],p[i][1]);c.closePath();}

};

const ACTORS=[crewR,crewL,girl];

// ---------- fires
const FIRE_N=13;
function makeFireShards(seed){
  const R=rng(seed);const cuts=[0,0.2,0.42,0.62,0.8,1];const cols=[4,3,3,2,1];
  const yc=cuts.map((c,i)=>(i>0&&i<5)?c+(R()-0.5)*0.05:c);
  const Wf=y=>0.52*Math.pow(Math.max(0,Math.sin(Math.PI*(0.12+0.88*y))),0.7)*Math.pow(Math.max(0,1-y),0.5);
  const out=[];
  for(let b=0;b<5;b++){
    const y0=yc[b],y1=yc[b+1],n=cols[b];const f0=[0],f1=[0];
    for(let i=1;i<n;i++){const f=i/n+(R()-0.5)*0.12;f0.push(f+(R()-0.5)*0.06);f1.push(f+(R()-0.5)*0.06);}
    f0.push(1);f1.push(1);
    const X=(f,y)=>-Wf(y)+f*2*Wf(y);const ym=(y0+y1)/2;
    for(let i=0;i<n;i++){
      const poly=[[X(f0[i],y0),y0],[X(f0[i+1],y0),y0]];
      if(i===n-1)poly.push([X(1,ym),ym]);
      poly.push([X(f1[i+1],y1),y1]);if(b<4)poly.push([X(f1[i],y1),y1]);
      if(i===0)poly.push([X(0,ym),ym]);
      let cx=0,cy=0;for(const q of poly){cx+=q[0];cy+=q[1];}cx/=poly.length;cy/=poly.length;
      const r=Math.abs(cx)/Math.max(0.05,Wf(cy));
      let col='verm';if(b<=1&&r<0.38)col='white';else if(b<=2&&r<0.72)col='ochre';else if(b===3&&r<0.3)col='ochre';
      out.push({poly,cx,cy,col});
    }
  }
  out.sort((a,b)=>(b.cy-a.cy)||(Math.abs(b.cx)-Math.abs(a.cx)));
  return out;
}
function newFire(side,seed){return{side,health:1,out:false,lit:side!=='G',shards:makeFireShards(seed),hv:1,seed:seed*0.37,hitThisPress:false,pressVis:FIRE_N,wob:0,outT:0};}
function visCount(f){return f.health<=0?0:Math.ceil(f.health*FIRE_N-1e-6);}

function fireBase(f){
  if(f.side==='L')return{x:L.fireLx,y:L.scaf.top-L.H*0.1};
  if(f.side==='R')return{x:L.fireRx,y:L.balY-L.H*0.1};
  const ln=lanFor();return{x:ln.x,y:ln.y-L.H*0.04};
}
function fireSize(f){return(f.side==='G'?0.32:0.46)*L.H;}
function fireCenter(f){const b=fireBase(f);return{x:b.x,y:b.y-fireSize(f)*0.42*(0.55+0.45*f.hv)};}
function burning(f){return f&&f.lit&&!f.out;}

// ---------- audio (Web Audio synth)
const AU={ctx:null,master:null,noise:null,spray:null};
function audioInit(){
  try{
    if(!AU.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      const c=new AC();AU.ctx=c;
      const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.connect(c.destination);
      AU.master=c.createGain();AU.master.gain.value=0.8;AU.master.connect(comp);
      const len=Math.floor(c.sampleRate*1.5);const b=c.createBuffer(1,len,c.sampleRate);const d=b.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noise=b;
      const s=c.createBufferSource();s.buffer=c.createBuffer(1,1,22050);s.connect(c.destination);s.start(0);
    }
    if(AU.ctx.state==='suspended'&&!document.hidden)AU.ctx.resume();
  }catch(e){}
}
function tone(f,d,o){o=o||{};const c=AU.ctx;if(!c||!AU.master)return;try{
  const t=c.currentTime+(o.at||0);const osc=c.createOscillator();osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,t);
  if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,t+d*(o.toT||1));
  const g=c.createGain();const v=o.v||0.18;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.a||0.006));g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  osc.connect(g);g.connect(AU.master);osc.start(t);osc.stop(t+d+0.03);}catch(e){}}
function nz(d,o){o=o||{};const c=AU.ctx;if(!c||!AU.noise)return;try{
  const t=c.currentTime+(o.at||0);const s=c.createBufferSource();s.buffer=AU.noise;
  const fl=c.createBiquadFilter();fl.type=o.type||'bandpass';fl.frequency.setValueAtTime(o.f||1200,t);if(o.to)fl.frequency.exponentialRampToValueAtTime(o.to,t+d);fl.Q.value=o.q||1;
  const g=c.createGain();const v=o.v||0.15;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.a||0.004));g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(fl);fl.connect(g);g.connect(AU.master);s.start(t,Math.random()*0.8);s.stop(t+d+0.03);}catch(e){}}
const PENTA=[0,2,4,7,9,12,14,16,19,21,24,26,28,31];
function sfx(n,arg){
  if(!AU.ctx)return;
  switch(n){
    case 'press':tone(240,0.12,{to:360,v:0.16,type:'triangle'});nz(0.14,{f:2600,q:0.7,v:0.16});break;
    case 'release':tone(300,0.28,{to:150,v:0.14,type:'sine'});tone(420,0.14,{to:260,v:0.06,type:'triangle',at:0.05});break;
    case 'shard':{const k=PENTA[clamp(arg|0,0,PENTA.length-1)];const f=620*Math.pow(2,k/12);tone(f,0.16,{v:0.12,type:'triangle'});tone(f*2.01,0.08,{v:0.04});break;}
    case 'out':[784,988,1175,1568].forEach((f,i)=>{tone(f,0.32,{v:0.13,type:'triangle',at:i*0.07});tone(f*2,0.2,{v:0.04,at:i*0.07});});nz(0.4,{f:3000,q:0.5,v:0.05,to:6000});break;
    case 'step':nz(0.05,{type:'lowpass',f:700,v:0.08});tone(110+Math.random()*30,0.05,{v:0.06});break;
    case 'katan':tone(980,0.06,{v:0.16,type:'square',to:700});nz(0.05,{f:2200,q:2,v:0.12});tone(520,0.12,{v:0.17,type:'triangle',at:0.1,to:380});nz(0.07,{f:1200,q:2,v:0.12,at:0.1});break;
    case 'unroll':nz(0.35,{type:'lowpass',f:500,to:1800,v:0.14});break;
    case 'swing':nz(0.4,{f:600,to:1600,q:1.5,v:0.08});break;
    case 'pick':tone(500,0.12,{to:820,v:0.1,type:'sine'});break;
    case 'connect':[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.3,{v:0.12,type:'triangle',at:0.15+i*0.08}));break;
    case 'handover':tone(392,0.15,{v:0.14,type:'triangle'});tone(587,0.22,{v:0.14,type:'triangle',at:0.12});tone(784,0.3,{v:0.12,type:'sine',at:0.24});break;

function defaultAim(){

// ---------- input
function toWorld(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-VIEW.offX)/VIEW.scale,y:(e.clientY-r.top-VIEW.offY)/VIEW.scale};}
function opMoving(){const o=S.operator;if(!o)return true;const st=o.steps[0];return!!(st&&st.type==='move'&&o!==girl);}

  if(Math.abs(w.x-o.p.x)<L.H*0.32&&w.y>o.p.y-L.H*1.05&&w.y<o.p.y+L.H*0.06)return true;

function onDown(e){

    S.pointerId=e.pointerId;try{if(cv.setPointerCapture&&e.pointerType!=='fake')cv.setPointerCapture(e.pointerId);}catch(er){}

  }else poke(w);
}
function onMove(e){if(e.pointerId!==S.pointerId)return;if(e.cancelable)e.preventDefault();const w=toWorld(e);
  const g=2.4;S.aimRaw={x:clamp(S.aimStart.x+(w.x-S.fingerStart.x)*g,-L.H*0.5,L.WW+L.H*0.5),y:clamp(S.aimStart.y+(w.y-S.fingerStart.y)*g,-L.H*0.2,L.G+L.H*0.4)};}
function onUp(e){if(e.pointerId!==S.pointerId)return;endSpray();}
function startSpray(w){
  if(!S.pressAt)S.pressAt=performance.now();
  S.spraying=true;S.fingerStart=w;S.aimStart={x:S.aimRaw.x,y:S.aimRaw.y};S.pressT=0;
  S.pressure=Math.max(S.pressure,0.6);S.head=Math.max(0.45,S.tail<1?S.head:0.45);S.tail=0;
  for(const k in FIRES){const f=FIRES[k];if(f){f.hitThisPress=false;f.pressVis=visCount(f);}}
  S.discover.firstPress=true;
  {const a=assist(S.aimRaw),H=L.H;for(let i=0;i<9;i++)addP({t:'drop',x:a.x,y:a.y,vx:(Math.random()-0.5)*H*1.8,vy:-H*(0.4+Math.random()*0.9),life:0,max:0.6,s:H*0.045,col:i%2?'white':'lblue',k:i,rot:0,vr:4,g:H*4});
   for(const k in FIRES){const f=FIRES[k];if(burning(f)&&dist(a.x,a.y,fireCenter(f).x,fireCenter(f).y)<H*0.5)f.wob=0.8;}}
  sfx('press');sprayOn();
}
function endSpray(){

    const before=visCount(f);f.health=(f.pressVis-1)/FIRE_N;sinkShards(f,before,visCount(f));if(f.health<=0.0001){f.health=0;fireOut(f);}}}
  for(const k in FIRES){const f=FIRES[k];if(f&&burning(f)&&f.hitThisPress&&f.health<1)S.discover.partial=true;}
  sprayOff();sfx('release');S.spr.v-=6;

  const n=nozzleAt();for(let i=0;i<6;i++){const u=Math.random();addP({t:'drop',x:lerp(n.x,S.aim.x,u),y:lerp(n.y,S.aim.y,u)-L.H*0.2*Math.sin(u*Math.PI),vx:(Math.random()-0.5)*30,vy:Math.random()*40,life:0,max:0.8,s:L.H*0.035,col:i%2?'white':'lblue',k:i,rot:0,vr:2,g:L.H*3});}
  // gently turn toward the next burning target
  const tg=aimTargets();let onT=false;for(const c of tg)if(dist(S.aim.x,S.aim.y,c.x,c.y)<L.H*0.6)onT=true;
  if(!onT&&tg.length)S.aimTurn={from:{x:S.aimRaw.x,y:S.aimRaw.y},to:defaultAim(),t:0};
}
function poke(w){

// ---------- spray simulation

    if(SINKS.length>=SMAX)SINKS.shift();SINKS.push({poly:sh.poly,col:sh.col,x:b.x,y:b.y,s:sz,t:0,r:(Math.random()-0.5)*1.2});
    sfx('shard',FIRE_N-v);}
}
function fireOut(f){

    const a=f.side==='L'?crewL:crewR;a.rescued=true;

}
function burstAt(p,col,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=L.H*(0.6+Math.random()*0.8);
  addP({t:'spark',x:p.x,y:p.y-L.H*0.05,vx:Math.cos(a)*s,vy:Math.sin(a)*s-L.H*0.3,life:0,max:0.6+Math.random()*0.3,s:L.H*0.045,col:i%3===0?'white':col,k:i,rot:Math.random()*6,vr:6,g:L.H*2});}}

    if(S.phase==='A'&&k==='G')continue;

    if(d<hitR){
      f.hitThisPress=true;const before=visCount(f);

    if(Math.random()<dt*10)addP({t:'spark',x:ap.x+(Math.random()-0.5)*H*0.5,y:ap.y+(Math.random()-0.5)*H*0.3,vx:0,vy:-10,life:0,max:0.6,s:H*0.04,col:'white',k:1,rot:0,vr:3});

}

// ---------- actors update
function updateActor(a,dt){

  if(a.exprT>0){a.exprT-=dt;if(a.exprT<=0)a.expr='smile';}
  a.blinkT-=dt;if(a.blinkT<0){a.blink=0.13;a.blinkT=2.4+Math.random()*3;}if(a.blink>0)a.blink-=dt;
  let guard=0;a.moving=false;
  while(a.steps.length&&guard++<8){
    const st=a.steps[0];
    const go=st.always||!S.spraying;
    if(!go){a.paused=true;return;}
    a.paused=false;
    if(st.type==='move'){
      if(!st.init){st.init=true;st.t=0;st.from=a.restFn;}
      const pts=st.path(st);const sp=(st.speed||1)*L.walk;

      if(st.t>=1){st.t=1;const fn=st.path;const stt=st;a.restFn=()=>{const q=fn(stt);return q[q.length-1];};a.steps.shift();a.moving=false;continue;}

      if(!st.started){st.started=true;st.onStart&&st.onStart();}
      st.e+=dt;st.onUpdate&&st.onUpdate(Math.min(1,st.e/st.dur));
      if(st.e>=st.dur){a.steps.shift();st.onEnd&&st.onEnd();continue;}
      return;
    }else if(st.type==='wait'){if(st.cond()){a.steps.shift();continue;}return;}
    else if(st.type==='call'){a.steps.shift();st.fn();continue;}
    else if(st.type==='branch'){a.steps.shift();const ns=st.fn();a.steps.unshift(...ns);continue;}
    else a.steps.shift();
  }

function anyPending(){for(const a of ACTORS){const st=a.steps[0];if(!st)continue;if(st.type==='wait'&&!st.cond())continue;return true;}return false;}
function sagAt(x){
  const m=S.mat;let base=0;

function computeActors(){

      if(seg.h){pt.y-=Math.sin(Math.PI*r.u)*(H*0.22+Math.abs(r.dy)*0.25);}
      if(seg.m)a.onMat=true;
      if(seg.tp)a.alpha=0;

      else if(a.carry==='mat')pose='carry';else if(a.carry==='ladderH'||a.carry==='arch')pose='carryLow';
      else if(a.carry==='ladderV')pose='carryV';else if(a.carry==='hose')pose='holdWalk';else pose='walk';

function poseState(a,pose){

function handOfLocal(a,s){const H=L.H;const ang=s.armF;const lx=8+26*Math.sin(ang),ly=-57+26*Math.cos(ang);return{x:a.p.x+lx*a.face*H/100,y:a.p.y+(ly+s.bob)*H/100*s.squat};}

// ---------- update
let SPR={};
function update(dt){
  S.time+=dt;
  S.pressure+=((S.spraying?1:0)-S.pressure)*Math.min(1,dt*(S.spraying?30:9));
  S.spr.v+=(-S.spr.x*260-S.spr.v*8)*dt;S.spr.x+=S.spr.v*dt;
  if(S.spraying){S.head=Math.min(1,S.head+dt/0.07);S.tail=0;S.pressT+=dt;}
  else{S.tail=Math.min(1,S.tail+dt/0.16);if(S.tail>=1)S.head=0;}
  if(S.aimTurn&&!S.spraying){S.aimTurn.t+=dt/0.6;const k=ease(S.aimTurn.t);S.aimRaw={x:lerp(S.aimTurn.from.x,S.aimTurn.to.x,k),y:lerp(S.aimTurn.from.y,S.aimTurn.to.y,k)};if(S.aimTurn.t>=1)S.aimTurn=null;}
  else if(S.spraying)S.aimTurn=null;
  S.aim=assist(S.aimRaw);
  if(S.spraying&&canSpray())sprayUpdate(dt);
  else if(S.spraying&&!canSpray())endSpray();
  for(const a of ACTORS)updateActor(a,dt);
  computeActors();
  // footsteps
  for(const a of ACTORS){if(a.moving&&a.alpha>0.5&&a.pose!=='climb'){const k=Math.floor(a.walkPh/Math.PI);if(k!==a.stepPh){a.stepPh=k;if(S.time-S.lastStepSnd>0.11){S.lastStepSnd=S.time;sfx('step');}}}}
  for(const k in FIRES){const f=FIRES[k];if(!f)continue;f.hv+=(f.health-f.hv)*Math.min(1,dt*6);f.wob=Math.max(0,f.wob-dt*2.5);if(f.out)f.outT+=dt;}
  for(let i=SINKS.length-1;i>=0;i--){SINKS[i].t+=dt/0.6;if(SINKS[i].t>=1)SINKS.splice(i,1);}
  for(const nm in SPR){const sp=SPR[nm];if(sp&&sp.wob)sp.wob=Math.max(0,sp.wob-dt*2.5);}
  if(S.passDone)S.reveal=Math.min(1,S.reveal+dt*0.8);
  S.bellT=Math.max(0,S.bellT-dt*0.4);
  if(S.phase==='C'){S.celebT+=dt;
    if(S.celebT>1.4&&S.bowStage===0){S.bowStage=1;for(const a of ACTORS)a.idlePose='bow';sfx('yay');}
    if(S.celebT>2.2&&S.bowStage===1){S.bowStage=2;for(const a of ACTORS)a.idlePose='cheer';}
    if(S.celebT>3.2&&!S.trans){S.trans={t:0,did:false};sfx('whoosh');}}
  if(S.trans){S.trans.t+=dt;if(!S.trans.did&&S.trans.t>=0.75){resetCycle(false);S.trans.did=true;}if(S.trans.t>=1.5)S.trans=null;}
  if(highlightOn()&&!S.demo)S.idleT+=dt;
  if(!S.demoDone&&!S.demo&&S.idleT>4){S.demo={t:0};}
  if(S.demo){S.demo.t+=dt;if(S.demo.t>3.0||!canSpray()){S.demo=null;S.demoDone=true;}}
  for(let i=PARTS.length-1;i>=0;i--){const p=PARTS[i];p.life+=dt;if(p.life>=p.max){PARTS.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.g)p.vy+=p.g*dt;if(p.t==='steam'){p.vx*=0.98;p.s*=1+dt*0.6;}p.rot+=p.vr*dt;}
}

function buildTrans(){

  const J=[];for(let i=0;i<=nx;i++){J.push([]);for(let j=0;j<=ny;j++)J[i].push([(i===0||i===nx)?0:(R()-0.5)*cell*0.5,(j===0||j===ny)?0:(R()-0.5)*cell*0.5]);}
  const V=(i,j)=>[r.x0+i*cell+J[i][j][0],r.y0+j*cell+J[i][j][1]];
  for(let i=0;i<nx;i++)for(let j=0;j<ny;j++){const p=[V(i,j),V(i+1,j),V(i+1,j+1),V(i,j+1)];let cx=0,cy=0;for(const q of p){cx+=q[0];cy+=q[1];}cx/=4;cy/=4;

function drawPerson(a){
  if(a.alpha<0.02||!a.ps)return;
  const H=L.H,s=a.ps,lk=a.look,c=ctx;
  c.save();
  c.translate(a.p.x,a.p.y);

  c.scale(H/100*a.face,H/100*s.squat);c.translate(0,s.bob);
  const parts0=[],parts1=[];
  const P=(arr,g,x,y,r,fn,pat)=>arr.push({g,x,y,r,fn,pat});

  P(parts0,1,-8,-57,-s.armB,armPath,lk.coat);P(parts0,1,-8,-57,-s.armB,gloveP,lk.glove);
  P(parts0,0,-4.5,-30,-s.legB,legPath,lk.coat);P(parts0,0,-4.5,-30,-s.legB,bootPath,lk.boots);
  P(parts0,0,4.5,-30,-s.legF,legPath,lk.coat);P(parts0,0,4.5,-30,-s.legF,bootPath,lk.boots);

  if(lk.style==='bun')P(parts0,1,0,0,0,bunP,lk.hair);

  P(parts0,1,0,0,0,headPath,'peach');
  P(parts0,1,0,0,0,bangsP,lk.hair);
  P(parts0,1,0,0,0,helmPath,lk.helmet);P(parts0,1,0,0,0,brimPath,lk.helmet);
  P(parts1,1,8,-57,-s.armF,armPath,lk.coat);P(parts1,1,8,-57,-s.armF,gloveP,lk.glove);
  const up=s.upper;

    if(HAS_P2D){

        c.translate(pt.x,pt.y);if(pt.r)c.rotate(pt.r);

    c.beginPath();c.rect(-15.8,-35,31.6,3.6);c.fillStyle=PF[lk.stripe2];c.fill();c.stroke();
    // helmet badge
    c.beginPath();c.moveTo(0,-97);c.lineTo(5,-94);c.lineTo(4,-89);c.lineTo(0,-87);c.lineTo(-4,-89);c.lineTo(-5,-94);c.closePath();c.fillStyle=PF[lk.badge];c.fill();c.lineWidth=1.1;c.stroke();

  c.restore();
}

function drawTrans(){
  const tr=S.trans;if(!tr)return;const c=ctx,t=tr.t;
  if(Math.abs(t-0.75)<0.22){c.save();c.globalAlpha=clamp(1-Math.abs(t-0.75)/0.22,0,1);const r=worldRect();c.fillStyle=PAL.grout;c.fillRect(r.x0,r.y0,r.x1-r.x0,r.y1-r.y0);c.restore();}
  c.lineWidth=2;c.strokeStyle=PAL.grout;
  for(const q of TRANS){let s;if(t<0.75)s=ease((t-q.d)/0.35);else s=1-ease((t-0.75-q.d)/0.35);if(s<=0.01)continue;
    c.save();c.translate(q.cx,q.cy);c.scale(s*0.94,s*0.94);c.beginPath();c.moveTo(q.p[0][0],q.p[0][1]);for(let i=1;i<4;i++)c.lineTo(q.p[i][0],q.p[i][1]);c.closePath();c.fillStyle=PW[q.col].m;c.fill();c.lineWidth=2/s;c.stroke();c.restore();}
}

function render(){
  const c=ctx;
  c.setTransform(1,0,0,1,0,0);
  if(BG)c.drawImage(BG,0,0);
  c.setTransform(VIEW.k,0,0,VIEW.k,VIEW.offX*VIEW.dpr,VIEW.offY*VIEW.dpr);
  c.lineJoin='round';c.lineCap='round';
  const H=L.H,G=L.G;
  // twinkle stars
  for(const s of STARS){const a=0.5+0.5*Math.sin(S.time*2+s.ph);if(a<0.3)continue;c.save();c.globalAlpha=a;c.translate(s.x,s.y);c.rotate(S.time*0.3+s.ph);c.scale(s.s,s.s);c.beginPath();shardPath(c,3);c.fillStyle=PAL.white;c.fill();c.restore();}
  drawSprite(SPR.moon,L.moon.x,L.moon.y+L.moon.r);
  drawSprite(SPR.house,(L.house.x0+L.gap.x0)/2,G);
  drawDoor(L.doorGX,G,L.door.w,L.door.h,S.doorOpen&&S.shape!=='high');
  drawDoor(L.balDoorX,L.balY,L.bdoor.w,L.bdoor.h,S.doorOpen&&S.shape==='high');
  drawBell();
  // dim far side until the passage connects
  const dim=0.42*(1-S.reveal);
  if(dim>0.01){c.save();c.globalAlpha=dim;c.fillStyle=PAL.night;c.fillRect(L.ditch.x1-H*0.05,L.house.top-H*0.6,L.house.x1-L.ditch.x1+H*0.3,G-L.house.top+H*0.62);c.restore();}
  drawSprite(SPR.scaf,(L.scaf.x0+L.scaf.x1)/2,G);
  drawSprite(SPR.truck,(L.truck.x0+L.truck.x1)/2,L.truck.bot);
  if(S.arch.state==='store')drawArchNoz(L.archStore.x,G,1,-0.9,0.85);
  drawMat();
  drawLadderState(true);
  drawLadderState(false);
  if(S.arch.state==='placed')drawArchNoz(L.archBase.x,G,1,-0.95,1);
  drawPathLights();
  drawHose();
  // characters
  for(const a of ACTORS){
    drawPerson(a);
    if(a.alpha>0.5&&a.carry==='arch'){const h=handOf(a);drawArchNoz(h.x,h.y+H*0.08,a.face,-1.2,0.75);}
  }
  // re-draw nozzle over the holder so it reads in front
  for(const k of ['L','R','G'])if(FIRES[k])drawFire(FIRES[k]);
  drawSinks();
  drawWater();
  drawParts();
  if(highlightOn())drawHighlight();
  drawDemoHand();
  drawTrans();
}

// ---------- main loop & lifecycle
let running=false,raf=0,last=0;
function loop(now){
  if(!running)return;raf=requestAnimationFrame(loop);
  let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0;if(dt>0.05)dt=0.05;
  try{if(needLayout)relayout();const t0=performance.now();update(dt);render();const ms=performance.now()-t0;S.frameMs=S.frameMs?S.frameMs*0.95+ms*0.05:ms;
    if(S.pressAt&&S.pressShownMs===undefined&&S.head>0)S.pressShownMs=performance.now()-S.pressAt;}catch(e){if(!loop.err){loop.err=1;console.warn(e);}}
}
function pause(){if(!running)return;running=false;cancelAnimationFrame(raf);if(S.spraying)endSpray();sprayOff();try{if(AU.ctx&&AU.ctx.state==='running')AU.ctx.suspend();}catch(e){}}
function resume(){if(running)return;running=true;last=performance.now();try{if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();}catch(e){}raf=requestAnimationFrame(loop);}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();else resume();});
window.addEventListener('pagehide',pause);
window.addEventListener('pageshow',()=>{if(!document.hidden)resume();});

relayout();resetCycle(true);computeActors();
if(!document.hidden)resume();

// test/inspection hook (no UI)
window.__fr={S,FIRES,get L(){return L;},get VIEW(){return VIEW;},ACTORS,
  toScreen(p){return{x:p.x*VIEW.scale+VIEW.offX,y:p.y*VIEW.scale+VIEW.offY};},
  nozzle(){return this.toScreen(hoseEnd());},
  fire(k){return this.toScreen(fireCenter(FIRES[k]));},
  apex(){return this.toScreen(apexPt());},
  canSpray,highlightOn,anyPending,audio(){return AU.ctx?AU.ctx.state:'none';},get running(){return running;},
  snap(){return{phase:S.phase,cycle:S.cycle,order:S.order.slice(),coop:S.coop,mat:S.mat.state,ladder:S.ladder.state,shape:S.shape,
    hL:FIRES.L.health,hR:FIRES.R.health,hG:FIRES.G.health,gLit:FIRES.G.lit,operator:S.operator&&S.operator.name,opReady:S.opReady,
    spraying:S.spraying,head:S.head,pressure:S.pressure,arch:S.arch.state,archProg:S.archProg,locked:S.archLocked,
    taker:S.taker&&S.taker.name,pending:anyPending(),demo:!!S.demo,demoDone:S.demoDone,highlight:highlightOn(),
    actors:ACTORS.map(a=>({n:a.name,x:Math.round(a.p.x),y:Math.round(a.p.y),pose:a.pose,steps:a.steps.length,carry:a.carry,look:a.look===LOOK.c0?'c0':a.look===LOOK.c1?'c1':'girl'})),
    parts:PARTS.length,discover:Object.assign({},S.discover)};}};
})();
</script>
