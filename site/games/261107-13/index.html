'use strict';
(function(){
// ============================================================
//  world constants
// ============================================================
const W=1200,H=700;
const BG='#1d4e89',PAPER='#1f5290',WH='#ffffff',LB='#b3dfff';
const TAU=Math.PI*2;

const KEY='gf261107-13-blueprint-v1';

// ============================================================
//  math helpers
// ============================================================
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const easeBack=t=>{t=clamp(t,0,1);const c1=1.3,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
const mul=(a,k)=>[a[0]*k,a[1]*k];
const nrm=a=>{const l=Math.hypot(a[0],a[1])||1;return [a[0]/l,a[1]/l];};
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1];
const crs=(a,b)=>a[0]*b[1]-a[1]*b[0];
const perp=a=>[-a[1],a[0]];
const rotv=(a,t)=>{const c=Math.cos(t),s=Math.sin(t);return [a[0]*c-a[1]*s,a[0]*s+a[1]*c];};
const lerpv=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
function segNear(p,a,b){
  const abx=b[0]-a[0],aby=b[1]-a[1];const l2=abx*abx+aby*aby||1e-9;
  let t=((p[0]-a[0])*abx+(p[1]-a[1])*aby)/l2;t=clamp(t,0,1);
  const x=a[0]+abx*t,y=a[1]+aby*t;return {d:Math.hypot(p[0]-x,p[1]-y),pt:[x,y],t:t};
}
function pip(p,poly){
  let ins=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
    if(((yi>p[1])!==(yj>p[1]))&&(p[0]<(xj-xi)*(p[1]-yi)/(yj-yi)+xi))ins=!ins;
  }
  return ins;
}
function polyNear(p,poly,skip0){
  let best={d:1e9,pt:[0,0],i:0,t:0};
  for(let i=0;i<poly.length;i++){
    if(skip0&&i===0)continue;
    const r=segNear(p,poly[i],poly[(i+1)%poly.length]);
    if(r.d<best.d){best=r;best.i=i;}
  }
  return best;
}
function area(poly){let s=0;for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];s+=a[0]*b[1]-b[0]*a[1];}return s/2;}
function centroid(poly){
  let A=0,cx=0,cy=0;
  for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];const f=a[0]*b[1]-b[0]*a[1];A+=f;cx+=(a[0]+b[0])*f;cy+=(a[1]+b[1])*f;}
  if(Math.abs(A)<1e-6){let x=0,y=0;for(const q of poly){x+=q[0];y+=q[1];}return [x/poly.length,y/poly.length];}
  return [cx/(3*A),cy/(3*A)];
}
function segX(a,b,c,d){
  const d1=crs(sub(b,a),sub(c,a)),d2=crs(sub(b,a),sub(d,a)),d3=crs(sub(d,c),sub(a,c)),d4=crs(sub(d,c),sub(b,c));
  return (d1*d2<0)&&(d3*d4<0);
}
function overlap(A,B){
  for(const p of A)if(pip(p,B))return true;
  for(const p of B)if(pip(p,A))return true;
  for(let i=0;i<A.length;i++){const a=A[i],b=A[(i+1)%A.length];for(let j=0;j<B.length;j++){if(segX(a,b,B[j],B[(j+1)%B.length]))return true;}}
  return false;
}
function hull(pts){
  const P=pts.map(p=>[p[0],p[1]]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  if(P.length<3)return P;
  const lo=[],up=[];
  for(const p of P){while(lo.length>=2&&crs(sub(lo[lo.length-1],lo[lo.length-2]),sub(p,lo[lo.length-2]))<=0)lo.pop();lo.push(p);}
  for(let i=P.length-1;i>=0;i--){const p=P[i];while(up.length>=2&&crs(sub(up[up.length-1],up[up.length-2]),sub(p,up[up.length-2]))<=0)up.pop();up.push(p);}
  up.pop();lo.pop();return lo.concat(up);
}
function plen(pts){let L=0;for(let i=1;i<pts.length;i++)L+=dist(pts[i-1],pts[i]);return L;}
function resample(pts,step){
  if(pts.length<2)return pts.slice();
  const out=[pts[0]];let acc=0;let prev=pts[0];
  for(let i=1;i<pts.length;i++){
    let cur=pts[i];let d=dist(prev,cur);
    while(acc+d>=step){const t=(step-acc)/d;const q=lerpv(prev,cur,t);out.push(q);prev=q;d=dist(prev,cur);acc=0;}
    acc+=d;prev=cur;
  }
  if(dist(out[out.length-1],pts[pts.length-1])>1)out.push(pts[pts.length-1]);
  return out;
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function superEll(rx,ry,n,pw){const o=[];for(let i=0;i<n;i++){const a=i/n*TAU;const c=Math.cos(a),s=Math.sin(a);o.push([Math.sign(c)*Math.pow(Math.abs(c),pw)*rx,Math.sign(s)*Math.pow(Math.abs(s),pw)*ry]);}return o;}

// ============================================================
//  audio (Web Audio synth)
// ============================================================
const AU={c:null,m:null,nb:null,dg:null,df:null,fail:false};
function auInit(){
  if(AU.fail)return;
  try{
    if(!AU.c){
      const C=window.AudioContext||window.webkitAudioContext;if(!C){AU.fail=true;return;}
      AU.c=new C();AU.m=AU.c.createGain();AU.m.gain.value=0.8;AU.m.connect(AU.c.destination);
      const n=AU.c.sampleRate|0;const buf=AU.c.createBuffer(1,n,n);const d=buf.getChannelData(0);
      for(let i=0;i<n;i++)d[i]=Math.random()*2-1;AU.nb=buf;
      const src=AU.c.createBufferSource();src.buffer=buf;src.loop=true;
      const f=AU.c.createBiquadFilter();f.type='bandpass';f.frequency.value=2300;f.Q.value=0.8;
      const g=AU.c.createGain();g.gain.value=0;src.connect(f);f.connect(g);g.connect(AU.m);src.start();
      AU.dg=g;AU.df=f;
    }
    if(AU.c.state==='suspended'){const p=AU.c.resume();if(p&&p.catch)p.catch(()=>{});}
  }catch(e){AU.c=null;AU.fail=true;}
}
function tone(f,dur,type,g,delay,f2){
  if(!AU.c)return;
  try{
    const t=AU.c.currentTime+(delay||0);const o=AU.c.createOscillator();const gg=AU.c.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    gg.gain.setValueAtTime(0.0001,t);gg.gain.exponentialRampToValueAtTime(g,t+0.012);gg.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(gg);gg.connect(AU.m);o.start(t);o.stop(t+dur+0.05);
  }catch(e){}
}
function noise(f,q,dur,g,delay,f2){
  if(!AU.c||!AU.nb)return;
  try{
    const t=AU.c.currentTime+(delay||0);const s=AU.c.createBufferSource();s.buffer=AU.nb;
    const bf=AU.c.createBiquadFilter();bf.type='bandpass';bf.frequency.setValueAtTime(f,t);bf.Q.value=q;
    if(f2)bf.frequency.exponentialRampToValueAtTime(f2,t+dur);
    const gg=AU.c.createGain();gg.gain.setValueAtTime(0.0001,t);gg.gain.exponentialRampToValueAtTime(g,t+0.01);gg.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(bf);bf.connect(gg);gg.connect(AU.m);s.start(t,Math.random()*0.5);s.stop(t+dur+0.05);
  }catch(e){}
}
function drawGain(v){if(!AU.c||!AU.dg)return;try{AU.dg.gain.setTargetAtTime(v,AU.c.currentTime,0.03);}catch(e){}}
const SND={
  tick(){tone(1900,0.05,'triangle',0.05);noise(4200,2,0.04,0.05);},
  bend(){noise(700,1.6,0.2,0.13,0,300);tone(180,0.12,'sine',0.05,0,140);},
  snap(){tone(1480,0.05,'sine',0.045);},
  connect(){noise(1300,1,0.1,0.14);tone(523,0.2,'triangle',0.13);tone(784,0.22,'triangle',0.12,0.09);tone(1047,0.4,'triangle',0.11,0.18);tone(1568,0.3,'sine',0.04,0.26);},
  pata(){noise(500,1.2,0.12,0.2);tone(150,0.12,'sine',0.12,0,90);},
  fold(w){const f=clamp(200000/Math.max(40,w),260,3200);noise(f,2.6,0.3,0.22,0,f*0.55);tone(f/5,0.22,'sine',0.08,0.03,f/8);},
  step(i){tone(i%2?330:392,0.055,'sine',0.06);noise(600,2,0.03,0.04);},
  flip(){noise(380,1.1,1.0,0.2,0,2600);tone(240,0.9,'sine',0.05,0,480);},
  flipEnd(){noise(260,1,0.25,0.3);tone(110,0.35,'sine',0.25,0,62);tone(659,0.25,'triangle',0.08,0.1);tone(988,0.35,'triangle',0.08,0.2);},
  shake(){tone(360,0.07,'sine',0.04);noise(900,3,0.05,0.03);},
  wave(){tone(880,0.1,'sine',0.06);tone(1175,0.1,'sine',0.06,0.08);tone(1397,0.18,'sine',0.06,0.16);},
  grow(){tone(392,0.28,'triangle',0.1,0,587);noise(900,2,0.22,0.1);tone(784,0.2,'sine',0.05,0.2);},
  rest(){tone(523,0.25,'sine',0.07);tone(392,0.4,'sine',0.07,0.18);},
  plaza(d){SND.fold(d);tone(659,0.22,'triangle',0.08,0.12);tone(880,0.25,'triangle',0.07,0.22);},
  turn(w){SND.fold(w);tone(300,0.4,'triangle',0.06,0,450);},
  swing(){noise(1500,2,0.3,0.12,0,700);tone(698,0.18,'triangle',0.07,0.1);tone(523,0.2,'triangle',0.07,0.22);}
};

// ============================================================
//  state
// ============================================================
let S=null;          // persistent game state
let memOnly=false;   // storage unavailable
const P={onB:null,acts:[],wait:0,hat:0,step:0,stepT:0,moving:false,hop:0,hv:0,restT:0,look:[0,0],patrol:null,stepI:0,idleT:0};
const FX={parts:[],touch:null,flip:null,pendingFlip:-1,corner:0,cv:0,cornerPeekT:0,stubGone:0};
const CNT={taps:0,strokes:0,bridges:0,rotates:0,plazas:0,grows:0,flaps:0,rests:0,refolds:0,flips:0,patrols:0,shakes:0,cancels:0,saves:0,saveFail:0,demo:0};
let hint=null,hintT=0,hintDirty=true,demo=null,demoDone=false,lastInput=0,nowT=0,cycleIdx=0;
let mirror=1,squash=1,squashV=0;

function islandIds(){return S.pieces.filter(p=>p.kind==='island').map(p=>p.id);}
function pieceById(id){for(const p of S.pieces)if(p.id===id)return p;return null;}
function bridgeById(id){for(const b of S.bridges)if(b.id===id)return b;return null;}
function playPiece(){for(const p of S.pieces)if(p.kind==='play')return p;return null;}
function activePieces(){return S.pieces.filter(p=>p.kind!=='play'||p.active);}
function viewFace(){return mirror>=0?0:1;}

function mkPiece(o){
  const p=Object.assign({flaps:[],creases:[],cut:null,face:-1,active:true,habits:[]},o);
  p.lift=1;p.lv=0;p.wob=0;p.wv=0;p.wp=[0,0];p.rotA=null;p.moving=0;p.grow=1;p.gv=0;
  return p;
}
function l2w(p,l){const c=Math.cos(p.a),s=Math.sin(p.a);return [p.x+l[0]*c-l[1]*s,p.y+l[0]*s+l[1]*c];}
function w2l(p,w){const dx=w[0]-p.x,dy=w[1]-p.y,c=Math.cos(p.a),s=Math.sin(p.a);return [dx*c+dy*s,-dx*s+dy*c];}
function curPoly(p){
  if(p.kind==='play'&&p.poly0&&p.poly1){const g=p.active?clamp(p.grow,0,1.2):0;return p.poly0.map((q,i)=>lerpv(q,p.poly1[i],g*p.gf));}
  return p.poly;
}
function logicPoly(p){if(p.kind==='play'&&p.poly0)return p.active?p.poly0.map((q,i)=>lerpv(q,p.poly1[i],p.gf)):p.poly0;return p.poly;}
function wpoly(p){return logicPoly(p).map(l=>l2w(p,l));}
function wpolys(p){const o=[wpoly(p)];for(const f of p.flaps)o.push(f.poly.map(l=>l2w(p,l)));return o;}
function inPiece(p,w){for(const poly of wpolys(p))if(pip(w,poly))return true;return false;}
function nearB(p,w){
  const polys=wpolys(p);let best=polyNear(w,polys[0],false);
  for(let i=1;i<polys.length;i++){const r=polyNear(w,polys[i],true);if(r.d<best.d)best=r;}
  return best;
}
function pieceNear(w,rad,list){
  list=list||activePieces();let best=null,bestA=1e12;
  for(const p of list){if(inPiece(p,w)){const A=Math.abs(area(logicPoly(p)));if(A<bestA){best=p;bestA=A;}}}
  if(best)return best;
  let bd=rad;
  for(const p of list){const r=nearB(p,w);if(r.d<bd){bd=r.d;best=p;}}
  return best;
}
function hostOf(q){
  // a plaza that sits on another piece is connected to it
  const c=l2w(q,[0,0]);let best=null,bestA=1e12;
  for(const p of activePieces()){if(p===q)continue;if(p.kind==='plaza'&&Math.abs(area(p.poly))<=Math.abs(area(q.poly)))continue;
    if(inPiece(p,c)){const A=Math.abs(area(logicPoly(p)));if(A<bestA){bestA=A;best=p;}}}
  return best;
}

// ------------------------------------------------------------
//  generation
// ------------------------------------------------------------
function genIsland(rng,id,cx,cy,r){
  const n=16,ph=rng()*TAU,ph2=rng()*TAU,poly=[];
  for(let i=0;i<n;i++){const a=i/n*TAU;const rr=r*(1+0.09*Math.sin(2*a+ph)+0.06*Math.sin(3*a+ph2)+(rng()-.5)*0.07);poly.push([Math.cos(a)*rr*1.13,Math.sin(a)*rr*0.86]);}
  const k=Math.floor(rng()*n);const bp=poly[k];const inw=nrm(mul(bp,-1));const dir=rotv(inw,(rng()-.5)*0.7);
  const cut={p:[bp[0],bp[1]],q:add(bp,mul(dir,r*(0.3+rng()*0.16)))};
  const ca=rng()*Math.PI,cr=r*(0.25+rng()*0.25),ox=(rng()-.5)*r*0.5,oy=(rng()-.5)*r*0.4;
  const creases=[[ox-Math.cos(ca)*cr,oy-Math.sin(ca)*cr,ox+Math.cos(ca)*cr,oy+Math.sin(ca)*cr]];
  return mkPiece({id,kind:'island',x:cx,y:cy,a:(rng()-.5)*0.35,poly,cut,creases});
}
function gapOf(A,B){let m=1e9;for(const v of wpoly(A)){const r=nearB(B,v);if(pip(v,wpoly(B)))return -1;m=Math.min(m,r.d);}for(const v of wpoly(B)){if(pip(v,wpoly(A)))return -1;m=Math.min(m,nearB(A,v).d);}return m;}
function makePlay(){
  const pg=mkPiece({id:4,kind:'play',x:600,y:572,a:0,poly:null,active:false});
  pg.poly0=superEll(190,74,28,0.55);pg.poly1=superEll(278,108,28,0.6);pg.gf=1;pg.poly=pg.poly0;
  return pg;
}
function freshState(seed){
  let isl=null;
  for(let t=0;t<80&&!isl;t++){
    const rng=mulberry(seed+t*7919);
    const A=genIsland(rng,1,212+(rng()-.5)*50,290+(rng()-.5)*80,116+rng()*14);
    const B=genIsland(rng,2,600+(rng()-.5)*60,188+(rng()-.5)*50,112+rng()*14);
    const C=genIsland(rng,3,988+(rng()-.5)*50,310+(rng()-.5)*80,116+rng()*14);
    const g1=gapOf(A,B),g2=gapOf(B,C),g3=gapOf(A,C);
    const pg=makePlay();const pp=pg.poly1.map(l=>l2w(pg,l));
    const okPlay=![A,B,C].some(I=>overlap(wpoly(I),pp));
    const inSheet=[A,B,C].every(I=>wpoly(I).every(v=>v[0]>18&&v[0]<W-18&&v[1]>18&&v[1]<H-18));
    if(g1>75&&g1<160&&g2>75&&g2<160&&g3>250&&okPlay&&inSheet)isl=[A,B,C];
  }
  if(!isl){const rng=mulberry(1);isl=[genIsland(rng,1,212,290,118),genIsland(rng,2,600,180,112),genIsland(rng,3,988,310,118)];}
  const pg=makePlay();
  return {v:1,seed:seed,face:0,flipped:false,disc:{},pieces:[isl[0],isl[1],isl[2],pg],bridges:[],lines:[],rest:-1,nid:10,pup:{pid:1,l:[-18,14]},flipsN:0};
}

// ============================================================
//  persistence
// ============================================================
function r1(v){return Math.round(v*10)/10;}
function serialize(){
  return {v:1,seed:S.seed,face:S.face,flipped:S.flipped,disc:S.disc,rest:S.rest,nid:S.nid,flipsN:S.flipsN,
    pup:{pid:S.pup.pid,l:[r1(S.pup.l[0]),r1(S.pup.l[1])]},
    pieces:S.pieces.map(p=>({id:p.id,kind:p.kind,x:r1(p.x),y:r1(p.y),a:Math.round(p.a*1000)/1000,face:p.face,active:!!p.active,
      poly:p.kind==='play'?null:p.poly.map(q=>[r1(q[0]),r1(q[1])]),gf:p.kind==='play'?Math.round(p.gf*100)/100:undefined,
      cut:p.cut?{p:[r1(p.cut.p[0]),r1(p.cut.p[1])],q:[r1(p.cut.q[0]),r1(p.cut.q[1])]}:null,
      creases:p.creases.map(c=>c.map(r1)),habits:p.habits.map(c=>c.map(r1)),
      flaps:p.flaps.map(f=>({p1:f.p1.map(r1),p2:f.p2.map(r1),n:[Math.round(f.n[0]*1000)/1000,Math.round(f.n[1]*1000)/1000],D:r1(f.D)}))})),
    bridges:S.bridges.map(b=>({id:b.id,a:{pid:b.a.pid,l:b.a.l.map(r1)},b:{pid:b.b.pid,l:b.b.l.map(r1)},w:b.w,face:b.face,vis:!!b.vis})),
    lines:S.lines.map(L=>({face:L.face,pts:L.pts.map(q=>[Math.round(q[0]),Math.round(q[1])])}))};
}
function isNum(v,lo,hi){return typeof v==='number'&&isFinite(v)&&v>=lo&&v<=hi;}
function isPt(q,lim){return Array.isArray(q)&&q.length===2&&isNum(q[0],-lim,lim)&&isNum(q[1],-lim,lim);}
function validate(o){
  try{
    if(!o||typeof o!=='object'||o.v!==1)return false;
    if(!isNum(o.seed,0,4294967296)||(o.face!==0&&o.face!==1)||typeof o.flipped!=='boolean')return false;
    if(!o.disc||typeof o.disc!=='object'||Array.isArray(o.disc))return false;
    if(!isNum(o.nid,1,100000)||!isNum(o.rest,-1,100000)||!isNum(o.flipsN||0,0,1e6))return false;
    if(!Array.isArray(o.pieces)||o.pieces.length<4||o.pieces.length>20)return false;
    if(!Array.isArray(o.bridges)||o.bridges.length>16)return false;
    if(!Array.isArray(o.lines)||o.lines.length>40)return false;
    const ids=new Set();let nIsl=0,nPlay=0;
    for(const p of o.pieces){
      if(!p||!isNum(p.id,1,100000)||ids.has(p.id))return false;ids.add(p.id);

function bEndsRaw(b){const pa=pieceById(b.a.pid),pb=pieceById(b.b.pid);if(!pa||!pb)return null;return [l2w(pa,b.a.l),l2w(pb,b.b.l)];}

//  graph & paths

function graph(){

}
let touchCache={key:'',pairs:[]};
function geoKey(){let k='';for(const p of S.pieces){k+=p.id+':'+(p.x|0)+','+(p.y|0)+','+((p.a*100)|0)+','+p.flaps.length+','+(p.kind==='play'?(p.active?1:0)+'/'+p.gf:p.poly.length+'/'+((p.poly[0][0]*10)|0))+';';}return k;}

let CW=0,CH=0,DPR=1;const view={cx:0,cy:0,s:1,rot:0};let M=[1,0,0,1,0,0],Mi=[1,0,0,1,0,0],invOK=true,UP=[0,-1];

  CW=Math.max(1,window.innerWidth);CH=Math.max(1,window.innerHeight);DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  const cs=getComputedStyle(sa);const il=parseFloat(cs.paddingLeft)||0,ir=parseFloat(cs.paddingRight)||0,it=parseFloat(cs.paddingTop)||0,ib=parseFloat(cs.paddingBottom)||0;
  const pad=6;const aw=Math.max(50,CW-il-ir-pad*2),ah=Math.max(50,CH-it-ib-pad*2);

}

// ---------- corner (sheet flip handle) ----------

// ---------- island edge trace -> flap with back road (D4) ----------

// ---------- sideways from a bridge end -> island swings around it (D2) ----------

// ---------- stroke classification ----------

function classify(raw,cancelled){

function farthest(from,cands,adj){let best=null,bl=-1;for(const c of cands){if(c===from)continue;const p=bfs(from,c,adj);if(p&&p.length>bl){bl=p.length;best=c;}}return best;}
function updatePatrol(){
  const adj=graph();const cur=S.pup.pid;const comp=component(cur,adj);
  const kindOf=id=>{const p=pieceById(id);return p?p.kind:'';};
  let A=null,B=null,kind=null;
  if(S.flipped){
    const backs=comp.filter(id=>{const p=pieceById(id);return p&&((p.kind==='plaza'&&p.face===1));});
    const isl=comp.filter(id=>kindOf(id)==='island');
    if(backs.length&&isl.length){A=backs[backs.length-1];B=farthest(A,isl,adj);kind='back';}
  }

function demoPoint(){if(!demo)return null;const k=clamp(demo.t/demo.dur,0,1);const f=k*(demo.path.length-1);const i=Math.floor(f);return lerpv(demo.path[i],demo.path[Math.min(demo.path.length-1,i+1)],f-i);}
function drawHand(){
  const p=demoPoint();if(!p)return;
  const fade=clamp(demo.t>demo.dur?1-(demo.t-demo.dur)/0.6:Math.min(1,demo.t*4),0,1);
  const s=toScreen(p);const k=Math.max(0.6,view.s)*1.0;
  ctx.setTransform(DPR*k,0,0,DPR*k,s[0]*DPR,s[1]*DPR);ctx.globalAlpha=fade;
  ctx.fillStyle=BG;ctx.strokeStyle=WH;ctx.lineWidth=3;ctx.lineJoin='round';
  // simple outline hand: finger tip at origin
  ctx.beginPath();
  ctx.moveTo(-6,2);ctx.lineTo(-6,34);ctx.quadraticCurveTo(-24,22,-26,32);ctx.quadraticCurveTo(-24,44,-6,64);ctx.lineTo(30,64);
  ctx.quadraticCurveTo(40,50,38,36);ctx.lineTo(38,30);ctx.quadraticCurveTo(38,24,30,24);ctx.quadraticCurveTo(28,18,20,20);ctx.quadraticCurveTo(18,14,10,16);ctx.lineTo(6,16);ctx.lineTo(6,2);ctx.quadraticCurveTo(0,-6,-6,2);ctx.closePath();
  ctx.fill();ctx.stroke();
  ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-2,6);ctx.lineTo(2,6);ctx.stroke();
  ctx.globalAlpha=fade*0.7;ctx.strokeStyle=LB;ctx.beginPath();ctx.arc(0,0,10+Math.sin(nowT*10)*2,0,TAU);ctx.stroke();
  ctx.globalAlpha=1;
}
function drawPuppet(){
  const w=pupWorld();const s=toScreen(w);const k=Math.max(view.s*1.3,0.62);
  const hop=Math.max(0,P.hop)*0.2;
  const bob=P.moving?Math.abs(Math.sin(P.step))*5:0;
  const resting=P.restT>0;
  ctx.setTransform(DPR*k,0,0,DPR*k,s[0]*DPR,s[1]*DPR);
  ctx.lineJoin='round';ctx.lineCap='round';
  // look direction in screen space
  let lk=[0,0];
  if(demo){const dp=demoPoint();if(dp){const ds=toScreen(dp);lk=nrm([ds[0]-s[0],ds[1]-s[1]]);}}
  else if(P.look){const ls=toScreen(P.look);const v=[ls[0]-s[0],ls[1]-s[1]-60*k];if(Math.hypot(v[0],v[1])>4)lk=nrm(v);}
  const y0=-hop-bob;
  // pawn base (with thickness section lines)
  ctx.fillStyle=BG;ctx.strokeStyle=WH;ctx.lineWidth=3.2;
  ctx.beginPath();ctx.ellipse(0,0,27,9,0,0,TAU);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(0,-7,27,9,0,Math.PI,TAU);ctx.stroke();
  ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(-27,0);ctx.lineTo(-27,-7);ctx.moveTo(27,0);ctx.lineTo(27,-7);ctx.stroke();
  ctx.lineWidth=3.2;ctx.fillStyle=BG;ctx.beginPath();ctx.ellipse(0,-7,27,9,0,0,TAU);ctx.fill();ctx.stroke();
  ctx.save();ctx.translate(0,y0);
  const sit=resting?10:0;
  // body
  ctx.beginPath();ctx.moveTo(-17,-10+sit*0.2);ctx.lineTo(17,-10+sit*0.2);ctx.lineTo(11,-50+sit);ctx.lineTo(-11,-50+sit);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(0,-46+sit);ctx.stroke();ctx.lineWidth=3.2;
  // legs step
  if(P.moving){const sw=Math.sin(P.step)*5;ctx.beginPath();ctx.moveTo(-6,-10);ctx.lineTo(-6+sw,-1);ctx.moveTo(6,-10);ctx.lineTo(6-sw,-1);ctx.stroke();}
  // arms
  const wave=P.hat>0;const wv=Math.sin(nowT*16)*0.5;
  ctx.beginPath();ctx.moveTo(-11,-44+sit);ctx.lineTo(-22,-26+sit+(FX.flip?-26:0));ctx.stroke();
  let hatPos=[lk[0]*2,-82+sit],hatRot=lk[0]*0.08;
  if(wave){const hx=24+wv*6,hy=-74+sit;ctx.beginPath();ctx.moveTo(11,-44+sit);ctx.lineTo(hx,hy+8);ctx.stroke();hatPos=[hx+2,hy-4];hatRot=0.5+wv;}
  else{ctx.beginPath();ctx.moveTo(11,-44+sit);ctx.lineTo(22,-26+sit+(FX.flip?-26:0));ctx.stroke();}
  // head
  const hx=lk[0]*3,hy=-66+sit+lk[1]*2;
  ctx.beginPath();ctx.arc(hx,hy,17,0,TAU);ctx.fill();ctx.stroke();
  // face: always visible, eyes follow the target
  ctx.fillStyle=WH;const ex=lk[0]*3.5,ey=lk[1]*2.5;
  if(resting){ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(hx-9,hy-1);ctx.quadraticCurveTo(hx-6,hy+2,hx-3,hy-1);ctx.moveTo(hx+3,hy-1);ctx.quadraticCurveTo(hx+6,hy+2,hx+9,hy-1);ctx.stroke();}
  else{ctx.beginPath();ctx.arc(hx-6+ex,hy-1+ey,2.6,0,TAU);ctx.arc(hx+6+ex,hy-1+ey,2.6,0,TAU);ctx.fill();}
  ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(hx+ex*0.5,hy+5,5,0.15*Math.PI,0.85*Math.PI);ctx.stroke();
  ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(hx-11,hy+5,2.5,0,TAU);ctx.arc(hx+11,hy+5,2.5,0,TAU);ctx.stroke();
  // hat
  ctx.save();ctx.translate(hatPos[0],hatPos[1]);ctx.rotate(hatRot);
  ctx.fillStyle=BG;ctx.lineWidth=3.2;
  ctx.beginPath();ctx.ellipse(0,0,29,7,0,0,TAU);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-15,-1);ctx.lineTo(-13,-24);ctx.quadraticCurveTo(0,-30,13,-24);ctx.lineTo(15,-1);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.strokeStyle=LB;ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(-14.5,-7);ctx.quadraticCurveTo(0,-4,14.5,-7);ctx.stroke();
  ctx.restore();
  ctx.restore();
}
function draw(){
  drawBG();
  drawSheet();
  const vf=viewFace();
  const pg=playPiece();
  if(pg&&!pg.active&&vf===0)drawPlanned(pg);
  ctx.lineCap='round';ctx.lineJoin='round';
  // roads of bridges seen from the other face lie flat on the sheet
  for(const b of S.bridges)if(b.face!==vf)drawBridge(b,vf);
  if(pg&&pg.active)drawPlay(pg,vf);
  for(const p of S.pieces)if(p.kind==='island'){drawIsland(p,vf);drawFlaps(p,vf);}
  for(const p of S.pieces)if(p.kind==='plaza'&&!hostOf(p))drawPlaza(p,vf);
  for(const p of S.pieces)if(p.kind==='plaza'&&hostOf(p))drawPlaza(p,vf);
  drawLines(vf);
  for(const b of S.bridges)if(b.face===vf)drawBridge(b,vf);
  if(vf===0)drawStub();
  drawCorner();
  drawHint();
  drawDemoTrail();
  drawActive();
  drawParts();
  drawPuppet();
  drawHand();
  drawTouch();
}

// ============================================================
//  loop & lifecycle
// ============================================================
let raf=0,lastTS=0,running=false;
function frame(ts){
  raf=0;if(!running)return;
  let dt=(ts-lastTS)/1000;lastTS=ts;if(!(dt>0))dt=0;dt=Math.min(dt,0.05);
  try{update(dt);draw();}catch(err){if(!frame.errLogged){frame.errLogged=true;setTimeout(()=>{throw err;},0);}}
  raf=requestAnimationFrame(frame);
}
function start(){if(running)return;running=true;lastTS=performance.now();raf=requestAnimationFrame(frame);}
function stop(){running=false;if(raf)cancelAnimationFrame(raf);raf=0;}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(active)endStroke(true);drawGain(0);stop();saveNow();if(AU.c&&AU.c.state==='running'){try{AU.c.suspend();}catch(e){}}}
  else{if(AU.c&&AU.c.state==='suspended'){try{const p=AU.c.resume();if(p&&p.catch)p.catch(()=>{});}catch(e){}}start();}
});
window.addEventListener('pagehide',()=>{saveNow();});
window.addEventListener('resize',()=>{layout();draw();});
window.addEventListener('orientationchange',()=>{setTimeout(()=>{layout();draw();},120);});

// boot
S=loadSaved();
if(!S){S=freshState((Date.now()^Math.floor(Math.random()*1e9))>>>0);}
mirror=S.face===0?1:-1;
if(S.bridges.length)FX.stubGone=1;
layout();
updatePatrol();
hint=computeHint();
draw();
start();

// hooks for automated checks (no UI)
window.__gf={
  get S(){return S;},P,FX,CNT,
  toScreen:(x,y)=>{const s=toScreen([x,y]);return {x:s[0],y:s[1]};},
  toWorld:(x,y)=>{const w=toWorld(x,y);return {x:w[0],y:w[1]};},
  hint:()=>hint,pupWorld:()=>pupWorld(),
  bEnds:(id)=>{const b=bridgeById(id);return b?bEnds(b):null;},
  wpoly:(id)=>{const p=pieceById(id);return p?wpoly(p):null;},
  nearB:(id,x,y)=>{const p=pieceById(id);return p?nearB(p,[x,y]).pt:null;},
  creaseSeg:(id)=>{const b=bridgeById(id);return b?creaseSeg(b):null;},
  edgeCand:(id)=>{const p=pieceById(id);return p?edgeCandidate(p):null;},
  freeSpot:()=>freeSpot(activePieces(),null),
  freeSpotIn:()=>{const pg=playPiece();return pg&&pg.active?freeSpot([pg],pg):null;},
  audio:()=>AU.c?AU.c.state:(AU.fail?'failed':'none'),
  memOnly:()=>memOnly,face:()=>viewFace(),mirror:()=>mirror,
  allConnected:()=>allConnected(),
  gapBetween:(a,b)=>{const A=pieceById(a),B=pieceById(b);if(!A||!B)return null;const g=gapPair([A],[B]);return g?{p:g.p,q:g.q,d:g.d}:null;},
  flapTip:(id)=>{const p=pieceById(id);if(!p||!p.flaps.length)return null;const f=p.flaps[p.flaps.length-1];return l2w(p,add(lerpv(f.p1,f.p2,0.5),mul(f.n,f.D*0.85)));},
  diag:(pts)=>{pts=resample(pts,6);const sp=pieceNear(pts[0],55),ep=pieceNear(pts[pts.length-1],62);
    const fr={};for(const p of S.pieces){if(p.kind!=='island')continue;const wp=wpoly(p);let n=0;for(const q of pts)if(polyNear(q,wp,false).d<32)n++;fr[p.id]=n/pts.length;}
    const be=bridgeEndsNear(pts[0],40);
    let tb=null;if(sp&&ep&&sp!==ep){let i0=0;while(i0<pts.length-1&&inPiece(sp,pts[i0]))i0++;let i1=pts.length-1;while(i1>0&&inPiece(ep,pts[i1]))i1--;const SA=nearB(sp,pts[i0]).pt,EA=nearB(ep,pts[i1]).pt;
      tb={i0,i1,n:pts.length,SA,EA,dup:S.bridges.filter(b=>(b.a.pid===sp.id&&b.b.pid===ep.id)||(b.b.pid===sp.id&&b.a.pid===ep.id)).length,nb:S.bridges.length};}
    return {tb,sp:sp&&sp.id,ep:ep&&ep.id,edgeFr:fr,be:be&&{b:be.b.id,k:be.k},L:plen(pts),circle:isCircle(pts)};}
};
})();
