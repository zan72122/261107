<body>

<div id="safe"></div>
<script>
(function(){
'use strict';
/* ================= 基本 ================= */
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const TAU=Math.PI*2;
const PAL={g:'#1e2333',red:'#c94a32',teal:'#2c8c84',ochre:'#c9973a',cream:'#efe5cf',blue:'#2f4d8a',brown:'#6a3e2b',skin:'#e6b08a'};
const SH={};
(function(){
  for(const k in PAL){
    const n=parseInt(PAL[k].slice(1),16), c=[n>>16&255,n>>8&255,n&255];
    SH[k]=[0.88,0.94,1,1.05,1.1].map(m=>'rgb('+c.map(v=>Math.max(0,Math.min(255,Math.round(v*m)))).join(',')+')');
  }
})();
function tc(name,r){return SH[name][Math.min(4,Math.floor(r*5))];}
function rng(seed){let s=seed|0;return function(){s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h|0;}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);

/* ================= タイル描画ヘルパ ================= */
function poly(c,p){c.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);c.closePath();}
function tile(c,p,fill,gw){c.beginPath();poly(c,p);c.fillStyle=fill;c.fill();if(gw>0){c.lineWidth=gw;c.strokeStyle=PAL.g;c.lineJoin='round';c.stroke();}}
// 不揃いの多角形で領域を埋める（ずらし行＋ランダム三角分割）
function tileRegion(c,clip,x0,y0,x1,y1,size,colorFn,gw,R,per){
  c.save();c.beginPath();clip(c);c.clip();
  c.fillStyle=PAL.g;c.fillRect(x0-2,y0-2,x1-x0+4,y1-y0+4);
  let nper=0;if(per){nper=Math.max(1,Math.round(per/size));size=per/nper;}
  const hh=size*0.8,cols=Math.ceil((x1-x0)/size)+4,rows=Math.ceil((y1-y0)/hh)+3,V=[];
  const seed0=(R()*1e9)|0;
  for(let j=0;j<rows;j++){const row=[],off=(j&1)?size*0.5:0;for(let i=0;i<cols;i++){const r=nper?rng(seed0+j*7919+(i%nper)*104729):R;row.push(x0-size*1.5+i*size+off+(r()-0.5)*size*0.62,y0-hh+j*hh+(r()-0.5)*hh*0.62);}V.push(row);}
  for(let j=0;j<rows-1;j++){const a=V[j],b=V[j+1];for(let i=0;i<cols-1;i++){if(nper)R=rng(seed0+31+j*7919+(i%nper)*104729);
    const ax=a[i*2],ay=a[i*2+1],bx=a[i*2+2],by=a[i*2+3],cx=b[i*2+2],cy=b[i*2+3],dx=b[i*2],dy=b[i*2+1];
    const mx=(ax+bx+cx+dx)/4,my=(ay+by+cy+dy)/4;
    if(mx<x0-size||mx>x1+size||my<y0-size||my>y1+size)continue;
    if(R()<0.3){tile(c,[ax,ay,bx,by,cx,cy],colorFn(mx,my,R),gw);tile(c,[ax,ay,cx,cy,dx,dy],colorFn(mx,my,R),gw);}
    else tile(c,[ax,ay,bx,by,cx,cy,dx,dy],colorFn(mx,my,R),gw);
  }}
  c.restore();
}
// 同心リングのタイル（弧形タイル）
function tileRings(c,cx,cy,r0,r1,size,colorFn,gw,R,sy,a0,a1){
  sy=sy||1;if(a0===undefined){a0=0;a1=TAU;}
  const full=(a1-a0)>=TAU-1e-6;
  let ri=r0;
  while(ri<r1-0.5){
    let ro=Math.min(r1,ri+size*(0.8+R()*0.35));if(r1-ro<size*0.45)ro=r1;
    const span=a1-a0,n=Math.max(full?6:3,Math.round(span*(ri+ro)/2/size)),st=span/n,off=full?R()*st:0;
    const ang=[];for(let k=0;k<=n;k++){let a=a0+off+k*st;if(k>0&&k<n)a+=(R()-0.5)*st*0.5;ang.push(a);}
    if(full)ang[n]=ang[0]+TAU;
    for(let k=0;k<n;k++){const b1=ang[k],b2=ang[k+1],bm=(b1+b2)/2;
      tile(c,[cx+Math.cos(b1)*ri,cy+Math.sin(b1)*ri*sy,cx+Math.cos(b1)*ro,cy+Math.sin(b1)*ro*sy,cx+Math.cos(bm)*ro,cy+Math.sin(bm)*ro*sy,cx+Math.cos(b2)*ro,cy+Math.sin(b2)*ro*sy,cx+Math.cos(b2)*ri,cy+Math.sin(b2)*ri*sy,cx+Math.cos(bm)*ri,cy+Math.sin(bm)*ri*sy],colorFn(bm,(ri+ro)/2,R),gw);}
    ri=ro;
  }
}
function tileDisk(c,cx,cy,r,size,colorFn,gw,R,sy){
  sy=sy||1;const r0=Math.min(r*0.6,size*0.8);
  tileRings(c,cx,cy,r0*0.92,r,size,colorFn,gw,R,sy);
  const p=[],a0=R()*TAU,n=5+(R()*2|0);
  for(let k=0;k<n;k++){const a=a0+k*TAU/n+(R()-0.5)*0.4,rr=r0*(0.9+R()*0.2);p.push(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*sy);}
  tile(c,p,colorFn(0,0,R),gw);
}
function tileHalfDisk(c,cx,cy,r,size,colorFn,gw,R,sy){
  const r0=size*0.9;
  tileRings(c,cx,cy,r0,r,size,colorFn,gw,R,sy,Math.PI,TAU);
  const p=[cx+r0,cy];for(let k=0;k<=4;k++){const a=Math.PI*(2-k/4);p.push(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0*sy);}
  tile(c,p,colorFn(0,0,R),gw);
}

/* ================= 画面と配置 ================= */
let W=1,H=1,DPR=1,S=1,VW=400,VH=800,portrait=true;
const SA={t:0,r:0,b:0,l:0};
const Lo={};
let bgShop=null,bgRoad=null,BG_RES=1;
const ROAD_P=1600;
function readSafe(){
  const el=document.getElementById('safe');const cs=getComputedStyle(el);
  SA.t=parseFloat(cs.paddingTop)||0;SA.r=parseFloat(cs.paddingRight)||0;SA.b=parseFloat(cs.paddingBottom)||0;SA.l=parseFloat(cs.paddingLeft)||0;
}
function layout(){
  const t=SA.t/S,b=SA.b/S,l=SA.l/S,r=SA.r/S;
  const y0=t+4,UH=VH-t-b-4;
  Lo.l=l;Lo.r=r;
  if(portrait){
    Lo.chair={x:l+(VW-l-r)*0.43,y:y0+UH*0.565};Lo.cs=1.08;Lo.bs=0.46;
    Lo.r1=y0+UH*0.795;Lo.r2=y0+UH*0.975;
  }else{
    Lo.chair={x:l+(VW-l-r)*0.25,y:y0+UH*0.7};Lo.cs=1.22;Lo.bs=0.47;
    Lo.r1=y0+UH*0.97;
  }
  Lo.floorY=Lo.chair.y-95*Lo.cs;
}
function vx(f){return Lo.l+(VW-Lo.l-Lo.r)*f;}
function slotPos(i){
  if(portrait){if(i<4)return{x:vx(0.13+0.245*i),y:Lo.r1,s:Lo.bs};return{x:vx(0.865-0.245*(i-4)),y:Lo.r2,s:Lo.bs};}
  return{x:vx(0.43+0.105*i),y:Lo.r1,s:Lo.bs};
}
const QP_P=[[0.86,18,0.42],[0.92,-36,0.33],[0.953,-76,0.27],[0.97,-104,0.23],[0.983,-126,0.2],[0.993,-146,0.18]];
const QP_L=[[0.53,-12,0.5],[0.61,-46,0.43],[0.68,-74,0.37],[0.74,-96,0.32],[0.79,-114,0.28],[0.83,-128,0.25],[0.865,-140,0.22]];
function queuePos(i){const T=portrait?QP_P:QP_L,q=T[Math.min(i,T.length-1)];return{x:vx(q[0]),y:Lo.chair.y+q[1],s:q[2]};}
function chairPos(){return{x:Lo.chair.x,y:Lo.chair.y,s:Lo.cs};}

/* ================= スプライト ================= */
let SPR={};
function spr(key,big,w,h,ox,oy,fn){
  const k=key+(big?'B':'s');let sp=SPR[k];if(sp)return sp;
  const st=big?0.95:0.42,res=S*DPR*st,c=document.createElement('canvas');
  c.width=Math.max(1,Math.ceil(w*res));c.height=Math.max(1,Math.ceil(h*res));
  const g=c.getContext('2d');g.scale(res,res);g.translate(ox,oy);
  fn(g,1.3/st,rng(hashStr(key)));
  sp={c,w,h,ox,oy};SPR[k]=sp;return sp;
}
function dspr(sp){ctx.drawImage(sp.c,-sp.ox,-sp.oy,sp.w,sp.h);}
function sprFace(sk,big){return spr('face'+sk,big,124,124,62,62,(c,gw,R)=>{
  const col=()=>sk?(R()<0.2?tc('ochre',0.9):tc('skin',R()*0.6)):(R()<0.22?tc('cream',R()*0.4):tc('skin',0.3+R()*0.7));
  tileDisk(c,-48,6,10,4.6,col,gw,R);tileDisk(c,48,6,10,4.6,col,gw,R);
  tileDisk(c,0,0,50,10.5,col,gw,R);
});}
function sprBody(robe,big){return spr('body'+robe,big,106,124,53,114,(c,gw,R)=>{
  tile(c,[-9,-110,9,-110,9,-92,-9,-92],tc('skin',0.5),gw);
  const pts=[-40,0,40,0,37,-70,26,-96,-26,-96,-37,-70];
  tileRegion(c,cc=>poly(cc,pts),-42,-98,42,2,11,(x,y,R)=>tc(robe,R()),gw,R);
  c.beginPath();poly(c,pts);c.lineWidth=gw;c.strokeStyle=PAL.g;c.stroke();
  tileRings(c,0,-96,9,23,7,()=>tc('cream',R()),gw,R,1,0.15,Math.PI-0.15);
  let x=-39;while(x<38){const w=9+R()*6,x2=Math.min(39,x+w);tile(c,[x,-26+R(),x2,-26+R(),x2,-17,x,-17],tc('ochre',R()),gw);x=x2;}
  for(const y of [-38,-54,-68])tileDisk(c,0,y,4,4,()=>tc('cream',R()),gw*0.8,R);
});}
function sprHat(col,big){return spr('hat'+col,big,150,104,75,86,(c,gw,R)=>{
  tileDisk(c,0,-3,66,10,()=>tc(col,R()*0.7),gw,R,0.2);
  const band=col==='cream'?'red':'cream';
  tileHalfDisk(c,0,-6,47,9.5,(a,r)=>r>39?tc(band,R()):tc(col,R()),gw,R,1.12);
  tileDisk(c,0,-62,8,5,()=>tc(col==='red'?'ochre':'red',R()),gw,R);
});}
function sprChairBack(big){return spr('chairB',big,230,300,115,292,(c,gw,R)=>{
  tileDisk(c,0,-8,56,9,()=>tc('brown',R()),gw,R,0.22);
  tileRegion(c,cc=>cc.rect(-14,-100,28,92),-14,-100,14,-8,8,(x,y,R)=>tc('ochre',R()),gw,R);
  const br=[-58,-112,58,-112,58,-232,40,-252,-40,-252,-58,-232];
  tileRegion(c,cc=>poly(cc,br),-60,-254,60,-110,13,(x,y,R)=>{const e=Math.min(x+58,58-x,-112-y,y+246);return e<10?tc('teal',R()):tc('red',R());},gw,R);
  const st=[-76,-96,76,-96,72,-122,-72,-122];
  tileRegion(c,cc=>poly(cc,st),-78,-124,78,-94,10,(x,y,R)=>y<-116?tc('cream',R()):tc('red',R()),gw,R);
});}
function sprChairFront(big){return spr('chairF',big,230,190,115,172,(c,gw,R)=>{
  for(const s of [-1,1]){
    tile(c,[s*72,-120,s*80,-120,s*80,-98,s*72,-98],tc('brown',R()),gw);
    tileRegion(c,cc=>cc.rect(s>0?64:-88,-152,24,30),s>0?64:-88,-152,s>0?88:-64,-122,9,(x,y,R)=>tc('ochre',R()),gw,R);
  }
  tile(c,[-5,-96,5,-96,5,-34,-5,-34],tc('brown',R()),gw);
  tileRegion(c,cc=>cc.rect(-44,-36,88,12),-44,-36,44,-24,10,(x,y,R)=>tc('brown',R()),gw,R);
});}
function sprWheel(big){return spr('wheel',big,70,70,35,35,(c,gw,R)=>{
  tileRings(c,0,0,21,31,7,()=>tc('ochre',R()),gw,R);
  for(let k=0;k<6;k++){const a=k*TAU/6,ca=Math.cos(a),sa=Math.sin(a),na=-sa,nb=ca;
    tile(c,[ca*6+na*3,sa*6+nb*3,ca*21+na*4,sa*21+nb*4,ca*21-na*4,sa*21-nb*4,ca*6-na*3,sa*6-nb*3],tc('teal',R()),gw);}
  tileDisk(c,0,0,7,5,()=>tc('brown',R()),gw,R);
});}
function sprAwning(big){return spr('awning',big,260,96,130,48,(c,gw,R)=>{
  const pts=[-122,10];for(let i=0;i<=8;i++){const x=-122+i*30.5;pts.push(x,12);if(i<8)pts.push(x+15,30);}
  pts.push(122,10,104,-26,0,-38,-104,-26);
  tileRegion(c,cc=>poly(cc,pts),-124,-40,124,32,11,(x,y,R)=>(Math.floor((x+130)/30.5)%2)?tc('cream',R()):tc('red',R()),gw,R);
  c.beginPath();poly(c,pts);c.lineWidth=gw;c.strokeStyle=PAL.g;c.stroke();
  tileDisk(c,0,-44,9,5,()=>tc('ochre',R()),gw,R);
});}
function sprInst(role,big){
  switch(role){
  case 'trumpet':return spr('i_tr',big,120,56,4,28,(c,gw,R)=>{
    let x=0;while(x<70){const w=8+R()*6;tile(c,[x,-4,x+w,-4.5,x+w,3.5,x,4],tc('ochre',R()),gw);x+=w;}
    for(const vx of [28,38,48])tile(c,[vx-3,-14,vx+3,-14,vx+3,-4,vx-3,-4],tc('cream',R()),gw);
    tileRings(c,84,0,6,22,6,()=>tc('ochre',R()),gw,R,1.0);tileDisk(c,84,0,7,4,()=>tc('brown',R()),gw,R);
    tile(c,[66,-9,72,-12,72,12,66,9],tc('ochre',0.2),gw);
  });
  case 'drum':return spr('i_dr',big,96,86,48,44,(c,gw,R)=>{
    tileRegion(c,cc=>cc.rect(-37,-20,74,46),-37,-20,37,26,10,(x,y,R)=>(Math.abs(((x*0.8+y*1.6)%28+28)%28-14)<5)?tc('ochre',R()):tc('red',R()),gw,R);
    c.beginPath();c.rect(-37,-20,74,46);c.lineWidth=gw;c.strokeStyle=PAL.g;c.stroke();
    tileDisk(c,0,26,37,10,()=>tc('brown',R()),gw,R,0.18);
    tileDisk(c,0,-20,37,9,()=>tc('cream',R()),gw,R,0.3);
  });
  case 'cymbal':return spr('i_cy',big,64,64,32,32,(c,gw,R)=>{tileDisk(c,0,0,27,7,(a,r)=>tc('ochre',r<8?0.1:R()),gw,R);tileDisk(c,0,0,6,4,()=>tc('brown',R()),gw,R);});
  case 'bell':return spr('i_be',big,56,70,28,10,(c,gw,R)=>{
    tile(c,[-4,-8,4,-8,4,6,-4,6],tc('brown',R()),gw);
    const p=[-6,6,6,6,14,30,22,46,-22,46,-14,30];tileRegion(c,cc=>poly(cc,p),-24,4,24,48,8,(x,y,R)=>tc('ochre',R()),gw,R);
    c.beginPath();poly(c,p);c.lineWidth=gw;c.strokeStyle=PAL.g;c.stroke();
    tileDisk(c,0,50,5,4,()=>tc('brown',R()),gw,R);
  });
  case 'flute':return spr('i_fl',big,104,22,4,11,(c,gw,R)=>{
    let x=0;while(x<92){const w=10+R()*8;tile(c,[x,-3.5,x+w,-3.5,x+w,3.5,x,3.5],x>80?tc('ochre',R()):tc('cream',R()),gw);x+=w;}
    for(const hx of [34,46,58,70])tile(c,[hx-2,-2,hx+2,-2,hx+2,2,hx-2,2],tc('brown',0.3),gw*0.5);
  });
  case 'tamb':return spr('i_ta',big,64,64,32,32,(c,gw,R)=>{tileRings(c,0,0,16,26,7,(a)=>((Math.floor(a/TAU*8+8)%2)?tc('ochre',R()):tc('red',R())),gw,R);tileDisk(c,0,0,16,8,()=>tc('cream',R()),gw,R);});
  }
}

/* ================= 背景 ================= */
function buildBG(){
  BG_RES=S*Math.min(DPR,1.5);
  const fy=Lo.floorY,gw=1.3;
  // ---- お店 ----
  bgShop=document.createElement('canvas');bgShop.width=Math.ceil(VW*BG_RES);bgShop.height=Math.ceil(VH*BG_RES);
  let g=bgShop.getContext('2d');g.scale(BG_RES,BG_RES);let R=rng(1234);
  tileRegion(g,c=>c.rect(0,0,VW,fy-62),0,0,VW,fy-62,36,(x,y,R)=>(Math.sin(x*0.013+Math.sin(y*0.02)*1.7)>0.975?tc('ochre',0.6+R()*0.4):tc('cream',0.4+R()*0.6)),gw,R);
  tileRegion(g,c=>c.rect(0,fy-62,VW,62),0,fy-62,VW,fy,17,(x,y,R)=>(y<fy-52?tc('ochre',R()):tc('teal',R())),gw,R);
  tileRegion(g,c=>c.rect(0,fy,VW,VH-fy),0,fy,VW,VH,34,(x,y,R)=>(Math.sin(x*0.011+Math.sin(y*0.018)*2+y*0.006)>0.8?tc('teal',0.5+R()*0.5):tc('cream',R()*0.7)),gw,R);
  // 奥への入口と小道
  const dX=portrait?vx(0.955):vx(0.9),dB=Lo.chair.y+(portrait?-160:-128),dw=portrait?44:60,dT=dB-(portrait?100:140);
  const path=portrait?[vx(0.7),Lo.chair.y+46,VW+20,Lo.chair.y+46,dX+dw,dB,dX-dw,dB]:[vx(0.5),Lo.chair.y+40,vx(0.8),Lo.chair.y+40,dX+dw,dB,dX-dw,dB];
  const arch=c=>{c.moveTo(dX-dw-10,dB+2);c.lineTo(dX-dw-10,dT+dw);c.arc(dX,dT+dw,dw+10,Math.PI,TAU);c.lineTo(dX+dw+10,dB+2);c.closePath();};
  tileRegion(g,arch,dX-dw-12,dT-14,dX+dw+12,dB+4,9,(x,y,R)=>tc('ochre',R()),gw,R);
  const inner=c=>{c.moveTo(dX-dw,dB+2);c.lineTo(dX-dw,dT+dw);c.arc(dX,dT+dw,dw,Math.PI,TAU);c.lineTo(dX+dw,dB+2);c.closePath();};
  tileRegion(g,inner,dX-dw,dT,dX+dw,dB+2,12,(x,y,R)=>{const d=Math.hypot((x-dX)/dw,(y-dB+20)/(dB-dT));return d<0.45?tc('cream',R()):d<0.8?tc('teal',R()):tc('blue',R());},gw,R);
  tileRegion(g,c=>poly(c,path),Math.min(path[0],path[6])-10,dB,VW+20,path[1]+4,14,(x,y,R)=>(Math.sin(y*0.12+x*0.02)>0.1?tc('cream',R()):tc('ochre',R())),gw,R);
  // 床屋の柱
  const px=vx(0.045)+10,ptop=Lo.chair.y-(portrait?330:330)*Lo.cs;
  tileRegion(g,c=>c.rect(px-13,ptop,26,fy-ptop-6),px-13,ptop,px+13,fy-6,9,(x,y,R)=>((((y*0.55+x*1.3)%34)+34)%34<17?tc('red',R()):tc('cream',R())),gw,R);
  tileDisk(g,px,ptop-6,15,6,()=>tc('ochre',R()),gw,R);tileDisk(g,px,fy-6,15,6,()=>tc('ochre',R()),gw,R,0.5);
  // ---- 道 ----
  bgRoad=document.createElement('canvas');bgRoad.width=Math.round(ROAD_P*BG_RES);bgRoad.height=Math.ceil(VH*BG_RES);

  return -1;
}
function hitTuft(p,v){let best=null;for(const k of ['F','L','R']){const h=hitTuftK(p,k,v);if(h>=0&&(!best||h>0&&best.seg===0)){best={k,seg:h};}}return best;}
function tuftWorld(p,k,idx){const pts=spine(k,p.hair[k],null,0);idx=clamp(idx,0,p.hair[k]);return fromHead(p,pts[idx*2],pts[idx*2+1]);}

/* ================= 操作の結果 ================= */
function cut(p,k,nl,speed,pt){
  const old=p.hair[k];if(nl>=old)return;
  const before=hatTarget(p.hair);p.hair[k]=nl;const amt=old-nl,after=hatTarget(p.hair);

  const an=p.an;an.bv+=10;an.cheek=1;an.surprise=0.5;
  if(k==='F'&&nl<=1)an.bv+=10;
  p.tan[k].sv+=10;p.tan[k].wave=1;
  p.hat.vl-=40;p.hat.wv+=(Math.random()-0.5)*1.5;
  const r=isReady(p.hair);
  if(r&&!p.wasReady){snd.kapon(0.07);an.happy=1;p.hat.vl-=160;const hp=fromHead(p,0,-60);sparkleRing(hp.x,hp.y,10,60);}
  else if(after.lift<before.lift-0.5)snd.kachin(0.06);

}
function addShard(p,k,amt,pt){
  const side=k==='L'?-1:k==='R'?1:(Math.random()<0.5?-1:1);
  const ox=side*(28+Math.random()*80),oy=8+Math.random()*26;
  const st={x:(pt.x-p.x)/p.s,y:(pt.y-p.y)/p.s};
  const R=rng((Math.random()*1e9)|0),tl=[];
  const n=Math.min(6,1+amt*2);for(let i=0;i<n;i++)tl.push([(R()-0.5)*20,(R()-0.5)*8,R()*Math.PI,8+R()*7,R()]);
  p.shards.push({k,amt,ox,oy,sx:st.x,sy:st.y,fall:0,rot:(Math.random()-0.5)*0.6,tl,jx:0,jy:0,jt:9,fly:null,drag:null,wx:0,wy:0});
  if(p.shards.length>14)p.shards.shift();
}
function restoreShard(p,sh){

  const wasR=isReady(p.hair);p.hair[sh.k]=Math.min(4,p.hair[sh.k]+sh.amt);
  snd.restore();p.tan[sh.k].sv-=8;p.tan[sh.k].wave=1;p.an.bv+=5;p.an.happy=0.5;

function sendToQueueFront(c){c.loc='queue';queue.unshift(c.id);chair=null;c.arrived=false;}

function invite(p){freeChair();queue.splice(queue.indexOf(p.id),1);seat(p,-1);}
function recall(p){const bi=band.indexOf(p.id);if(bi>=0)band.splice(bi,1);freeChair();seat(p,-2.5);}
function join(c){chair=null;c.loc='band';band.push(c.id);c.arrived=false;c.joinPending=true;c.readyT=0;c.an.happy=1;checkPhase();}

  if(phase==='shop'&&['trumpet','drum','cymbal'].every(r=>band.some(id=>P[id].role===r)))startTransform();

function joinNote(p){

function toV(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/S,y:(e.clientY-r.top)/S};}
function personBox(p,v,minHW){const hw=Math.max(minHW||0,62*p.s+6);return Math.abs(v.x-p.x)<hw&&v.y<p.y+14&&v.y>p.y-340*p.s-10;}
function hitBand(v){for(let i=band.length-1;i>=0;i--){const p=P[band[i]];if(personBox(p,v,28))return p;}return null;}
function hitQueue(v){for(const id of queue){const p=P[id];if(personBox(p,v,26))return p;}return null;}
function hitShard(p,v){for(let i=p.shards.length-1;i>=0;i--){const s=p.shards[i];if(s.fly||s.fall<1)continue;if(Math.hypot(v.x-s.wx,v.y-s.wy)<30)return s;}return null;}
function onDown(v){
  ptr={mode:'none',sx:v.x,sy:v.y,lx:v.x,ly:v.y,lt:performance.now(),moved:false,inside:{L:false,R:false,F:false},ref:null};
  const c=chairP();const seated=c&&c.near&&c.loc==='chair';
  if(seated){
    const h=hitTuft(c,v);
    if(h){ptr.mode='hair';for(const k of ['L','R','F'])ptr.inside[k]=hitTuftK(c,k,v)>=0;
      if(c.hair[h.k]>0){const w=tuftWorld(c,h.k,c.hair[h.k]);cut(c,h.k,c.hair[h.k]-1,500,{x:(w.x+v.x)/2,y:(w.y+v.y)/2});}
      else{c.tan[h.k].sv+=6;c.an.bv+=4;snd.tickle();}
      return;}
    const s=hitShard(c,v);if(s){ptr.mode='shardCand';ptr.ref=s;return;}
  }
  const b=hitBand(v);if(b){ptr.mode='bandCand';ptr.ref=b;return;}
  const q=hitQueue(v);if(q){invite(q);return;}
  if(seated){if(personBox(c,v)){c.an.bv+=5;c.an.cheek=0.6;}ptr.mode='hair';}
}
function onMove(v){
  if(!ptr)return;
  const dx=v.x-ptr.sx,dy=v.y-ptr.sy;if(!ptr.moved&&dx*dx+dy*dy>14*14)ptr.moved=true;
  const now=performance.now(),dt=Math.max(1,now-ptr.lt),sp=Math.hypot(v.x-ptr.lx,v.y-ptr.ly)/dt*1000;
  const c=chairP();
  switch(ptr.mode){
  case 'hair':{if(!(c&&c.near&&c.loc==='chair'))break;
    const L=Math.hypot(v.x-ptr.lx,v.y-ptr.ly),n=Math.max(1,Math.ceil(L/6));
    for(let j=1;j<=n;j++){const q={x:ptr.lx+(v.x-ptr.lx)*j/n,y:ptr.ly+(v.y-ptr.ly)*j/n};
      for(const k of ['L','R','F']){const h=hitTuftK(c,k,q);
        if(h>=0){if(!ptr.inside[k]){ptr.inside[k]=true;const nl=Math.max(0,h-1);if(h>0&&nl<c.hair[k])cut(c,k,nl,sp,q);}}
        else ptr.inside[k]=false;}}
    break;}
  case 'shardCand':if(ptr.moved){ptr.mode='shardDrag';ptr.ref.drag={x:v.x,y:v.y};}break;
  case 'shardDrag':ptr.ref.drag={x:v.x,y:v.y};break;
  case 'bandCand':if(ptr.moved){const p=ptr.ref;const i=band.indexOf(p.id);if(i>=0){dragOrig=i;band.splice(i,1);dragP=p;dragPos={x:v.x,y:v.y};dragInsert=calcInsert(v);ptr.mode='drag';p.arrived=false;}}break;
  case 'drag':dragPos={x:v.x,y:v.y};dragInsert=calcInsert(v);break;
  }
  ptr.lx=v.x;ptr.ly=v.y;ptr.lt=now;
}
function calcInsert(v){let bi=0,bd=1e9;for(let i=0;i<=band.length;i++){const s=slotPos(i);const d=Math.hypot(v.x-s.x,v.y-(s.y-60*s.s));if(d<bd){bd=d;bi=i;}}return bi;}
function inBandRegion(v){for(let i=0;i<=band.length;i++){const s=slotPos(i);if(Math.hypot(v.x-s.x,v.y-(s.y-60*s.s))<95)return true;}return false;}
function inChairRegion(v){const c=chairPos();return Math.abs(v.x-c.x)<110*c.s&&v.y<c.y+20&&v.y>c.y-330*c.s;}
function onUp(v){
  if(!ptr)return;const c=chairP();
  switch(ptr.mode){
  case 'shardCand':{const s=ptr.ref;if(c&&c.shards.includes(s)){const to=tuftWorld(c,s.k,c.hair[s.k]);s.fly={t:0,fx:s.wx,fy:s.wy};}break;}
  case 'shardDrag':{const s=ptr.ref;s.drag=null;if(c&&c.shards.includes(s)){const q=toHead(c,v);const root=TD[s.k];const tip=tuftWorld(c,s.k,c.hair[s.k]);
      if(Math.hypot(q.x,q.y)<95||Math.hypot(v.x-tip.x,v.y-tip.y)<80*c.s+20){restoreShard(c,s);}else{snd.poyon();}}break;}
  case 'bandCand':recall(ptr.ref);break;
  case 'drag':dropDrag(v);break;
  }
  ptr=null;
}
function dropDrag(v){
  const p=dragP;if(!p)return;dragP=null;
  if(inBandRegion(v)){const i=clamp(calcInsert(v),0,band.length);band.splice(i,0,p.id);snd.place();}
  else if(inChairRegion(v)){band.splice(Math.min(dragOrig,band.length),0,p.id);recall(p);}
  else{band.splice(Math.min(dragOrig,band.length),0,p.id);snd.poyon();}
  dragInsert=-1;p.mv=null;
}
function onCancel(){
  if(!ptr)return;
  if(ptr.mode==='shardDrag'&&ptr.ref)ptr.ref.drag=null;
  if(ptr.mode==='drag'&&dragP){const p=dragP;dragP=null;band.splice(Math.min(dragOrig,band.length),0,p.id);dragInsert=-1;p.mv=null;}

}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audioUnlock();

/* ================= 次の目標と実演 ================= */
function getTarget(){
  const c=chairP();
  if(c){if(!c.near||c.loc!=='chair')return null;if(isReady(c.hair))return null;
    const h=c.hair;const k=(h.L>=h.R&&h.L>0)?'L':(h.R>0?'R':'F');return{type:'tuft',p:c,k};}
  if(queue.length)return{type:'person',p:P[queue[0]]};
  if(band.length){let best=null,bs=-1;for(const id of band){const p=P[id];const s=p.hair.L+p.hair.R+p.hair.F;if(s>bs){bs=s;best=p;}}return{type:'person',p:best};}
  return null;
}

/* ================= 更新 ================= */
function updatePerson(p,dt){
  const an=p.an;
  const tg=targetOf(p);
  if(p===dragP){const tx=dragPos.x,ty=dragPos.y+40*p.s;p.x+=(tx-p.x)*Math.min(1,dt*20);p.y+=(ty-p.y)*Math.min(1,dt*20);p.s+=(Lo.bs*1.15-p.s)*Math.min(1,dt*10);p.hopY=0;p.near=false;}
  else if(tg){
    const dx=tg.x-p.x,dy=tg.y-p.y,d=Math.hypot(dx,dy);
    if(d>0.6){
      if(!p.mv||Math.abs(p.mv.tx-tg.x)>1||Math.abs(p.mv.ty-tg.y)>1)p.mv={tx:tg.x,ty:tg.y,d0:Math.max(d,1)};
      const k=1-Math.exp(-dt*5);p.x+=dx*k;p.y+=dy*k;p.s+=(tg.s-p.s)*k;
      const pr=clamp(1-d/p.mv.d0,0,1);p.hopY=-Math.sin(Math.PI*pr)*Math.min(46,p.mv.d0*0.22);
      an.walk+=dt*12;
    }else{p.x=tg.x;p.y=tg.y;p.s=tg.s;p.hopY=0;p.mv=null;}
    p.near=d<3;
  }
  if(p.loc==='band'&&p.near&&!p.arrived&&p!==dragP){p.arrived=true;if(p.joinPending){p.joinPending=false;joinNote(p);}}
  if(p.loc!=='band')p.arrived=false;
  // 帽子
  const ht=hatTarget(p.hair),ready=isReady(p.hair);
  let tl=ht.lift,tt=ht.tilt;if(!ready)tl+=4+Math.sin(T*2.2+p.id)*3;
  p.hat.vl+=((tl-p.hat.lift)*90-p.hat.vl*9)*dt;p.hat.lift+=p.hat.vl*dt;
  p.hat.vt+=((tt-p.hat.tilt)*90-p.hat.vt*9)*dt;p.hat.tilt+=p.hat.vt*dt;
  const damp=an.holdT>0?30:3.5;p.hat.wv+=(-p.hat.wob*140-p.hat.wv*damp)*dt;p.hat.wob+=p.hat.wv*dt;
  if(Math.abs(p.hat.wob)>0.5)p.hat.wob=Math.sign(p.hat.wob)*0.5;
  // 顔
  an.bv+=(-an.brow*170-an.bv*10)*dt;an.brow+=an.bv*dt;
  const base=p.hat.tilt*0.35;an.bobV+=(-(an.bob-base)*60-an.bobV*7)*dt;an.bob+=an.bobV*dt;
  an.hit=Math.max(0,an.hit-dt*4);an.puff=Math.max(0,an.puff-dt*3);an.cheek=Math.max(0,an.cheek-dt*1.4);an.crash=Math.max(0,an.crash-dt*2.4);
  an.spread=Math.max(0,an.spread-dt*1.1);an.inhale=Math.max(0,an.inhale-dt*2.2);an.shoulder=Math.max(0,an.shoulder-dt*5);an.dip=Math.max(0,an.dip-dt*3.5);
  an.squash=Math.max(0,an.squash-dt*6);an.happy=Math.max(0,an.happy-dt*0.35);an.surprise=Math.max(0,an.surprise-dt*2);an.nod=Math.max(0,an.nod-dt*5);an.jump=Math.max(0,an.jump-dt*2.5);
  an.holdT-=dt;an.hold+=((an.holdT>0?1:0)-an.hold)*Math.min(1,dt*9);
  an.stepT[0]+=dt;an.stepT[1]+=dt;
  an.blinkT-=dt;if(an.blinkT<-0.13)an.blinkT=2.5+Math.random()*3.5;
  if(p.hair.F<=1){an.browTimer-=dt;if(an.browTimer<0){an.browTimer=1.1+Math.random()*0.6;an.bv+=6;}}
  if(curTarget&&curTarget.type==='tuft'&&curTarget.p===p&&!pointerDown){const ta=p.tan[curTarget.k];if(Math.sin(T*3.1)>0.97&&ta.wave<0.2){ta.wave=0.6;ta.sv+=3;}}
  for(const k of ['L','R','F']){const ta=p.tan[k];ta.sv+=(-ta.sq*210-ta.sv*11)*dt;ta.sq+=ta.sv*dt;ta.wave=Math.max(0,ta.wave-dt*2.2);}
  // 視線
  let gx=0,gy=0.1;
  if(p.loc==='chair'){const tgt=getTarget();if(tgt&&tgt.type==='tuft'&&tgt.p===p){gx=tgt.k==='L'?-1:tgt.k==='R'?1:0.15;gy=tgt.k==='F'?-1:-0.2;}else if(isReady(p.hair)){gx=portrait?-0.3:-0.6;gy=0.7;}}
  else if(p.loc==='queue'){gx=-0.9;gy=-0.1;}
  else if(p.loc==='band'){const i=band.indexOf(p.id);gx=i===0?0:-0.8;gy=an.crash>0.3?-0.8:0;}
  p.gaze.x+=(gx-p.gaze.x)*Math.min(1,dt*8);p.gaze.y+=(gy-p.gaze.y)*Math.min(1,dt*8);
  // 待機の小さな動き
  if(p.loc==='queue'&&p.near){an.idleHop+=dt;if(phase!=='shop'){an.walk+=dt*7;}}
  // 椅子で準備完了→列へ
  if(p.loc==='chair'&&p.near){
    if(ready&&!pointerDown&&!p.shards.some(s=>s.fly)){p.readyT+=dt;if(p.readyT>1.6)join(p);}
    else if(!ready)p.readyT=Math.min(p.readyT,0);
  }
  // 陶片
  for(let i=p.shards.length-1;i>=0;i--){const s=p.shards[i];
    if(s.fall<1)s.fall=Math.min(1,s.fall+dt*1.9);
    s.jt+=dt;
    if(s.fly){s.fly.t+=dt*2.6;if(s.fly.t>=1){restoreShard(p,s);}}
  }
}
function update(dt){
  T+=dt;idleT+=dt;
  musicTick();processEv(clock());
  for(const p of P)updatePerson(p,dt);
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life+=dt;if(q.life>=q.max){parts.splice(i,1);continue;}q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.r+=q.vr*dt;q.vx*=1-dt*1.2;}
  if(phase==='transform'){trT+=dt;if(trT>3.0)phase='road';}
  if(phase==='finale')finT+=dt;
  if(phase==='transform'){cart.wheel=clamp((trT-0.15)/0.5,0,1);cart.awn=clamp((trT-0.7)/0.6,0,1);}
  else if(phase!=='shop'){cart.wheel=1;cart.awn=1;}
  const sv=(phase==='shop')?0:(phase==='transform'?(trT>1.1?70:0):70);
  scrollV+=(sv-scrollV)*Math.min(1,dt*1.5);scroll+=scrollV*dt;cart.rot+=scrollV*dt/(30*Lo.cs);
  cart.bounce=Math.max(0,cart.bounce-dt*4);
  if(!hintDone&&!hint&&idleT>4&&!pointerDown){const tg=getTarget();if(tg){hint={tg,t:0};hintDone=true;}}
  if(hint){hint.t+=dt;if(hint.t>2.6)hint=null;}
}

function hand(x,y,gw){ctx.beginPath();ctx.arc(x,y,7,0,TAU);ctx.fillStyle=SH.skin[2];ctx.fill();ctx.lineWidth=gw;ctx.strokeStyle=PAL.g;ctx.stroke();}

function drawShards(p){

  const tgp=curTarget&&curTarget.type==='person'?curTarget.p:null;
  // 奥の人と待つ人（遠い順）
  const back=P.filter(p=>p.loc==='far'||p.loc==='queue').sort((a,b)=>a.y-b.y);
  for(const p of back){if(p===tgp)drawGlowPerson(p);drawPerson(p);}
  drawChair(false);
  const c=chairP();
  if(c&&p_on_chair(c)){drawPerson(c);}
  drawChair(true);
  if(c)drawShards(c);
  const moving=P.filter(p=>p.loc==='chair'&&!p_on_chair(p));
  const bm=P.filter(p=>p.loc==='band'&&p!==dragP).concat(moving).sort((a,b)=>a.y-b.y);
  for(const p of bm){if(p===tgp)drawGlowPerson(p);if(p.loc==='band')drawShards(p);drawPerson(p);}
  drawBunting();
  if(dragP){drawShards(dragP);drawPerson(dragP);}
  for(const q of parts){const a=1-q.life/q.max;ctx.save();ctx.globalAlpha=Math.min(1,a*1.6);ctx.translate(q.x,q.y);ctx.rotate(q.r);const s=q.sz;tile(ctx,[-s,-s*0.5,s*0.9,-s*0.6,s,s*0.5,-s*0.8,s*0.6],q.col,1.1);ctx.restore();}
  drawHint();
}
function p_on_chair(p){return p.loc==='chair'&&p.near;}

/* ================= ループ ================= */
let running=false,raf=0,last=0;const PF={u:0,r:0,n:0};
function frame(ts){
  if(!running)return;raf=requestAnimationFrame(frame);
  const dt=Math.min(0.05,Math.max(0,(ts-last)/1000));last=ts;
  try{const t0=performance.now();update(dt);const t1=performance.now();render();const t2=performance.now();PF.u+=t1-t0;PF.r+=t2-t1;PF.n++;}catch(err){if(!frame.err){frame.err=1;console.warn(err);}}
}
function start(){if(running)return;running=true;last=performance.now();raf=requestAnimationFrame(frame);}
function stop(){running=false;cancelAnimationFrame(raf);}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stop();if(AC&&AC.state==='running')AC.suspend().catch(()=>{});}
  else{if(AC)AC.resume().catch(()=>{});nextT=0;flushEv();start();}
});
window.addEventListener('pagehide',()=>{stop();});
window.addEventListener('pageshow',()=>{if(!document.hidden)start();});
let rzT=0;
function resize(){
  W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  portrait=W<H*1.05;S=portrait?Math.min(W/400,H/800):Math.min(W/1200,H/800);VW=W/S;VH=H/S;
  readSafe();layout();SPR={};buildBG();snapAll();
  if(dragP){dragP.x=dragPos.x;dragP.y=dragPos.y;}
}
window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(resize,60);});
window.addEventListener('orientationchange',()=>{clearTimeout(rzT);rzT=setTimeout(resize,200);});
resize();
// 最初の見た目：椅子の人は座った状態から
for(const p of P){p.hat.lift=hatTarget(p.hair).lift+4;}
start();

/* 自動検査用の読み取り口（画面には出ない） */
const css=pt=>({x:pt.x*S,y:pt.y*S});
window.__gf={
  st:()=>({phase,chair,queue:queue.slice(),band:band.slice(),far:far.slice(),bpm:curBpm(),audio:AC?AC.state:'none',parts:parts.length,hint:!!hint,hintDone,idleT,
    people:P.map(p=>({id:p.id,role:p.role,hair:Object.assign({},p.hair),loc:p.loc,near:p.near,arrived:p.arrived,ready:isReady(p.hair),lift:+p.hat.lift.toFixed(1),tilt:+p.hat.tilt.toFixed(3),wob:+p.hat.wob.toFixed(3),hold:+p.an.hold.toFixed(2),stepA:p.an.stepA.slice(),bob:+p.an.bob.toFixed(3),brow:+p.an.brow.toFixed(2),lean:p.hat.tilt,shards:p.shards.length,x:p.x,y:p.y,s:p.s}))}),
  tuft:(k,seg)=>{const c=chairP();if(!c)return null;const len=c.hair[k];if(seg===undefined)seg=len;if(len===0)return css(fromHead(c,TD[k].rx,TD[k].ry));const a=tuftWorld(c,k,Math.max(0,seg-1)),b=tuftWorld(c,k,seg);return css({x:(a.x+b.x)/2,y:(a.y+b.y)/2});},
  tuftLine:(k,seg)=>{const c=chairP();const len=c.hair[k];seg=clamp(seg,1,len);const a=tuftWorld(c,k,seg-1),b=tuftWorld(c,k,seg);const dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l,m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};return[css({x:m.x-nx*50,y:m.y-ny*50}),css({x:m.x+nx*50,y:m.y+ny*50})];},
  person:id=>{const p=P[id];return css({x:p.x,y:p.y-150*p.s});},
  shard:i=>{const c=chairP();const s=c&&c.shards[i];return s?css({x:s.wx,y:s.wy}):null;},
  slot:i=>{const s=slotPos(i);return css({x:s.x,y:s.y-120*s.s});},
  chairPt:()=>{const c=chairPos();return css({x:c.x,y:c.y-200*c.s});},
  music:()=>musicLog.slice(),
  clearMusic:()=>{musicLog.length=0;},
  perf:()=>{const o={u:PF.u/Math.max(1,PF.n),r:PF.r/Math.max(1,PF.n),n:PF.n};PF.u=PF.r=PF.n=0;return o;},
  dbg:{}
};
})();
</script>
