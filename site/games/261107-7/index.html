<script>
(function(){
'use strict';
/* ============ 基本 ============ */
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const safeEl=document.getElementById('safe');
const TAU=Math.PI*2, K=64, NH=8, PI=Math.PI;
const COL={
  bg:'#272c1b', off:'#30361f', ygr:'#b5d34f', yel:'#f3d64a', dgr:'#3f6d33', dgy:'#575b51',
  body:'#a2a49b', bodyD:'#86887f', bodyL:'#b9bbb2', bezel:'#3b3d37',
  pad:'#e4e7c3', padD:'#c3c69f', padY:'#f0e3a2', padYD:'#d3c27c', ink:'#5d6056', inkL:'#7c7f74'
};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const ease=t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const angDist=(a,b)=>{let d=(a-b)%TAU;if(d<0)d+=TAU;return d>PI?TAU-d:d;};
const gauss=(d,s)=>Math.exp(-d*d/(2*s*s));
let TIME=0;

/* ============ 音 ============ */
const AU={c:null,m:null,nb:null,st:null};
function auInit(){
  try{
    if(!AU.c){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
      AU.c=new AC();
      AU.m=AU.c.createGain(); AU.m.gain.value=0.55;
      const comp=AU.c.createDynamicsCompressor();
      AU.m.connect(comp); comp.connect(AU.c.destination);
      const len=Math.floor(AU.c.sampleRate*0.6), b=AU.c.createBuffer(1,len,AU.c.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      AU.nb=b;
    }
    if(AU.c.state==='suspended'){const p=AU.c.resume(); if(p&&p.catch)p.catch(()=>{});}
  }catch(e){AU.c=null;}
}
function tone(f,d,o){
  o=o||{}; if(!AU.c)return;
  try{
    const c=AU.c,t=c.currentTime+(o.dl||0);
    const os=c.createOscillator(); os.type=o.ty||'sine'; os.frequency.setValueAtTime(f,t);
    if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t+d);
    const g=c.createGain(), v=o.g||0.2;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+(o.a||0.006)); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    let n=os;
    if(o.lp){const fl=c.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=o.lp; os.connect(fl); n=fl;}
    n.connect(g); g.connect(AU.m); os.start(t); os.stop(t+d+0.05);
  }catch(e){}
}
function noise(d,o){
  o=o||{}; if(!AU.c||!AU.nb)return;
  try{
    const c=AU.c,t=c.currentTime+(o.dl||0);
    const s=c.createBufferSource(); s.buffer=AU.nb;
    const f=c.createBiquadFilter(); f.type=o.ft||'bandpass'; f.frequency.value=o.f||1000; f.Q.value=o.q||1;
    const g=c.createGain(), v=o.g||0.1;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+(o.a||0.004)); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    s.connect(f); f.connect(g); g.connect(AU.m);
    s.start(t,Math.random()*0.3); s.stop(t+d+0.05);
  }catch(e){}
}
function stStart(){
  if(!AU.c)return; stStop();
  try{
    const c=AU.c,o1=c.createOscillator(),o2=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();
    o1.type='sawtooth'; o2.type='triangle'; f.type='lowpass'; f.frequency.value=300; f.Q.value=5; g.gain.value=0.0001;
    o1.frequency.value=72; o2.frequency.value=36;
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(AU.m); o1.start(); o2.start();
    AU.st={o1,o2,f,g};
  }catch(e){AU.st=null;}
}
function stSet(L,sp){
  if(!AU.st)return;
  try{
    const t=AU.c.currentTime, fr=62+L*48;
    AU.st.o1.frequency.setTargetAtTime(fr,t,0.04); AU.st.o2.frequency.setTargetAtTime(fr*0.5,t,0.04);
    AU.st.f.frequency.setTargetAtTime(220+L*260,t,0.05);
    AU.st.g.gain.setTargetAtTime(Math.min(0.17,0.015+sp*0.04+L*0.05),t,0.04);
  }catch(e){}
}
function stStop(){
  if(!AU.st)return; const s=AU.st; AU.st=null;
  try{const t=AU.c.currentTime; s.g.gain.setTargetAtTime(0.0001,t,0.03); s.o1.stop(t+0.25); s.o2.stop(t+0.25);}catch(e){}
}
const SFX={
  press(){tone(150,0.09,{ty:'triangle',g:0.26,f2:95}); noise(0.05,{f:420,q:1,g:0.07});},
  boing(stiff){const f=stiff?250:165; tone(f,0.42,{ty:'triangle',g:0.22,f2:f*0.45}); tone(f*1.5,0.28,{ty:'sine',g:0.08,f2:f*0.7,dl:0.04});},
  tick(){tone(520,0.04,{ty:'square',g:0.025,lp:1400});},
  click(){tone(760,0.035,{ty:'square',g:0.05,lp:2200});},
  blip(){tone(440,0.07,{ty:'square',g:0.06,f2:660,lp:2400}); tone(660,0.08,{ty:'square',g:0.05,dl:0.07,lp:2400});},
  plop(){tone(210,0.18,{ty:'sine',g:0.3,f2:70}); noise(0.06,{ft:'lowpass',f:500,g:0.08});},
  sizzle(d){noise(d,{ft:'highpass',f:2800,q:0.5,g:0.07,a:0.25});},
  bakeOn(){tone(85,0.35,{ty:'sawtooth',g:0.08,lp:280});},
  crack(){noise(0.025,{f:2600,q:2.5,g:0.16});},
  chomp(){noise(0.07,{ft:'lowpass',f:900,q:1,g:0.24}); tone(240,0.08,{ty:'square',g:0.05,f2:150,lp:900});},
  crisp(){for(let i=0;i<4;i++)noise(0.025,{f:2800+i*500,q:3,g:0.17,dl:i*0.05});},
  success(){[523,659,784,1047].forEach((f,i)=>tone(f,0.2,{ty:'square',g:0.06,dl:i*0.085,lp:3000})); tone(1047,0.5,{ty:'triangle',g:0.08,dl:0.34});},
  share(){[[659,784],[880,1047],[784,988],[1047,1319]].forEach((p,i)=>p.forEach(f=>tone(f,0.3,{ty:'triangle',g:0.07,dl:i*0.15})));},
  snap(){tone(420,0.13,{ty:'triangle',g:0.2,f2:110}); noise(0.05,{f:1300,g:0.1});},
  laugh(){[720,600,720,600,720].forEach((f,i)=>tone(f,0.08,{ty:'triangle',g:0.07,dl:i*0.1,f2:f*0.82}));},
  swap(){tone(300,0.5,{ty:'sine',g:0.13,f2:900}); tone(900,0.45,{ty:'sine',g:0.1,f2:380,dl:0.5}); [392,523,659,784].forEach((f,i)=>tone(f,0.15,{ty:'square',g:0.05,dl:1.0+i*0.1,lp:2500}));},
  feast(){const m=[523,587,659,784,659,784,1047];m.forEach((f,i)=>{tone(f,0.22,{ty:'square',g:0.05,dl:i*0.14,lp:2600}); tone(f/2,0.22,{ty:'triangle',g:0.06,dl:i*0.14});});},
  wobble(){tone(300,0.12,{ty:'sine',g:0.06,f2:240});}
};

/* ============ レイアウト ============ */
let VW=0,VH=0,DPR=1;
const LY={lcd:{},lcdO:{},panel:{},ring:{},bake:{},memPads:[]};
const S={};
function readSafe(){
  try{const cs=getComputedStyle(safeEl);return{t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};}
  catch(e){return{t:0,r:0,b:0,l:0};}
}
function resize(){
  VW=Math.max(200,window.innerWidth); VH=Math.max(200,window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(VW*DPR); cv.height=Math.round(VH*DPR);
  const s=readSafe();
  const x0=s.l+10,x1=VW-s.r-10,y0=s.t+10,y1=VH-s.b-10;
  const cw=x1-x0,ch=y1-y0;
  const portrait=VW/VH<1.1;
  const lh=Math.round(ch*(portrait?0.47:0.52));
  LY.lcdO={x:x0,y:y0,w:cw,h:lh};
  LY.lcd={x:x0+8,y:y0+8,w:cw-16,h:lh-16};
  LY.panel={x:x0,y:y0+lh+8,w:cw,h:ch-lh-8};
  sceneLayout(); panelLayout();
  clampRest();
  if(AP)endPointer();
}
function sceneLayout(){
  const W=LY.lcd.w,H=LY.lcd.h; S.W=W;S.H=H;
  const wide=W/H>1.55; S.wide=wide;
  if(!wide){
    S.hr=0.068*Math.min(W,H*1.05);
    S.seatY=Math.max(1.9*S.hr,0.11*H);
    S.s1x=0.25*W; S.s2x=0.75*W; S.midx=0.5*W;
    S.counterY=S.seatY+1.85*S.hr; S.cx0=0; S.cx1=W;
    S.workX=Math.max(0.1*W,1.3*S.hr); S.workY=S.counterY+2.5*S.hr;
    const top=S.counterY+0.35*S.hr;
    S.cx=0.58*W; S.cy=top+(0.84*H-top)*0.5;
    S.R0=Math.min(0.145*W,(0.84*H-top)*0.33);
    S.bx0=S.workX+1.25*S.hr; S.bx1=W-5; S.by0=top; S.by1=H-5;
    const mw=0.19*W, mh=Math.min(0.13*H,mw*0.8);
    S.mem=[0.40,0.63,0.86].map(f=>({x:f*W,y:H-mh-6,w:mw,h:mh}));
  }else{
    S.hr=0.085*H;
    S.seatY=Math.max(1.9*S.hr,0.2*H);
    S.s1x=0.71*W; S.s2x=0.89*W; S.midx=0.80*W;
    S.counterY=S.seatY+1.85*S.hr; S.cx0=0.62*W; S.cx1=W;
    S.workX=0.07*W; S.workY=0.38*H;
    S.cx=0.36*W; S.cy=0.5*H; S.R0=Math.min(0.2*H,0.085*W);
    S.bx0=S.workX+1.25*S.hr; S.bx1=0.61*W; S.by0=5; S.by1=H-5;
    const mw=0.1*W, mh=Math.min(0.2*H,mw*0.8);
    S.mem=[0.68,0.80,0.92].map(f=>({x:f*W,y:H-mh-6,w:mw,h:mh}));
  }
}
function panelLayout(){
  const P=LY.panel,L=LY.lcd;
  if(!S.wide){
    const mh=Math.min(46,P.h*0.12);
    LY.memPads=S.mem.map(m=>({x:L.x+m.x-m.w/2,y:P.y+8,w:m.w,h:mh}));
    const bh=Math.min(58,P.h*0.15);
    const top=P.y+8+mh+12,bot=P.y+P.h-8-bh-10;
    const Rr=Math.max(30,Math.min((bot-top)/2.9,P.w/3.0));
    LY.ring={x:clamp(L.x+S.cx,P.x+Rr*1.5,P.x+P.w-Rr*1.5),y:(top+bot)/2,r:Rr};
    const bw=Math.min(P.w*0.62,330);
    LY.bake={x:P.x+P.w/2-bw/2,y:P.y+P.h-8-bh,w:bw,h:bh};
  }else{
    const mh=Math.min(80,P.h*0.28);
    LY.memPads=S.mem.map(m=>({x:L.x+m.x-m.w/2,y:P.y+8,w:m.w,h:mh}));
    const Rr=Math.max(30,Math.min((P.h-16)/2.9,P.w*0.16));
    const rx=clamp(L.x+S.cx,P.x+Rr*1.5+120,P.x+P.w*0.55);
    LY.ring={x:rx,y:P.y+P.h/2,r:Rr};
    const right=rx-Rr*1.5-14, left=P.x+10, bw=Math.max(80,Math.min(240,right-left)), bh=Math.min(76,P.h*0.3);
    LY.bake={x:right-bw,y:P.y+P.h/2-bh/2,w:bw,h:bh};
  }
}

/* ============ 生地モデル ============ */
const pts=[]; for(let i=0;i<K;i++)pts.push({x:0,y:0,vx:0,vy:0,rx:0,ry:0});
const mass=new Float32Array(K), len0=new Float32Array(K), rb=new Float32Array(K), thR=new Float32Array(K), thC=new Float32Array(K), curlR=new Float32Array(K), SEC=new Float32Array(K);
const TX=new Float32Array(K), TY=new Float32Array(K), LXa=new Float32Array(K), LYa=new Float32Array(K);
const D={pull:null,pulls:0,baked:0,vis:1,lastH:-1};
const PHI=[]; for(let i=0;i<K;i++)PHI.push(i*TAU/K);
function makeRound(sc){
  sc=sc||1;
  for(let i=0;i<K;i++){const p=pts[i],c=Math.cos(PHI[i]),s=Math.sin(PHI[i]); p.rx=c;p.ry=s;p.x=c*sc;p.y=s*sc;p.vx=0;p.vy=0; rb[i]=0;curlR[i]=0;}
  for(let i=0;i<K;i++){mass[i]=0.5*Math.sin(TAU/K);len0[i]=2*Math.sin(PI/K);}
  D.baked=0; D.pulls=0; D.lastH=-1; D.pull=null; D.vis=1;
  calcTh(true,thR);
}
function calcTh(useRest,out){
  for(let i=0;i<K;i++){
    const a=pts[i],b=pts[(i+1)%K];
    const ax=useRest?a.rx:a.x,ay=useRest?a.ry:a.y,bx=useRest?b.rx:b.x,by=useRest?b.ry:b.y;
    const at=mass[i]/Math.max(0.0015,0.5*(ax*by-ay*bx));
    const lt=len0[i]/Math.max(0.004,Math.hypot(bx-ax,by-ay));
    SEC[i]=Math.sqrt(Math.max(0.01,at)*clamp(lt,0.05,4));
  }
  for(let i=0;i<K;i++)out[i]=clamp((SEC[(i+K-1)%K]+SEC[i])*0.5,0.12,3);
}
function softAt(i){return clamp(Math.pow(thR[i],-0.75)/(1+0.9*rb[i]),0.4,2.1);}
function bnd(){return{x0:(S.bx0-S.cx)/S.R0+0.04,x1:(S.bx1-S.cx)/S.R0-0.04,y0:(S.by0-S.cy)/S.R0+0.04,y1:(S.by1-S.cy)/S.R0-0.04};}
function clampRest(){
  if(!S.R0)return; const b=bnd();
  for(const p of pts){p.rx=clamp(p.rx,b.x0,b.x1);p.ry=clamp(p.ry,b.y0,b.y1);}
}
function beginPull(h,demo){
  const th=h*TAU/NH,ux=Math.cos(th),uy=Math.sin(th);
  let sw=0,ss=0;
  for(let i=0;i<K;i++){const w=gauss(angDist(PHI[i],th),0.35);sw+=w;ss+=w*softAt(i);}
  D.pull={h,D:{x:0,y:0},sig:0.3,softH:ss/sw,press:demo?0:1,demo:!!demo,ext:0,tan:0};
  if(!demo){
    for(let i=0;i<K;i++){
      const w=gauss(angDist(PHI[i],th),0.32),p=pts[i];
      p.x-=ux*w*0.085; p.y-=uy*w*0.085; p.vx-=ux*w*0.8; p.vy-=uy*w*0.8;
    }
  }
}
function computeTargets(){
  const P=D.pull;
  if(!P){for(let i=0;i<K;i++){TX[i]=pts[i].rx;TY[i]=pts[i].ry;}return;}
  const th=P.h*TAU/NH,ux=Math.cos(th),uy=Math.sin(th),tx=-uy,ty=ux;
  const dr=P.D.x*ux+P.D.y*uy, dt=P.D.x*tx+P.D.y*ty, dl=Math.hypot(P.D.x,P.D.y);
  const drE=dr>0?dr:Math.max(dr*0.5,-0.18);
  const dtE=clamp(dt,-0.4,0.4)*0.35;
  let ob=0; if(dl>0.1)ob=Math.atan2(Math.abs(dt),Math.max(dr,0.001));
  const sigT=lerp(0.3,0.8,smooth(0.35,0.85,ob)); P.sig+=(sigT-P.sig)*0.25;
  const sig=P.sig,s=P.softH;
  P.press=Math.max(0,P.press-0.0);
  const press=Math.max(0,1-dl/0.12)*P.press;
  const ext=Math.max(0,drE)*s; P.ext=ext; P.tan=Math.abs(dtE)*s;
  const neck=0.75*ext*sig*sig/0.5;
  const b=bnd(), back=th+PI;
  for(let i=0;i<K;i++){
    const p=pts[i],phi=PHI[i];
    const w=gauss(angDist(phi,th),sig);
    let X=p.rx+w*(ux*drE*s+tx*dtE*s)-w*ux*press*0.09;
    let Y=p.ry+w*(uy*drE*s+ty*dtE*s)-w*uy*press*0.09;
    const dn=Math.min(angDist(phi,th+PI/2),angDist(phi,th-PI/2));
    const gc=gauss(dn,0.6)*(1-w);
    const rr=Math.hypot(p.rx,p.ry)||1;
    X-=p.rx/rr*neck*gc; Y-=p.ry/rr*neck*gc;
    const pw=1-smooth(0.45,0.8,angDist(phi,back));
    X=lerp(X,p.rx,pw); Y=lerp(Y,p.ry,pw);
    const r2=Math.hypot(X,Y); if(r2<0.32){X*=0.32/r2;Y*=0.32/r2;}
    TX[i]=clamp(X,b.x0,b.x1); TY[i]=clamp(Y,b.y0,b.y1);
  }
}
function releasePull(){
  const P=D.pull; if(!P)return; D.pull=null;
  if(P.demo)return;
  stStop();
  const Lraw=Math.hypot(P.D.x,P.D.y), th=P.h*TAU/NH;
  const L=P.ext+P.tan*0.5;
  const Pf=smooth(0.1,0.5,L)*clamp(0.5+0.3*(P.softH-1),0.3,0.85);
  for(let i=0;i<K;i++){const p=pts[i];p.rx+=Pf*(TX[i]-p.rx);p.ry+=Pf*(TY[i]-p.ry);}
  const g=0.26*(1-smooth(0.08,0.3,Lraw));
  if(g>0.005)for(let i=0;i<K;i++)rb[i]=Math.min(1.6,rb[i]+g*gauss(angDist(PHI[i],th),0.3));
  smoothRest(0.12); fixMono(); clampRest();
  calcTh(true,thR);
  if(L>0.12){D.pulls++;D.lastH=P.h;}
  SFX.boing(Pf<0.42);
  const e=edgeLCD(P.h*8); puff(e.x,e.y,5,COL.ygr,40);
}
function smoothRest(l){
  const ox=[],oy=[];
  for(let i=0;i<K;i++){ox.push(pts[i].rx);oy.push(pts[i].ry);}
  for(let i=0;i<K;i++){const a=(i+K-1)%K,b=(i+1)%K;pts[i].rx=lerp(ox[i],(ox[a]+ox[b])/2,l);pts[i].ry=lerp(oy[i],(oy[a]+oy[b])/2,l);}
}
function fixMono(){
  let prev=Math.atan2(pts[0].ry,pts[0].rx);
  for(let i=1;i<K;i++){
    const p=pts[i],r=Math.hypot(p.rx,p.ry);let a=Math.atan2(p.ry,p.rx);
    while(a<prev-PI)a+=TAU; while(a>prev+PI)a-=TAU;
    if(a<prev+0.015){a=prev+0.015;p.rx=Math.cos(a)*r;p.ry=Math.sin(a)*r;}
    prev=a;
  }
}
function stepDough(dt){
  computeTargets();
  const P=D.pull, k=P?320:150, c=P?28:7.5, kn=30;
  const n=Math.max(1,Math.ceil(dt/0.008)), h=dt/n;
  for(let s=0;s<n;s++){
    for(let i=0;i<K;i++){
      const p=pts[i],a=pts[(i+K-1)%K],b=pts[(i+1)%K];
      const dx=p.x-TX[i],dy=p.y-TY[i];
      const ax=a.x-TX[(i+K-1)%K],ay=a.y-TY[(i+K-1)%K],bx=b.x-TX[(i+1)%K],by=b.y-TY[(i+1)%K];
      p.vx+=(-k*dx-c*p.vx+kn*((ax+bx)*0.5-dx))*h;
      p.vy+=(-k*dy-c*p.vy+kn*((ay+by)*0.5-dy))*h;
    }
    for(let i=0;i<K;i++){const p=pts[i];p.x+=p.vx*h;p.y+=p.vy*h;}
  }
  for(let i=0;i<K;i++){LXa[i]=pts[i].x;LYa[i]=pts[i].y;}
  calcTh(false,thC);
}
function nudgeDough(x,y,amt){
  for(let i=0;i<K;i++){const p=pts[i];const d=Math.hypot(p.x*S.R0+S.cx-x,p.y*S.R0+S.cy-y)/S.R0;const w=Math.exp(-d*d*2)*amt;p.vx+=(p.x)*w*1.5;p.vy+=(p.y)*w*1.5;}
}
function edgeLCD(i){const p=pts[i%K];return{x:S.cx+p.x*S.R0,y:S.cy+p.y*S.R0};}

/* ============ 具 ============ */
const TOPS=[
  {kind:'T',m:{x:-0.12,y:0.46},offs:[{x:0,y:-0.15},{x:0.13,y:0.08},{x:-0.13,y:0.08}],r:0.12,moved:0},
  {kind:'M',m:{x:0.36,y:-0.36},offs:[{x:0.12,y:0},{x:-0.06,y:0.11},{x:-0.06,y:-0.11}],r:0.085,moved:0}
];
TOPS.forEach(t=>{let s=0,n=0;for(let a=0;a<3;a++)for(let b=a+1;b<3;b++){s+=Math.hypot(t.offs[a].x-t.offs[b].x,t.offs[a].y-t.offs[b].y);n++;}t.md=s/n;});
function mapArr(X,Y,mx,my,o){
  let r=Math.hypot(mx,my); if(r>0.97){mx*=0.97/r;my*=0.97/r;r=0.97;}
  let a=Math.atan2(my,mx); if(a<0)a+=TAU;
  const f=a/TAU*K,i0=Math.floor(f)%K,i1=(i0+1)%K,t=f-Math.floor(f);
  const ex=lerp(X[i0],X[i1],t),ey=lerp(Y[i0],Y[i1],t),ux=Math.cos(a),uy=Math.sin(a);
  o.x=ux*r+(ex-ux)*r*r; o.y=uy*r+(ey-uy)*r*r; return o;
}
function topsMapped(X,Y){
  return TOPS.map(t=>({kind:t.kind,r:t.r,ma:Math.atan2(t.m.y,t.m.x),P:t.offs.map(of=>mapArr(X,Y,t.m.x+of.x,t.m.y+of.y,{x:0,y:0}))}));
}

/* ============ スナップショットと形の解析 ============ */
function snapNow(){
  const X=new Float32Array(K),Y=new Float32Array(K);
  for(let i=0;i<K;i++){X[i]=pts[i].rx;Y[i]=pts[i].ry;}
  calcTh(true,thR);
  const th=Float32Array.from(thR),r=Float32Array.from(rb),cu=new Float32Array(K);
  for(let i=0;i<K;i++)cu[i]=clamp((0.68-(th[i]+0.6*r[i]))/0.25,0,1);
  return {X,Y,th,rb:r,curl:cu,tops:topsMapped(X,Y),baked:1,mass:Float32Array.from(mass),len0:Float32Array.from(len0)};
}
function centroid(s,clip){
  let x=0,y=0,n=0;
  for(let i=0;i<K;i++){
    if(clip&&((s.X[i]-clip.qx)*clip.nx+(s.Y[i]-clip.qy)*clip.ny)<0)continue;
    x+=s.X[i];y+=s.Y[i];n++;
  }
  if(clip){x+=clip.qx*3;y+=clip.qy*3;n+=3;}
  return {x:x/Math.max(1,n),y:y/Math.max(1,n)};
}
function waistOf(X,Y){
  let cx=0,cy=0; for(let i=0;i<K;i++){cx+=X[i];cy+=Y[i];} cx/=K;cy/=K;
  let xx=0,xy=0,yy=0; for(let i=0;i<K;i++){const dx=X[i]-cx,dy=Y[i]-cy;xx+=dx*dx;xy+=dx*dy;yy+=dy*dy;}
  const ang=0.5*Math.atan2(2*xy,xx-yy),ux=Math.cos(ang),uy=Math.sin(ang),vx=-uy,vy=ux;
  let tmin=1e9,tmax=-1e9;
  for(let i=0;i<K;i++){const t=(X[i]-cx)*ux+(Y[i]-cy)*uy;if(t<tmin)tmin=t;if(t>tmax)tmax=t;}
  const N=30,ws=[],tsv=[];
  for(let s=1;s<N;s++){
    const t=tmin+(tmax-tmin)*s/N; let mn=1e9,mx=-1e9;
    for(let i=0;i<K;i++){
      const j=(i+1)%K;
      const ta=(X[i]-cx)*ux+(Y[i]-cy)*uy, tb=(X[j]-cx)*ux+(Y[j]-cy)*uy;
      if((ta-t)*(tb-t)<=0&&ta!==tb){
        const f=(t-ta)/(tb-ta),px=X[i]+(X[j]-X[i])*f,py=Y[i]+(Y[j]-Y[i])*f;
        const v=(px-cx)*vx+(py-cy)*vy; if(v<mn)mn=v; if(v>mx)mx=v;
      }
    }
    ws.push(mx>mn?mx-mn:0); tsv.push(t);
  }
  const n=ws.length,a0=Math.floor(n*0.2),a1=Math.ceil(n*0.8);
  let mi=a0; for(let s=a0;s<a1;s++)if(ws[s]<ws[mi])mi=s;
  let lm=0,rm=0; for(let s=0;s<mi;s++)lm=Math.max(lm,ws[s]); for(let s=mi+1;s<n;s++)rm=Math.max(rm,ws[s]);
  const side=Math.min(lm,rm), ratio=ws[mi]/Math.max(0.01,side), len=tmax-tmin;
  return {ok:ratio<0.8&&len>2.3&&side>0.95, ang,ux,uy,cx,cy,tm:tsv[mi],wmin:ws[mi],ratio,len};
}
function analyze(s){
  const r=new Float32Array(K); for(let i=0;i<K;i++)r[i]=Math.hypot(s.X[i],s.Y[i]);
  const ears=[], TH=1.32;
  let st=-1; for(let i=0;i<K;i++)if(r[i]<=TH){st=i;break;}
  if(st>=0){
    let i=0;
    while(i<K){
      const idx=(st+i)%K;
      if(r[idx]>TH){
        let pk=idx,cnt=0;
        while(i<K&&r[(st+i)%K]>TH){const j=(st+i)%K;if(r[j]>r[pk])pk=j;cnt++;i++;}
        const span=cnt*TAU/K;
        if(r[pk]>1.34&&span<=1.3)ears.push({i:pk,r:r[pk],a:Math.atan2(s.Y[pk],s.X[pk]),span});
      }else i++;
    }
  }
  const w=waistOf(s.X,s.Y);
  let ri=0; for(let i=0;i<K;i++)if(s.rb[i]>s.rb[ri])ri=i;
  let spread=0,sc=null;
  s.tops.forEach((t,ti)=>{
    let sum=0,n=0; for(let a=0;a<3;a++)for(let b=a+1;b<3;b++){sum+=Math.hypot(t.P[a].x-t.P[b].x,t.P[a].y-t.P[b].y);n++;}
    let sp=(sum/n)/TOPS[ti].md;
    let a=t.ma; if(a<0)a+=TAU; const ei=Math.round(a/TAU*K)%K; const er=Math.max(r[ei],r[(ei+1)%K],r[(ei+K-1)%K]);
    if(er<1.3)sp=Math.min(sp,1.0+(sp-1)*0.3);
    else sp=Math.max(sp,1.0+(er-1)*0.9);
    if(sp>spread){spread=sp;sc={x:(t.P[0].x+t.P[1].x+t.P[2].x)/3,y:(t.P[0].y+t.P[1].y+t.P[2].y)/3};}
  });
  let two=null;
  for(let a=0;a<ears.length;a++)for(let b=a+1;b<ears.length;b++){
    if(angDist(ears[a].a,ears[b].a)>2.2&&(!two||ears[a].r+ears[b].r>two[0].r+two[1].r))two=[ears[a],ears[b]];
  }
  return {ears,two,waist:w.ok?w:null,wInfo:w,rimI:ri,rimV:s.rb[ri],spread,sc};
}
function nearestIdx(s,x,y){let bi=0,bd=1e9;for(let i=0;i<K;i++){const d=(s.X[i]-x)**2+(s.Y[i]-y)**2;if(d<bd){bd=d;bi=i;}}return bi;}
function dirIdx(s,ax,ay){let bi=0,bd=-1e9;for(let i=0;i<K;i++){const d=s.X[i]*ax+s.Y[i]*ay;if(d>bd){bd=d;bi=i;}}return bi;}
/* 持ち方を決める（正解形の照合ではなく、形の特徴から手の使い方を選ぶ） */
function plan(s,an,mitt){
  const opp=i=>(i+K/2)%K;
  let type,specs,bite,mouth,regrip=null,plate=false,gi=[];
  if(an.spread>1.3&&an.sc){
    type='plate'; plate=true;
    const L=Math.hypot(an.sc.x,an.sc.y)||1;
    const bi=dirIdx(s,an.sc.x/L,an.sc.y/L); bite={x:s.X[bi],y:s.Y[bi]};
    specs=[{at:'plate',side:-1,t:mitt?'under':'under'},{at:'side',side:1,t:mitt?'mitt':'pinch'}];
    mouth='mid';
  }else if(an.two){
    type='two';
    const e1=an.two[0].i,e2=an.two[1].i;
    const ea=Math.atan2(s.Y[e1]-s.Y[e2],s.X[e1]-s.X[e2]);
    let bi=dirIdx(s,Math.cos(ea-PI/2),Math.sin(ea-PI/2));
    bite={x:s.X[bi],y:s.Y[bi]};
    const f=mitt?0.78:0.92;
    specs=[{at:'pt',i:e1,f,t:mitt?'mitt':'pinch'},{at:'pt',i:e2,f,t:mitt?'mitt':'pinch'}];
    gi=[e1,e2]; mouth='wide';
  }else if(an.ears.length){
    type='pinch';
    let e=an.ears[0]; for(const q of an.ears)if(q.r>e.r)e=q;
    const bi=opp(e.i); bite={x:s.X[bi],y:s.Y[bi]};
    specs=[{at:'pt',i:e.i,f:mitt?0.74:0.9,t:mitt?'mitt':'pinch'}];
    gi=[e.i]; mouth=mitt?'wide':'o';
  }else if(an.rimV>0.42){
    type='wrap';
    const bi=opp(an.rimI); bite={x:s.X[bi],y:s.Y[bi]};
    specs=[{at:'pt',i:an.rimI,f:0.97,t:mitt?'mitt':'wrap'}];
    gi=[an.rimI]; mouth='wide';
  }else{
    type='flat';
    const bi=dirIdx(s,0,-1); bite={x:s.X[bi],y:s.Y[bi]};
    specs=[{at:'side',side:-1,t:mitt?'mitt':'flat'},{at:'side',side:1,t:mitt?'mitt':'flat'}];
    mouth=mitt?'wide':'mid';
  }
  if(type==='flat'){
    const c=centroid(s),up={x:bite.x-c.x,y:bite.y-c.y},q={x:-up.y,y:up.x};
    gi=[dirIdx(s,q.x,q.y),dirIdx(s,-q.x,-q.y)];
  }
  let maxCurl=0; for(const i of gi)for(let d=-2;d<=2;d++)maxCurl=Math.max(maxCurl,s.curl[(i+d+K)%K]);
  if(maxCurl>0.5&&type!=='plate'){
    regrip=[{at:'low',t:'under'}];
    if(specs.length>1)regrip.push({at:'side',side:1,t:mitt?'mitt':'flat'});
  }
  return {type,specs,bite,mouth,regrip,plate,curl:maxCurl};
}

/* ============ 座標変換 ============ */
function T(tr,x,y,o){
  const c=Math.cos(tr.rot),s=Math.sin(tr.rot),dx=(x-tr.px)*tr.s,dy=(y-tr.py)*tr.s;
  o=o||{}; o.x=tr.ox+c*dx-s*dy; o.y=tr.oy+s*dx+c*dy; return o;
}
function standTr(){return{ox:S.cx,oy:S.cy,s:S.R0,rot:0,px:0,py:0};}
function pivotTo(tr,p){const q=T(tr,p.x,p.y);return{ox:q.x,oy:q.y,s:tr.s,rot:tr.rot,px:p.x,py:p.y};}
function trLerp(a,b,t){
  let dr=(b.rot-a.rot)%TAU; if(dr>PI)dr-=TAU; if(dr<-PI)dr+=TAU;
  return{ox:lerp(a.ox,b.ox,t),oy:lerp(a.oy,b.oy,t),s:lerp(a.s,b.s,t),rot:a.rot+dr*t,px:lerp(a.px,b.px,t),py:lerp(a.py,b.py,t)};
}
function holdS(sc){return S.R0*(sc||0.7);}
function holdTr(bite,c,a,lift,sc){
  const beta=Math.atan2(bite.y-c.y,bite.x-c.x);
  return{ox:a.x,oy:a.y+S.hr*(1.0-(lift||0)),s:holdS(sc),rot:-PI/2-beta,px:bite.x,py:bite.y};
}

const A={

ACTORS.forEach(a=>{a.x=0;a.y=0;a.mv=null;a.at=null;a.jig=0;a.bl=2+Math.random()*3;a.blink=0;a.mouth='smile';a.mo=0;a.eyes='open';a.handFn=null;a.lookFn=null;a.lx=0;a.ly=0;a.gest=Math.random()*3;});
function stPos(st){
  switch(st){
    case 'work':return{x:S.workX,y:S.workY};

}
function actorAt(st){return ACTORS.find(a=>a.st===st&&!a.mv);}
function seated(a){return !a.mv&&!a.at&&a.st!=='work';}
function moveTo(a,to,d,after,hop){
  a.mv={fx:a.x,fy:a.y,to,t:0,d,after,hop:hop==null?1:hop};
}
function seatX(a){return a.st==='seat2'?S.s2x:a.st==='mid'?S.midx:S.s1x;}
function leanTo(a,xf,d){a.lean=true;moveTo(a,()=>({x:xf(),y:S.counterY+S.hr*0.35}),d,null,0.25);}
function unlean(a,st,d){moveTo(a,st,d,()=>{a.lean=false;},0.4);}
function leanX(a){const x=seatX(a);return S.wide?x:lerp(x,S.W*0.5,0.28);}
function updActor(a,dt){
  if(a.mv){
    const m=a.mv; m.t+=dt; const p=clamp(m.t/m.d,0,1),e=ease(p);
    const tp=typeof m.to==='function'?m.to():stPos(m.to);
    a.x=lerp(m.fx,tp.x,e); a.y=lerp(m.fy,tp.y,e)-(Math.sin(p*PI)*S.hr*1.1+Math.abs(Math.sin(p*PI*4))*S.hr*0.15)*m.hop;
    if(p>=1){a.mv=null; if(typeof m.to==='function'){a.at=m.to;}else{a.st=m.to;a.at=null;} if(m.after)m.after();}
  }else if(a.at){const p=a.at();a.x=p.x;a.y=p.y;}
  else{const p=stPos(a.st);a.x=p.x;a.y=p.y;}
  a.jig=Math.max(0,a.jig-dt*2.5);
  a.bl-=dt; if(a.bl<0){a.blink=0.14;a.bl=2.5+Math.random()*3;} a.blink=Math.max(0,a.blink-dt);
  a.gest+=dt;
  // 視線
  let L=null;
  if(a.lookFn)L=a.lookFn();
  else L=defaultLook(a);
  if(L){const dx=L.x-a.x,dy=L.y-a.y,dl=Math.hypot(dx,dy)||1;a.lx=lerp(a.lx,dx/dl,0.2);a.ly=lerp(a.ly,dy/dl,0.2);}
}

/* ============ シーケンス ============ */
function runSeq(steps){G.seq={steps,i:0,t:0}; const s=steps[0]; if(s&&s.s)s.s();}
function updSeq(dt){
  const q=G.seq; if(!q)return;
  const s=q.steps[q.i]; q.t+=dt;
  const p=clamp(q.t/s.d,0,1);
  if(s.u)s.u(p);
  if(q.t>=s.d){
    if(s.e)s.e();
    if(G.seq!==q)return;
    q.i++; q.t=0;
    if(q.i>=q.steps.length){G.seq=null;return;}
    const n=q.steps[q.i]; if(n.s)n.s();
  }
}
function makerA(){return ACTORS.find(a=>a.st==='work');}
function startBake(){
  G.mode='bake'; SFX.bakeOn(); SFX.sizzle(1.35);
  calcTh(true,thR);
  for(let i=0;i<K;i++)curlR[i]=clamp((0.68-(thR[i]+0.6*rb[i]))/0.25,0,1);
  let ck=0;
  runSeq([{d:1.35,u:p=>{
      D.baked=p;
      if(p*12>ck){ck++;SFX.crack(); const i=Math.floor(Math.random()*K),e=edgeLCD(i); if(Math.random()<0.6)puff(e.x,e.y,1,COL.yel,25);}
    },e:()=>{D.baked=1; const snap=snapNow(); D.vis=0; startDelivery(snap);}}]);
}
function startDelivery(snap){
  G.mode='deliver';
  const an=analyze(snap);
  const mk=makerA(),r1=actorAt('seat1'),r2=actorAt('seat2');
  const h={snap,tr:standTr(),bites:[],clip:null,plate:null};
  if(an.waist){seqShare(h,an,mk,r1,r2,false);return;}
  const rc=G.dn%2===0?r1:r2;
  const pl=plan(snap,an,rc.hand==='mitt');
  if(pl.type==='two'&&Math.random()<0.2){seqShare(h,an,mk,r1,r2,true);return;}
  seqSingle(h,an,pl,mk,rc);
}
function carryHands(h){return()=>{const c=T(h.tr,h.cx||0,h.cy||0);const w=h.tr.s*0.9;return[{x:c.x-w,y:c.y+w*0.5,t:'flat',rot:-0.3},{x:c.x+w,y:c.y+w*0.5,t:'flat',rot:PI+0.3}];};}
function resolveHands(h,specs){
  const tr=h.tr,s=h.snap,out=[];
  const c=T(tr,h.cx,h.cy);
  for(const sp of specs){
    let p=null;
    if(sp.at==='pt'){p=T(tr,s.X[sp.i]*sp.f,s.Y[sp.i]*sp.f);}
    else if(sp.at==='low'||sp.at==='side'){
      let best=null,bv=-1e9;
      for(let i=0;i<K;i++){
        if(h.clip&&((s.X[i]-h.clip.qx)*h.clip.nx+(s.Y[i]-h.clip.qy)*h.clip.ny)<-0.02)continue;
        const q=T(tr,s.X[i]*0.92,s.Y[i]*0.92);
        const v=sp.at==='low'?q.y:q.x*sp.side;
        if(v>bv){bv=v;best=q;}
      }
      p=best||c;
      if(sp.at==='low')p={x:lerp(p.x,c.x,0.3),y:p.y+S.hr*0.12};
    }else if(sp.at==='plate'){
      const pl=h.plate||{x:c.x,y:c.y+S.hr,w:S.hr*2};
      p={x:pl.x+sp.side*pl.w*0.5,y:pl.y+S.hr*0.08};
    }
    if(!p)p=c;
    let rot=Math.atan2(c.y-p.y,c.x-p.x);
    if(sp.t==='under')rot=0;
    out.push({x:p.x,y:p.y,t:sp.t,rot});
  }

}
function setGripHands(rc,h,specs){rc.handFn=()=>resolveHands(h,specs);}
function memSlotPos(){const m=S.mem[0];return{x:m.x,y:m.y+m.h/2};}
function flyToMem(h,p){

function biteSteps(list){

function target(){
  if(G.mode!=='make'||G.seq)return null;
  if(G.memInvite&&memory.length)return{k:'mem',i:0};
  if(G.total>=3&&!TOPS[1].moved&&!TOPS[0].moved&&D.pulls===0)return{k:'top',i:1};
  if(D.pulls===0)return{k:'h',i:SUGS[G.sug]};
  if(D.pulls===1&&D.lastH>=0)return{k:'h',i:(D.lastH+4)%NH};
  return{k:'bake'};
}
function targetLCD(t){
  if(!t)return null;
  if(t.k==='h')return edgeLCD(t.i*8);
  if(t.k==='bake')return{x:S.cx,y:S.cy+S.R0*1.3};
  if(t.k==='mem'){const m=S.mem[t.i];return{x:m.x,y:m.y+m.h/2};}
  if(t.k==='top'){const o=mapArr(LXa,LYa,TOPS[t.i].m.x,TOPS[t.i].m.y,{x:0,y:0});return{x:S.cx+o.x*S.R0,y:S.cy+o.y*S.R0};}
  return null;
}
function defaultLook(a){

    if(D.pull)return edgeLCD(D.pull.h*8);
    const t=targetLCD(target()); if(t)return t;

    if(t>0.65&&t<1.45){
      if(!D.pull)beginPull(dm.tg.i,true);
      if(D.pull&&D.pull.demo){const e=smooth(0.65,1.35,t)*0.55;D.pull.D.x=Math.cos(th)*e;D.pull.D.y=Math.sin(th)*e;}
    }else if(t>=1.45&&D.pull&&D.pull.demo){D.pull=null;}
  }
  if(t>=dm.d)cancelDemo();
}
function demoFinger(){
  const dm=G.demo; if(!dm)return null;
  const t=dm.t; let tgt=null,drag={x:0,y:0},press=0;
  const R=LY.ring;
  if(dm.tg.k==='h'){const th=dm.tg.i*TAU/NH;tgt={x:R.x+Math.cos(th)*R.r*1.16,y:R.y+Math.sin(th)*R.r*1.16};const e=smooth(0.65,1.35,t)*(t<1.45?1:0)*0.55*R.r;drag={x:Math.cos(th)*e,y:Math.sin(th)*e};}
  else if(dm.tg.k==='bake'){const b=LY.bake;tgt={x:b.x+b.w/2,y:b.y+b.h*0.4};}
  else if(dm.tg.k==='mem'){const m=LY.memPads[dm.tg.i];tgt={x:m.x+m.w/2,y:m.y+m.h/2};}
  else if(dm.tg.k==='top'){const tp=TOPS[dm.tg.i];tgt={x:R.x+tp.m.x*R.r,y:R.y+tp.m.y*R.r};const e=Math.sin(smooth(0.65,1.6,t)*PI)*0.3*R.r;drag={x:-e,y:e*0.4};}
  if(!tgt)return null;
  press=(t>0.55&&t<1.5)?1:0;
  const app=smooth(0,0.55,t), lv=1-smooth(1.6,2.3,t);
  const sx=tgt.x+R.r*0.6,sy=tgt.y+R.r*1.4;
  return{x:lerp(sx,tgt.x,app)+drag.x,y:lerp(sy,tgt.y,app)+drag.y,a:Math.min(app*1.5,lv),press,drag,k:dm.tg.k,i:dm.tg.i};
}

/* ============ 入力 ============ */
let AP=null;
function hitTest(x,y){
  const R=LY.ring;
  for(let i=0;i<LY.memPads.length;i++){const m=LY.memPads[i];if(x>=m.x-6&&x<=m.x+m.w+6&&y>=m.y-6&&y<=m.y+m.h+6)return{k:'mem',i};}
  const b=LY.bake; if(x>=b.x-8&&x<=b.x+b.w+8&&y>=b.y-8&&y<=b.y+b.h+8)return{k:'bake'};
  const dx=x-R.x,dy=y-R.y,dr=Math.hypot(dx,dy)/R.r;
  for(let i=TOPS.length-1;i>=0;i--){const t=TOPS[i];if(Math.hypot(x-(R.x+t.m.x*R.r),y-(R.y+t.m.y*R.r))<Math.max(28,R.r*0.3))return{k:'top',i};}
  if(dr>=0.7&&dr<=1.65){let a=Math.atan2(dy,dx);if(a<0)a+=TAU;return{k:'h',i:Math.round(a/(TAU/NH))%NH};}
  if(dr<0.7)return{k:'ringIn'};
  const L=LY.lcd; if(x>=L.x&&x<=L.x+L.w&&y>=L.y&&y<=L.y+L.h)return{k:'lcd'};
  return{k:'none'};
}
const JIG={h:new Float32Array(NH),top:[0,0],bake:0,mem:[0,0,0],ring:0,panel:0};
function softWobble(x,y,hit){
  hit=hit||hitTest(x,y);
  if(hit.k==='h')JIG.h[hit.i]=1;
  else if(hit.k==='top')JIG.top[hit.i]=1;
  else if(hit.k==='bake')JIG.bake=1;
  else if(hit.k==='mem')JIG.mem[hit.i]=1;
  else if(hit.k==='ringIn')JIG.ring=1;
  else if(hit.k==='lcd'){
    const lx=x-LY.lcd.x,ly=y-LY.lcd.y;let best=null,bd=1e9;
    for(const a of ACTORS){const d=Math.hypot(a.x-lx,a.y-ly);if(d<bd){bd=d;best=a;}}
    if(best&&bd<S.hr*2.2){best.jig=Math.max(best.jig,0.5);}
    else if(G.mode==='make'&&Math.hypot(lx-S.cx,ly-S.cy)<S.R0*1.4)nudgeDough(lx,ly,0.6);
    else G.shake=1;
  }else JIG.panel=1;
  SFX.tick();
}
function onDown(e){
  if(e.cancelable)e.preventDefault();
  auInit();
  const x=e.clientX,y=e.clientY;
  if(AP&&performance.now()-AP.lm>2500)endPointer();
  if(AP){softWobble(x,y);return;}
  interact();
  const hit=hitTest(x,y);
  const free=G.mode==='make'&&!G.seq;
  if(hit.k==='h'&&free){
    AP={id:e.pointerId,k:'h',i:hit.i,sx:x,sy:y,x,y,lm:performance.now(),lx:x,ly:y};
    beginPull(hit.i,false); SFX.press(); stStart();
    const ep=edgeLCD(hit.i*8); puff(ep.x,ep.y,3,COL.ygr,25);
  }else if(hit.k==='top'&&free){
    const t=TOPS[hit.i]; AP={id:e.pointerId,k:'top',i:hit.i,ox:t.m.x,oy:t.m.y,sx:x,sy:y,lm:performance.now()}; SFX.click(); JIG.top[hit.i]=0.5;
  }else if(hit.k==='bake'&&free){
    AP={id:e.pointerId,k:'bake',lm:performance.now()}; startBake();
  }else if(hit.k==='mem'&&free&&memory[hit.i]){
    AP={id:e.pointerId,k:'mem',i:hit.i,lm:performance.now()}; loadMem(hit.i);
  }else{
    softWobble(x,y,hit); return;
  }
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
}
function onMove(e){
  if(!AP||e.pointerId!==AP.id)return;
  if(e.cancelable)e.preventDefault();
  const x=e.clientX,y=e.clientY,t=performance.now();
  if(AP.k==='h'&&D.pull&&!D.pull.demo){
    const R=LY.ring.r; let dx=(x-AP.sx)/R,dy=(y-AP.sy)/R; const l=Math.hypot(dx,dy);
    if(l>1.45){dx*=1.45/l;dy*=1.45/l;}
    D.pull.D.x=dx;D.pull.D.y=dy;
    const sp=Math.hypot(x-AP.lx,y-AP.ly)/Math.max(8,t-AP.lm)*16/R;
    stSet(Math.min(l,1.45)*D.pull.softH,Math.min(3,sp*6));
    if(Math.random()<0.05){const ep=edgeLCD(AP.i*8);puff(ep.x,ep.y,1,COL.ygr,15);}
    AP.lx=x;AP.ly=y;
  }else if(AP.k==='top'){
    const R=LY.ring,tp=TOPS[AP.i];
    let mx=AP.ox+(x-AP.sx)/R.r,my=AP.oy+(y-AP.sy)/R.r;const l=Math.hypot(mx,my);if(l>0.8){mx*=0.8/l;my*=0.8/l;}
    const moved=Math.hypot(mx-tp.m.x,my-tp.m.y);
    tp.m.x=mx;tp.m.y=my; if(moved>0.002)tp.moved=1;
    if(Math.random()<moved*8)SFX.click();
  }
  AP.lm=t;
}
function endPointer(){
  if(!AP)return;
  const k=AP.k; AP=null;
  if(k==='h'&&D.pull&&!D.pull.demo)releasePull();
  if(k==='top')SFX.click();
  stStop();
}
function onUp(e){
  if(!AP||e.pointerId!==AP.id)return;
  try{cv.releasePointerCapture(e.pointerId);}catch(err){}
  endPointer(); interact();
}
cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});

/* ============ 更新 ============ */
function update(dt){
  TIME+=dt; G.frames++;
  updSeq(dt);
  if(G.mode==='make'&&!AP&&!G.demo&&!G.seq){G.idle+=dt;if(G.idle>4&&!G.demoDone)startDemo();}
  updDemo(dt);
  if(D.vis)stepDough(dt);
  ACTORS.forEach(a=>updActor(a,dt));
  for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.l+=dt;p.vy+=60*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=dt*4;if(p.l>p.m)PT.splice(i,1);}
  for(let i=0;i<NH;i++)JIG.h[i]=Math.max(0,JIG.h[i]-dt*3);
  JIG.top[0]=Math.max(0,JIG.top[0]-dt*3);JIG.top[1]=Math.max(0,JIG.top[1]-dt*3);
  JIG.bake=Math.max(0,JIG.bake-dt*3);JIG.ring=Math.max(0,JIG.ring-dt*3);JIG.panel=Math.max(0,JIG.panel-dt*3);
  for(let i=0;i<3;i++)JIG.mem[i]=Math.max(0,JIG.mem[i]-dt*3);
  G.shake=Math.max(0,G.shake-dt*4);
  if(G.memPickT)G.memPickT=Math.max(0,G.memPickT-dt);
  G.nextRecv=G.mode==='make'?actorAt(G.dn%2===0?'seat1':'seat2'):null;
}

/* ============ 描画ヘルパ ============ */
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function circ(x,y,r,f,s,lw){ctx.beginPath();ctx.arc(x,y,Math.max(0.1,r),0,TAU);if(f){ctx.fillStyle=f;ctx.fill();}if(s){ctx.strokeStyle=s;ctx.lineWidth=lw;ctx.stroke();}}
function ell(x,y,rx,ry,rot,f,s,lw){ctx.beginPath();ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),rot||0,0,TAU);if(f){ctx.fillStyle=f;ctx.fill();}if(s){ctx.strokeStyle=s;ctx.lineWidth=lw;ctx.stroke();}}
function seg(x1,y1,x2,y2,w,c){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.stroke();}
function cap(x1,y1,x2,y2,w,f,o,lw){seg(x1,y1,x2,y2,w+lw*2,o);seg(x1,y1,x2,y2,w,f);}

/* ピザ/生地（生地単位で描く。呼ぶ側でtransform済） */
const NX=new Float32Array(K),NY=new Float32Array(K),RW=new Float32Array(K),TMP={x:0,y:0};
function drawPizza(X,Y,th,rbv,cu,bake,tops,o){
  const s=o.s;
  ctx.save();
  if(o.clip){const c=o.clip,tx=-c.ny,ty=c.nx;ctx.beginPath();ctx.moveTo(c.qx+tx*30,c.qy+ty*30);ctx.lineTo(c.qx+tx*30+c.nx*30,c.qy+ty*30+c.ny*30);ctx.lineTo(c.qx-tx*30+c.nx*30,c.qy-ty*30+c.ny*30);ctx.lineTo(c.qx-tx*30,c.qy-ty*30);ctx.closePath();ctx.clip();}
  if(o.bites&&o.bites.length){ctx.beginPath();ctx.rect(-30,-30,60,60);for(const b of o.bites){ctx.moveTo(b.x+b.r,b.y);ctx.arc(b.x,b.y,b.r,0,TAU);}ctx.clip('evenodd');}
  for(let i=0;i<K;i++){
    const a=(i+K-1)%K,b=(i+1)%K;let tx=X[b]-X[a],ty=Y[b]-Y[a];const l=Math.hypot(tx,ty)||1;NX[i]=ty/l;NY[i]=-tx/l;
    RW[i]=(0.05+0.065*clamp(th[i],0.2,1.8)+0.1*rbv[i])*(bake>0.5&&rbv[i]>0.2?1.15:1);
  }
  // 中身
  ctx.beginPath();ctx.moveTo(X[0],Y[0]);for(let i=1;i<K;i++)ctx.lineTo(X[i],Y[i]);ctx.closePath();
  ctx.fillStyle=COL.dgr;ctx.fill();
  // 格子
  if(o.grid){
    ctx.strokeStyle=bake>0.5?COL.dgy:COL.ygr;ctx.lineWidth=1.3/s;ctx.lineCap='round';
    for(let gi=-3;gi<=3;gi++){
      const c=gi*0.25,hl=Math.sqrt(Math.max(0,0.92*0.92-c*c));
      for(let dir=0;dir<2;dir++){
        ctx.beginPath();
        for(let k=0;k<=10;k++){const v=-hl+2*hl*k/10;const mx=dir?c:v,my=dir?v:c;mapArr(X,Y,mx,my,TMP);if(k)ctx.lineTo(TMP.x,TMP.y);else ctx.moveTo(TMP.x,TMP.y);}
        ctx.stroke();
      }
    }
    if(bake>0.5){ctx.fillStyle=COL.yel;for(let k=0;k<9;k++){const a=k*2.4,r=0.3+0.5*((k*37)%10)/10;mapArr(X,Y,Math.cos(a)*r,Math.sin(a)*r,TMP);ctx.fillRect(TMP.x-0.03,TMP.y-0.03,0.06,0.06);}}
  }
  // 縁（液晶セグメント風に区切る）
  const rimC=bake>0.5?COL.yel:COL.ygr;
  ctx.fillStyle=rimC;
  for(let j=0;j<16;j++){
    const a=j*4;ctx.beginPath();
    const P=(i,f)=>{const i0=(i)%K,i1=(i+1)%K;return[lerp(X[i0],X[i1],f),lerp(Y[i0],Y[i1],f),lerp(NX[i0],NX[i1],f),lerp(NY[i0],NY[i1],f),lerp(RW[i0],RW[i1],f)];};
    const outer=[],inner=[];
    const list=[[a,0.12],[a+1,0],[a+2,0],[a+3,0],[a+3,0.88]];
    for(const [i,f] of list){const p=P(i,f);outer.push([p[0],p[1]]);inner.push([p[0]-p[2]*p[4],p[1]-p[3]*p[4]]);}
    ctx.moveTo(outer[0][0],outer[0][1]);for(let k=1;k<outer.length;k++)ctx.lineTo(outer[k][0],outer[k][1]);
    for(let k=inner.length-1;k>=0;k--)ctx.lineTo(inner[k][0],inner[k][1]);
    ctx.closePath();ctx.fill();
  }
  // 反り
  if(bake>0.02&&cu){
    for(let i=0;i<K;i++){
      const c=cu[i]*clamp((bake-0.3)/0.7,0,1); if(c<0.08)continue;
      const j=(i+1)%K;
      seg(X[i]-NX[i]*(RW[i]+0.03),Y[i]-NY[i]*(RW[i]+0.03),X[j]-NX[j]*(RW[j]+0.03),Y[j]-NY[j]*(RW[j]+0.03),0.05*c+1/s,COL.dgy);
      seg(X[i]+NX[i]*0.04*c,Y[i]+NY[i]*0.04*c,X[j]+NX[j]*0.04*c,Y[j]+NY[j]*0.04*c,0.05*c+1/s,COL.yel);
      if(i%2===0)seg(X[i],Y[i],X[i]+NX[i]*0.13*c,Y[i]+NY[i]*0.13*c-0.06*c,0.035+0.6/s,COL.yel);
    }
  }
  // 取っ手と対応する縁の小さな耳
  if(o.tabs){
    for(let k=0;k<NH;k++){
      const i=k*8;const on=o.tabs.hi===k?(o.tabs.blink?1:2):(o.tabs.pr===k?2:0);
      const L=on?0.17:0.11;
      seg(X[i]+NX[i]*0.01,Y[i]+NY[i]*0.01,X[i]+NX[i]*L,Y[i]+NY[i]*L,(on?0.14:0.09),on===2?COL.yel:on===1?COL.off:COL.ygr);
    }
  }
  // 具
  if(tops){
    for(const t of tops){
      for(const p of t.P){
        if(t.kind==='T'){circ(p.x,p.y,t.r,COL.yel,COL.bg,0.025);ctx.fillStyle=COL.dgr;for(let k=0;k<3;k++){const a=k*TAU/3+0.4;ctx.fillRect(p.x+Math.cos(a)*t.r*0.45-0.018,p.y+Math.sin(a)*t.r*0.45-0.018,0.036,0.036);}}
        else{circ(p.x,p.y,t.r,COL.bg,COL.ygr,0.045);}
      }
    }
  }
  ctx.restore();
}
function withTr(tr,fn){ctx.save();ctx.translate(tr.ox,tr.oy);ctx.rotate(tr.rot);ctx.scale(tr.s,tr.s);ctx.translate(-tr.px,-tr.py);fn();ctx.restore();}
function drawSnap(h,tr,opts){
  const s=h.snap||h;
  withTr(tr,()=>drawPizza(s.X,s.Y,s.th,s.rb,s.curl,1,s.tops,{s:tr.s,grid:tr.s>12,bites:opts&&opts.bites,clip:opts&&opts.clip}));
}

/* 手 */
function drawHand(x,y,t,rot,hs,mitt){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.lineJoin='round';ctx.lineCap='round';
  const ol=COL.bg,lw=Math.max(1.4,hs*0.2);
  if(mitt){
    if(t==='under'){
      rr(-hs*1.15,-hs*0.3,hs*2.3,hs*0.8,hs*0.4);ctx.fillStyle=COL.yel;ctx.fill();ctx.strokeStyle=ol;ctx.lineWidth=lw;ctx.stroke();
      ell(hs*0.75,-hs*0.35,hs*0.28,hs*0.4,0.3,COL.yel,ol,lw);
      rr(-hs*1.6,-hs*0.38,hs*0.5,hs*0.95,hs*0.15);ctx.fillStyle=COL.dgy;ctx.fill();ctx.stroke();
    }else{
      ell(hs*0.2,0,hs*1.02,hs*0.88,0,COL.yel,ol,lw);
      ell(hs*0.55,-hs*0.82,hs*0.4,hs*0.3,-0.5,COL.yel,ol,lw);
      rr(-hs*1.25,-hs*0.62,hs*0.5,hs*1.24,hs*0.15);ctx.fillStyle=COL.dgy;ctx.fill();ctx.strokeStyle=ol;ctx.lineWidth=lw;ctx.stroke();
    }
  }else{
    const f=COL.ygr,w=hs*0.32;
    switch(t){
      case 'pinch':
        circ(-hs*0.25,0,hs*0.55,f,ol,lw);
        cap(hs*0.05,-hs*0.32,hs*0.7,-hs*0.08,w,f,ol,lw*0.8);
        cap(hs*0.05,hs*0.32,hs*0.65,hs*0.1,w,f,ol,lw*0.8);
        break;
      case 'wrap':
        ctx.beginPath();ctx.arc(hs*0.35,0,hs*0.62,PI*0.3,PI*1.7);ctx.strokeStyle=ol;ctx.lineWidth=hs*0.5+lw*2;ctx.stroke();ctx.strokeStyle=f;ctx.lineWidth=hs*0.5;ctx.stroke();
        break;
      case 'flat':
        ell(0,0,hs*0.5,hs*0.68,0,f,ol,lw);
        for(let k=0;k<4;k++){const yy=(-0.45+k*0.3)*hs;cap(hs*0.3,yy,hs*0.75,yy*1.05,w*0.8,f,ol,lw*0.7);}
        ell(0,0,hs*0.45,hs*0.62,0,f);
        break;
      case 'under':
        rr(-hs*0.95,-hs*0.24,hs*1.8,hs*0.52,hs*0.24);ctx.fillStyle=f;ctx.fill();ctx.strokeStyle=ol;ctx.lineWidth=lw;ctx.stroke();
        cap(hs*0.25,-hs*0.22,hs*0.45,-hs*0.6,w*0.9,f,ol,lw*0.8);
        break;
      default:
        circ(0,0,hs*0.6,f,ol,lw);
        for(let k=0;k<3;k++){const yy=(-0.35+k*0.35)*hs;circ(hs*0.55,yy,hs*0.2,f,ol,lw*0.7);}
        circ(0,0,hs*0.52,f);
    }
  }
  ctx.restore();
}

/* 人物 */
function shoulders(a){const hr=S.hr;return[{x:a.x-0.85*hr,y:a.y+1.3*hr},{x:a.x+0.85*hr,y:a.y+1.3*hr}];}
function defaultHands(a){
  const hr=S.hr;
  if(seated(a)){
    if(a===G.nextRecv&&G.lastGrip[a.id]){
      const ph=(a.gest%3.4);
      if(ph<1.0){
        const g=G.lastGrip[a.id];const q=Math.sin(ph/1.0*PI);
        const tp=a.hand==='mitt'?'mitt':g==='pinch'?'pinch':g==='wrap'?'wrap':g==='under'?'under':'flat';
        const sp=hr*(0.95-0.35*q);
        return[{x:a.x-sp,y:a.y+1.55*hr-q*hr*0.3,t:tp,rot:0},{x:a.x+sp,y:a.y+1.55*hr-q*hr*0.3,t:tp,rot:PI}];
      }
    }
    const up=a===G.nextRecv?Math.sin(TIME*4)*hr*0.06-hr*0.12:0;
    return[{x:a.x-0.9*hr,y:S.counterY+up,t:a.hand==='mitt'?'mitt':'rest',rot:-PI/2},{x:a.x+0.9*hr,y:S.counterY+up,t:a.hand==='mitt'?'mitt':'rest',rot:-PI/2}];
  }
  if(a.st==='work'&&!a.mv&&!a.at&&D.vis){
    const pinT=a.hand==='mitt'?'mitt':'pinch';
    if(D.pull){
      const e=edgeLCD(D.pull.h*8+0), ba=edgeLCD(D.pull.h*8+K/2);
      const c={x:S.cx,y:S.cy};
      return[{x:e.x,y:e.y,t:pinT,rot:Math.atan2(c.y-e.y,c.x-e.x)},{x:lerp(ba.x,c.x,0.15),y:lerp(ba.y,c.y,0.15),t:a.hand==='mitt'?'mitt':'flat',rot:Math.atan2(c.y-ba.y,c.x-ba.x)}];
    }
    if(G.mode==='bake'){

  const df=demoFinger();

    if(hi){rr(m.x-4,m.y+by-4,m.w+8,m.h+8,13);ctx.strokeStyle=COL.yel;ctx.lineWidth=3+pulse()*3;ctx.stroke();}
    if(e){
      const s=e.snap;let mx=1;for(let k=0;k<K;k++)mx=Math.max(mx,Math.abs(s.X[k]),Math.abs(s.Y[k]));
      const sc=Math.min(m.w,m.h)*0.38/mx,cx=m.x+m.w/2+j,cy=m.y+m.h/2+by+pr;

      ctx.strokeStyle=COL.ink;ctx.lineWidth=2.5;ctx.stroke();

  });

  circ(R.x+jr,R.y,R.r*0.92,null,COL.padD,R.r*0.1);
  // 取っ手
  for(let k=0;k<NH;k++){
    const th=k*TAU/NH,ux=Math.cos(th),uy=Math.sin(th);
    let cx=R.x+ux*R.r*1.16,cy=R.y+uy*R.r*1.16;

    cap(x+w*0.78,y+h*0.45,x+w*0.85,y+h*0.95,h*0.16,COL.padD,COL.ink,2);

    const lit=G.mode==='bake'&&Math.floor(TIME*8)%2===0;
    ctx.fillStyle=lit?COL.yel:(G.mode==='make'?COL.padY:COL.padD);ctx.fill();ctx.strokeStyle=COL.ink;ctx.lineWidth=2.5;ctx.stroke();
    for(let k=-2;k<=2;k++){const hx=x+w/2+k*w*0.13;ctx.beginPath();ctx.moveTo(hx,y+h*0.14);ctx.lineTo(hx+h*0.07,y+h*0.25);ctx.lineTo(hx-h*0.07,y+h*0.36);ctx.lineTo(hx,y+h*0.47);ctx.strokeStyle=COL.ink;ctx.lineWidth=2.5;ctx.stroke();}
    if(hi){rr(x-5,y-5,w+10,h*0.62+10,h*0.34);ctx.strokeStyle=COL.yel;ctx.lineWidth=3+pulse()*3;ctx.stroke();}
  }
  ctx.restore();
  // お手本の指
  if(df&&df.a>0.02){
    ctx.save();ctx.globalAlpha=clamp(df.a,0,1)*0.92;
    const x=df.x,y=df.y,s=Math.max(16,R.r*0.2);
    ctx.translate(x,y);
    ctx.beginPath();
    rr(-s*0.22,-s*0.05,s*0.44,s*1.1,s*0.22);ctx.fillStyle='#f6efd8';ctx.fill();ctx.strokeStyle=COL.ink;ctx.lineWidth=2.5;ctx.stroke();
    rr(-s*0.62,s*0.75,s*1.24,s*1.1,s*0.4);ctx.fill();ctx.stroke();
    circ(0,0,s*(df.press?0.42:0.3),null,COL.ink,2);
    ctx.restore();
  }
}
function drawBody0(){
  ctx.fillStyle=COL.body;ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle=COL.bodyL;ctx.fillRect(0,0,VW,4);
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawBody0();
  drawLCD();
  drawPanel();
}

/* ============ ループ ============ */
let last=0,raf=0,running=false;
function frame(t){
  raf=0; if(!running)return;
  const dt=Math.min(0.05,Math.max(0,(t-last)/1000)); last=t;
  try{update(dt);draw();}catch(err){if(!frame.err){frame.err=1;console.warn(err);}}
  raf=requestAnimationFrame(frame);
}
function start(){if(running)return;running=true;last=performance.now();raf=requestAnimationFrame(frame);}
function stop(){running=false;if(raf)cancelAnimationFrame(raf);raf=0;}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stop();endPointer();stStop();try{if(AU.c){const p=AU.c.suspend();if(p&&p.catch)p.catch(()=>{});}}catch(e){}}
  else{try{if(AU.c){const p=AU.c.resume();if(p&&p.catch)p.catch(()=>{});}}catch(e){} start();}
});

/* ============ 開始 ============ */
resize();
makeRound(1);
ACTORS.forEach(a=>{const p=stPos(a.st);a.x=p.x;a.y=p.y;});
stepDough(0.016);
start();

/* テスト用の読み取り口（UIには出ない） */
window.__PZ={
  LY,S,G,D,memory,TOPS,HELD,A,
  handlePos(k){const R=LY.ring,th=k*TAU/NH;return{x:R.x+Math.cos(th)*R.r*1.16,y:R.y+Math.sin(th)*R.r*1.16};},
  topPos(i){const R=LY.ring,t=TOPS[i];return{x:R.x+t.m.x*R.r,y:R.y+t.m.y*R.r};},
  bakePos(){const b=LY.bake;return{x:b.x+b.w/2,y:b.y+b.h*0.3};},
  memPos(i){const m=LY.memPads[i];return{x:m.x+m.w/2,y:m.y+m.h/2};},
  analyzeNow(){const s=snapNow();const an=analyze(s);return{an:{ears:an.ears.length,two:!!an.two,waist:!!an.waist,ratio:an.wInfo.ratio,len:an.wInfo.len,rimV:an.rimV,spread:an.spread},plan:plan(s,an,false).type,planMitt:plan(s,an,true).type,regrip:!!plan(s,an,false).regrip,maxCurl:Math.max(...s.curl)};},
  rest(){return pts.map(p=>[p.rx,p.ry]);},
  fresh(){makeRound(1);G.idle=0;G.demoDone=true;},
  get mode(){return G.mode;}
};
})();
