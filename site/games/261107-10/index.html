const COL = { bg:'#6f879c', ink:'#1e2840', red:'#d9533b', cream:'#f2e8cf' };
const TAU = Math.PI * 2;
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp = (a,b,t) => a + (b-a)*t;
const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
const easeOut = t => 1 - (1-t)*(1-t);
const rnd = (a,b) => a + Math.random()*(b-a);
const appr = (c,t,r,dt) => c + (t-c)*(1 - Math.exp(-r*dt));

/* ============================================================

let SH = false, DEPTH = 1;
function fc(c){ ctx.fillStyle = SH ? COL.ink : COL[c]; }
function circ(x,y,r,c){ fc(c); ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,TAU); ctx.fill(); }
function ell(x,y,rx,ry,c,rot){ fc(c); ctx.beginPath(); ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,TAU); ctx.fill(); }
function rect(x,y,w,h,c){ fc(c); ctx.fillRect(x,y,w,h); }
function poly(p,c){ fc(c); ctx.beginPath(); ctx.moveTo(p[0],p[1]); for(let i=2;i<p.length;i+=2) ctx.lineTo(p[i],p[i+1]); ctx.closePath(); ctx.fill(); }
function rrPath(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function rr(x,y,w,h,r,c){ fc(c); rrPath(x,y,w,h,r); ctx.fill(); }
function halfDisc(x,y,rx,ry,c,up){ fc(c); ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,up?Math.PI:0,up?TAU:Math.PI); ctx.closePath(); ctx.fill(); }
function thread(pts,w){ if(SH) return; ctx.strokeStyle = COL.ink; ctx.lineWidth = w||1.6; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(pts[0],pts[1]); for(let i=2;i<pts.length;i+=2) ctx.lineTo(pts[i],pts[i+1]); ctx.stroke(); }
function brad(x,y,r){ r=r||3; circ(x,y,r,'cream'); if(!SH) circ(x,y,r*.45,'ink'); }
function sh(fn,d){ if(SH){ fn(); return; } d=(d||1)*DEPTH; ctx.save(); ctx.translate(2.6*d,3.4*d); SH=true; try{ fn(); } finally { SH=false; ctx.restore(); } fn(); }
function star5(x,y,r,c,rot){ const p=[]; for(let i=0;i<10;i++){ const a=rot-Math.PI/2+i*Math.PI/5; const rr2=i%2?r*.45:r; p.push(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);} poly(p,c); }
function zigBand(x0,x1,yTop,yBot,amp,step,phase,c){ const p=[]; p.push(x0,yBot); let k=0; for(let x=x0;x<=x1+0.01;x+=step){ p.push(x, yTop + ((k++ + phase)%2 ? amp : 0)); } p.push(x1,yTop, x1,yBot); poly(p,c); }

    SA.b = parseFloat(cs.paddingBottom)||0; SA.l = parseFloat(cs.paddingLeft)||0; }catch(e){}
  const m = 6;
  const sx = SA.l + m, sy = SA.t + m, sw = W - SA.l - SA.r - 2*m, shh = H - SA.t - SA.b - 2*m;
  if (sw/shh < 1.08){
    L.portrait = true;
    const s = Math.min(sw/TW, shh/(TH+BH));
    const tot = (TH+BH)*s, g = (shh - tot)/3;
    L.ts = L.bs = s;
    L.tx = L.bx = sx + (sw - TW*s)/2;
    L.ty = sy + g; L.by = L.ty + TH*s + g;
  } else {
    L.portrait = false;
    const bw = sw*0.46, tw = sw - bw;
    L.bs = Math.min(bw/BW, shh/BH); L.ts = Math.min(tw/TW, shh/TH);
    L.bx = sx + (bw - BW*L.bs)/2; L.by = sy + (shh - BH*L.bs)/2;
    L.tx = sx + bw + (tw - TW*L.ts)/2; L.ty = sy + (shh - TH*L.ts)/2;
  }
}

/* ============================================================
   音（Web Audio 合成・最初のタッチで開始）
   ============================================================ */
let AC = null, MASTER = null, NOISE = null, audioOK = false;
function initAudio(){
  if (AC) { if (AC.state === 'suspended') AC.resume().catch(()=>{}); return; }
  try{
    const A = window.AudioContext || window.webkitAudioContext;
    if (!A) return;
    AC = new A();
    MASTER = AC.createGain(); MASTER.gain.value = 0.55; MASTER.connect(AC.destination);
    const n = AC.sampleRate * 1.0; NOISE = AC.createBuffer(1, n, AC.sampleRate);
    const d = NOISE.getChannelData(0); for (let i=0;i<n;i++) d[i] = Math.random()*2-1;
    audioOK = true;
    if (AC.state === 'suspended') AC.resume().catch(()=>{});
  }catch(e){ AC = null; audioOK = false; }
}
let sndCount = 0, sndWin = 0;
function canSnd(){ if(!audioOK || !AC || AC.state!=='running') return false; if (sndCount > 40) return false; sndCount++; return true; }
function tone(f, dur, type, vol, f2, delay){
  if(!canSnd()) return;
  try{
    const t = AC.currentTime + (delay||0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t+dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol||0.2, t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(MASTER); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
function noise(dur, freq, vol, ftype, q, delay, f2){
  if(!canSnd()) return;
  try{
    const t = AC.currentTime + (delay||0);
    const s = AC.createBufferSource(); s.buffer = NOISE;
    const f = AC.createBiquadFilter(); f.type = ftype || 'bandpass'; f.frequency.setValueAtTime(freq, t); f.Q.value = q || 1.2;
    if (f2) f.frequency.exponentialRampToValueAtTime(f2, t+dur);
    const g = AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.1, t+0.01); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    s.connect(f); f.connect(g); g.connect(MASTER); s.start(t, Math.random()*0.5); s.stop(t+dur+0.02);
  }catch(e){}
}

  unfold(){ for(let i=0;i<6;i++){ noise(0.08,900+i*300,0.1,'bandpass',2,i*0.12); tone(260+i*60,0.08,'triangle',0.08,0,i*0.12); } },
  pick(i){ tone(523*Math.pow(1.26,i),0.18,'triangle',0.16,0); },
  puzzled(){ tone(400,0.12,'sine',0.1,300); tone(300,0.15,'sine',0.08,420,0.13); },

/* ============================================================
   コルーチン（rAF 駆動のみ）
   ============================================================ */
let CO = [];
function spawn(gen){ const c = { g:gen, w:0, done:false }; CO.push(c); return c; }
function stepCo(dt){
  const list = CO.slice();
  for (const c of list){
    if (c.done) continue;
    c.w -= dt; if (c.w > 0) continue;
    let r;
    try { r = c.g.next(); } catch(e){ c.done = true; recover(e); continue; }
    if (r.done) { c.done = true; continue; }
    c.w = (typeof r.value === 'number' && r.value > 0) ? r.value : 0;
  }
  CO = CO.filter(c => !c.done);
}
function* tween(dur, f){ let t = 0; for(;;){ t += DT; const p = Math.min(1, t/dur); f(p); if (p >= 1) return; yield 0; } }
function* join(c){ while(!c.done) yield 0; }
const ERRS = [];
function recover(e){ // 何があっても操作不能にしない
  ERRS.push(String(e && e.stack || e).slice(0,300));
  busy = false; if (mode !== 'board' && mode !== 'select') { mode = 'board'; R.rise = 0; WD.pop = 0; WD.links = 0; G.space='b'; }
}

/* ============================================================

const KEY = 'gf261107_10_shows_v1';
const Store = { ok:true, status:'init', shows:[] };
function num01(v){ return (typeof v === 'number' && isFinite(v)) ? clamp(v,0,1) : null; }
function validShow(s){
  if (!s || typeof s !== 'object') return null;
  if (typeof s.o !== 'string' || !/^[HRS]{3}$/.test(s.o)) return null;
  if (!s.i || typeof s.i !== 'object' || !s.f || typeof s.f !== 'object') return null;
  const i = { W:num01(s.i.W), S:num01(s.i.S), P:num01(s.i.P), a:num01(s.i.a), g:num01(s.i.g), st:num01(s.i.st) };
  const f = { W:num01(s.f.W), S:num01(s.f.S), P:num01(s.f.P), st:num01(s.f.st) };
  for (const k in i) if (i[k] === null) return null;
  for (const k in f) if (f[k] === null) return null;
  return { o:s.o, i, f };
}
function storeLoad(){
  let raw = null;
  try { raw = window.localStorage.getItem(KEY); }
  catch(e){ Store.ok = false; Store.status = 'denied'; Store.shows = []; return; }
  if (raw === null || raw === undefined){ Store.status = 'empty'; return; }
  try {
    const d = JSON.parse(raw);
    if (!d || d.v !== 1 || !Array.isArray(d.shows)) throw new Error('bad');
    const v = d.shows.slice(0,3).map(validShow).filter(Boolean);
    if (v.length !== Math.min(3, d.shows.length)) Store.status = 'partial'; else Store.status = 'restored';
    Store.shows = v;
  } catch(e){ Store.status = 'broken'; Store.shows = []; }
}
function storeSave(){
  if (!Store.ok) return false;
  try { window.localStorage.setItem(KEY, JSON.stringify({ v:1, shows:Store.shows })); Store.status = 'saved'; return true; }

}

/* 人形の移動（経路は橋の状態しだい） */
function dollTarget(kind, i){
  const cls = bridgeClass();
  if (kind === 'shade') return { reg:'R', x:400+i*52, y:520 };
  if (kind === 'rain') return WD.awn > 0.5 ? { reg:'R', x:415+i*48, y:520 } : { reg:'R', x:362+i*28, y:520 };
  if (kind === 'home') return { reg:'R', x:420+i*55, y:520 };
  // snow / bridge
  if (cls === 'flat') return { reg:'L', x:172+i*26, y:520 };
  if (cls === 'ramp') return { reg:'E', x:226+i*22, y:448 };
  return { reg:'R', x:372+i*30, y:520 };
}
function planPath(d, tg){
  const cls = bridgeClass();
  const P = [];
  let reg = d.reg;
  if (reg === tg.reg){ P.push([tg.x,tg.y]); return { path:P, reg:tg.reg }; }
  if (reg === 'R' && tg.reg === 'L' && cls === 'flat'){ P.push([355,520],[240,520],[tg.x,tg.y]); return { path:P, reg:'L' }; }
  if (reg === 'R' && tg.reg === 'E' && cls === 'ramp'){ P.push([355,520],[261,451],[tg.x,tg.y]); return { path:P, reg:'E' }; }

    yield* walkTo(222, 448, 60);
    G.pose = 'cheer'; G.poseT = 1; SFX.chime(); confetti('t', 222, 410, 8);
    yield 0.5;

  }
}

function tilePos(i){

  const rise = R.rise;
  if (rise <= 0) return { x:bx, y:by, s:L.bs, st:0, e:0 };
  const e = clamp(rise*1.7 - (i/GOAL)*0.7, 0, 1);
  const P = walkPts();
  const t = (GOAL - i + 0.5)/(GOAL+1);
  const [wx, wy] = bez(P, t);
  const ee = ease(e);
  const ws = lerp(L.bs*0.75, L.ts*(L.portrait ? 0.36 : 0.5), t);
  return { x:lerp(bx,wx,ee), y:lerp(by,wy,ee) - Math.sin(e*Math.PI)*60*L.bs, s:lerp(L.bs, ws, ee)*0.7 + 0.3*lerp(L.bs,ws,ee), st:Math.sin(e*Math.PI), e:ee };

    rect(TR.x0-4, TR.top-6, 8, TR.bot-TR.top+12, 'red');
    rect(TR.x0-4, TR.bot, 404-TR.x0+4, 9, 'red');
    rect(436, TR.bot, TR.x1-436+6, 9, 'red');
    rect(TR.x1-2, TR.top-6, 8, TR.bot-TR.top+12, 'red');
  });
  // あふれ管（上限の水だけを下へ流す）
  sh(() => { rect(291, TR.top+4, 10, TR.bot-TR.top+30, 'cream'); rect(288, TR.top+2, 16, 5, 'cream'); }, 0.7);
  // 脚
  sh(() => { rect(206, TR.bot+9, 7, 520-TR.bot-9, 'ink'); rect(452, TR.bot+9, 7, 520-TR.bot-9, 'ink'); }, 0.6);
  // 水門（樋の左端）
  const g = WD.gateD, gw = WD.wob.gate || 0;
  setT(); ctx.translate(TR.x0 - 2, TR.top + 22 - g*38); ctx.rotate(Math.sin(TIME*30)*gw*0.08);
  sh(() => { rr(-9,-26,18,50,4,'cream'); rect(-9,-6,18,4,'red'); });
  brad(0,-20,3);
  setT();
  // 舟着き場の旗
  sh(() => { rect(TR.x1-14, TR.top-40, 3, 36, 'ink'); poly([TR.x1-11, TR.top-40, TR.x1+8, TR.top-33, TR.x1-11, TR.top-26], 'red'); });
}
function drawBoat(){
  const bx = WD.boatX, by = WD.boatY, w = WD.wob.boat || 0;
  setT(); ctx.translate(bx, by); ctx.rotate(Math.sin(TIME*2)*0.05 + Math.sin(TIME*30)*w*0.15 + (WD.Wd < 0.15 ? -0.08 : 0));
  sh(() => {
    poly([-24,-8, 24,-8, 15,4, -15,4], 'cream');
    poly([0,-8, 0,-36, 18,-12], 'cream');
    poly([0,-8, 0,-30, -13,-12], 'red');
    rect(-1,-38,2.4,30,'ink');
  });
  setT();
}
function drawWheel(){
  const { x, y, r } = WHEEL; const w = WD.wob.wheel || 0;
  sh(() => { poly([x-3,y, x-30,520, x-22,520], 'ink'); poly([x+3,y, x+30,520, x+22,520], 'ink'); }, 0.7);
  setT(); ctx.translate(x, y); ctx.rotate(WD.wheelA + Math.sin(TIME*30)*w*0.1);
  sh(() => {
    for (let i=0;i<8;i++){ ctx.save(); ctx.rotate(i*TAU/8); rect(-3, -r, 6, r, 'cream'); rr(-10, -r-4, 20, 13, 3, i%2 ? 'red' : 'cream'); ctx.restore(); }
    circ(0,0,13,'red');
  });
  brad(0,0,5);
  setT();
}
function streamPts(pts, wdt){ // 折り紙の帯で流れを描く
  const ps1 = [], ps2 = [];
  for (let i=0;i<pts.length;i+=2){
    const j = Math.min(i+2, pts.length-2), k = Math.max(i-2, 0);
    const dx = pts[j]-pts[k], dy = pts[j+1]-pts[k+1], d = Math.hypot(dx,dy) || 1;
    const nx = -dy/d, ny = dx/d;
    const zz = ((i/2 + Math.floor(TIME*8)) % 2) ? 1.6 : -1.6;
    ps1.push(pts[i] + nx*(wdt+zz), pts[i+1] + ny*(wdt+zz));
    ps2.unshift(pts[i] - nx*(wdt-zz), pts[i+1] - ny*(wdt-zz));
  }
  poly(ps1.concat(ps2), 'ink');
}
function drawStreams(){
  setT();
  const ag = awnGeom(WD.awnD);
  // 日よけから樋へ
  if (WD.raining && WD.awnD > 0.6){
    const y1 = waterTop(WD.Wd);
    const pts = []; for (let i=0;i<=8;i++){ const t = i/8; pts.push(ag.tx - 4 + Math.sin(t*3 + TIME*6)*1.5, lerp(ag.ty+8, y1, t)); }
    sh(() => streamPts(pts, 3.5), 0.5);
  }
  // 水門→水車→排出口
  if (WD.flow > 0.05){
    const wv = 2 + WD.flow*3.5;
    const pts = []; for (let i=0;i<=10;i++){ const t = i/10; pts.push(lerp(TR.x0-8, WHEEL.x+28, t) - Math.sin(t*Math.PI)*6, lerp(TR.bot-4, WHEEL.y-30, t*t)); }
    sh(() => streamPts(pts, wv), 0.5);
    const p2 = []; for (let i=0;i<=6;i++){ const t = i/6; p2.push(WHEEL.x - 20 + Math.sin(t*4+TIME*5)*2, lerp(WHEEL.y+20, 518, t)); }
    sh(() => streamPts(p2, wv*0.8), 0.5);
  }
  // あふれ口→みぞ
  if (WD.ovf > 0){
    const pts = []; for (let i=0;i<=8;i++){ const t = i/8; pts.push(296 + Math.sin(t*5+TIME*7)*2, lerp(TR.bot+30, 545, t)); }
    sh(() => streamPts(pts, 2.6), 0.5);
  }
  // 雪どけのしずく
  if (WD.melt > 0 && Math.random() < 0.5) addP({ k:'drop', sp:'t', x:rnd(410,430), y:panY()-6, vx:0, vy:-40, life:0, max:0.3 });
}
function drawFloor(){
  setT();
  sh(() => { rect(40,520,210,50,'cream'); rect(350,520,250,50,'cream'); }, 1.2);
  // みぞ（排出口）
  rect(250,520,100,50,'ink');
  for (let i=0;i<4;i++){ rect(258 + i*24 + ((TIME*14)%24), 538 + (i%2)*8, 12, 2.5, 'bg'); }
  // 左の排出口（格子）
  rect(100,519,70,7,'ink'); for (let x=104;x<170;x+=10) rect(x,519,4,7,'cream');
  // 日かげ
  if (WD.shade > 0.05){
    const ag = awnGeom(WD.awnD);
    const x0 = lerp(AWN.hx, ag.tx - 20, WD.shade);
    poly([x0, 520, AWN.hx+10, 520, AWN.hx+10, 528, x0 + 10, 528], 'ink');
  }
}
function drawLedge(){
  sh(() => { rect(200,446,90,10,'cream'); rect(206,456,8,64,'ink'); });
  sh(() => { rect(272,416,3,30,'ink'); poly([275,416, 292,422, 275,428],'red'); }, 0.6);
}
function drawBridge(){
  setT();
  const a = WD.bridgeA*Math.PI/180;
  const w = WD.wob.bridge || 0;
  ctx.translate(BR.hx, BR.hy); ctx.rotate(a + Math.sin(TIME*30)*w*0.04);
  sh(() => { rect(-BR.len, -8, BR.len, 9, 'red'); for (let i=0;i<5;i++) rect(-BR.len + 6 + i*22, -11, 12, 4, 'cream'); }, 1.1);
  setT();
  brad(BR.hx, BR.hy - 3, 5);
  const t = bridgeTip(); brad(t[0], t[1] - 3, 3.5);
}
function drawPan(){
  setT();
  const y = panY(), w = WD.wob.pan || 0;
  ctx.translate(420, y); ctx.rotate(Math.sin(TIME*30)*w*0.1);
  sh(() => {
    if (WD.Pd > 0.02){ const sz = 6 + Math.min(1,WD.Pd)*16; const ps = [-sz,0]; let k = 0; for (let x=-sz;x<=sz;x+=5) ps.push(x, -6 - sz*0.4 - (k++%2?3:0)); ps.push(sz,0); poly(ps,'cream'); }
    halfDisc(0,-2,24,11,'ink',false);
    rect(-24,-4,48,4,'ink');
  });
  setT();
  thread([420 - 22, y - 3, 420, y - 12, 420 + 22, y - 3], 1.3);
}
function drawAwning(){
  setT();
  const a = WD.awnD, g = awnGeom(a), w = WD.wob.awn || 0;
  const N = 7;
  const dx = g.dx, dy = g.dy, nx = dy, ny = -dx; // 下向きの厚み方向
  const thick = 16;
  // 引きひも（裏方へ）
  thread([g.tx, g.ty, 186, 120], 1.3);
  sh(() => {
    for (let i=0;i<N;i++){
      const t0 = i/N, t1 = (i+1)/N;
      const zz0 = (i%2 ? 1 : -1)*(1-a)*5, zz1 = -zz0;
      const x0 = AWN.hx + dx*g.len*t0, y0 = AWN.hy + dy*g.len*t0 + Math.sin(TIME*30)*w*2;
      const x1 = AWN.hx + dx*g.len*t1, y1 = AWN.hy + dy*g.len*t1 + Math.sin(TIME*30)*w*2;
      const c = i%2 ? 'cream' : 'red';
      poly([x0 + nx*zz0, y0 + ny*zz0 - 2, x1 + nx*zz1, y1 + ny*zz1 - 2, x1 + nx*(thick+zz1), y1 + ny*(thick+zz1), x0 + nx*(thick+zz0), y0 + ny*(thick+zz0)], c);
      // 切り込みの房
      const mx = (x0+x1)/2, my = (y0+y1)/2;
      poly([x0 + nx*thick, y0 + ny*thick, x1 + nx*thick, y1 + ny*thick, mx + nx*(thick+10*a+3), my + ny*(thick+10*a+3)], c);
    }
  });
  sh(() => { rect(AWN.hx-2, AWN.hy-16, 30, 10, 'ink'); rect(AWN.hx+18, AWN.hy-16, 10, 40, 'ink'); }, 0.6);
  brad(AWN.hx, AWN.hy, 5);
}
function drawDoll(d, i){
  setT();
  const bob = d.path.length ? Math.abs(Math.sin(d.ph))*3 : 0;
  const j = d.jump > 0 ? Math.sin((d.jump%0.6)/0.6*Math.PI)*14 : 0;
  ctx.translate(d.x, d.y - bob - j);
  if (d.wob) ctx.rotate(Math.sin(TIME*30)*d.wob*0.2);
  ctx.scale(d.face, 1);
  sh(() => {
    rect(-5,-10,3,10,'ink'); rect(2,-10,3,10,'ink');
    poly([-3,-28, 3,-28, 10,-9, -10,-9], d.c);
    rect(-9,-26,4,13,'cream'); rect(5,-26,4,13,'cream');
    circ(0,-33,8,'cream');
    halfDisc(0,-35,8.5,7,'ink',true);
  }, 0.7);
  circ(3,-33,1.4,'ink'); circ(-2,-33,1.4,'ink'); circ(5,-30,1.6,'red');
  brad(-7,-25,1.6); brad(7,-25,1.6);
}
function drawDolls(){ DOLLS.forEach(drawDoll); }
function drawLinks(){
  const k = WD.links; if (k < 0.02) return;
  setT();
  // 樋の右端から床への階段（変身で現れる）
  sh(() => {
    for (let i=0;i<4;i++){ const t = (i+1)/4; if (t > k + 0.01) break; rect(448 + i*10, lerp(TR.bot+10, 512, t) - 4, 34, 7, 'cream'); }
    // 坂の下と樋をつなぐ渡し板
    if (k > 0.3) poly([SL.bx-2, SL.by, TR.x0+10, TR.top-4, TR.x0+10, TR.top+2, SL.bx-2, SL.by+6], 'cream');
  }, 1.2);
  // 入り口の踊り場
  sh(() => { rect(40, 168, 30*k, 8, 'cream'); }, 1.2);
}
function drawStagehand(){
  setT();
  const p = WD.pull;
  const x = 186, y = 102;
  const w = WD.wob.hand || 0;
  ctx.translate(x, y + Math.sin(TIME*30)*w*2);
  // 腕で糸を引く
  const pullY = p*10;
  sh(() => {
    circ(0, 0, 13, 'cream');
    halfDisc(0,-3,14,12,'ink',true); rect(-14,-4,28,4,'ink');
    rr(-12, 8 + pullY, 7, 16, 3.5, 'cream'); rr(5, 8 + pullY*0.6, 7, 16, 3.5, 'cream');
  });
  circ(-4,1,1.6,'ink'); circ(4,1,1.6,'ink'); halfDisc(0,6,3,2,'ink',false);
  setT();
  // 水門へのひも
  thread([x + 8, y + 22 + pullY*0.6, TR.x0 - 2, TR.top - 6 - WD.gateD*38], 1.3);
}
function drawParticles(sp){
  for (const p of PS){
    if (p.sp !== sp) continue;
    if (p.k === 'rain'){ rect(p.x, p.y, 2.2, 11, 'cream'); }
    else if (p.k === 'snow'){ circ(p.x, p.y, p.r, 'cream'); }
    else if (p.k === 'drop'){ circ(p.x, p.y, 2.5, 'ink'); }
    else if (p.k === 'conf'){ ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); rect(-p.r, -p.r*0.6, p.r*2, p.r*1.2, p.c); ctx.restore(); }
  }
}

/* ============================================================
   背景（反応しない紙の帯）
   ============================================================ */
function drawBackground(){
  setScreen();
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, W, H);
}

/* ============================================================
   メインループ
   ============================================================ */
let last = 0, raf = 0, running = true;
function frame(now){
  raf = 0;
  if (!running) return;
  let dt = last ? (now - last)/1000 : 0.016;
  last = now;
  dt = Math.min(0.05, Math.max(0, dt)) * SPEED;
  try {
    update(dt);
    updateLook();
    render();
  } catch(e){ recover(e); }
  frames++;
  raf = requestAnimationFrame(frame);
}
function render(){
  drawBackground();
  drawTheater();
  drawBoard();
  drawFlyers();
  if (G.space === 'b' || G.space === 's'){ placeGirl(); drawGirl(); }
  setScreen();
  // 盤の紙吹雪
  setB(); drawParticles('b');
  drawHint();
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden){
    running = false; if (raf) cancelAnimationFrame(raf); raf = 0;
    if (AC && AC.state === 'running') AC.suspend().catch(()=>{});
  } else {
    running = true; last = 0;
    if (AC && AC.state === 'suspended' && firstTouch) AC.resume().catch(()=>{});
    if (!raf) raf = requestAnimationFrame(frame);
  }
});
window.addEventListener('pagehide', () => { running = false; });
window.addEventListener('pageshow', () => { if (!running){ running = true; last = 0; if (!raf) raf = requestAnimationFrame(frame); } });

storeLoad();
resize();
raf = requestAnimationFrame(frame);

/* 自動テスト用の読み取り口（画面には出ない） */
window.__gf = {
  state: () => ({ mode, busy, sq:G.sq, cos:G.cos, space:G.space, W:+WD.W.toFixed(3), S:+WD.S.toFixed(3), P:+WD.P.toFixed(3), awn:WD.awn, gate:WD.gate, star:+WD.star.toFixed(3),
                  bridge:bridgeClass(), boatX:+WD.boatX.toFixed(1), sled:+WD.sledD.toFixed(3), dolls:DOLLS.map(d=>d.reg+':'+Math.round(d.x)), dicePress:dice.press, hint:hint.on,
                  rolls:journey.rolls, journeyN:journey.n, sel: sel ? sel.slots.join('') : null, pending: pending ? pending.o : null, shows:Store.shows.map(s=>s.o), store:Store.status, storeOk:Store.ok,
                  particles:PS.length, frames, audio: AC ? AC.state : 'none', layout:{...L} }),
  disc, errs: ERRS,
  setSpeed: v => { SPEED = clamp(+v||1, 0.1, 8); },
  pos: (k, a) => { // 対象のスクリーン座標
    if (k === 'dice') return bToS(DICE.x, DICE.y);
    if (k === 'med') return bToS(MEDS[a][0], MEDS[a][1]);
    if (k === 'slot') return bToS(SLOTS[a][0], SLOTS[a][1]);
    if (k === 'gal') return bToS(GAL[a][0], GAL[a][1]);
    if (k === 'boat') return tToS(WD.boatX, WD.boatY-10);
    if (k === 'bg') return [L.portrait ? W*0.5 : W*0.5, SA.t + 3];
    return null;
  }
};
})();
