<script>
(function(){
'use strict';
/* =========================================================
   ぱちん、ぽかぽか！てのひら招待パーティー  (gf-261107-nx1)
   thermo style / one finger / no text UI
   ========================================================= */
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const saEl=document.getElementById('sa');
let W=0,H=0,DPR=1,u=1,T=0;
const L={};
const PI=Math.PI, TAU=PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const wrapA=a=>{a=(a+PI)%TAU;if(a<0)a+=TAU;return a-PI;};
const angDiff=(a,b)=>Math.abs(wrapA(a-b));
const rnd=(a,b)=>a+Math.random()*(b-a);
const ease=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
const damp=(c,t,r,dt)=>c+(t-c)*(1-Math.exp(-r*dt));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ---------- thermal palette: blue-black, blue, green, yellow, orange, red ---------- */
const STOPS=[[9,13,38],[26,70,206],[38,184,92],[242,226,58],[245,150,30],[228,46,28]];
function heatRGB(t){t=clamp(t,0,1)*5;const i=Math.min(4,Math.floor(t));const f=t-i;const a=STOPS[i],b=STOPS[i+1];
  return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f];}
const HEAT=[],LUT=new Uint8Array(256*3);
for(let i=0;i<=100;i++){const c=heatRGB(i/100);HEAT.push('rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')');}
for(let i=0;i<256;i++){const c=heatRGB(i/255);LUT[i*3]=c[0];LUT[i*3+1]=c[1];LUT[i*3+2]=c[2];}
const hc=t=>HEAT[Math.round(clamp(t,0,1)*100)];
function hca(t,a){const c=heatRGB(t);return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a.toFixed(3)+')';}
const WHITE='#f4f8ff';
const DARK='#070b22';

/* ---------- layout ---------- */
// spots: 0 far-left, 1 far-right, 2 near-right, 3 near-left (ring order 0-1-2-3)
const SP_ANG=[-0.75*PI,-0.25*PI,0.25*PI,0.75*PI];
const ADJ=(a,b)=>((a+1)%4===b)||((b+1)%4===a);
function readSafe(){
  try{const cs=getComputedStyle(saEl);
    return {t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};}
  catch(e){return {t:0,r:0,b:0,l:0};}
}
function layout(){
  W=Math.max(200,window.innerWidth||document.documentElement.clientWidth||390);
  H=Math.max(200,window.innerHeight||document.documentElement.clientHeight||844);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const s=readSafe();
  const x0=s.l,y0=s.t,w=W-s.l-s.r,h=H-s.t-s.b;
  const portrait=h>w*1.1;
  u=portrait?Math.min(w/390,h/720):Math.min(w/700,h/600);
  u=Math.max(0.55,u);
  L.x0=x0;L.y0=y0;L.w=w;L.h=h;L.portrait=portrait;
  L.cx=x0+w/2;
  L.faceY=y0+h-62*u;
  L.girlHome={x:L.cx-18*u,y:L.faceY};
  L.handHome={x:L.cx+22*u,y:L.faceY-100*u};
  L.topY=y0+112*u;
  L.bottomY=L.faceY-238*u;
  if(L.bottomY-L.topY<150*u)L.bottomY=L.topY+150*u;
  L.C={x:L.cx,y:(L.topY+L.bottomY)/2};
  L.ry=(L.bottomY-L.topY)/2;
  L.rx=portrait?Math.min(w*0.32,w/2-42*u):Math.min(w*0.3,L.ry*2.5);
  L.Ex=L.rx*Math.SQRT2;L.Ey=L.ry*Math.SQRT2;
}
function spotPos(i){const f=i<=1?0.64:1;return {x:L.C.x+Math.cos(SP_ANG[i])*L.Ex*f,y:L.C.y+Math.sin(SP_ANG[i])*L.Ey};}
function modeTarget(){
  if(S.mode==='ring')return {Lx:L.C.x,Ly:L.C.y,k:0.8};
  if(S.mode==='near')return {Lx:L.C.x,Ly:L.C.y+0.45*L.ry,k:0.42};
  return {Lx:L.C.x,Ly:L.C.y,k:0.56};
}

/* ---------- audio (Web Audio synth) ---------- */
let AC=null,MG=null,NB=null;
function audioInit(){
  try{
    if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
      AC=new C();MG=AC.createGain();MG.gain.value=0.6;
      let out=MG;
      try{const comp=AC.createDynamicsCompressor();MG.connect(comp);comp.connect(AC.destination);out=null;}catch(e){}
      if(out)MG.connect(AC.destination);
      NB=AC.createBuffer(1,Math.floor(AC.sampleRate*0.6),AC.sampleRate);
      const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
    if(AC.state==='suspended'){const p=AC.resume();if(p&&p.catch)p.catch(()=>{});}
  }catch(e){AC=null;}
}
function tone(f,dur,type,vol,delay,f2){
  if(!AC)return;
  try{const t=AC.currentTime+(delay||0);const o=AC.createOscillator();const g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.1,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(MG);o.start(t);o.stop(t+dur+0.05);}catch(e){}
}
function noise(dur,freq,q,vol,delay,type,f2){
  if(!AC||!NB)return;
  try{const t=AC.currentTime+(delay||0);const s=AC.createBufferSource();s.buffer=NB;
    const fl=AC.createBiquadFilter();fl.type=type||'bandpass';fl.frequency.setValueAtTime(freq,t);
    if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=q||1;
    const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(fl);fl.connect(g);g.connect(MG);s.start(t,Math.random()*0.3);s.stop(t+dur+0.05);}catch(e){}
}
const lastSnd={};
function okSnd(k,gap){const n=T;if(lastSnd[k]!==undefined&&n-lastSnd[k]<gap)return false;lastSnd[k]=n;return true;}
const SND={
  press(){tone(330,0.09,'sine',0.12,0,230);},
  ooh(p){if(!okSnd('ooh'+p,0.6))return;tone(p,0.32,'triangle',0.06,0,p*1.12);},
  pachin(p){noise(0.07,2300,1.1,0.55);noise(0.05,5200,0.7,0.25,0.004);tone(p,0.11,'square',0.04,0,p*0.8);},
  success(n){const b=523.25*Math.pow(2,[0,2,4,7,9][n%5]/12);
    tone(b,0.22,'triangle',0.12,0.07);tone(b*1.25,0.22,'triangle',0.12,0.16);tone(b*1.5,0.4,'triangle',0.13,0.25);tone(b*2,0.6,'sine',0.07,0.34);},
  chair(){if(!okSnd('chair',0.25))return;noise(0.32,420,0.8,0.22,0,'lowpass',160);tone(98,0.14,'sine',0.12,0.02);},
  scrape(){if(!okSnd('scrape',0.18))return;noise(0.14,600,1.2,0.07,0,'bandpass',300);},
  bench(){tone(196,0.09,'square',0.05,0);tone(247,0.09,'square',0.05,0.1);tone(392,0.3,'triangle',0.09,0.2);tone(494,0.35,'triangle',0.08,0.24);},
  snack(){for(let i=0;i<3;i++)noise(0.035,3200,2,0.13,i*0.07);tone(660,0.12,'sine',0.05,0.22);},
  table(){tone(880,1.0,'sine',0.1);tone(1320,0.8,'sine',0.06,0.03);tone(1760,0.6,'sine',0.04,0.06);},
  guide(){tone(480,0.35,'sine',0.11,0,980);tone(980,0.25,'triangle',0.08,0.32);tone(1175,0.3,'triangle',0.07,0.45);},
  reverse(){[392,494,587,784].forEach((f,i)=>tone(f,0.7,'triangle',0.08,i*0.11));},
  seat(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.45,'triangle',0.09,i*0.09));noise(0.5,1800,0.5,0.06,0.3);},
  tick(){if(!okSnd('tick',0.08))return;tone(880,0.05,'sine',0.04);},
  boop(){if(!okSnd('boop',0.15))return;tone(520,0.08,'sine',0.05,0,620);},
  next(){tone(784,0.6,'sine',0.08,0,392);tone(587,0.5,'triangle',0.05,0.15,294);},
  pof(){if(!okSnd('pof',0.08))return;noise(0.09,500,0.8,0.12,0,'lowpass');},
  clap(){for(let i=0;i<4;i++)noise(0.04,2600,1.4,0.18,i*0.12+Math.random()*0.04);},
  chat(){if(!okSnd('chat',1))return;tone(700,0.07,'sine',0.025);tone(820,0.07,'sine',0.025,0.08);}
};

/* ---------- state ---------- */
const GDEF=[
  {hair:0,glove:0,gesture:0,pitch:392},   // bob + mitten + wave
  {hair:1,glove:1,gesture:1,pitch:440},   // bun + dotted glove + bow
  {hair:2,glove:2,gesture:2,pitch:523},   // short + glasses + fingerless + jump
  {hair:3,glove:3,gesture:3,pitch:587}    // ponytail + bare/wristband + both arms
];
const S={phase:'invite',phaseT:0,round:0,mode:null,groups:[[0],[1],[2],[3]],lastInvited:-1,order:[],
  benchMade:false,tableMade:false,guideMade:false,guide:-1,lastGuide:-1,guideFresh:0,firstFar:null,prevFirstFar:null,
  idle:0,demo:null,nextDemoAt:4,swapT:20,chairMoved:false,seatedT:0,heatDirty:0.01,later:[],
  lastHighFive:0,chain:0,appG:null,appA:0,touched:false,guidedBy:-1,prevSpots:null};
const guests=[],chairs=[];
let hand,guideHand=null,girl,center,table,mpCur;
const parts=[],ripples=[],stamps=[],snacks=[],marks=[];
const MAXP=120,MAXR=10;
let act=null; // active pointer

function later(t,fn){S.later.push({t:t,fn:fn});}

function newGuest(i){
  return {id:i,def:GDEF[i],spot:i,sleeve:i,state:'stand',x:0,y:0,chair:-1,approach:0,appT:0,reachTo:null,
    hand:{x:0,y:0},hand2:{x:0,y:0},side:1,smile:0.35,wig:0,act:null,actT:rnd(2,6),bounce:0,gestT:0,
    look:{x:0,y:0},hasCard:false,cardX:0,cardY:0,order:-1,walkPh:0,sitAmt:0,greetCD:0,hop:0,bow:0,pendingSnack:false,
    lastGreetT:-9,guideCount:0};
}
function initGame(){
  for(let i=0;i<4;i++){guests.push(newGuest(i));
    chairs.push({j:i,owner:-1,ang:SP_ANG[i],angCur:SP_ANG[i],face:PI/2,x:0,y:0,wig:0});}
  const sp=shuffle([0,1,2,3]);const sl=shuffle([0,1,2,3]);
  guests.forEach((g,i)=>{g.spot=sp[i];g.sleeve=sl[i];});
  hand={x:0,y:0,vx:0,vy:0,press:0,rim:0,drag:false,bounce:0,dx:0,dy:0,r:28};
  girl={x:0,y:0,scale:1,smile:0.4,lx:0,ly:0,glance:0,gx:0,gy:0,wig:0,path:null};
  center={x:0,y:0,show:0,relX:0,relY:0.15,moved:false,wig:0,drag:false};
  table={open:false,s:0,ox:0,oy:0};
  mpCur=modeTarget();
}
function snapAll(){
  mpCur=modeTarget();
  computeChairAngles();
  chairs.forEach(c=>{c.angCur=c.ang;});
  updateChairPositions(0);
  guests.forEach(g=>{const t=guestTarget(g);g.x=t.x;g.y=t.y;
    if(g.state==='walk'||g.state==='swap')g.state='sit';
    if(g.state==='reset')g.state='stand';
    g.sitAmt=(g.state==='sit')?1:0;
    const tt=guestTarget(g);g.x=tt.x;g.y=tt.y;
    g.hand.x=g.x;g.hand.y=g.y+10*u;g.hand2.x=g.x;g.hand2.y=g.y+10*u;
    if(g.chair>=0){const cp=cardTarget(g);g.cardX=cp.x;g.cardY=cp.y;}});
  if(S.phase==='girlSeated'||S.phase==='guiding'){const cp=centerPos();center.x=cp.x;center.y=cp.y;girl.x=center.x;girl.y=center.y-24*u*0.8;girl.scale=0.8;}
  else {girl.x=L.girlHome.x;girl.y=L.girlHome.y;girl.scale=1;}
  const hh=handHome();hand.x=hand.dx=hh.x;hand.y=hand.dy=hh.y;hand.vx=hand.vy=0;
  if(guideHand){const h2=guideHome();guideHand.x=guideHand.dx=h2.x;guideHand.y=guideHand.dy=h2.y;}
}

/* ---------- groups & chairs ---------- */
function groupIdx(j){for(let i=0;i<S.groups.length;i++)if(S.groups[i].indexOf(j)>=0)return i;return -1;}
function joinGroup(j,target){
  const gi=groupIdx(j),ti=groupIdx(target);if(gi===ti||gi<0||ti<0)return;
  const G=S.groups[ti];S.groups[gi]=S.groups[gi].filter(x=>x!==j);
  G.push(j);S.groups=S.groups.filter(x=>x.length>0);
}
function speedAt(a,mp){return mp.k*Math.sqrt(Math.pow(Math.sin(a)*L.Ex,2)+Math.pow(Math.cos(a)*L.Ey,2))+1e-3;}
// angular step so neighbours are separated by an ellipse of (sx,sy) px on screen (seated people need more room vertically)
function stepAt(a,mp,sx,sy){const tx=-Math.sin(a)*L.Ex*mp.k,ty=Math.cos(a)*L.Ey*mp.k;return 1/(Math.sqrt(Math.pow(tx/sx,2)+Math.pow(ty/sy,2))+1e-6);}
function computeChairAngles(){
  const mp=modeTarget();const ang=SP_ANG.slice();const gid=[0,0,0,0];
  S.groups.forEach((G,gi)=>G.forEach(j=>gid[j]=gi));
  for(const G of S.groups){
    if(G.length<2||G.length>=4)continue;
    let sx=0,sy=0;for(const j of G){sx+=Math.cos(SP_ANG[j]);sy+=Math.sin(SP_ANG[j]);}
    const c=(Math.hypot(sx,sy)/G.length<0.3)?SP_ANG[G[0]]:Math.atan2(sy,sx);
    const m=G.slice().sort((a,b)=>wrapA(SP_ANG[a]-c)-wrapA(SP_ANG[b]-c));
    const d=stepAt(c,mp,58*u,86*u);
    m.forEach((j,i)=>{ang[j]=c+(i-(m.length-1)/2)*d;});
  }
  for(let it=0;it<10;it++){
    for(let a=0;a<4;a++)for(let b=a+1;b<4;b++){
      if(gid[a]===gid[b])continue;
      const d=wrapA(ang[b]-ang[a]);const mid=ang[a]+d/2;const req=stepAt(mid,mp,62*u,92*u);
      if(Math.abs(d)<req){const p=(req-Math.abs(d))/2*(d>=0?1:-1);
        for(const j of S.groups[gid[a]])ang[j]-=p;for(const j of S.groups[gid[b]])ang[j]+=p;}
    }
  }
  for(let j=0;j<4;j++)chairs[j].ang=wrapA(ang[j]);
}
function tableR(){return clamp(0.27*mpCur.k*Math.min(L.Ex,L.Ey),30*u,62*u);}
function tablePos(){return {x:mpCur.Lx+table.ox,y:mpCur.Ly+table.oy};}
function centerPos(){
  if(center.moved)return {x:L.C.x+center.relX*L.rx,y:L.C.y+center.relY*L.ry};
  return {x:mpCur.Lx,y:mpCur.Ly+(table.open?14*u:0)};
}
function updateChairPositions(dt){
  const tp=tablePos(),tr=tableR()*table.s;
  for(const c of chairs){
    let x=mpCur.Lx+Math.cos(c.angCur)*L.Ex*mpCur.k,y=mpCur.Ly+Math.sin(c.angCur)*L.Ey*mpCur.k;
    if(table.s>0.02){const d=dist(x,y,tp.x,tp.y),m=tr+28*u;if(d<m&&d>0.01){x=tp.x+(x-tp.x)/d*m;y=tp.y+(y-tp.y)/d*m;}}
    if(center.show>0.02){const d=dist(x,y,center.x,center.y),m=68*u*center.show;if(d<m&&d>0.01){x=center.x+(x-center.x)/d*m;y=center.y+(y-center.y)/d*m;}}
    c.x=x;c.y=y;
  }
}

/* ---------- guests helpers ---------- */
function guestTarget(g){
  if(g.state==='stand'||g.state==='reset'||g.chair<0)return spotPos(g.spot);
  const c=chairs[g.chair];
  if(g.state==='guide'){const dx=c.x-mpCur.Lx,dy=c.y-mpCur.Ly;const d=Math.hypot(dx,dy)||1;
    return {x:c.x+dx/d*30*u,y:c.y+dy/d*16*u-22*u};}
  return {x:c.x,y:c.y-22*u};
}
function cardTarget(g){const c=chairs[g.chair];return {x:c.x-18*u,y:c.y+9*u};}
function shoulderOf(g,side){return {x:g.x+side*14*u,y:g.y-15*u+g.bow*4*u};}
function headOf(g){return {x:g.x+g.bow*2*u*g.side,y:g.y-37*u+g.bow*7*u+(g.sitAmt>0.5?2*u:0)};}
function contactable(g){return g.state==='stand'||g.state==='sit'||g.state==='guide';}

/* ---------- hands ---------- */
function girlShoulder(){const s=girl.scale;
  if(S.phase==='girlSeated'||S.phase==='guiding')return {x:girl.x+24*u*s,y:girl.y+40*u*s};
  return {x:girl.x+44*u*s,y:girl.y+46*u*s};}
function handHome(){
  const s=girl.scale;
  if(S.phase==='girlSeated')return {x:girl.x+52*u*s,y:girl.y+92*u*s+Math.sin(T*2.4)*2*u};
  if(S.phase==='guiding')return {x:girl.x+60*u*s,y:girl.y+10*u*s};
  let x=girl.x+40*u*s,y=girl.y-100*u*s;
  if(S.phase==='invite'){const sg=suggestGuest();
    if(sg){const t=sg.state==='stand'?sg.hand:{x:sg.x,y:sg.y};const d=dist(t.x,t.y,x,y)||1;x+=(t.x-x)/d*7*u;y+=(t.y-y)/d*7*u;}}
  y+=Math.sin(T*2.2)*2.5*u;
  return {x:x,y:y};
}
function guideHome(){
  const g=guests[S.guide];if(!g)return {x:0,y:0};
  const side=(L.C.x>g.x)?1:-1;const sh=shoulderOf(g,side);
  const dx=L.C.x-sh.x,dy=(L.C.y+L.ry*0.3)-sh.y;const d=Math.hypot(dx,dy)||1;
  return {x:sh.x+dx/d*46*u,y:sh.y+dy/d*46*u+Math.sin(T*3)*2*u};
}
function handDraggable(){return S.phase==='invite'||S.phase==='reverse'||S.phase==='girlSeated';}

/* ---------- suggestion (one invitation) ---------- */
function suggestGuest(){
  if(S.phase==='reverse'){let b=null,bd=1e9;for(const g of guests){const d=dist(g.hand.x,g.hand.y,hand.x,hand.y);if(d<bd){bd=d;b=g;}}return b;}
  if(S.phase!=='invite')return null;
  const U=guests.filter(g=>g.state==='stand');
  const seated=guests.filter(g=>g.state==='sit'||g.state==='guide');
  if(!U.length)return null;
  if(S.guide>=0&&S.guideFresh>0){return U[0];}
  if(S.order.length===0){
    const wantFar=(S.prevFirstFar===null)?false:!S.prevFirstFar;
    const c=U.filter(g=>(g.spot<=1)===wantFar);const pool=c.length?c:U;
    return pool[S.round%pool.length];
  }
  if(!S.benchMade&&S.lastInvited>=0){const la=chairs[S.lastInvited].ang;
    const c=U.filter(g=>angDiff(SP_ANG[g.spot],la)<2.18);if(c.length)return c[0];}
  if(!S.tableMade){const c=U.filter(g=>seated.some(o=>o.chair>=0&&angDiff(SP_ANG[g.spot],chairs[o.chair].ang)>2.44));if(c.length)return c[0];}
  if(!S.guideMade&&seated.length>=2){const c=seated.filter(g=>g.state==='sit');if(c.length)return c[c.length-1];}
  let b=U[0],bd=1e9;for(const g of U){const d=dist(g.x,g.y,L.handHome.x,L.handHome.y);if(d<bd){bd=d;b=g;}}return b;
}
function highlightTarget(){
  if(act)return null;

/* ---------- core events ---------- */
function highFive(h,isGuide,g){
  const mx=(h.dx+g.hand.x)/2,my=(h.dy+g.hand.y)/2;
  const prevPhase=S.phase;
  if(prevPhase==='girlSeated'){
    if(T-g.lastGreetT<1.5)return;g.lastGreetT=T;
    g.bounce=1;g.smile=1;g.smileT=1.4;g.hop=1;girl.smile=1;
    SND.pachin(g.def.pitch*1.5);tone(g.def.pitch*2,0.2,'triangle',0.06,0.05);
    spawnHeat(mx,my,6,0.8,110);spawnRipple(mx,my,0.75,40*u);
    stamps.push({x:mx,y:my,r:14*u,rot:rnd(-0.4,0.4),life:0,guest:-1,fly:0,fx:mx,fy:my});if(stamps.length>8)stamps.shift();
    return;}
  // bounce back
  const ax=h.dx-g.hand.x,ay=h.dy-g.hand.y,ad=Math.hypot(ax,ay)||1;
  h.drag=false;h.vx=ax/ad*520*u;h.vy=ay/ad*520*u;h.bounce=1;
  if(act)act.consumed=true;
  g.bounce=1;g.smile=1;g.smileT=1.6;girl.smile=1;
  const now=T;const quick=(now-S.lastHighFive)<6;S.lastHighFive=now;
  S.chain=quick?S.chain+1:0;
  const pitch=g.def.pitch*Math.pow(2,(S.order.length*2+(isGuide?5:0))/12);
  SND.pachin(pitch);
  spawnHeat(mx,my,12,0.85);spawnRipple(mx,my,0.8,62*u);
  const st={x:mx,y:my,r:20*u,rot:Math.atan2(my-g.y,mx-g.x)+PI/2+rnd(-0.2,0.2),life:0,guest:-1,fly:0,fx:mx,fy:my};
  stamps.push(st);if(stamps.length>8)stamps.shift();
  if(prevPhase==='invite'){
    if(g.state==='stand'){st.guest=g.id;invite(g,isGuide);return;}
    if(isGuide){ // pass guide role
      if(g.id!==S.guide&&(g.state==='sit')){passGuide(g);} return;}
    if(g.state==='guide'){endGuide(true);SND.boop();return;}
    if(g.state==='sit'){
      const anyU=guests.some(o=>o.state==='stand');
      if(anyU&&(T-g.lastGreetT>1.2)){makeGuide(g);}else{g.hop=1;SND.boop();}
      g.lastGreetT=T;return;}
  }
  if(prevPhase==='reverse'){guided(g);return;}
}
function invite(g,viaGuide){
  const j=g.spot,ch=chairs[j];
  ch.owner=g.id;g.chair=j;g.state='walk';g.order=S.order.length;S.order.push(g.id);g.hasCard=false;
  const myAng=SP_ANG[g.spot];
  const others=guests.filter(o=>o!==g&&o.chair>=0);
  if(S.order.length===1){S.firstFar=(g.spot<=1);S.mode=S.firstFar?'ring':'near';later(0.15,()=>SND.chair());}
  let joined=false;
  if(viaGuide&&S.guide>=0){joinGroup(j,guests[S.guide].chair);joined=true;}
  else if(S.lastInvited>=0&&chairs[S.lastInvited].owner>=0&&chairs[S.lastInvited].owner!==g.id){
    if(angDiff(myAng,chairs[S.lastInvited].ang)<2.18||ADJ(S.lastInvited,g.spot)){joinGroup(j,S.lastInvited);joined=true;}}
  if(!joined&&!viaGuide){
    for(const o of others){const gi=groupIdx(o.chair);if(gi>=0&&S.groups[gi].length>=2&&(angDiff(myAng,chairs[o.chair].ang)<2.18||ADJ(o.chair,g.spot))){joinGroup(j,o.chair);joined=true;break;}}
  }
  let opp=false;
  for(const o of others){if(angDiff(myAng,chairs[o.chair].ang)>2.44)opp=true;}
  if(joined){S.benchMade=true;g.pendingSnack=true;later(0.35,()=>SND.bench());}
  if(opp&&!table.open){table.open=true;S.tableMade=true;later(0.3,()=>{SND.table();const tp=tablePos();spawnRipple(tp.x,tp.y,0.65,80*u);});}
  S.lastInvited=j;
  SND.success(S.order.length-1);
  if(!joined&&S.order.length>1)later(0.2,()=>SND.chair());
  if(guests.every(o=>o.chair>=0)&&S.guide>=0)later(0.4,()=>{if(S.guide>=0)endGuide(false);});
  S.heatDirty=1.2;
}
function makeGuide(g){
  if(S.guide>=0)endGuide(false);
  S.guide=g.id;g.state='guide';S.guideMade=true;S.guideFresh=7;g.guideCount++;
  const h=guideHome();guideHand={x:g.hand.x,y:g.hand.y,vx:0,vy:0,press:0,rim:0,drag:false,bounce:1,dx:g.hand.x,dy:g.hand.y,r:13};
  SND.guide();spawnHeat(g.x,g.y-30*u,10,0.7,120);spawnRipple(g.x,g.y,0.6,50*u);
  void h;
}
function passGuide(g){
  const old=guests[S.guide];if(old){old.state='sit';old.smile=0.9;}
  S.guide=-1;

}
function endGuide(sound){

}
function startReverse(){
  if(S.phase!=='invite')return;
  S.phase='reverse';S.phaseT=0;S.lastGuide=S.guide>=0?S.guide:S.lastGuide;
  if(S.guide>=0)endGuide(false);

}
function guided(g){

  const cp=centerPos();girl.path={x0:girl.x,y0:girl.y,x1:cp.x,y1:cp.y-24*u*0.8,t:0};

function nextRound(){
  S.phase='reset';S.phaseT=0;SND.next();
  for(const m of marks)m.age++;
  for(const g of guests){if(g.hasCard){marks.push({rx:(g.cardX-L.C.x)/L.rx,ry:(g.cardY-L.C.y)/L.ry,age:0,rot:rnd(-0.4,0.4)});}}
  while(marks.length>12)marks.shift();
  for(let i=marks.length-1;i>=0;i--)if(marks[i].age>2)marks.splice(i,1);
  const cur=guests.map(g=>g.spot);let perm;let tries=0;
  do{perm=shuffle([0,1,2,3]);tries++;}while(tries<30&&perm.filter((p,i)=>p===cur[i]).length>1);
  const sl=guests.map(g=>g.sleeve);let ns;tries=0;
  do{ns=shuffle(sl.slice());tries++;}while(tries<30&&ns.filter((p,i)=>p===sl[i]).length>1);
  S.lastGuide=S.guide>=0?S.guide:S.lastGuide;
  if(S.guide>=0)endGuide(false);
  guests.forEach((g,i)=>{g.spot=perm[i];g.sleeve=ns[i];g.chair=-1;g.state='reset';g.hasCard=false;g.order=-1;g.pendingSnack=false;g.act=null;});
  chairs.forEach(c=>c.owner=-1);
  S.groups=[[0],[1],[2],[3]];S.mode=null;S.order=[];S.lastInvited=-1;
  S.benchMade=S.tableMade=S.guideMade=false;S.prevFirstFar=S.firstFar;S.firstFar=null;
  table.open=false;table.oyT=0;center.moved=false;S.chairMoved=false;
  girl.path={x0:girl.x,y0:girl.y,x1:L.girlHome.x,y1:L.girlHome.y,t:0};

function poke(x,y){
  for(const g of guests){const hd=headOf(g);
    if(dist(x,y,g.x,g.y)<32*u||dist(x,y,hd.x,hd.y)<24*u){g.wig=1;SND.tick();return;}}
  for(const c of chairs){if(dist(x,y,c.x,c.y)<22*u){c.wig=1;SND.tick();return;}}
  if(table.s>0.5){const tp=tablePos();if(dist(x,y,tp.x,tp.y)<tableR()){table.wig=1;SND.tick();return;}}

}

/* ---------- heat background (event-driven, static between events) ---------- */
const bgCan=document.createElement('canvas'),bgPrev=document.createElement('canvas');
let bgFade=1,bgHas=false;
function buildHeat(){
  const sc=0.5;const w=Math.max(16,Math.ceil(W*sc)),h=Math.max(16,Math.ceil(H*sc));
  if(bgHas){bgPrev.width=bgCan.width;bgPrev.height=bgCan.height;bgPrev.getContext('2d').drawImage(bgCan,0,0);bgFade=0;}
  bgCan.width=w;bgCan.height=h;
  const F=new Float32Array(w*h);
  for(let y=0;y<h;y++){const b=0.055;for(let x=0;x<w;x++)F[y*w+x]=b;}
  const B=[];
  B.push([L.C.x,L.C.y+L.ry*0.1,L.Ex*1.05,L.Ey*1.0,0.24]);
  B.push([L.C.x,L.C.y+L.ry*0.15,L.Ex*0.55,L.Ey*0.5,0.09]);
  B.push([L.x0+26*u,L.y0+30*u,120*u,120*u,0.34],[L.x0+26*u,L.y0+30*u,40*u,40*u,0.22]);
  B.push([L.x0+L.w-26*u,L.y0+30*u,120*u,120*u,0.34],[L.x0+L.w-26*u,L.y0+30*u,40*u,40*u,0.22]);
  B.push([L.girlHome.x,L.girlHome.y+30*u,150*u,120*u,0.28]);
  for(const g of guests){if(g.chair<0){const p=spotPos(g.spot);B.push([p.x,p.y+30*u,70*u,55*u,0.11]);}}
  for(const c of chairs){if(c.owner>=0)B.push([c.x,c.y,62*u,52*u,0.2]);}
  if(table.open){const tp=tablePos();const tr=tableR();B.push([tp.x,tp.y,tr*1.9,tr*1.7,0.3]);}
  if(S.phase==='girlSeated'){B.push([center.x,center.y,90*u,80*u,0.26]);}
  for(const m of marks){B.push([L.C.x+m.rx*L.rx,L.C.y+m.ry*L.ry,34*u,30*u,0.17/(1+m.age*0.8)]);}
  for(const b of B){
    const bx=b[0]*sc,by=b[1]*sc,rx=b[2]*sc,ry=b[3]*sc,a=b[4];
    const x0=Math.max(0,Math.floor(bx-rx)),x1=Math.min(w-1,Math.ceil(bx+rx));
    const y0=Math.max(0,Math.floor(by-ry)),y1=Math.min(h-1,Math.ceil(by+ry));
    for(let y=y0;y<=y1;y++){const dy=(y-by)/ry;const dy2=dy*dy;if(dy2>=1)continue;
      for(let x=x0;x<=x1;x++){const dx=(x-bx)/rx;const q=dx*dx+dy2;if(q<1){const f=1-q;F[y*w+x]+=a*f*f;}}}
  }
  const bctx=bgCan.getContext('2d');const img=bctx.createImageData(w,h);const D=img.data;
  for(let i=0,n=w*h;i<n;i++){let v=F[i];if(v>0.86)v=0.86;const band=Math.floor(v*13)/13;const t=band*0.8+v*0.2;
    const k=Math.min(255,(t*255)|0)*3;D[i*4]=LUT[k];D[i*4+1]=LUT[k+1];D[i*4+2]=LUT[k+2];D[i*4+3]=255;}
  bctx.putImageData(img,0,0);bgHas=true;
}

/* ---------- update ---------- */
function update(dt){
  T+=dt;S.phaseT+=dt;DT=dt;
  if(!act)S.idle+=dt;
  // scheduled
  for(let i=S.later.length-1;i>=0;i--){const l=S.later[i];l.t-=dt;if(l.t<=0){S.later.splice(i,1);try{l.fn();}catch(e){}}}
  if(S.heatDirty>0){S.heatDirty-=dt;if(S.heatDirty<=0)buildHeat();}
  if(bgFade<1)bgFade=Math.min(1,bgFade+dt*2);
  if(S.guideFresh>0)S.guideFresh-=dt;
  // mode params
  const mt=modeTarget();
  mpCur.Lx=damp(mpCur.Lx,mt.Lx,4,dt);mpCur.Ly=damp(mpCur.Ly,mt.Ly,4,dt);mpCur.k=damp(mpCur.k,mt.k,4,dt);
  // table
  table.s=damp(table.s,table.open?1:0,table.open?5:7,dt);
  table.oy=damp(table.oy,table.oyT||0,4,dt);
  if(table.wig)table.wig=Math.max(0,table.wig-dt*3);
  // center seat
  const cshow=(S.phase==='reverse'||S.phase==='guiding'||S.phase==='girlSeated')?1:0;
  center.show=damp(center.show,cshow,6,dt);
  if(act&&act.kind==='chair'){
    let tx=act.px+act.ox,ty=act.py+act.oy;
    let rx=(tx-L.C.x)/L.rx,ry=(ty-L.C.y)/L.ry;const m=Math.hypot(rx/0.95,ry/1.05);if(m>1){rx/=m;ry/=m;}
    center.relX=rx;center.relY=ry;center.moved=true;
    if(dist(act.px,act.py,act.sx,act.sy)>12*u)SND.scrape();
  }
  const cp=centerPos();
  if(center.show<0.05&&!cshow){center.x=cp.x;center.y=cp.y;}
  else{center.x=damp(center.x,cp.x,center.drag?22:8,dt);center.y=damp(center.y,cp.y,center.drag?22:8,dt);}
  if(center.wig)center.wig=Math.max(0,center.wig-dt*2.5);
  // chairs
  computeChairAngles();
  for(const c of chairs){c.angCur+=wrapA(c.ang-c.angCur)*(1-Math.exp(-5*dt));if(c.wig)c.wig=Math.max(0,c.wig-dt*3);}
  updateChairPositions(dt);
  // girl
  updateGirl(dt);
  // hands
  updateHands(dt);
  // approach & guests
  updateGuests(dt);
  // contact
  checkContacts();
  // chair facing
  updateFacing(dt);
  // swaps
  updateSwaps(dt);
  // phase logic
  updatePhase(dt);
  // demo
  updateDemo(dt);
  // fx
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;if(p.life>=p.max){parts.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.exp(-3*dt);p.vy=p.vy*Math.exp(-3*dt)-20*u*dt;}
  for(let i=ripples.length-1;i>=0;i--){ripples[i].life+=dt;if(ripples[i].life>=ripples[i].max)ripples.splice(i,1);}
  for(let i=stamps.length-1;i>=0;i--){const s=stamps[i];s.life+=dt;
    if(s.guest>=0){const g=guests[s.guest];
      if(s.life>0.45&&g.chair>=0){s.fly=Math.min(1,s.fly+dt*2.2);const ct=cardTarget(g);s.fx=lerp(s.x,ct.x,ease(s.fly));s.fy=lerp(s.y,ct.y,ease(s.fly))-Math.sin(s.fly*PI)*40*u;
        if(s.fly>=1){g.hasCard=true;g.cardX=ct.x;g.cardY=ct.y;stamps.splice(i,1);SND.pof();spawnHeat(ct.x,ct.y,4,0.9,60);}}
      else if(g.chair<0){stamps.splice(i,1);}
    } else if(s.life>1.1)stamps.splice(i,1);
  }
  for(let i=snacks.length-1;i>=0;i--){const s=snacks[i];s.t+=dt/s.dur;if(s.t>=1){const r=guests[s.to];r.smile=1;r.smileT=1.2;guests[s.from].smile=1;
    SND.snack();spawnHeat(r.hand.x,r.hand.y,4,0.65,50);snacks.splice(i,1);}}
}
function updateGirl(dt){
  if(girl.path){const p=girl.path;p.t=Math.min(1,p.t+dt/(S.phase==='guiding'?1.5:1.2));const e=ease(p.t);
    const tx=lerp(p.x0,p.x1,e),ty=lerp(p.y0,p.y1,e)-Math.sin(e*PI)*30*u;
    girl.x=tx;girl.y=ty;
    if(S.phase==='guiding')girl.scale=lerp(1,0.8,e);else if(S.phase==='reset')girl.scale=lerp(girl.scale,1,e);
    if(p.t>=1){girl.path=null;}
  } else {
    if(S.phase==='girlSeated'){girl.x=center.x;girl.y=center.y-24*u*0.8;girl.scale=0.8;}
    else if(S.phase==='invite'||S.phase==='reverse'){girl.x=damp(girl.x,L.girlHome.x,8,dt);girl.y=damp(girl.y,L.girlHome.y,8,dt);girl.scale=damp(girl.scale,1,8,dt);}
  }
  girl.smile=damp(girl.smile,S.phase==='girlSeated'?0.8:0.45,1.2,dt);
  if(girl.glance>0)girl.glance-=dt;
  if(girl.wig)girl.wig=Math.max(0,girl.wig-dt*3);
  // gaze
  let lx,ly;
  if(girl.glance>0){lx=girl.gx;ly=girl.gy;}
  else if(act&&(act.kind==='hand'||act.kind==='guide')){const h=act.kind==='hand'?hand:guideHand;lx=h?h.x:girl.x;ly=h?h.y:girl.y;}
  else if(S.demo){const o=S.demo.obj==='guide'?guideHand:hand;lx=o?o.x:girl.x;ly=o?o.y:girl.y;}

function stepHand(h,dt,home,dragging){

function poseHands(g,dt){

function updateGuestAct(g,dt){

function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(0.1,r),0,TAU);}
function ell(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),0,0,TAU);}
function line(x1,y1,x2,y2,w,col){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}

// hand parts (local, fingers toward -y; thumb on +x)
const FING=[[-0.44,-0.42,-0.6,-1.24,0.33],[-0.15,-0.5,-0.18,-1.42,0.34],[0.15,-0.5,0.2,-1.34,0.33],[0.43,-0.4,0.6,-1.08,0.29]];
const THUMB=[0.58,0.08,1.08,-0.42,0.34];
const GLOVES=[
  {rim:0.27,core:0.38,mitten:true},
  {rim:0.36,core:0.46,dots:0.7},
  {rim:0.42,core:0.5,fingerless:true},
  {rim:0.64,core:0.82,band:0.22}
];
function drawHand(x,y,r,rot,st,sq,ow,mirror,spread){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);if(mirror)ctx.scale(-1,1);
  if(sq)ctx.scale(1+sq*0.1,1-sq*0.17);
  ctx.lineCap='round';
  const sp=spread||1;
  const fing=(w,col,lw)=>{ctx.strokeStyle=col;
    if(st.mitten){ctx.lineWidth=lw(0.95);ctx.beginPath();ctx.moveTo(0,-0.45*r);ctx.lineTo(0,-0.95*r);ctx.stroke();}
    else for(const f of FING){ctx.lineWidth=lw(f[4]);ctx.beginPath();ctx.moveTo(f[0]*r,f[1]*r);ctx.lineTo(f[2]*r*sp,f[3]*r);ctx.stroke();}
    ctx.lineWidth=lw(THUMB[4]);ctx.beginPath();ctx.moveTo(THUMB[0]*r,THUMB[1]*r);ctx.lineTo(THUMB[2]*r,THUMB[3]*r*sp);ctx.stroke();};
  // pass 1: white outline
  if(ow>0){ctx.fillStyle=WHITE;ell(0,0,0.74*r+ow,0.8*r+ow);ctx.fill();fing(0,WHITE,w=>w*r+ow*2);}
  // pass 2: rim
  const rimC=typeof st.rimC==='string'?st.rimC:hc(st.rim);
  ctx.fillStyle=rimC;ell(0,0,0.74*r,0.8*r);ctx.fill();fing(0,rimC,w=>w*r);
  // pass 3: core
  if(st.fingerless){ctx.strokeStyle=hc(0.9);for(const f of FING){ctx.lineWidth=f[4]*r*0.8;ctx.beginPath();ctx.moveTo(lerp(f[0],f[2],0.45)*r,lerp(f[1],f[3],0.45)*r);ctx.lineTo(f[2]*r*sp,f[3]*r);ctx.stroke();}}
  ctx.fillStyle=hc(st.core);ell(0,0.06*r,0.48*r,0.52*r);ctx.fill();
  if(!st.mitten&&!st.fingerless&&st.core>0.6){ctx.strokeStyle=hc(Math.min(1,st.core+0.06));for(const f of FING){ctx.lineWidth=f[4]*r*0.42;ctx.beginPath();ctx.moveTo(f[0]*r,f[1]*r);ctx.lineTo(lerp(f[0],f[2]*sp,0.8)*r,lerp(f[1],f[3],0.8)*r);ctx.stroke();}}
  if(st.hot){ctx.fillStyle=hc(st.hot);ell(0,0.1*r,0.26*r,0.28*r);ctx.fill();}
  if(st.dots){ctx.fillStyle=hc(st.dots);for(const d of [[-0.3,-0.1],[0.25,-0.2],[0,0.3],[-0.25,0.4],[0.32,0.32]]){circ(d[0]*r,d[1]*r,0.11*r);ctx.fill();}}
  if(st.band!==undefined){ctx.fillStyle=hc(st.band);rrect(-0.6*r,0.62*r,1.2*r,0.36*r,0.15*r);ctx.fill();}
  ctx.restore();
}
function drawPrint(x,y,r,rot,alpha,outline){
  ctx.save();ctx.globalAlpha=alpha;
  drawHand(x,y,r,rot,{rimC:hc(0.8),rim:0.8,core:1,hot:1},0,outline?Math.max(1.2,r*0.12):0,false,1.12);
  ctx.restore();
}

// sleeves on an arm from shoulder (sx,sy) to wrist (wx,wy)
function drawArm(sx,sy,hx,hy,sleeve,thick,handR){
  const dx=hx-sx,dy=hy-sy,len=Math.hypot(dx,dy)||1,nx=dx/len,ny=dy/len;
  const wx=hx-nx*handR*0.55,wy=hy-ny*handR*0.55;
  const th=thick*clamp(42*u/len,0.68,1.1);
  ctx.lineCap='round';
  line(sx,sy,wx,wy,th+3*u,'rgba(230,240,255,0.8)');
  line(sx,sy,wx,wy,th,hc(0.72));
  const P=f=>({x:lerp(sx,wx,f),y:lerp(sy,wy,f)});
  if(sleeve===0){const e=P(0.82);line(sx,sy,e.x,e.y,th,hc(0.24));
    ctx.save();ctx.setLineDash([5*u,5*u]);line(sx,sy,e.x,e.y,th,hc(0.44));ctx.restore();}
  else if(sleeve===1){const e=P(0.5);line(sx,sy,e.x,e.y,th,hc(0.3));
    ctx.fillStyle=WHITE;circ(sx,sy,th*0.95+1.5*u);ctx.fill();ctx.fillStyle=hc(0.32);circ(sx,sy,th*0.95);ctx.fill();
    ctx.fillStyle=hc(0.4);circ(sx,sy,th*0.55);ctx.fill();
    const c=P(0.5);ctx.fillStyle=hc(0.5);for(let i=0;i<6;i++){const a=i/6*TAU+T*0;circ(c.x+Math.cos(a)*th*0.55,c.y+Math.sin(a)*th*0.55,th*0.28);ctx.fill();}}
  else if(sleeve===2){const e=P(0.92);line(sx,sy,e.x,e.y,th,hc(0.17));
    const c=P(0.82);line(c.x,c.y,e.x,e.y,th+2*u,hc(0.38));ctx.fillStyle=hc(0.6);
    for(const f of [0.3,0.5,0.68]){const q=P(f);circ(q.x,q.y,th*0.16);ctx.fill();}}
  else {const e=P(0.3);line(sx,sy,e.x,e.y,th+1*u,hc(0.36));const c=P(0.86);const c2=P(0.97);line(c.x,c.y,c2.x,c2.y,th+1.5*u,hc(0.2));}
}

function bandsEll(x,y,rx,ry,ts,sc,offY){
  for(let i=0;i<ts.length;i++){ctx.fillStyle=hc(ts[i]);ell(x,y+(offY||0)*i,rx*sc[i],ry*sc[i]);ctx.fill();}
}
function drawHead(x,y,r,hair,lx,ly,smile,isGirl,blink){
  const ow=Math.max(2.2,r*0.13);
  // back hair
  ctx.lineWidth=Math.max(1.2,ow*0.45);ctx.strokeStyle='rgba(230,240,255,0.75)';
  if(hair==='girl'){for(const s of [-1,1]){ctx.fillStyle=hc(0.26);circ(x+s*r*1.08,y+r*0.12,r*0.42);ctx.fill();ctx.stroke();ctx.fillStyle=hc(0.36);circ(x+s*r*1.08,y+r*0.12,r*0.22);ctx.fill();
    ctx.fillStyle=hc(0.5);circ(x+s*r*0.86,y-r*0.12,r*0.14);ctx.fill();}}
  if(hair===0){ctx.fillStyle=hc(0.24);ell(x,y+r*0.08,r*1.16,r*1.06);ctx.fill();ctx.stroke();}
  if(hair===3){ctx.fillStyle=hc(0.28);ell(x+r*1.0,y+r*0.35,r*0.32,r*0.62);ctx.fill();ctx.stroke();ctx.fillStyle=hc(0.5);circ(x+r*0.86,y-r*0.1,r*0.12);ctx.fill();}
  if(hair===1){ctx.fillStyle=hc(0.27);circ(x,y-r*1.02,r*0.4);ctx.fill();ctx.stroke();ctx.fillStyle=hc(0.37);circ(x,y-r*1.02,r*0.2);ctx.fill();}
  // face outline + bands
  ctx.fillStyle=WHITE;circ(x,y,r+ow);ctx.fill();
  ctx.fillStyle=hc(0.6);circ(x,y,r);ctx.fill();
  ctx.fillStyle=hc(0.7);ell(x,y+r*0.1,r*0.8,r*0.76);ctx.fill();
  ctx.fillStyle=hc(0.8);ell(x,y+r*0.2,r*0.5,r*0.44);ctx.fill();
  // front hair cap
  ctx.fillStyle=hc(0.25);ctx.beginPath();ctx.arc(x,y,r*1.01,PI*1.02,PI*1.98);
  ctx.quadraticCurveTo(x+r*0.75,y-r*0.2,x+r*0.35,y-r*0.42);ctx.quadraticCurveTo(x,y-r*0.2,x-r*0.3,y-r*0.45);
  ctx.quadraticCurveTo(x-r*0.75,y-r*0.2,x-r*1.0,y-r*0.05);ctx.closePath();ctx.fill();
  ctx.fillStyle=hc(0.35);ell(x-r*0.25,y-r*0.72,r*0.32,r*0.12);ctx.fill();
  if(hair===2){ctx.fillStyle=hc(0.25);for(const s of [-0.5,0,0.5]){ctx.beginPath();ctx.moveTo(x+s*r-r*0.22,y-r*0.85);ctx.lineTo(x+s*r,y-r*1.28);ctx.lineTo(x+s*r+r*0.22,y-r*0.85);ctx.fill();}}
  if(hair==='girl'){ctx.fillStyle=hc(0.48);ctx.lineWidth=r*0.14;ctx.strokeStyle=hc(0.48);ctx.beginPath();ctx.arc(x,y,r*0.98,PI*1.15,PI*1.85);ctx.stroke();}
  // eyes
  const ex=r*0.36,ey=y+r*0.02;const ldx=lx-x,ldy=ly-y,ld=Math.hypot(ldx,ldy)||1;const px=ldx/ld*r*0.07,py=ldy/ld*r*0.06;
  const happy=smile>0.92;
  for(const s of [-1,1]){
    if(happy||blink){ctx.strokeStyle=DARK;ctx.lineWidth=r*0.09;ctx.lineCap='round';ctx.beginPath();
      if(happy)ctx.arc(x+s*ex,ey+r*0.05,r*0.12,PI*1.1,PI*1.9);else{ctx.moveTo(x+s*ex-r*0.12,ey);ctx.lineTo(x+s*ex+r*0.12,ey);}ctx.stroke();}
    else{ctx.fillStyle=DARK;circ(x+s*ex+px,ey+py,r*0.13);ctx.fill();ctx.fillStyle=WHITE;circ(x+s*ex+px-r*0.04,ey+py-r*0.05,r*0.045);ctx.fill();}
  }
  if(hair===2){ctx.strokeStyle=WHITE;ctx.lineWidth=r*0.07;ctx.fillStyle=hc(0.12);for(const s of [-1,1]){circ(x+s*ex,ey,r*0.24);ctx.globalAlpha=0.55;ctx.fill();ctx.globalAlpha=1;ctx.stroke();}
    line(x-ex+r*0.24,ey,x+ex-r*0.24,ey,r*0.06,WHITE);}
  // cheeks (hot)
  ctx.fillStyle=hc(0.97);for(const s of [-1,1]){ell(x+s*r*0.55,y+r*0.32,r*0.17,r*0.11);ctx.fill();}
  // mouth
  const my=y+r*0.42;
  if(smile>0.7){ctx.fillStyle=DARK;ctx.beginPath();ctx.ellipse(x,my-r*0.02,r*0.24,r*0.2*(0.6+smile*0.4),0,0,PI);ctx.closePath();ctx.fill();
    ctx.fillStyle=hc(0.98);ell(x,my+r*0.08,r*0.12,r*0.06);ctx.fill();}
  else{ctx.strokeStyle=DARK;ctx.lineWidth=r*0.08;ctx.lineCap='round';ctx.beginPath();ctx.arc(x,my-r*0.18,r*(0.18+smile*0.1),PI*(0.2),PI*(0.8));ctx.stroke();}
}
function drawChair(x,y,face,s,wig,glow){
  ctx.save();ctx.translate(x+Math.sin(T*40)*wig*3*u,y);ctx.rotate(face-PI/2);
  const w=30*u*s,h=22*u*s,o=2.6*u;
  if(glow>0){ctx.fillStyle=hca(0.62,0.35*glow);ell(0,0,w*0.95,h*1.2);ctx.fill();}
  ctx.fillStyle=WHITE;rrect(-w/2-o,-h/2-o,w+2*o,h+2*o,7*u*s);ctx.fill();
  rrect(-w/2-2*u-o,-h/2-10*u*s-o,w+4*u+2*o,8*u*s+2*o,4*u);ctx.fill();
  ctx.fillStyle=hc(s>1.1?0.4:0.2);rrect(-w/2,-h/2,w,h,6*u*s);ctx.fill();
  ctx.fillStyle=hc(s>1.1?0.52:0.29);rrect(-w/2+4*u,-h/2+4*u,w-8*u,h-8*u,4*u);ctx.fill();
  ctx.fillStyle=hc(s>1.1?0.45:0.24);rrect(-w/2-2*u,-h/2-10*u*s,w+4*u,8*u*s,4*u);ctx.fill();
  ctx.restore();
}

/* ---------- draw scene ---------- */
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=DARK;ctx.fillRect(0,0,W,H);
  ctx.imageSmoothingEnabled=true;
  if(bgHas){if(bgFade<1){ctx.drawImage(bgPrev,0,0,W,H);ctx.globalAlpha=bgFade;}ctx.drawImage(bgCan,0,0,W,H);ctx.globalAlpha=1;}
  // home mat (where the girl stands)
  if(girl.scale<0.98||S.phase==='girlSeated'){const a=S.phase==='girlSeated'?0.9:0.4;ctx.globalAlpha=a;
    ctx.fillStyle=WHITE;ell(L.girlHome.x,L.girlHome.y+18*u,74*u,28*u);ctx.fill();ctx.fillStyle=hc(0.5);ell(L.girlHome.x,L.girlHome.y+18*u,70*u,24*u);ctx.fill();
    ctx.fillStyle=hc(0.62);ell(L.girlHome.x,L.girlHome.y+18*u,40*u,13*u);ctx.fill();ctx.globalAlpha=1;}
  // floor marks (old prints)
  for(const m of marks){drawPrint(L.C.x+m.rx*L.rx,L.C.y+m.ry*L.ry,9*u,m.rot,0.32/(1+m.age*0.6),false);}
  // invitation chain
  drawChain();
  // depth sorted
  const D=[];
  // benches
  for(const G of S.groups){if(G.length>=2)D.push({y:Math.min(...G.map(j=>chairs[j].y))-30*u,f:()=>drawBench(G)});}
  for(const c of chairs)D.push({y:c.y-1,f:()=>drawChair(c.x,c.y,c.face,1,c.wig,0)});
  if(table.s>0.02){const tp=tablePos();D.push({y:tp.y,f:drawTable});}
  if(center.show>0.02)D.push({y:center.y-2,f:drawCenterChair});
  for(const g of guests)D.push({y:(g.chair>=0&&g.sitAmt>0.3)?Math.max(g.y+40*u,chairs[g.chair].y+2):g.y+40*u,f:()=>drawGuest(g)});
  D.sort((a,b)=>a.y-b.y);
  for(const d of D)d.f();
  // snacks
  for(const s of snacks){const a=guests[s.from],b=guests[s.to];const e=ease(s.t);
    const x=lerp(a.hand.x,b.hand.x,e),y=lerp(a.hand.y,b.hand.y,e)-Math.sin(e*PI)*26*u;drawCookie(x,y,7*u);}
  // ripples
  for(const r of ripples){const k=r.life/r.max;ctx.strokeStyle=hca(r.t,(1-k)*0.8);ctx.lineWidth=(3.5-2.5*k)*u;circ(r.x,r.y,r.r*(0.25+0.75*ease(k)));ctx.stroke();}
  // stamps
  for(const s of stamps){
    if(s.guest>=0&&s.fly>0){drawPrint(s.fx,s.fy,lerp(20*u,8*u,ease(s.fly)),s.rot*(1-s.fly),1,true);}
    else{const k=s.life;const sc=k<0.12?lerp(1.35,1,k/0.12):1;const al=s.guest>=0?1:clamp(1.3-k,0,1);drawPrint(s.x,s.y,s.r*sc,s.rot,al,true);}
  }
  // girl
  drawGirl();
  // guide hand dragged on top
  if(guideHand&&act&&act.kind==='guide'){const g=guests[S.guide];if(g)drawGuideHandTop(g);}
  // particles
  for(const p of parts){const k=p.life/p.max;ctx.fillStyle=hca(p.t,1-k);const s=p.sz*(1-k*0.5);ctx.fillRect(p.x-s/2,p.y-s/2,s,s);}
  // highlight + demo finger
  drawHighlight();
  if(S.demo)drawDemoFinger();
}
function drawChain(){
  const pts=[];for(const id of S.order){const g=guests[id];if(g.hasCard)pts.push({x:g.cardX,y:g.cardY,o:g.order});}
  if(pts.length<2)return;
  ctx.save();ctx.lineCap='round';
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];
    ctx.setLineDash([2*u,7*u]);ctx.strokeStyle=hca(0.82,0.7);ctx.lineWidth=4*u;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
  ctx.restore();
}
function drawBench(G){
  const mp=mpCur;let a=G.map(j=>chairs[j].angCur);
  ctx.save();ctx.lineCap='round';
  const rx=L.Ex*mp.k,ry=L.Ey*mp.k;
  const stroke=(lw,col)=>{ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();
    if(G.length>=4)ctx.ellipse(mp.Lx,mp.Ly,rx,ry,0,0,TAU);
    else{const c=a[0];const rel=a.map(x=>wrapA(x-c));const mn=Math.min(...rel),mx=Math.max(...rel);ctx.ellipse(mp.Lx,mp.Ly,rx,ry,0,c+mn,c+mx);}
    ctx.stroke();};
  stroke(26*u+5.2*u,WHITE);stroke(26*u,hc(0.22));stroke(12*u,hc(0.33));
  ctx.restore();
}
function drawTable(){
  const tp=tablePos();const r=tableR()*table.s;const x=tp.x+Math.sin(T*40)*(table.wig||0)*3*u,y=tp.y;
  ctx.fillStyle=WHITE;circ(x,y,r+3*u);ctx.fill();
  ctx.fillStyle=hc(0.38);circ(x,y,r);ctx.fill();ctx.fillStyle=hc(0.5);circ(x,y,r*0.7);ctx.fill();ctx.fillStyle=hc(0.6);circ(x,y,r*0.38);ctx.fill();
  if(table.s>0.6){
    const n=4;for(let i=0;i<n;i++){const a=i/n*TAU+0.4;const cx=x+Math.cos(a)*r*0.6,cy=y+Math.sin(a)*r*0.6;
      ctx.fillStyle=WHITE;circ(cx,cy,6.5*u);ctx.fill();ctx.fillStyle=hc(0.86);circ(cx,cy,5*u);ctx.fill();ctx.fillStyle=hc(0.98);circ(cx,cy,2.6*u);ctx.fill();
      ctx.strokeStyle=hca(0.66,0.55);ctx.lineWidth=1.6*u;ctx.beginPath();const ph=T*1.5+i;
      ctx.moveTo(cx,cy-6*u);ctx.quadraticCurveTo(cx+4*u*Math.sin(ph),cy-11*u,cx,cy-16*u);ctx.stroke();}
    drawCookie(x,y,5*u);
  }
}
function drawCenterChair(){
  ctx.save();ctx.globalAlpha=clamp(center.show,0,1);
  const glow=(highlightTarget()==='chair')?(0.6+0.4*Math.sin(T*5)):0.4;
  drawChair(center.x,center.y,PI/2,1.35*clamp(center.show*1.2,0,1),center.wig,glow);
  ctx.restore();
}
function drawCookie(x,y,r){ctx.fillStyle=WHITE;circ(x,y,r+1.5*u);ctx.fill();ctx.fillStyle=hc(0.7);circ(x,y,r);ctx.fill();ctx.fillStyle=hc(0.9);
  circ(x-r*0.3,y-r*0.2,r*0.2);ctx.fill();circ(x+r*0.35,y+r*0.15,r*0.18);ctx.fill();}

function drawGuest(g){
  const wig=Math.sin(T*40)*g.wig*3*u;
  const walking=(g.state==='walk'||g.state==='swap'||g.state==='reset');
  const bob=walking?-Math.abs(Math.sin(g.walkPh))*4*u:0;
  const hop=-Math.abs(Math.sin(g.hop*PI*2))*8*u*Math.min(1,g.hop*2);
  const x=g.x+wig,y=g.y+bob+hop;const sit=g.sitAmt;
  const gx=g.x,gy=g.y;g.x=x;g.y=y; // temp for helpers
  // legs
  ctx.lineCap='round';
  const legLen=lerp(40,24,sit)*u;
  for(const s of [-1,1]){const ph=walking?Math.sin(g.walkPh+(s>0?0:PI))*5*u:0;
    const lx=x+s*8*u,ly=y+14*u,ex=lx+s*sit*4*u+ph,ey=ly+legLen-14*u;
    line(lx,ly,ex,ey,11*u+2.5*u,'rgba(230,240,255,0.7)');line(lx,ly,ex,ey,11*u,hc(0.3));
    ctx.fillStyle=hc(0.12);ell(ex,ey+3*u,7*u,4*u);ctx.fill();}
  // card on seat (handprint seat card)
  if(g.hasCard&&g.chair>=0){drawPrint(g.cardX,g.cardY,8*u,-0.2,1,true);}
  // back arm (other)
  const side=g.side;const sh=shoulderOf(g,side),sh2=shoulderOf(g,-side);
  const sleeve=g.sleeve,gl=GLOVES[g.def.glove];
  drawArm(sh2.x,sh2.y,g.hand2.x,g.hand2.y,sleeve,9*u,11*u);
  drawHand(g.hand2.x,g.hand2.y,10*u,Math.atan2(g.hand2.y-sh2.y,g.hand2.x-sh2.x)+PI/2,gl,0,2.2*u,side>0);
  // torso
  ctx.save();ctx.translate(x,y+16*u);ctx.rotate(g.bow*0.18*side);ctx.translate(-x,-(y+16*u));
  ctx.fillStyle='rgba(230,240,255,0.8)';rrect(x-19*u,y-21*u,38*u,40*u,13*u);ctx.fill();
  ctx.fillStyle=hc(0.2);rrect(x-17.5*u,y-19.5*u,35*u,37*u,12*u);ctx.fill();
  bandsEll(x,y-2*u,13*u,13*u,[0.31,0.42],[1,0.55]);
  ctx.restore();
  // head
  const hd=headOf(g);
  const blink=((T*0.7+g.id*0.37)%4)<0.08;
  drawHead(hd.x,hd.y,20*u,g.def.hair,g.look.x,g.look.y,g.smile,false,blink);
  // front arm (reaching / guide)
  if(!(g.state==='guide'&&act&&act.kind==='guide')){
    const hx=g.hand.x,hy=g.hand.y;
    drawArm(sh.x,sh.y,hx,hy,sleeve,9.5*u,11*u);
    const isG=g.state==='guide';
    drawHand(hx,hy,(isG?13:11)*u,Math.atan2(hy-sh.y,hx-sh.x)+PI/2,gl,0,(isG?3:2.4)*u,side<0,1+g.approach*0.12);
    if(isG){ctx.strokeStyle=hca(0.62,0.85);ctx.lineWidth=2.5*u;circ(hx,hy,22*u+Math.sin(T*4)*2*u);ctx.stroke();}
  }
  // guide sash (warm band across torso)
  if(g.state==='guide'){ctx.strokeStyle=hc(0.75);ctx.lineWidth=6*u;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-14*u,y-16*u);ctx.lineTo(x+14*u,y+12*u);ctx.stroke();}
  // sip cup
  if(g.act&&g.act.type==='sip'){ctx.fillStyle=WHITE;circ(g.hand.x,g.hand.y-6*u,6*u);ctx.fill();ctx.fillStyle=hc(0.88);circ(g.hand.x,g.hand.y-6*u,4.5*u);ctx.fill();}
  g.x=gx;g.y=gy;
}
function drawGuideHandTop(g){
  const side=g.side;const sh=shoulderOf(g,side);
  drawArm(sh.x,sh.y,guideHand.dx,guideHand.dy,g.sleeve,9.5*u,13*u);
  drawHand(guideHand.dx,guideHand.dy,13*u*(1-guideHand.press*0.12),Math.atan2(guideHand.dy-sh.y,guideHand.dx-sh.x)+PI/2,GLOVES[g.def.glove],guideHand.press,3*u,side<0);
}
function drawGirl(){
  const s=girl.scale,x=girl.x+Math.sin(T*40)*girl.wig*3*u,y=girl.y;const r=46*u*s;
  const seated=(S.phase==='girlSeated'||S.phase==='guiding'||(S.phase==='reset'&&girl.path))&&s<0.97;
  // body
  ctx.fillStyle='rgba(230,240,255,0.85)';
  if(!seated){rrect(x-64*u*s,y+r*0.72,128*u*s,H-y+20*u,34*u*s);ctx.fill();
    ctx.fillStyle=hc(0.33);rrect(x-61*u*s,y+r*0.72+3*u,122*u*s,H-y+20*u,32*u*s);ctx.fill();
    bandsEll(x,y+r*1.55,40*u*s,30*u*s,[0.43,0.53],[1,0.55]);}
  else{rrect(x-26*u*s,y+r*0.7,52*u*s,50*u*s,16*u*s);ctx.fill();ctx.fillStyle=hc(0.33);rrect(x-24*u*s,y+r*0.7+2*u,48*u*s,46*u*s,15*u*s);ctx.fill();
    bandsEll(x,y+r*0.7+24*u*s,16*u*s,15*u*s,[0.43,0.53],[1,0.55]);}
  // left arm resting
  const lsx=x-(seated?24:44)*u*s,lsy=y+(seated?40:46)*u*s;
  const lhx=lsx-8*u*s,lhy=lsy+(seated?30:22)*u*s;
  if(seated){drawArm(lsx,lsy,lhx,lhy,3,13*u*s,16*u*s);drawHand(lhx,lhy,14*u*s,0.3+PI,{rim:0.64,core:0.82},0,2.5*u,true);}
  // right arm to big hand (behind head)
  const sh=girlShoulder();
  const hx=hand.dx,hy=hand.dy;
  drawArm(sh.x,sh.y,hx,hy,3,18*u*s,28*u*s);
  // head
  const blink=((T*0.6)%5)<0.07&&!act;
  drawHead(x,y,r,'girl',girl.lx,girl.ly,girl.smile,true,blink);
  // big hand
  const rot=Math.atan2(hy-sh.y,hx-sh.x)+PI/2;
  const rimT=lerp(0.6,0.8,clamp(hand.rim,0,1));
  const bnc=hand.bounce>0?Math.sin(hand.bounce*18)*hand.bounce*0.12:0;
  const hr=hand.r*u*s*(1+bnc);
  drawHand(hx,hy,hr,rot,{rim:rimT,core:0.86,hot:0.95},clamp(hand.press,0,1),4.5*u*s,false,1+0.08*clamp(hand.press,0,1));
}
function drawHighlight(){
  const hl=highlightTarget();if(!hl||S.idle<0.6)return;
  const p=0.5+0.5*Math.sin(T*4.2);
  let x,y,r;
  if(hl==='hand'){x=hand.x;y=hand.y-8*u*girl.scale;r=58*u*girl.scale;}
  else if(hl==='guide'&&guideHand){x=guideHand.x;y=guideHand.y;r=30*u;}
  else if(hl==='chair'){x=center.x;y=center.y;r=40*u;}
  else return;
  ctx.strokeStyle=hca(0.62,0.35+0.4*p);ctx.lineWidth=(3+2*p)*u;circ(x,y,r*(1+0.08*p));ctx.stroke();
  ctx.strokeStyle=hca(0.75,0.25*p);ctx.lineWidth=2*u;circ(x,y,r*(1.18+0.1*p));ctx.stroke();
}
function drawDemoFinger(){
  const d=S.demo;let ox,oy;
  if(d.obj==='hand'){ox=hand.x;oy=hand.y;}else if(d.obj==='guide'&&guideHand){ox=guideHand.x;oy=guideHand.y;}
  else if(d.obj==='chair'){const k=d.t<0.45?ease(d.t/0.45):d.t<0.6?1:ease(1-(d.t-0.6)/0.4);ox=center.x+(d.tx-center.x)*k;oy=center.y;
    // chair ghost shows where it can go
    ctx.save();ctx.globalAlpha=0.45*k;drawChair(ox,oy,PI/2,1.35,0,0);ctx.restore();}
  else return;
  const a=d.t<0.08?d.t/0.08:d.t>0.92?(1-d.t)/0.08:1;
  ctx.save();ctx.globalAlpha=0.85*a;ctx.translate(ox+10*u,oy+16*u);ctx.rotate(-0.5);
  ctx.fillStyle=WHITE;rrect(-9*u,-4*u,18*u,46*u,9*u);ctx.fill();
  ctx.fillStyle=hca(0.7,1);rrect(-6*u,-1*u,12*u,40*u,6*u);ctx.fill();
  ctx.fillStyle=WHITE;rrect(-5*u,0,10*u,9*u,4*u);ctx.fill();
  ctx.restore();
  ctx.strokeStyle='rgba(244,248,255,'+(0.6*a).toFixed(3)+')';ctx.lineWidth=2.5*u;circ(ox,oy,16*u+6*u*Math.sin(T*8));ctx.stroke();
}

/* ---------- loop / lifecycle ---------- */
let running=false,rafId=0,lastT=0;
function frame(now){
  if(!running)return;
  let dt=(now-lastT)/1000;lastT=now;if(!(dt>0))dt=0;if(dt>0.05)dt=0.05;
  try{update(dt);draw();}catch(e){if(!frame.err){frame.err=1;console.warn(e);}}
  rafId=requestAnimationFrame(frame);
}
function start(){if(running)return;running=true;lastT=performance.now();rafId=requestAnimationFrame(frame);}
function stop(){running=false;cancelAnimationFrame(rafId);}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stop();if(act)endAct();try{if(AC&&AC.state==='running')AC.suspend();}catch(e){}}
  else{try{if(AC&&AC.state==='suspended'){const p=AC.resume();if(p&&p.catch)p.catch(()=>{});}}catch(e){}start();}
});
window.addEventListener('blur',()=>{if(act)endAct();});
let resizeQ=false;
function onResize(){if(resizeQ)return;resizeQ=true;requestAnimationFrame(()=>{resizeQ=false;if(act)endAct();layout();snapAll();buildHeat();bgFade=1;});}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',onResize);

layout();initGame();snapAll();buildHeat();
start();

// read-only hooks for automated checks (no UI)
window.__gf={S:S,guests:guests,chairs:chairs,get hand(){return hand;},get guideHand(){return guideHand;},girl:girl,center:center,table:table,L:L,get u(){return u;},
  spotPos:spotPos,get running(){return running;},get audio(){return AC?AC.state:'none';},get parts(){return parts.length;}};
})();
</script>
